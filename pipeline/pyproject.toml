[project]
name = "hukum-bersih"
version = "0.1.0"
description = "Scraper and parser for Indonesian law and RUU documents"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "bluebell-akn>=5.0.0",
    "confusable-homoglyphs>=3.3.1",
    "diff-match-patch>=20241021",
    "httpx>=0.28.1",
    "orjson>=3.13.0",
    "pagefind[bin]==1.6.0",
    "pydantic>=2.14.4",
    "pymupdf>=2.1",
    "pyyaml>=6.0.3",
    "rapidiff>=0.3.0",
    "regex>=2026.11.24",
]

[project.optional-dependencies]
# peraturan.bpk.go.id: a stealth browser clears Cloudflare once, curl_cffi downloads
bpk = ["scrapling[fetchers]>=0.5.1", "curl-cffi>=0.17.0", "remotezip>=0.12"]
# OCR of scanned pages with Indra OCR (decision 0012); without it, Tesseract reads them
ocr = ["indra-ocr>=1.1.2"]

[project.scripts]
hukum-bersih = "hukum_bersih.cli:main"

[dependency-groups]
dev = [
    "huggingface-hub>=2.4.0",
    "lxml>=5",
    "pytest>=8",
    "remotezip>=0.12.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
