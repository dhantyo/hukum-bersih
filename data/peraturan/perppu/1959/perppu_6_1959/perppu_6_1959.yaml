title: Peraturan Pemerintah Pengganti Undang-Undang Nomor 6 Tahun 1959 tentang Pembatasan
  Waktu Untuk Melaksanakan Hak Menuntut Penukaran Uang Kertas Bank Pecahan-Pecahan
  Rp. 1.000,- Dan Rp. 500,- Yang Dengan Peraturan Pemerintah Pengganti Undangundang
  No. 2 Tahun 1959 Nilainya Masing-Masing Telah Diturunkan Menjadi Rp. 100,- Dan Rp.
  50
tentang: PEMBATASAN WAKTU UNTUK MELAKSANAKAN HAK MENUNTUT PENUKARAN UANG KERTAS BANK
  PECAHAN-PECAHAN Rp. 1.000,- DAN Rp. 500,- YANG DENGAN PERATURAN PEMERINTAH PENGGANTI
  UNDANGUNDANG NO. 2 TAHUN 1959 NILAINYA MASING-MASING TELAH DITURUNKAN MENJADI Rp.
  100,- DAN Rp. 50
