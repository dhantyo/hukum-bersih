title: Peraturan Pemerintah Nomor 11 Tahun 1948 tentang Kantor Urusan Pegawai Negeri.
  Pasal 1. Untuk Mengurus Segala Sesuatu Yang Mengenai Kedudukan Dan Gaji Pegawai
  Negeri Dan Mengawasi, Supaya Peraturan-Peraturan Itu Dijalankan Dengan Tepat, Didirikan
  Suatu Kantor Urusan Pegawai Negeri, Yang Berkedudukan Di Ibu Kota Pemerintahan Dan
  Dipimpin Seorang Kepala
tentang: KANTOR URUSAN PEGAWAI NEGERI. Pasal 1. Untuk mengurus segala sesuatu yang
  mengenai kedudukan dan gaji pegawai Negeri dan mengawasi, supaya peraturan-peraturan
  itu dijalankan dengan tepat, didirikan suatu kantor Urusan Pegawai Negeri, yang
  berkedudukan di ibu kota pemerintahan dan dipimpin seorang Kepala
