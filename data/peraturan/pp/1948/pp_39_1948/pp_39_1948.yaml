title: 'Peraturan Pemerintah Nomor 39 Tahun 1948 tentang Pemberantasan Pernyataan
  Setuju Menetapkan Peraturan Sebagai Berikut: Dengan Perbuatan Kaum Pemberontak.
  Pasal 1. Barang Siapa Dalam Keadaan Bahaya Dengan Perkataan, Tulisan Atau Perbuatan
  Menyatakan Setuju Dengan Perbuatan Kaum Pemberontak, Yang Dengan Kekerasan Telah
  Berusaha Merebut Kekuasaan Pemerintahan Dihukum Dengan Hukuman Penjara Paling Lama
  Sepuluh Tahun'
tentang: 'PEMBERANTASAN PERNYATAAN SETUJU Menetapkan peraturan sebagai berikut: DENGAN
  PERBUATAN KAUM PEMBERONTAK. Pasal 1. Barang siapa dalam keadaan bahaya dengan perkataan,
  tulisan atau perbuatan menyatakan setuju dengan perbuatan kaum pemberontak, yang
  dengan kekerasan telah berusaha merebut kekuasaan pemerintahan dihukum dengan hukuman
  penjara paling lama sepuluh tahun'
