  url: https://peraturan.bpk.go.id/DownloadUjiMateri/234/putusan_mkri_191-PUU-XXIII-2025.pdf
  amar: Undang-Undang Nomor 12 Tahun 1980 tentang Hak Keuangan/Administratif Pimpinan
    dan Anggota Lembaga Tertinggi/Tinggi Negara serta Bekas Pimpinan Lembaga Tertinggi/Tinggi
    Negara dan Bekas Anggota Lembaga Tinggi Negara (Lembaran Negara Republik Indonesia
    Tahun 1980 Nomor 71, Tambahan Lembaran Negara Republik Indonesia Nomor 3182) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dilakukan penggantian
    dengan undang-undang baru dalam waktu paling lama 2 (dua) tahun sejak putusan
    a quo diucapkan; 3.Menyatakan Undang-Undang Nomor 12 Tahun 1980 tentang Hak Keuangan/Administratif
    Pimpinan dan Anggota Lembaga Tertinggi/Tinggi Negara serta Bekas Pimpinan Lembaga
    Tertinggi/Tinggi Negara dan Bekas Anggota Lembaga Tinggi Negara (Lembaran Negara
    Republik Indonesia Tahun 1980 Nomor 71, Tambahan Lembaran Negara Republik Indonesia
    Nomor 3182) tetap berlaku sampai dengan undang-undang baru telah dibentuk sampai
    paling lama 2 (dua) tahun sejak putusan a quo diucapkan; 4.Memerintahkan kepada
    pembentuk undang-undang untuk melakukan penggantian dalam jangka waktu paling
    lama 2 (dua) tahun sejak putusan ini diucapkan dan apabila dalam tenggang waktu
    tersebut tidak dilakukan penggantian maka Undang-Undang Nomor 12 Tahun 1980 tentang
    Hak Keuangan/Administratif Pimpinan dan Anggota Lembaga Tertinggi/Tinggi Negara
    serta Bekas Pimpinan Lembaga Tertinggi/Tinggi Negara dan Bekas Anggota Lembaga
    Tinggi Negara (Lembaran Negara Republik Indonesia Tahun 1980 Nomor 71, Tambahan
    Lembaran Negara Republik Indonesia Nomor 3182) menjadi bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak memiliki kekuatan hukum mengikat
    secara permanen.
