- putusan: Nomor 22/PUU-XV/2017
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/145/PULB_MK_22PUUXV2017_2017.PDF
  amar: Menyatakan Pasal 7 ayat (1) sepanjang frasa “usia 16 (enam belas) tahun” Undang-Undang
    Nomor 1 Tahun 1974 tentang Perkawinan (Lembaran Negara Republik Indonesia Tahun
    1974 Nomor 1, Tambahan Lembaran Negara Republik Indonesia Nomor 3019) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat; 3. Menyatakan ketentuan Pasal 7 ayat (1) Undang-Undang
    Nomor 1 Tahun 1974 tentang Perkawinan (Lembaran Negara Republik Indonesia Tahun
    1974 Nomor 1, Tambahan Lembaran Negara Republik Indonesia Nomor 3019) masih tetap
    berlaku sampai dengan dilakukan perubahan sesuai dengan tenggang waktu sebagaimana
    yang telah ditentukan dalam putusan ini; 60 4. Memerintahkan kepada pembentuk
    undang-undang untuk dalam jangka waktu paling lama 3 (tiga) tahun melakukan perubahan
    terhadap Undang-Undang Nomor 1 Tahun 1974 tentang Perkawinan (Lembaran Negara
    Republik Indonesia Tahun 1974 Nomor 1, Tambahan Lembaran Negara Republik Indonesia
    Nomor 3019), khususnya berkenaan dengan batas minimal usia perkawinan bagi perempuan;
