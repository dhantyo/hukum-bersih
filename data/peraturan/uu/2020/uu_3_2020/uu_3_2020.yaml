uji_materi:
- putusan: 64/PUU-XVIII/2020
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/203/putusan_mkri_%2064-PUU-XVIII-2020.pdf
  amar: '1). Pasal 169A ayat (1) Undang-Undang Nomor 3 Tahun 2020 tentang Perubahan
    Atas Undang-Undang Nomor 4 Tahun 2009 tentang Pertambangan Mineral dan Batubara
    (Lembaran Negara Republik Indonesia Tahun 2020 Nomor 147, Lembaran Negara Republik
    Indonesia Nomor 6525) sepanjang frasa “diberikan jaminan” bertentangan dengan
    Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan
    hukum mengikat, sepanjang tidak dimaknai “dapat diberikan”; 2). Menyatakan ketentuan
    Pasal 169A ayat (1) huruf a dan huruf b Undang Undang Nomor 3 Tahun 2020 tentang
    Perubahan Atas Undang-Undang Nomor 4 Tahun 2009 tentang Pertambangan Mineral dan
    Batubara (Lembaran Negara Republik Indonesia Tahun 2020 Nomor 147, Lembaran Negara
    Republik Indonesia Nomor 6525), sepanjang kata “dijamin” bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat, sepanjang tidak dimaknai “dapat”; 3). Menyatakan ketentuan Pasal 169A
    ayat (1) Undang-Undang Nomor 3 Tahun 2020 tentang Perubahan Atas Undang-Undang
    Nomor 4 Tahun 2009 tentang Pertambangan Mineral dan Batubara (Lembaran Negara
    Republik Indonesia Tahun 2020 Nomor 147, Lembaran Negara Republik Indonesia Nomor
    6525) selengkapnya berbunyi, “KK dan PKP2B sebagaimana dimaksud dalam Pasal 169
    dapat diberikan perpanjangan menjadi IUPK sebagai Kelanjutan Operasi Kontrak/Perjanjian
    setelah memenuhi persyaratan dengan ketentuan: …”; 6. Menyatakan ketentuan Pasal
    169A ayat (1) huruf a dan huruf b Undang-Undang Nomor 3 Tahun 2020 tentang Perubahan
    Atas Undang-Undang Nomor 4 tahun 2009 tentang Pertambangan Mineral dan Batubara
    (Lembaran Negara Republik Indonesia Tahun 2020 Nomor 147, Lembaran Negara Republik
    Indonesia Nomor 6525), selengkapnya menjadi berbunyi: a. kontrak/perjanjian yang
    belum memperoleh perpanjangan dapat mendapatkan 2 (dua) kali perpanjangan dalam
    bentuk IUPK sebagai Kelanjutan Operasi Kontrak/Perjanjian masing-masing untuk
    jangka waktu paling lama 10 (sepuluh) tahun sebagai kelanjutan operasi 175 setelah
    berakhirnya KK atau PKP2B dengan mempertimbangkan upaya peningkatan penerimaan
    negara. b. kontrak/perjanjian yang telah memperoleh perpanjangan pertama dapat
    untuk diberikan perpanjangan kedua dalam bentuk IUPK sebagai Kelanjutan Operasi
    Kontrak/Perjanjian untuk jangka waktu paling lama 10 (sepuluh) tahun sebagai kelanjutan
    operasi setelah berakhirnya perpanjangan pertama KK atau PKP2B dengan mempertimbangkan
    upaya peningkatan penerimaan negara.'
