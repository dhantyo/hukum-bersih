- putusan: 37/PUU-XVIII/2020
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/161/putusan_mkri_37-2020.pdf
  amar: 'Pasal 27 ayat (1) menjadi: “Biaya yang telah dikeluarkan Pemerintah dan/atau
    lembaga anggota KSSK dalam rangka pelaksanaan kebijakan pendapatan negara termasuk
    kebijakan di bidang perpajakan, kebijakan belanja negara termasuk kebijakan di
    bidang keuangan daerah, kebijakan pembiayaan, kebijakan stabilitas sistem keuangan,
    dan program pemulihan ekonomi nasional, merupakan bagian dari biaya ekonomi untuk
    penyelamatan perekonomian dari krisis dan bukan merupakan kerugian negara sepanjang
    dilakukan dengan iktikad baik dan sesuai dengan peraturan perundang-undangan”.
    Pasal 27 ayat (3) menjadi: "Segala tindakan termasuk keputusan yang diambil berdasarkan
    Peraturan Pemerintah Pengganti Undang-Undang ini bukan merupakan objek gugatan
    yang dapat diajukan kepada peradilan tata usaha negara sepanjang dilakukan terkait
    dengan penanganan pandemi Covid-19 serta dilakukan dengan iktikad baik dan sesuai
    dengan peraturan perundang-undangan”. Pasal 29 bertentangan dengan UUD 1945 dan
    tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai,
    “Peraturan Pemerintah Pengganti Undang-Undang ini mulai berlaku pada tanggal diundangkan
    dan harus dinyatakan tidak berlaku lagi sejak Presiden mengumumkan secara resmi
    bahwa status pandemi Covid-19 telah berakhir di Indonesia dan status tersebut
    harus dinyatakan paling lambat akhir tahun ke-2. Dalam hal secara faktual pandemi
    Covid-19 belum berakhir, sebelum memasuki tahun ke-3 UU a quo masih dapat diberlakukan
    namun pengalokasian anggaran dan penentuan batas defisit anggaran untuk penanganan
    Pandemi Covid-19, harus mendapatkan persetujuan DPR dan pertimbangan DPD”.'
