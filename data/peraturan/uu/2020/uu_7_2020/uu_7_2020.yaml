uji_materi:
- putusan: 121/PUU-XX/2022
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/225/putusan_mkri_121_PUU-XX_2022.pdf
  amar: 1) Pasal 7A ayat (1) Undang-Undang Nomor 7 Tahun 2020 tentang Perubahan Ketiga
    atas Undang-Undang Nomor 24 Tahun 2003 tentang Mahkamah Konstitusi (Lembaran Negara
    Republik Indonesia Tahun 2020 Nomor 216, Tambahan Lembaran Negara Nomor 6554)
    yang menyatakan, “Kepaniteraan sebagaimana dimaksud dalam Pasal 7 merupakan jabatan
    fungsional yang menjalankan tugas teknis administratif peradilan Mahkamah Konstitusi
    dengan usia pensiun 62 (enam puluh dua) tahun bagi panitera, panitera muda, dan
    panitera pengganti” bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia
    Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat, sepanjang tidak dimaknai
    “Kepaniteraan sebagaimana dimaksud dalam Pasal 7 merupakan jabatan fungsional
    keahlian yang menjalankan tugas teknis administratif peradilan Mahkamah Konstitusi
    yang meliputi Panitera Konstitusi Ahli Utama, Panitera Konstitusi Ahli Madya,
    Panitera Konstitusi Ahli Muda, dan Panitera Konstitusi Ahli Pertama dengan usia
    pensiun bagi panitera, panitera muda, dan panitera pengganti adalah maksimal 65
    (enam puluh lima) tahun sesuai dengan batas usia pensiun pada jenjang jabatan
    fungsional keahlian sebagaimana diatur dalam peraturan perundang-undangan di bidang
    aparatur sipil negara”
