uji_materi:
- putusan: 104/PUU-XXIII/2025
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/215/putusan_mkri_104_PUU-XXIII_2025.pdf
  amar: 1) Kata “rekomendasi” pada Pasal 139 Undang-Undang Nomor 1 Tahun 2015 tentang
    Penetapan Peraturan Pemerintah Pengganti Undang Undang Nomor 1 Tahun 2014 tentang
    Pemilihan Gubernur, Bupati, dan Walikota Menjadi Undang-Undang (Lembaran Negara
    Republik Indonesia Tahun 2015 Nomor 245, Tambahan Lembaran Negara Republik Indonesia
    Nomor 5588) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia
    Tahun 1945 dan tidak memiliki kekuatan hukum mengikat secara bersyarat sepanjang
    tidak dimaknai “putusan”; 2) Frasa “memeriksa dan memutus” dan kata “rekomendasi”
    pada Pasal 140 ayat (1) Undang-Undang Nomor 1 Tahun 2015 tentang Penetapan Peraturan
    Pemerintah Pengganti Undang-Undang Nomor 1 Tahun 2014 tentang Pemilihan Gubernur,
    Bupati, dan Walikota Menjadi Undang-Undang (Lembaran Negara Republik Indonesia
    Tahun 2015 Nomor 245, Tambahan Lembaran Negara Republik Indonesia Nomor 5588)
    bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan
    tidak memiliki kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai
    frasa “memeriksa dan memutus” menjadi “menindaklanjuti” dan kata “rekomendasi”
    menjadi “putusan”;
- putusan: 69/PUU-XXII/2024
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/191/putusan_mkri_69-PUU-XXII-2024.pdf
  amar: Frasa “tempat pendidikan” dalam norma Pasal 69 huruf i Undang-Undang Nomor
    1 Tahun 2015 tentang Penetapan Peraturan Pemerintah Pengganti Undang-Undang Nomor
    1 Tahun 2014 tentang Pemilihan Gubernur, Bupati, dan Walikota menjadi Undang-Undang
    (Lembaran Negara Republik Indonesia Tahun 2015 Nomor 23, Tambahan Lembaran Negara
    Republik Indonesia Nomor 5588) bertentangan dengan Undang-Undang Dasar Negara
    Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat secara
    bersyarat sepanjang tidak dimaknai “dikecualikan bagi perguruan tinggi yang mendapat
    izin dari penanggung jawab perguruan tinggi atau sebutan lain dan hadir tanpa
    atribut kampanye pemilu”.
