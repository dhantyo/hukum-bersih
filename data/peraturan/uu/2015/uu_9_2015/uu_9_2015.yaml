      url: https://peraturan.bpk.go.id/Details/122742/uu-no-17-tahun-2019
      note: 'Ketentuan mengenai pembagian urusan pemerintahan konkuren antara Pemerintah
        Pusat dan pemerintah daerah provinsi dan pemerintah daerah kabupaten/kota,
        Angka I Matriks pembagian urusan pemerintahan konkuren antara pemerintah pusat
        dan pemerintah daerah provinsi dan pemerintah daerah kabupaten/kota: (a).
        huruf C Pembagian Urusan Pemerintahan Bidang Pekerjaan Umum dan Penataan Ruang
        Nomor 1 Suburusan Sumber Daya Air (SDA) kolom 3 huruf b, kolom 4 huruf b,
        dan kolom 5 huruf b; (b). huruf CC Pembagian Urusan Pemerintahan Bidang Energi
        dan Sumber Daya Mineral Nomor I Sub-Urusan Geologi kolom 3 huruf a, kolom
        4 huruf b, dan kolom 5, yang tertuang dalam lampiran yang merupakan bagian
        tidak terpisahkan dari Undang-Undang Nomor 23 Tahun 2014 tentang Pemerintahan
        Daerah sebagaimana telah beberapa kali diubah terakhir dengan Undang-Undang
        Nomor 9 Tahun 2015 tentang Perubahan Kedua atas Undang-Undang Nomor 23 Tahun
        2014 tentang Pemerintahan Daerah'
