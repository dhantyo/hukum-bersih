uji_materi:
- putusan: 135/PUU-XXII/2024
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/197/putusan_mkri_%20135_PUU-XXII_2024.pdf
  amar: Pasal 3 ayat (1) Undang-Undang Nomor 8 Tahun 2015 tentang Perubahan Atas Undang-Undang
    Nomor 1 Tahun 2015 tentang Penetapan Peraturan Pemerintah Pengganti Undang-Undang
    Nomor 1 Tahun 2014 tentang Pemilihan Gubernur, Bupati, dan Walikota Menjadi Undang-Undang
    (Lembaran Negara Republik Indonesia Tahun 2015 Nomor 57, Tambahan Lembaran Negara
    Republik Indonesia Nomor 5678) bertentangan dengan Undang-Undang Dasar Negara
    Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat secara
    bersyarat sepanjang ke depan tidak dimaknai, “Pemilihan dilaksanakan secara serentak
    di seluruh wilayah Negara Kesatuan Republik Indonesia untuk memilih anggota Dewan
    Perwakilan Rakyat Daerah provinsi, anggota Dewan Perwakilan Rakyat Daerah kabupaten/kota
    dan gubernur/wakil gubernur, bupati/wakil bupati, dan walikota/wakil walikota
    yang dilaksanakan dalam waktu paling singkat 2 (dua) tahun atau paling lama 2
    (dua) tahun 6 (enam) bulan sejak pelantikan anggota Dewan Perwakilan Rakyat dan
    anggota Dewan Perwakilan Daerah atau sejak pelantikan Presiden/Wakil Presiden.”
- putusan: 105/PUU-XIII/2015
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/59/105_PUU-XIII_2015.pdf
  amar: a. Kata "hari" dalam Pasal 157 ayat (8) Undang-Undang Nomor 8 Tahun 2015 tentang
    Perubahan atas Undang-Undang Nomor 1 Tahun 2015 tentang Penetapan Peraturan Pemerintah
    Pengganti Undang-Undang Nomor 1 Tahun 2014 tentang Pemilihan Gubernur, Bupati,
    dan Walikota Menjadi Undang-Undang bertentangan dengan UUD NRI Tahun 1945 dan
    tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai "hari kerja."
    b. Makna frasa "sejak diterimanya permohonan" dalam Pasal 157 ayat (8) Undang-Undang
    Nomor 8 Tahun 2015 tentang Perubahan atas Undang-Undang Nomor 1 Tahun 2015 tentang
    Penetapan Peraturan Pemerintah Pengganti Undang-Undang Nomor 1 Tahun 2014 tentang
    Pemilihan Gubernur, Bupati, dan Walikota Menjadi Undang-Undang adalah sejak dicatatnya
    perkara dalam buku registrasi perkara konstitusi (BRPK).
- putusan: 60/PUU-XIII/2015
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/52/60_PUU-XIII_2015.pdf
  amar: a. Pasal 41 ayat (1) huruf a, huruf b, huruf c, dan huruf d Undang-Undang
    Nomor 8 Tahun 2015 tentang Perubahan atas Undang-Undang Nomor 1 Tahun 2015 tentang
    Penetapan Peraturan Pemerintah Pengganti Undang-Undang Nomor 1 Tahun 2014 Tentang
    Pemilihan Gubernur, Bupati, dan Walikota Menjadi Undang-Undang bertentangan dengan
    UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak
    dimaknai bahwa perhitungan persentase dukungan bagi calon perseorangan yang hendak
    mendaftarkan diri sebagai Calon Gubernur dan Calon Wakil Gubernur didasarkan atas
    jumlah penduduk yang telah mempunyai hak pilih sebagaimana dimuat dalam daftar
    calon pemilih tetap di daerah yang bersangkutan pada Pemilihan Umum sebelumnya.
    b. Pasal 41 ayat (1) huruf a, huruf b, huruf c, dan huruf d Undang-Undang Nomor
    8 Tahun 2015 tentang Perubahan atas Undang-Undang Nomor 1 Tahun 2015 tentang Penetapan
    Peraturan Pemerintah Pengganti Undang-Undang Nomor 1 Tahun 2014 Tentang Pemilihan
    Gubernur, Bupati, dan Walikota Menjadi Undang-Undang bertentangan dengan UUD NRI
    Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai
    bahwa perhitungan persentase dukungan bagi calon perseorangan yang hendak mendaftarkan
    diri sebagai Calon Bupati dan Calon Wakil Bupati serta Calon Walikota dan Calon
    Walikota didasarkan atas jumlah penduduk yang telah mempunyai hak pilih sebagaimana
    dimuat dalam daftar calon pemilih tetap di daerah yang bersangkutan pada Pemilihan
    Umum sebelumnya.
- putusan: 46/PUU-XIII/2015
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/48/46_PUU-XIII_2015.pdf
  amar: Pasal 7 huruf t dan huruf u Undang-Undang Nomor 8 Tahun 2015 tentang Perubahan
    atas Undang-Undang Nomor 1 Tahun 2015 tentang Penetapan Peraturan Pemerintah Pengganti
    Undang-Undang Nomor 1 Tahun 2014 Tentang Pemilihan Gubernur, Bupati, dan Walikota
    Menjadi Undang-Undang bertentangan dengan UUD NRI Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat sepanjang tidak dimaknai "Mengundurkan diri sejak calon
    ditetapkan memenuhi persyaratan oleh KPU/KIP sebagai calon Gubernur, calon Wakil
    Gubernur, calon Bupati, calon Wakil Bupati, calon Walikota, dan calon Wakil Walikota.
