uji_materi:
- putusan: 78/PUU-XXI/2023
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/195/putusan_mkri_78_PUU-XXI_2023.pdf
  amar: 1). Pasal 14 dan Pasal 15 Undang-Undang Nomor 1 Tahun 1946 tentang Peraturan
    Hukum Pidana (Berita Negara Republik Indonesia II Nomor 9) bertentangan dengan
    Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan
    hukum mengikat. 2). Menyatakan Pasal 310 ayat (1) Kitab Undang-Undang Hukum Pidana
    yang menyatakan, “Barang siapa sengaja menyerang kehormatan atau nama baik seseorang
    dengan menuduhkan sesuatu hal, yang maksudnya terang supaya hal itu diketahui
    umum, diancam karena pencemaran dengan pidana penjara paling lama sembilan bulan
    atau pidana denda paling banyak empat ribu lima ratus rupiah”, bertentangan dengan
    Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan
    hukum mengikat sepanjang tidak dimaknai, “Barang siapa sengaja menyerang kehormatan
    atau nama baik seseorang dengan menuduhkan sesuatu hal dengan cara lisan, yang
    maksudnya terang supaya hal itu diketahui umum, diancam karena pencemaran dengan
    pidana penjara paling lama sembilan bulan atau pidana denda paling banyak empat
    ribu lima ratus rupiah”.
