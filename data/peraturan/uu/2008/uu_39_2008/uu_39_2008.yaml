  amar: 'Pasal 23 Undang-Undang Nomor 39 Tahun 2008 tentang Kementerian Negara (Lembaran
    Negara Republik Indonesia Tahun 2008 Nomor 166, Tambahan Lembaran Negara Republik
    Indonesia Nomor 4916) bertentangan dengan Undang-Undang Dasar Negara Republik
    Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat
    sepanjang tidak dimaknai “Menteri dan Wakil Menteri dilarang merangkap jabatan
    sebagai: a. Pejabat negara lainnya sesuai dengan peraturan perundang-undangan;
    b. Komisaris atau direksi pada perusahaan negara atau perusahaan swasta; atau
    c. Pimpinan organisasi yang dibiayai dari Anggaran Pendapatan Belanja Negara dan/atau
    Anggaran Pendapatan Belanja Daerah.”'
