- putusan: 27/PUU-VIII/2010
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/113/putusan_sidang_Putusan%20No.27-PUU-2010%20telah%20baca.pdf
  amar: Pasal 218 ayat (3) Undang-Undang Nomor 10 Tahun 2008 tentang Pemilihan Umum
    Anggota Dewan Perwakilan Rakyat, Dewan Perwakilan Daerah, dan Dewan Perwakilan
    Rakyat Daerah sepanjang frasa “Daftar Calon Tetap” bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 secara bersyarat (conditionally unconstitutional)
    dan tidak mempunyai kekuatan hukum mengikat sepanjang pengertiannya tidak mencakup
    calon pengganti yang diajukan oleh partai politik yang memiliki kursi di Dewan
    Perwakilan Rakyat, Dewan Perwakilan Rakyat Daerah provinsi, Dewan Perwakilan Rakyat
    Daerah kabupaten/kota dalam hal tidak terdapat lagi calon yang terdaftar dalam
    Daftar Calon Tetap (DCT).
