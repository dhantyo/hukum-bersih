  amar: a. Frasa "Informasi Elektronik dan/atau Dokumen Elektronik" dalam Pasal 5
    ayat (1) dan ayat (2) serta Pasal 44 huruf b Undang-Undang Nomor 11 Tahun 2008
    tentang Informasi dan Transaksi Elektronik bertentangan dengan UUD NRI Tahun 1945
    dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai khususnya
    frasa "Informasi Elektronik dan/atau Dokumen Elektronik" sebagai alat bukti dilakukan
    dalam rangka penegakan hukum atas permintaan kepolisian, kejaksaan, dan/atau institusi
    penegak hukum lainnya yang ditetapkan berdasarkan undang-undang sebagaimana ditentukan
    dalam Pasal 31 ayat (3) Undang-Undang Nomor 11 Tahun 2008 tentang Informasi dan
    Transaksi Elektronik; b. Frasa "Informasi Elektronik dan/atau Dokumen Elektronik"
    dalam Pasal 26A Undang-Undang Nomor 20 Tahun 2001 tentang Perubahan atas Undang-Undang
    Nomor 31 Tahun 1999 tentang Pemberantasan Tindak Pidana Korupsi bertentangan dengan
    UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak
    dimaknai khususnya frasa "Informasi Elektronik dan/atau Dokumen Elektronik" sebagai
    alat bukti dilakukan dalam rangka penegakan hukum atas permintaan kepolisian,
    kejaksaan, dan/atau institusi penegak hukum lainnya yang ditetapkan berdasarkan
    undang-undang sebagaimana ditentukan dalam Pasal 31 ayat (3) Undang-Undang Nomor
    11 Tahun 2008 tentang Informasi dan Transaksi Elektronik.
