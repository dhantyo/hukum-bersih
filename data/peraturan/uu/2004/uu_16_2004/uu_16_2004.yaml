  amar: Frasa "mengesampingkan perkara sebagaimana dimaksud dalam ketentuan ini merupakan
    pelaksanaan atas asas oportunitas yang hanya dapat dilakukan Jaksa Agung setelah
    memperhatikan saran dan pendapat dari badan-badan kekuasaan negara yang mempunyai
    hubungan dengan masalah tersebut" dalam Penjelasan Pasal 35 huruf c Undang-Undang
    Nomor 16 Tahun 2004 tentang Kejaksaan Republik Indonesia bertentangan dengan UUD
    NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai
    "Jaksa Agung wajib memperhatikan saran dan pendapat dari badan-badan kekuasaan
    negara yang mempunyai hubungan dengan masalah tersebut."
