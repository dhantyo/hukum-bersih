  amar: 'Pasal 14 ayat (1) huruf a Undang-Undang Nomor 29 Tahun 2004 tentang Praktik
    Kedokteran yang menyatakan Jumlah anggota Konsil Kedokteran Indonesia 17 (tujuh
    belas) orang yang terdiri atas unsur-unsur yang berasal dari: (a) organisasi profesi
    kedokteran 2 (dua) orang;..." bertentangan dengan UUD NRI Tahun 1945 dan tidak
    mempunyai kekuatan hukum mengikat sepanjang unsur "organisasi profesi kedokteran"
    tidak dimaknai sebagai tidak menjadi pengurus organisasi profesi kedokteran.'
