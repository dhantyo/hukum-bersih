  amar: Pasal 6 ayat (1) huruf c Undang-Undang Nomor 24 Tahun 2004 tentang Lembaga
    Penjamin Simpanan sebagaimana telah diubah dengan UndangUndang Nomor 7 Tahun 2009
    tentang Penetapan Peraturan Pemerintah Pengganti Undang-Undang Nomor 3 Tahun 2008
    tentang Perubahan Atas Undang-Undang Nomor 24 Tahun 2004 tentang Lembaga Penjamin
    Simpanan Menjadi Undang-Undang (Lembaran Negara Republik Indonesia Tahun 2004
    Nomor 96, Tambahan Lembaran Negara Republik Indonesia Nomor 4420) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat sepanjang tidak dimaknai “termasuk dapat melakukan tindakan
    hapus buku dan hapus tagih terhadap aset berupa piutang sepanjang memenuhi ketentuan
    Pasal 46 ayat (5) Undang-Undang Nomor 9 Tahun 2016 tentang Pencegahan dan Penanganan
    Krisis Sistem Keuangan”;
