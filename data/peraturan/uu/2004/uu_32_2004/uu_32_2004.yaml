uji_materi:
- putusan: 147/PUU-VII/2009
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/116/putusan_sidang_Putusan%20Perkara%20No.%20147-PUU-VII2009.pdf
  amar: 'Pasal 88 Undang-Undang Nomor 32 Tahun 2004 tentang Pemerintahan Daerah adalah
    konstitusional bersyarat terhadap Pasal 28C ayat (1) dan ayat (2) Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 sehingga kata, “mencoblos” dalam Pasal
    88 Undang-Undang Nomor 32 Tahun 2004 tentang Pemerintahan Daerah diartikan pula
    menggunakan metode e-voting dengan syarat kumulatif sebagai berikut: a. tidak
    melanggar asas langsung, umum, bebas, rahasia, jujur, dan adil; b. daerah yang
    menerapkan metode e-voting sudah siap dari sisi teknologi, pembiayaan, sumber
    daya manusia maupun perangkat lunaknya, kesiapan masyarakat di daerah yang bersangkutan,
    serta persyaratan lain yang diperlukan;'
- putusan: 5/PUU-V/2007
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/120/putusan_sidang_Putusan5PUUV2007ttgPilkadaIndependenTgl23072007.pdf
  amar: 'Bertentangan dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat pasal-pasal Undang-Undang Nomor 32 Tahun 2004 tentang Pemerintahan Daerah,
    yang hanya memberi kesempatan kepada partai politik atau gabungan partai politik
    dan menutup hak konstitusional calon perseorangan dalam Pilkada, yaitu: a. Pasal
    56 Ayat (2) yang berbunyi, ”Pasangan calon sebagaimana dimaksud pada Ayat (1)
    diajukan oleh partai politik atau gabungan partai politik”; b. Pasal 59 Ayat (1)
    sepanjang mengenai frasa “yang diusulkan oleh partai politik atau gabungan partai
    politik”. c. Pasal 59 Ayat (2) sepanjang mengenai frasa ”sebagaimana dimaksud
    pada ayat (1)”. d. Pasal 59 Ayat (3) sepanjang mengenai frasa “Partai politik
    atau gabungan partai politik wajib”, frasa ”yang seluas-luasnya”, dan frasa “dan
    selanjutnya memproses bakal calon dimaksud”.'
- putusan: 072- 073 /PUU-II/2004
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/134/Putusan072073PUUII2004tgl220305Pemda.pdf
  amar: Pasal 57 ayat (1) sepanjang anak kalimat “… yang bertanggung jawab kepada
    DPRD”; a. Pasal 66 ayat (3) huruf e “meminta pertanggungjawaban pelaksanaan tugas
    KPUD”; b. Pasal 67 ayat (1) huruf e sepanjang anak kalimat “… kepada DPRD”; c.
    Pasal 82 ayat (2) sepanjang anak kalimat “… oleh DPRD” Undang-Undang Nomor 32
    Tahun 2004 Tentang Pemerintahan Daerah bertentangan dengan UUD NRI Tahun 1945
    dan tidak mempunyai kekuatan hukum mengikat.
