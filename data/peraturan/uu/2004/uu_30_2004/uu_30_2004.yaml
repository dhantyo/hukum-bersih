  amar: Pasal 8 ayat (2) Undang-Undang Nomor 30 Tahun 2004 tentang Jabatan Notaris
    (Lembaran Negara Republik Indonesia Tahun 2004 Nomor 117, Tambahan Lembaran Negara
    Republik Indonesia Nomor 4432) bertentangan dengan Undang-Undang Dasar Negara
    Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat secara
    bersyarat sepanjang tidak dimaknai "Ketentuan umur sebagaimana dimaksud pada ayat
    (1) huruf b dapat diperpanjang sampai berumur 67 (enam puluh tujuh) tahun dengan
    mempertimbangkan kesehatan yang bersangkutan, dan dapat diperpanjang kembali setiap
    tahun sampai berumur 70 (tujuh puluh) tahun dengan mempertimbangkan kesehatan
    yang bersangkutan berdasarkan hasil pemeriksaan dokter yang dilakukan secara berkala
    setiap tahun pada rumah sakit umum pemerintah pusat, rumah sakit umum daerah,
    atau rumah sakit yang ditunjuk oleh Menteri yang menangani urusan di bidang hukum."
