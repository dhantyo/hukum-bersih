    Tahun 2011 Nomor 7, Tambahan Lembaran Negara Republik Indonesia Nomor 5188); 2)
    Undang-Undang Nomor 4 Tahun 2016 tentang Tabungan Perumahan Rakyat (Lembaran Negara
    Republik Indonesia Tahun 2016 Nomor 55, Tambahan Lembaran Negara Republik Indonesia
    Nomor 5863) dinyatakan tetap berlaku dan harus dilakukan penataan ulang dalam
    waktu paling lama 2 (dua) tahun sejak Putusan a quo diucapkan.
