uji_materi:
- putusan: 144/PUU-XXI/2023
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/219/putusan_mkri_%20144_PUU-XXI_2023.pdf
  amar: 1) Frasa “3 (tiga) tahun” dalam norma Pasal 74 ayat (1) Undang Undang Nomor
    20 Tahun 2016 tentang Merek dan Indikasi Geografis (Lembaran Negara Tahun 2016
    Nomor 252, Tambahan Lembaran Negara Republik Indonesia Nomor 5953) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai “5 (lima) tahun”.
    Sehingga, norma Pasal 74 ayat (1) Undang-Undang Nomor 20 Tahun 2016 tentang Merek
    dan Indikasi Geografis (Lembaran Negara Tahun 2016 Nomor 252, Tambahan Lembaran
    Negara Republik Indonesia Nomor 5953) selengkapnya berbunyi “Penghapusan Merek
    terdaftar dapat pula diajukan oleh pihak ketiga yang 223 berkepentingan dalam
    bentuk gugatan ke Pengadilan Niaga dengan alasan Merek tersebut tidak digunakan
    selama 5 (lima) tahun berturut-turut dalam perdagangan barang dan/atau jasa sejak
    tanggal pendaftaran atau pemakaian terakhir”. 2) Frasa “larangan serupa lainnya”
    dalam norma Pasal 74 ayat (2) huruf c Undang-Undang Nomor 20 Tahun 2016 tentang
    Merek dan Indikasi Geografis (Lembaran Negara Tahun 2016 Nomor 252, Tambahan Lembaran
    Negara Republik Indonesia Nomor 5953) bertentangan dengan Undang Undang Dasar
    Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat
    sepanjang tidak dimaknai mencakup “termasuk dalam kondisi force majeure”. Sehingga,
    norma Pasal 74 ayat (2) huruf c Undang-Undang Nomor 20 Tahun 2016 tentang Merek
    dan Indikasi Geografis (Lembaran Negara Tahun 2016 Nomor 252, Tambahan Lembaran
    Negara Republik Indonesia Nomor 5953) selengkapnya berbunyi “c. larangan serupa
    lainnya, termasuk dalam kondisi force majeure yang ditetapkan dengan Peraturan
    Pemerintah”
