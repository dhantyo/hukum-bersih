- putusan: 154/PUU-XXII/2024
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/180/154-PUU-XXII-2024.pdf
  amar: Pasal 70 ayat (3) Undang-Undang Nomor 10 Tahun 2016 tentang Perubahan Kedua
    Atas Undang-Undang Nomor 1 Tahun 2015 tentang Penetapan Peraturan Pemerintah Pengganti
    Undang-Undang Nomor 1 Tahun 2014 tentang Pemilihan Gubernur, Bupati, dan Walikota
    Menjadi Undang-Undang (Lembaran Negara Republik Indonesia Tahun 2016 Nomor 130,
    Tambahan Lembaran Negara Republik Indonesia Nomor 5898) bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat secara bersyarat sepanjang tidak dimaknai “cuti di luar tanggungan negara
    dan dilarang menggunakan fasilitas yang terkait dengan jabatannya bagi kepala
    daerah dan/atau wakil kepala daerah petahana baik pada masa kampanye, masa tenang
    maupun pada hari pemungutan suara”.
- putusan: 60/PUU-XXII/2024
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/193/60_PUU-XXII_2024.pdf
  amar: '1). Pasal 40 ayat (1) Undang-Undang Nomor 10 Tahun 2016 tentang Perubahan
    Kedua Atas Undang-Undang Nomor 1 Tahun 2015 tentang Penetapan Peraturan Pemerintah
    Pengganti Undang-Undang Nomor 1 Tahun 2014 tentang Pemilihan Gubernur, Bupati,
    dan Walikota Menjadi Undang-Undang (Lembaran Negara Republik Indonesia Tahun 2016
    Nomor 130, Tambahan Lembaran Negara Republik Indonesia Nomor 5898) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat, sepanjang tidak dimaknai: “partai politik atau gabungan
    partai politik peserta pemilu dapat mendaftarkan pasangan calon jika telah memenuhi
    persyaratan sebagai berikut: Untuk mengusulkan calon gubernur dan calon wakil
    gubernur: a. provinsi dengan jumlah penduduk yang termuat pada daftar pemilih
    tetap sampai dengan 2.000.000 (dua juta) jiwa, partai politik atau gabungan partai
    politik peserta pemilu harus memeroleh suara sah paling sedikit 10% (sepuluh persen)
    di provinsi tersebut; b. provinsi dengan jumlah penduduk yang termuat pada daftar
    pemilih tetap lebih dari 2.000.000 (dua juta) jiwa sampai dengan 6.000.000 (enam
    juta) jiwa, partai politik atau gabungan partai politik peserta pemilu harus memeroleh
    suara sah paling sedikit 8,5% (delapan setengah persen) di provinsi tersebut;
    c. provinsi dengan jumlah penduduk yang termuat pada daftar pemilih tetap lebih
    dari 6.000.000 (enam juta) jiwa sampai dengan 12.000.000 (dua belas juta) jiwa,
    partai politik atau gabungan partai politik peserta pemilu harus memeroleh suara
    sah paling sedikit 7,5% (tujuh setengah persen) di provinsi tersebut; d. provinsi
    dengan jumlah penduduk yang termuat pada daftar pemilih tetap lebih dari 12.000.000
    (dua belas juta) jiwa, partai politik atau gabungan partai politik peserta pemilu
    harus memeroleh suara sah paling sedikit 6,5% (enam setengah persen) di provinsi
    tersebut; Untuk mengusulkan calon bupati dan calon wakil bupati serta calon walikota
    dan calon wakil walikota: a. kabupaten/kota dengan jumlah penduduk yang termuat
    pada daftar pemilih tetap sampai dengan 250.000 (dua ratus lima puluh ribu) jiwa,
    partai politik atau gabungan partai politik peserta pemilu harus memeroleh suara
    sah paling sedikit 10% (sepuluh persen) di kabupaten/kota tersebut; b. kabupaten/kota
    dengan jumlah penduduk yang termuat pada daftar pemilih tetap lebih dari 250.000
    (dua ratus lima puluh ribu) sampai dengan 500.000 (lima ratus ribu) jiwa, partai
    politik atau gabungan partai politik peserta pemilu harus memeroleh suara sah
    paling sedikit 8,5% (delapan setengah persen) di kabupaten/kota tersebut; c. kabupaten/kota
    dengan jumlah penduduk yang termuat pada daftar pemilih tetap lebih dari 500.000
    (lima ratus ribu) sampai dengan 1.000.000 (satu juta) jiwa, partai politik atau
    gabungan partai politik peserta pemilu harus memeroleh suara sah paling sedikit
    7,5% (tujuh setengah persen) di kabupaten/kota tersebut; d. kabupaten/kota dengan
    jumlah penduduk yang termuat pada daftar pemilih tetap lebih dari 1.000.000 (satu
    juta) jiwa, partai politik atau gabungan partai politik peserta pemilu harus memeroleh
    suara sah paling sedikit 6,5% (enam setengah persen) di kabupaten/kota tersebut;”
    2). Pasal 40 ayat (3) Undang-Undang Nomor 10 Tahun 2016 tentang Perubahan Kedua
    Atas Undang-Undang Nomor 1 Tahun 2015 tentang Penetapan Peraturan Pemerintah Pengganti
    Undang-Undang Nomor 1 Tahun 2014 tentang Pemilihan Gubernur, Bupati, dan Walikota
    Menjadi Undang-Undang (Lembaran Negara Republik Indonesia Tahun 2016 Nomor 130,
    Tambahan Lembaran Negara Republik Indonesia Nomor 5898) bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat.'
- putusan: 27/PUU-XXII/2024
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/263/putusan_mkri_9705_27_PUU-XXII_2024.pdf
  amar: Pasal 201 ayat (7) Undang-Undang Nomor 10 Tahun 2016 tentang Perubahan Kedua
    Atas Undang-Undang Nomor 1 Tahun 2015 tentang Penetapan Peraturan Pemerintah Pengganti
    Undang-Undang Nomor 1 Tahun 2014 tentang Pemilihan Gubernur, Bupati, dan Walikota
    Menjadi Undang-Undang (Lembaran Negara Republik Indonesia Tahun 2016 Nomor 130,
    Tambahan Lembaran Negara Republik Indonesia Nomor 5898) yang semula berbunyi,
    “Gubernur dan Wakil Gubernur, Bupati dan Wakil Bupati, serta Walikota dan Wakil
    Walikota hasil Pemilihan tahun 2020 menjabat sampai dengan tahun 2024” bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai, “Gubernur dan
    Wakil Gubernur, Bupati dan Wakil Bupati, serta Walikota dan Wakil Walikota hasil
    Pemilihan tahun 2020 menjabat sampai dengan dilantiknya Gubernur dan Wakil Gubernur,
    Bupati dan Wakil Bupati, serta Walikota dan Wakil Walikota hasil Pemilihan serentak
    secara nasional tahun 2024 sepanjang tidak melewati 5 (lima) tahun masa jabatan”.
    Sehingga, norma Pasal 201 ayat (7) Undang-Undang Nomor 10 Tahun 2016 tentang Perubahan
    Kedua Atas Undang-Undang Nomor 1 Tahun 2015 tentang Penetapan Peraturan Pemerintah
    Pengganti Undang-Undang Nomor 1 Tahun 2014 tentang Pemilihan Gubernur, Bupati,
    dan Walikota Menjadi Undang-Undang selengkapnya menjadi berbunyi, “Gubernur dan
    Wakil Gubernur, Bupati dan Wakil Bupati, serta Walikota dan Wakil Walikota hasil
    Pemilihan tahun 2020 menjabat sampai dengan dilantiknya Gubernur dan Wakil Gubernur,
    Bupati dan Wakil Bupati, serta Walikota dan Wakil Walikota hasil Pemilihan serentak
    secara nasional tahun 2024 sepanjang tidak melewati 5 (lima) tahun masa jabatan."
- putusan: Nomor 56/PUU-XVII/2019
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/147/PULB_MK_56PUUXVII2019_2019.PDF
  amar: 'enyatakan Pasal 7 ayat (2) huruf g Undang-Undang Nomor 10 Tahun 2016 tentang
    Perubahan Kedua Atas Undang-Undang Nomor 1 Tahun 2015 tentang Penetapan Peraturan
    Pemerintah Pengganti Undang-Undang Nomor 1 Tahun 2014 tentang Pemilihan Gubernur,
    Bupati, Dan Walikota Menjadi UndangUndang (Lembaran Negara Republik Indonesia
    Tahun 2016 Nomor 130, Tambahan Lembaran Negara Republik Indonesia Nomor 5898)
    bertentangan dengan Undang-Undang Dasar 1945 dan tidak mempunyai kekuatan hukum
    mengikat secara bersyarat sepanjang tidak dimaknai telah melewati jangka 65 waktu
    5 (lima) tahun setelah mantan terpidana selesai menjalani pidana penjara berdasarkan
    putusan pengadilan yang telah mempunyai kekuatan hukum tetap; sehingga Pasal 7
    ayat (2) huruf g Undang-Undang Nomor 10 Tahun 2016 tentang Perubahan Kedua Atas
    Undang-Undang Nomor 1 Tahun 2015 tentang Penetapan Peraturan Pemerintah Pengganti
    Undang-Undang Nomor 1 Tahun 2014 tentang Pemilihan Gubernur, Bupati, Dan Walikota
    Menjadi Undang-Undang (Lembaran Negara Republik Indonesia Tahun 2016 Nomor 130,
    Tambahan Lembaran Negara Republik Indonesia Nomor 5898) selengkapnya berbunyi:
    Calon Gubernur dan Calon Wakil Gubernur, Calon Bupati dan Calon Wakil Bupati,
    serta Calon Walikota dan Calon Wakil Walikota sebagaimana dimaksud pada ayat (1)
    harus memenuhi persyaratan sebagai berikut: … g. (i) tidak pernah sebagai terpidana
    berdasarkan putusan pengadilan yang telah memperoleh kekuatan hukum tetap karena
    melakukan tindak pidana yang diancam dengan pidana penjara 5 (lima) tahun atau
    lebih, kecuali terhadap terpidana yang melakukan tindak pidana kealpaan dan tindak
    pidana politik dalam pengertian suatu perbuatan yang dinyatakan sebagai tindak
    pidana dalam hukum positif hanya karena pelakunya mempunyai pandangan politik
    yang berbeda dengan rezim yang sedang berkuasa; (ii) bagi mantan terpidana, telah
    melewati jangka waktu 5 (lima) tahun setelah mantan terpidana selesai menjalani
    pidana penjara berdasarkan putusan pengadilan yang telah mempunyai kekuatan hukum
    tetap dan secara jujur atau terbuka mengumumkan mengenai latar belakang jati dirinya
    sebagai mantan terpidana; dan (iii) bukan sebagai pelaku kejahatan yang berulangulang;'
- putusan: 71/PUU-XIV/2016
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/15/71_PUU-XIV_2016.pdf
  amar: Pasal 7 ayat (2) huruf g, Pasal 163 ayat (7), Pasal 163 ayat (8), Pasal 164
    ayat (7) dan ayat (8) Undang-Undang Nomor 10 Tahun 2016 tentang tentang Perubahan
    Kedua atas Undang-Undang Nomor 1 Tahun 2015 tentang Penetapan Peraturan Pemerintah
    Pengganti Undang-Undang Nomor 1 Tahun 2014 tentang Pemilihan Gubernur, Bupati,
    dan Walikota Menjadi Undang-Undang bertentangan dengan UUD NRI Tahun 1945 dan
    tidak memiliki kekuatan hukum mengikat secara bersyarat.
