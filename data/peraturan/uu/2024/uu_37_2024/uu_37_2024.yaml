  amar: Kata “Batanghari” dalam Undang-Undang Nomor 37 Tahun 2024 tentang Kabupaten
    Batanghari di Provinsi Jambi (Lembaran Negara Republik Indonesia Tahun 2024 Nomor
    143, Tambahan Lembaran Negara Republik Indonesia Nomor 6958) bertentangan dengan
    Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan
    hukum mengikat secara bersyarat sepanjang tidak dimaknai ”Batang Hari”, sehingga
    ditulis menjadi “Batang Hari.”
