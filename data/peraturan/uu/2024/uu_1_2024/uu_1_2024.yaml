  amar: Kata “kerusuhan” dalam Pasal 28 ayat (3) dan Pasal 45A ayat (3) Undang-Undang
    Nomor 1 Tahun 2024 tentang Perubahan Kedua Atas Undang-Undang Nomor 11 Tahun 2008
    tentang Informasi dan Transaksi Elektronik (Lembaran Negara Republik Indonesia
    Tahun 2024 Nomor 1, Tambahan Lembaran Negara Republik Indonesia Nomor 6905) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai “kerusuhan adalah
    kondisi yang mengganggu ketertiban umum di ruang fisik, bukan kondisi di ruang
    digital/siber.”
