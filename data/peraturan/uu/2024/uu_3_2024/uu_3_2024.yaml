  amar: Pasal 118 huruf e Undang-Undang Nomor 3 Tahun 2024 tentang Perubahan Kedua
    Atas Undang-Undang Nomor 6 Tahun 2014 tentang Desa (Lembaran Negara Republik Indonesia
    Tahun 2024 Nomor 77, Tambahan Lembaran Negara Republik Indonesia Nomor 6914) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak memiliki
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai “tidak diberlakukan
    untuk desa yang telah melakukan pemilihan kepala desa berdasarkan Undang-Undang
    Nomor 6 Tahun 2014 tentang Desa”.
