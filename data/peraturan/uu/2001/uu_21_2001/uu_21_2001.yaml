  amar: Pasal 20 ayat (1) huruf a Undang-Undang Nomor 21 Tahun 2001 tentang Otonomi
    Khusus Bagi Provinsi Papua adalah bertentangan dengan UUD NRI Tahun 1945 dan tidak
    mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai bahwa pertimbangan
    dan persetujuan Majelis Rakyat Papua mengenai status seseorang sebagai orang asli
    Papua sebagaimana dimaksud Pasal 1 huruf t Undang-Undang Nomor 21 Tahun 2001 tentang
    Otonomi Khusus Bagi Provinsi Papua, yang bakal menjadi calon gubernur dan/atau
    calon wakil gubernur, adalah berdasarkan pengakuan dari suku asli di Papua asal
    bakal calon gubernur dan/atau wakil gubernur yang bersangkutan
