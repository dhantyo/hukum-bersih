    Badan Pelaksana dan" dalam Pasal 21 ayat (1), frasa "Badan Pelaksana dan" dalam
    Pasal 49 bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia dan
    tidak mempunyai kekuatan hukum mengikat; (c) Seluruh hal terkait dengan Undang-Undang
    Dasar Negara Republik Indonesia dan tidak mempunyai kekuatan hukum mengikat; (d)
    Fungsi dan tugas Badan Pelaksana Minyak dan Gas BUmi dilaksanakan oleh Pemerintah,
