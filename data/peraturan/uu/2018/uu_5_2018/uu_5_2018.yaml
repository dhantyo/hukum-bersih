uji_materi:
- putusan: 103/PUU-XXI/2023
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/190/Putusan_mkri_%20103-PUU-XXI-2023.pdf
  amar: frasa “3 (tiga) tahun terhitung sejak tanggal Undang-Undang ini mulai berlaku”
    dalam Pasal 43L ayat (4) Undang-Undang Nomor 5 Tahun 2018 tentang Perubahan Atas
    Undang-Undang Nomor 15 Tahun 2003 tentang Penetapan Peraturan Pemerintah Pengganti
    Undang-Undang Nomor 1 Tahun 2002 tentang Pemberantasan Tindak Pidana Terorisme
    Menjadi Undang-Undang (Lembaran Negara Republik Indonesia Tahun 2018 Nomor 92,
    Tambahan Lembaran Negara Republik Indonesia Nomor 6216) bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat secara bersyarat sepanjang tidak dimaknai “10 (sepuluh) tahun terhitung
    sejak tanggal Undang-Undang ini mulai berlaku”. Sehingga, norma Pasal 43L ayat
    (4) Undang-Undang Nomor 5 Tahun 2018 tentang Perubahan Atas Undang-Undang Nomor
    15 Tahun 2003 tentang Penetapan Peraturan Pemerintah Pengganti Undang-Undang Nomor
    1 Tahun 2002 tentang Pemberantasan Tindak Pidana Terorisme Menjadi Undang-Undang
    yang semula berbunyi “Permohonan sebagaimana dimaksud pada ayat (2) dapat diajukan
    paling lama 3 (tiga) tahun terhitung sejak tanggal Undang-Undang ini mulai berlaku”
    menjadi selengkapnya berbunyi, “Permohonan sebagaimana dimaksud pada ayat (2)
    dapat diajukan paling lama 10 (sepuluh) tahun terhitung sejak tanggal Undang-Undang
    ini mulai berlaku”.
