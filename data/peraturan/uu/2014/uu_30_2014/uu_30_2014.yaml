- putusan: 66/PUU-XXIV/2026
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/232/putusan_mkri_66-PUU-XXIV-2026.pdf
  amar: 'Frasa "kerugian negara" dalam norma Pasal 20 ayat (5) dan ayat (6) Undang-Undang
    Nomor 30 Tahun 2014 tentang Administrasi Pemerintahan (Lembaran Negara Republik
    Indonesia Tahun 2014 Nomor 292, Tambahan Lembaran Negara Republik Indonesia Nomor
    5601) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun
    1945 dan tidak memiliki kekuatan hukum mengikat secara bersyarat sepanjang tidak
    dimaknai "kerugian keuangan negara", sehingga norma Pasal 20 ayat (5) dan ayat
    (6) Undang-Undang Nomor 30 Tahun 2014 tentang Administrasi Pemerintahan (Lembaran
    Negara Republik Indonesia Tahun 2014 Nomor 292, Tambahan Lembaran Negara Republik
    Indonesia Nomor 5601) selengkapnya berbunyi: “(5) Pengembalian kerugian keuangan
    negara sebagaimana dimaksud pada ayat (4) dibebankan kepada Badan Pemerintahan,
    apabila kesalahan administratif sebagaimana dimaksud pada ayat (2) huruf c terjadi
    bukan karena adanya unsur penyalahgunaan Wewenang. (6) Pengembalian kerugian keuangan
    negara sebagaimana dimaksud pada ayat (4) dibebankan kepada Pejabat Pemerintahan,
    apabila kesalahan administratif sebagaimana dimaksud pada ayat (2) huruf c terjadi
    karena adanya unsur penyalahgunaan Wewenang.”'
