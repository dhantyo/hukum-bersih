uji_materi:
- putusan: 169/PUU-XXII/2024
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/207/putusan_mkri_169_PUU-XXII_2024.pdf
  amar: 1) Pasal 90 ayat (2) Undang-Undang Nomor 17 Tahun 2014 tentang Majelis Permusyawaratan
    Rakyat, Dewan Perwakilan Rakyat, Dewan Perwakilan Daerah, dan Dewan Perwakilan
    Rakyat Daerah (Lembaran Negara Republik Indonesia Tahun 2014 Nomor 182, Tambahan
    Lembaran Negara Republik Indonesia Nomor 5568) bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat secara bersyarat sepanjang tidak dimaknai, “Anggota Badan Musyawarah
    berjumlah paling banyak 1/10 (satu per sepuluh) dari jumlah anggota DPR berdasarkan
    perimbangan jumlah anggota tiap-tiap fraksi dengan memuat keterwakilan perempuan
    berdasarkan perimbangan dan pemerataan jumlah anggota perempuan pada tiap-tiap
    fraksi yang ditetapkan oleh rapat paripurna”. 2) Pasal 96 ayat (2) Undang-Undang
    Nomor 17 Tahun 2014 tentang Majelis Permusyawaratan Rakyat, Dewan Perwakilan Rakyat,
    Dewan Perwakilan Daerah, dan Dewan Perwakilan Rakyat Daerah (Lembaran Negara Republik
    Indonesia Tahun 2014 Nomor 182, Tambahan Lembaran Negara Republik Indonesia Nomor
    5568) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun
    1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang tidak
    dimaknai, “Jumlah anggota komisi ditetapkan dalam rapat paripurna menurut perimbangan
    dan pemerataan jumlah anggota tiap-tiap fraksi dengan memuat keterwakilan perempuan
    berdasarkan perimbangan dan pemerataan jumlah anggota perempuan pada tiap-tiap
    fraksi pada permulaan masa keanggotaan DPR, permulaan tahun sidang, dan pada setiap
    masa sidang”. 3) Pasal 103 ayat (2) Undang-Undang Nomor 17 Tahun 2014 tentang
    Majelis Permusyawaratan Rakyat, Dewan Perwakilan Rakyat, Dewan Perwakilan Daerah,
    dan Dewan Perwakilan Rakyat Daerah (Lembaran Negara Republik Indonesia Tahun 2014
    Nomor 182, Tambahan Lembaran Negara Republik Indonesia Nomor 5568) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai, “Jumlah anggota
    Badan Legislasi paling banyak 2 (dua) kali jumlah anggota komisi, yang mencerminkan
    fraksi dan komisi dengan memuat keterwakilan perempuan berdasarkan perimbangan
    dan pemerataan jumlah anggota perempuan pada tiap-tiap fraksi”. 4) Pasal 108 ayat
    (3) Undang-Undang Nomor 17 Tahun 2014 tentang Majelis Permusyawaratan Rakyat,
    Dewan Perwakilan Rakyat, Dewan Perwakilan Daerah, dan Dewan Perwakilan Rakyat
    Daerah (Lembaran Negara Republik Indonesia Tahun 2014 Nomor 182, Tambahan Lembaran
    Negara Republik Indonesia Nomor 5568) bertentangan dengan Undang-Undang Dasar
    Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat
    secara bersyarat sepanjang tidak dimaknai, “Susunan dan keanggotaan Badan Anggaran
    sebagaimana dimaksud pada ayat (1) terdiri atas anggota dari setiap komisi yang
    dipilih oleh komisi dengan memperhatikan perimbangan jumlah anggota dan usulan
    fraksi dengan memuat keterwakilan perempuan berdasarkan perimbangan dan pemerataan
    jumlah anggota perempuan pada tiap-tiap fraksi”. 5) Pasal 114 ayat (3) Undang-Undang
    Nomor 17 Tahun 2014 tentang Majelis Permusyawaratan Rakyat, Dewan Perwakilan Rakyat,
    Dewan Perwakilan Daerah, dan Dewan Perwakilan Rakyat Daerah (Lembaran Negara Republik
    Indonesia Tahun 2014 Nomor 182, Tambahan Lembaran Negara Republik Indonesia Nomor
    5568) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun
    1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang tidak
    dimaknai, “Jumlah anggota BKSAP ditetapkan dalam rapat paripurna DPR menurut perimbangan
    dan pemerataan jumlah anggota setiap fraksi dengan memuat keterwakilan perempuan
    berdasarkan perimbangan dan pemerataan jumlah anggota perempuan pada tiap-tiap
    fraksi”. 6) Pasal 120 ayat (1) Undang-Undang Nomor 17 Tahun 2014 tentang Majelis
    Permusyawaratan Rakyat, Dewan Perwakilan Rakyat, Dewan Perwakilan Daerah, dan
    Dewan Perwakilan Rakyat Daerah (Lembaran Negara Republik Indonesia Tahun 2014
    Nomor 182, Tambahan Lembaran Negara Republik Indonesia Nomor 5568) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai, “DPR menetapkan
    susunan dan keanggotaan Mahkamah Kehormatan Dewan yang terdiri atas semua fraksi
    dengan memperhatikan perimbangan dan pemerataan jumlah anggota setiap fraksi dengan
    memuat keterwakilan perempuan berdasarkan perimbangan dan pemerataan jumlah anggota
    perempuan pada tiap-tiap fraksi pada permulaan masa keanggotaan DPR dan permulaan
    tahun sidang”. 7) Pasal 151 ayat (2) Undang-Undang Nomor 17 Tahun 2014 tentang
    Majelis Permusyawaratan Rakyat, Dewan Perwakilan Rakyat, Dewan Perwakilan Daerah,
    dan Dewan Perwakilan Rakyat Daerah (Lembaran Negara Republik Indonesia Tahun 2014
    Nomor 182, Tambahan Lembaran Negara Republik Indonesia Nomor 5568) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai, “Jumlah anggota
    BURT paling banyak 25 (dua puluh lima) orang atas usul komisi dan fraksi berdasarkan
    perimbangan dan pemerataan jumlah anggota setiap fraksi di komisi dengan memuat
    keterwakilan perempuan berdasarkan perimbangan dan pemerataan jumlah anggota perempuan
    pada tiap-tiap fraksi yang ditetapkan dalam rapat paripurna DPR”. 8) Pasal 157
    ayat (1) Undang-Undang Nomor 17 Tahun 2014 tentang Majelis Permusyawaratan Rakyat,
    Dewan Perwakilan Rakyat, Dewan Perwakilan Daerah, dan Dewan Perwakilan Rakyat
    Daerah (Lembaran Negara Republik Indonesia Tahun 2014 Nomor 182, Tambahan Lembaran
    Negara Republik Indonesia Nomor 5568) bertentangan dengan Undang-Undang Dasar
    Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat
    secara bersyarat sepanjang tidak dimaknai, “DPR menetapkan susunan dan keanggotaan
    panitia khusus berdasarkan perimbangan dan pemerataan jumlah anggota tiap-tiap
    fraksi dengan memuat keterwakilan perempuan berdasarkan perimbangan dan pemerataan
    jumlah anggota perempuan pada tiap-tiap fraksi”. 9) Pasal 427E ayat (1) huruf
    b Undang-Undang Nomor 2 Tahun 2018 tentang Perubahan Kedua Atas Undang-Undang
    Nomor 17 Tahun 2014 tentang Majelis Permusyawaratan Rakyat, Dewan Perwakilan Rakyat,
    Dewan Perwakilan Daerah, dan Dewan Perwakilan Rakyat Daerah (Lembaran Negara Republik
    Indonesia Tahun 2018 Nomor 29, Tambahan Lembaran Negara Republik Indonesia Nomor
    6187) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun
    1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang tidak
    dimaknai, “pimpinan komisi, Badan 239 Legislasi, Badan Anggaran, BKSAP, Mahkamah
    Kehormatan Dewan, dan BURT terdiri atas 1 (satu) orang ketua dan paling banyak
    4 (empat) orang wakil ketua, yang ditetapkan dari dan oleh anggota komisi, Badan
    Legislasi, Badan Anggaran, BKSAP, Mahkamah Kehormatan Dewan, dan BURT berdasarkan
    prinsip musyawarah untuk mufakat dan proporsional menurut perimbangan jumlah anggota
    tiap-tiap fraksi dengan memuat keterwakilan perempuan paling sedikit 30% (tiga
    puluh persen)”
- putusan: 76/PUU-XIII/2014
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/55/76_PUU-XII_2014.pdf
  amar: a. Frasa "persetujuan tertulis dari Mahkamah Kehormatan Dewan" dalam Pasal
    224 ayat (5) dan Pasal 245 ayat (1) Undang-Undang Nomor 17 Tahun 2014 tentang
    Majelis Permusyawaratan Rakyat, Dewan Perwakilan Rakyat, Dewan Perwakilan Daerah,
    dan Dewan Perwakilan Rakyat Daerah bertentangan dengan UUD NRI Tahun 1945 dan
    tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai "persetujuan
    tertulis dari Presiden." b. Pasal 245 ayat (1) Undang-Undang Nomor 17 Tahun 2014
    tentang Majelis Permusyawaratan Rakyat, Dewan Perwakilan Rakyat, Dewan Perwakilan
    Daerah, dan Dewan Perwakilan Rakyat Daerah selengkapnya menjadi "Pemanggilan dan
    permintaan keterangan untuk penyidikan terhadap anggota DPR yang diduga melakukan
    tindak pidana harus mendapat persetujuan tertulis dari Presiden."
