uji_materi:
- putusan: 88/PUU-XXI/2023
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/221/88_PUU-XXI_2023.pdf
  amar: 'Pasal 193 ayat (2) huruf i Undang-Undang Nomor 23 Tahun 2014 tentang Pemerintahan
    Daerah (Lembaran Negara Republik Indonesia Tahun 2014 Nomor 244, Tambahan Lembaran
    Negara Republik Indonesia Nomor 5587) bertentangan dengan Undang-Undang Dasar
    Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat,
    sepanjang tidak dimaknai “dikecualikan bagi anggota Dewan Perwakilan Rakyat Daerah
    Kabupaten/Kota jika: a. partai politik yang mencalonkan anggota tersebut tidak
    lagi menjadi peserta Pemilu atau kepengurusan partai politik tersebut sudah tidak
    ada lagi, b. anggota Dewan Perwakilan Rakyat Daerah Kabupaten/Kota tidak diberhentikan
    atau tidak ditarik oleh partai politik yang mencalonkannya, c. tidak lagi terdapat
    calon pengganti yang terdaftar dalam Daftar Calon Tetap dari partai yang mencalonkannya.”'
- putusan: 137/PUU-XIII/2015
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/29/137_PUU-XIII_2015.pdf
  amar: Frasa "Perda Kabupaten/Kota dan" dalam Pasal 251 ayat (2) dan ayat (4); frasa
    "Perda Kabupaten/Kota dan/atau" dalam Pasal 25 ayat (3); frasa "penyelenggara
    Pemerintah Daerah kabupaten/kota tidak dapat menerima keputusan pembatalan Perda
    Kabupaten/Kota dan;" dan frasa "Perda Kabupaten/Kota atau" dalam Pasal 251 ayat
    (8) Undang-Undang Nomor 23 Tahun 2014 tentang Pemerintahan Daerah bertentangan
    dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat.
