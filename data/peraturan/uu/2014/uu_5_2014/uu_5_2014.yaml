  amar: Menyatakan frasa “dan/atau pidana umum” dalam Pasal 87 ayat (4) huruf b Undang-Undang
    Nomor 5 Tahun 2014 tentang Aparatur Sipil Negara (Lembaran Negara Republik Indonesia
    Tahun 2014 Nomor 6, Tambahan Lembaran Negara Republik Indonesia Nomor 5494) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat, sehingga Pasal 87 ayat (4) huruf b Undang-Undang Nomor
    5 Tahun 2014 tentang Aparatur Sipil Negara menjadi berbunyi, “dihukum penjara
    atau kurungan berdasarkan putusan pengadilan yang telah memiliki kekuatan hukum
    tetap karena melakukan tindak pidana kejahatan jabatan atau tindak pidana kejahatan
    yang ada hubungannya dengan jabatan”;
