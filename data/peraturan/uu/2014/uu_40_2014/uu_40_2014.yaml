- putusan: PUTUSAN Nomor 32/PUU-XVIII/2020
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/156/putusan_mkri_7292.pdf
  amar: Amar Putusan:1. Mengabulkan permohonan para Pemohon; 1.1 Menyatakan frasa
    “...diatur dalam Peraturan Pemerintah” dalam Pasal 6 ayat (3) Undang-Undang Nomor
    40 Tahun 2014 tentang Perasuransian (Lembaran Negara Republik Indonesia Tahun
    2014 Nomor 337, Tambahan Lembaran Negara Republik Indonesia Nomor 5618), bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat; 1.2 Menyatakan frasa “...diatur dalam Peraturan Pemerintah”
    dalam Pasal 6 ayat (3) Undang-Undang Nomor 40 Tahun 2014 tentang Perasuransian
    (Lembaran Negara Republik Indonesia Tahun 2014 Nomor 337, Tambahan Lembaran Negara
    Republik Indonesia Nomor 5618), diubah sehingga menjadi diatur dengan Undang-Undang,
    sehingga selengkapnya Pasal 6 ayat (3) Undang-Undang Nomor 40 Tahun 2014 tentang
    Perasuransian (Lembaran Negara Republik Indonesia Tahun 2014 Nomor 337, Tambahan
    Lembaran Negara Republik Indonesia Nomor 5618), menjadi “Ketentuan lebih lanjut
    mengenai badan hukum usaha bersama sebagaimana dimaksud pada ayat (2) diatur dengan
    Undang-Undang”. 1.3 Memerintahkan DPR dan Presiden untuk menyelesaikan Undang-Undang
    tentang Asuransi Usaha Bersama dalam waktu paling lama dua tahun sejak putusan
    ini diucapkan. 2. Memerintahkan pemuatan Putusan ini dalam Berita Negara Republik
    Indonesia sebagaimana mestinya.
