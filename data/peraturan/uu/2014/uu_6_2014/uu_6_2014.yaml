uji_materi:
- putusan: 42/PUU-XIX/2021
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/199/putusan_mkri_42-PUU-XIX-2021.pdf
  amar: Penjelasan Pasal 39 Undang-Undang Republik Indonesia Nomor 6 Tahun 2014 tentang
    Desa (Lembaran Negara Republik Indonesia Tahun 2014 Nomor 7, Tambahan Lembaran
    Negara Republik Indonesia Nomor 5495) bertentangan dengan Undang-Undang Dasar
    Negara Republik Indonesia 1945 dan tidak mempunyai kekuatan hukum mengikat secara
    bersyarat sepanjang tidak dimaknai, “Kepala desa yang sudah menjabat 1 (satu)
    periode, baik berdasarkan Undang-Undang Republik Indonesia Nomor 6 Tahun 2014
    tentang Desa maupun berdasarkan undang-undang sebelumnya masih diberi kesempatan
    untuk menjabat 2 (dua) periode. Begitu pula, bagi kepala desa yang sudah menjabat
    2 (dua) periode, baik berdasarkan Undang-Undang Republik Indonesia Nomor 6 Tahun
    2014 tentang Desa maupun berdasarkan undang-undang sebelumnya masih diberi kesempatan
    untuk menjabat 1 (satu) periode”. Sehingga Penjelasan Pasal 39 Undang-Undang Republik
    Indonesia Nomor 6 Tahun 2014 tentang Desa (Lembaran Negara Republik Indonesia
    Tahun 2014 Nomor 7, Tambahan Lembaran Negara Republik Indonesia Nomor 5495) yang
    semula berbunyi “Kepala Desa yang telah menjabat satu kali masa jabatan berdasarkan
    Undang-Undang Nomor 32 Tahun 2004 diberi kesempatan untuk mencalonkan kembali
    paling lama 2 (dua) kali masa jabatan. Sementara itu, Kepala Desa yang telah menjabat
    2 (dua) kali masa jabatan berdasarkan Undang-Undang Nomor 32 Tahun 2004 diberi
    kesempatan untuk mencalonkan kembali hanya 1 (satu) kali masa jabatan” menjadi
    selengkapnya berbunyi “Kepala desa yang sudah menjabat 1 (satu) periode, baik
    berdasarkan Undang-Undang Republik Indonesia Nomor 6 Tahun 2014 tentang Desa maupun
    berdasarkan undang-undang sebelumnya masih diberi kesempatan untuk menjabat 2
    (dua) periode. Begitu pula, bagi kepala desa yang sudah menjabat 2 (dua) periode,
    baik berdasarkan Undang-Undang Republik Indonesia Nomor 6 Tahun 2014 tentang Desa
    maupun berdasarkan undang-undang sebelumnya masih diberi kesempatan untuk menjabat
    1 (satu) periode”.
