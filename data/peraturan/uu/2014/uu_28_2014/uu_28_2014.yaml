  amar: Pasal 10 Undang-Undang Nomor 28 Tahun 2014 tentang Hak Cipta (Lembaran Negara
    Republik Indonesia Tahun 2014 Nomor 266, Tambahan Lembaran Negara Republik Indonesia
    Nomor 5599) yang menyatakan, “Pengelola tempat perdagangan dilarang membiarkan
    penjualan dan/atau penggandaan barang hasil pelanggaran Hak Cipta dan/atau Hak
    Terkait di tempat perdagangan yang dikelolanya” bertentangan dengan Undang-Undang
    Dasar 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai,
    “Pengelola tempat perdagangan dan/atau Platform Layanan Digital berbasis User
    Generated Content (UGC) dilarang membiarkan penjualan, penayangan, dan/atau penggandaan
    barang hasil pelanggaran Hak Cipta dan/atau Hak Terkait di tempat perdagangan
    dan/atau Layanan Digital yang dikelolanya."
