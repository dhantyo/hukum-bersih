uji_materi:
- putusan: 15/PUU-XXIII/2025
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/208/15_PUU-XXIII_2025.pdf
  amar: '1) Pasal 8 ayat (5) Undang-Undang Nomor 11 Tahun 2021 tentang Perubahan Atas
    Undang-Undang Nomor 16 Tahun 2004 tentang Kejaksaan Republik Indonesia (Lembaran
    Negara Republik Indonesia Tahun 2021 Nomor 298, Tambahan Lembaran Negara Republik
    Indonesia Nomor 6755) bertentangan dengan Undang-Undang Dasar Negara Republik
    Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat
    sepanjang tidak dimaknai memuat pengecualian dalam hal tertangkap tangan melakukan
    tindak pidana atau berdasarkan bukti permulaan yang cukup disangka melakukan tindak
    pidana kejahatan yang diancam dengan pidana mati, tindak pidana kejahatan terhadap
    keamanan negara, atau tindak pidana khusus, sehingga Pasal a quo selengkapnya
    berbunyi: “Dalam melaksanakan tugas dan wewenangnya, pemanggilan, pemeriksaan,
    penggeledahan, penangkapan, dan penahanan terhadap Jaksa hanya dapat dilakukan
    atas izin Jaksa Agung, kecuali dalam hal: a. tertangkap tangan melakukan tindak
    pidana; atau b. berdasarkan bukti permulaan yang cukup disangka telah melakukan
    tindak pidana kejahatan yang diancam dengan pidana mati, tindak pidana kejahatan
    terhadap keamanan negara, atau tindak pidana khusus.” 2) Pasal 35 ayat (1) huruf
    e beserta Penjelasannya Undang Undang Nomor 11 Tahun 2021 tentang Perubahan Atas
    Undang-Undang Nomor 16 Tahun 2004 tentang Kejaksaan Republik Indonesia (Lembaran
    Negara Republik Indonesia Tahun 2021 Nomor 298, Tambahan Lembaran Negara Republik
    Indonesia Nomor 6755) bertentangan dengan Undang Undang Dasar Negara Republik
    Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat.'
