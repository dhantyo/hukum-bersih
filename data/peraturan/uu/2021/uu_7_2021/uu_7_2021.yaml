uji_materi:
- putusan: 83/PUU-XXI/2023
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/261/putusan_mkri_83_PUU-XXI_2023.pdf
  amar: 1) Sepanjang frasa “pemeriksaan bukti permulaan sebelum dilakukan penyidikan”
    dalam Pasal 43A ayat (1) dalam Pasal 2 angka 13 Undang-Undang Nomor 7 Tahun 2021
    tentang Harmonisasi Peraturan Perpajakan (Lembaran Negara Republik Indonesia Tahun
    2021 Nomor 246, Tambahan Lembaran Negara Republik Indonesia Nomor 6736) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat, sepanjang tidak dimaknai “tidak terdapat tindakan upaya
    paksa”, sehingga selengkapnya norma Pasal 43A ayat (1) dalam Pasal 2 angka 13
    Undang-Undang Nomor 7 Tahun 2021 tentang Harmonisasi Peraturan Perpajakan (Lembaran
    Negara Republik Indonesia Tahun 2021 Nomor 246, Tambahan Lembaran Negara Republik
    Indonesia Nomor 6736) menjadi “Direktur Jenderal Pajak berdasarkan informasi,
    data, laporan, dan pengaduan berwenang melakukan pemeriksaan bukti permulaan sebelum
    dilakukan penyidikan tindak pidana di bidang perpajakan, sepanjang tidak terdapat
    tindakan upaya paksa”; 2) Menyatakan Pasal 43A ayat (4) dalam Pasal 2 angka 13
    Undang-Undang Nomor 7 Tahun 2021 tentang Harmonisasi Peraturan Perpajakan (Lembaran
    Negara Republik Indonesia Tahun 2021 Nomor 246, Tambahan Lembaran Negara Republik
    Indonesia Nomor 6736) bertentangan dengan Undang-Undang Dasar Negara Republik
    Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat, sepanjang tidak
    dimaknai “tidak melanggar hak asasi wajib pajak”, sehingga selengkapnya norma
    Pasal 43A ayat (4) dalam Pasal 2 angka 13 Undang-Undang Nomor 7 Tahun 2021 tentang
    Harmonisasi Peraturan Perpajakan (Lembaran Negara Republik Indonesia Tahun 2021
    Nomor 246, Tambahan Lembaran Negara Republik Indonesia Nomor 6736) menjadi “Tata
    cara pemeriksaan bukti permulaan tindak pidana di bidang perpajakan sebagaimana
    dimaksud pada ayat (1) dan ayat (2) diatur dengan atau berdasarkan Peraturan Menteri
    Keuangan, sepanjang tidak mengatur hal-hal yang berkaitan dengan upaya paksa dan
    melanggar hak asasi wajib pajak”.
