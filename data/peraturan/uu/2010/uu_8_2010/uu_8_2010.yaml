uji_materi:
- putusan: PUTUSAN Nomor 15/PUU-XIX/2021
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/151/putusan_mkri_7942.pdf
  amar: 'Amar Putusan: 1. Mengabulkan permohonan para Pemohon untuk seluruhnya; 2.
    Menyatakan Penjelasan Pasal 74 Undang-Undang Nomor 8 Tahun 2010 tentang Pencegahan
    dan Pemberantasan Tindak Pidana Pencucian Uang (Lembaran Negara Republik Indonesia
    Tahun 2010 Nomor 122, Tambahan Lembaran Negara Republik Indonesia Nomor 5164)
    sepanjang kalimat “Yang dimaksud dengan “penyidik tindak pidana asal” adalah pejabat
    dari instansi yang oleh undang-undang diberi kewenangan untuk melakukan penyidikan,
    yaitu Kepolisian Negara Republik Indonesia, Kejaksaan, Komisi Pemberantasan Korupsi
    (KPK), Badan Narkotika Nasional (BNN), serta Direktorat Jenderal Pajak dan Direktorat
    Jenderal Bea dan Cukai Kementerian Keuangan Republik Indonesia” bertentangan dengan
    Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak memiliki kekuatan
    hukum mengikat sepanjang tidak dimaknai “Yang dimaksud dengan ‘penyidik tindak
    pidana asal’ adalah pejabat atau instansi yang oleh peraturan perundang-undangan
    diberi kewenangan untuk melakukan penyidikan”; 3. Memerintahkan pemuatan Putusan
    ini dalam Berita Negara Republik Indonesia sebagaimana mestinya.'
