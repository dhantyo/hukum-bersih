uji_materi:
- putusan: 3/PUU-XXII/2024
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/170/Putusan%20Nomor%203-PUU-XXII-2024.pdf
  amar: Pasal 34 ayat (2) Undang-Undang Nomor 20 Tahun 2003 tentang Sistem Pendidikan
    Nasional (Lembaran Negara Republik Indonesia Tahun 2003 Nomor 78, Tambahan Lembaran
    Negara Republik Indonesia Nomor 4301) bertentangan dengan Undang-Undang Dasar
    Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat
    secara bersyarat sepanjang tidak dimaknai “Pemerintah dan Pemerintah Daerah menjamin
    terselenggaranya wajib belajar minimal pada jenjang pendidikan dasar tanpa memungut
    biaya, baik untuk satuan pendidikan dasar yang diselenggarakan oleh pemerintah
    maupun satuan pendidikan dasar yang diselenggarakan oleh masyarakat”
- putusan: 11-14-21-126 dan 136/PUU-VII/2009
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/67/PUTUSAN%20UU%20BHP_baca_31%20Maret%202010.pdf
  amar: a. Pasal 6 ayat (2) Undang-Undang Nomor 20 Tahun 2003 tentang Sistem Pendidikan
    Nasional sepanjang frasa, “... bertanggung jawab” adalah konstitusional sepanjang
    dimaknai “... ikut bertanggung jawab”, sehingga pasal tersebut selengkapnya menjadi,
    “Setiap warga negara ikut bertanggung jawab terhadap keberlangsungan penyelenggaraan
    pendidikan”; b. Pasal 12 ayat (1) huruf c Undang-Undang Nomor 20 Tahun 2003 tentang
    Sistem Pendidikan Nasional sepanjang frasa, “...yang orang tuanya tidak mampu
    membiayai pendidikannya”, bertentangan dengan UUD NRI Tahun 1945, sehingga Pasal
    12 ayat (1) huruf c Undang-Undang Nomor 20 Tahun 2003 tentang Sistem Pendidikan
    Nasional menjadi, “Mendapatkan beasiswa bagi yang berprestasi”; c. Pasal 53 ayat
    (1) Undang-Undang Nomor 20 Tahun 2003 tentang Sistem Pendidikan Nasional konstitusional
    sepanjang frasa “badan hukum pendidikan” dimaknai sebagai sebutan fungsi penyelenggara
    pendidikan dan bukan sebagai bentuk badan hukum tertentu; d. Penjelasan Pasal
    53 ayat (1) Undang-Undang Nomor 20 Tahun 2003 tentang Sistem Pendidikan Nasional
    bertentangan dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat.
- putusan: 011/PUU-III/2005
