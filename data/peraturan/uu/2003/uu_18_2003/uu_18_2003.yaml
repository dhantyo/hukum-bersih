uji_materi:
- putusan: 126/PUU-XXIV/2026
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/244/putusan_mkri_126%3APUU-XXIV%3A2026.pdf
  amar: Menyatakan Undang-Undang Nomor 18 Tahun 2003 tentang Advokat (Lembaran Negara
    Tahun 2003, Nomor 49, Tambahan Lembaran Negara Nomor 4288) bertentangan dengan
    Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan
    hukum mengikat secara bersyarat sepanjang tidak dimaknai “apabila dalam waktu
    paling lama 2 (dua) tahun sejak putusan a quo diucapkan tidak dilakukan perubahan/penggantian
    terhadap Undang-Undang Nomor 18 Tahun 2003 tentang Advokat dengan antara lain
    berpedoman pada putusan-putusan Mahkamah Konstitusi”.
- putusan: 150/PUU-XXII/2024
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/173/150-PUU-XXII-2024.pdf
  amar: 'Pasal 3 ayat (1) huruf c dan Pasal 20 ayat (2) Undang-Undang Nomor 18 Tahun
    2003 tentang Advokat (Lembaran Negara Republik Indonesia Tahun 2003 Nomor 49,
    Tambahan Lembaran Negara Republik Indonesia Nomor 4288) bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat secara bersyarat sepanjang tidak dimaknai: "tidak diberlakukan bagi dosen
    Pegawai Negeri Sipil (PNS) untuk pengabdian kepada masyarakat dalam rangka Tri
    Dharma Perguruan Tinggi memberikan bantuan hukum dengan cuma-cuma atau tanpa memungut
    biaya (prodeo/pro bono)"; 2.'
- putusan: 112/PUU-XII/2014 dan 36/PUU-XIII/2015
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/63/Nomor%2036_PUU-XIII_2015.pdf
  amar: Pasal 4 ayat (1) sepanjang frasa "di sidang terbuka Pengadilan Tinggi" Undang-Undang
    Nomor 18 Tahun 2003 tentang Advokat bertentangan dengan UUD NRI Tahun 1945 dan
    tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai bahwa "Pengadilan
    Tinggi atas perintah Undang-Undang wajib mengambil sumpah bagi para advokat sebelum
    menjalankan profesinya tanpa mengaitkan dengan keanggotaan Organisasi Advokat
    yang secara de facto ada yaitu Peradi dan KAI"
