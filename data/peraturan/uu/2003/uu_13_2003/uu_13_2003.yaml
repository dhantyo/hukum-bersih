uji_materi:
- putusan: 13/PUU-XV/2017
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/1/13_PUU-XV_2017.pdf
  amar: Frasa "kecuali telah diatur dalam perjanjian kerja, peraturan perusahaan,
    atau perjanjian kerja bersama" dalam Pasal 153 ayat (1) huruf f Undang-Undang
    Nomor 13 Tahun 2003 tentang Ketenagakerjaan bertentangan dengan UUD NRI Tahun
    1945 dan tidak mempunyai kekuatan hukum mengikat.
- putusan: 7/PUU-XII/2014
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/93/putusan_sidang_2235_20170608075000_7_PUU_2014-UU-Ketenagakerjaan-KABUL-telahucap-4Nov2015-qrcode-wmActionWiz.pdf
  amar: 'Frasa "demi hukum" dalam Pasal 59 ayat (7), Pasal 65 ayat (8) , dan Pasal
    66 ayat (4) Undang-Undang Nomor 13 Tahun 2003 tentang Ketenagakerjaan bertentangan
    dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang
    tidak dimaknai "Pekerja/buruh dapat meminta pengesahaan nota pemeriksaan pegawai
    pengawas ketenagakerjaan kepada Pengadilan Negeri setempat dengan syariat: 1.
    Telah dilaksanakan perundingan bipartit namun perundingan bipartit tersebut tidak
    mencapai kesepakatan atau salah satu pihak menolak untuk berunding; dan 2. Telah
    dilakukan pemeriksaan oleh pegawai pengawas ketenagakerjaan berdasarkan peraturan
    perundang-undangan."'
- putusan: 012/PUU-I/2003
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/132/Putusan012PUUI2003.pdf
  amar: 'Undang-undang Nomor 13 Tahun 2003 tentang Ketenagakerjaan: • Pasal 158;----------------------------------------------------------------------------------------------------
    • Pasal 159;----------------------------------------------------------------------------------------------------
    • Pasal 160 ayat (1) sepanjang mengenai anak kalimat “…. bukan atas pengaduan
    pengusaha …”;--------------------------------------------------------------------------------------------
    • Pasal 170 sepanjang mengenai anak kalimat “.… kecuali Pasal 158 ayat (1), …”;-
    • Pasal 171 sepanjang menyangkut anak kalimat “…. Pasal 158 ayat (1)…”;----------
    • Pasal 186 sepanjang mengenai anak kalimat “…. Pasal 137 dan Pasal 138 ayat (1)…”
    -----------------------------------------------------------------------------------------------------------
    bertentangan dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat.'
