uji_materi:
- putusan: 31/PUU-XXI/2023
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/227/putusan_mkri_31_PUU-XXI_2023.pdf
  amar: Frasa “3 x 24 (tiga kali dua puluh empat) jam sejak” dalam Pasal 74 ayat (3)
    Undang-Undang Nomor 24 Tahun 2003 tentang Mahkamah Konstitusi sebagaimana yang
    telah diubah dengan Undang-Undang Nomor 7 Tahun 2020 tentang Perubahan Ketiga
    Atas Undang-Undang Nomor 24 Tahun 2003 tentang Mahkamah Konstitusi (Lembaran Negara
    Republik Indonesia Tahun 2003 Nomor 98, Tambahan Lembaran Negara Republik Indonesia
    Nomor 4316) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia
    Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat, sepanjang tidak dimaknai
    “3 (tiga) hari setelah”, sehingga ketentuan dalam Pasal 74 ayat (3) Undang-Undang
    Nomor 24 Tahun 2003 tentang Mahkamah Konstitusi, selengkapnya menjadi “Permohonan
    hanya dapat diajukan dalam jangka waktu paling lama 3 (tiga) hari setelah Komisi
    Pemilihan Umum mengumumkan penetapan hasil pemilihan umum secara nasional”.
- putusan: 066/PUU-II/2004
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/133/Putusan066PUUII2004tgl120405ttgKADIN.pdf
  amar: Pasal 50 Undang-undang Nomor 24 Tahun 2003 tentang Mahkamah Konstitusi bertentangan
    dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat.
