  amar: 1) Pasal 17 ayat (2) huruf b dalam Pasal 37 angka 5 Lampiran Undang-Undang
    Nomor 6 Tahun 2023 tentang Penetapan Peraturan Pemerintah Pengganti Undang-Undang
    Nomor 2 Tahun 2022 tentang Cipta Kerja Menjadi Undang-Undang (Lembaran Negara
    Republik Indonesia Tahun 2023 Nomor 41, Tambahan Lembaran Negara Republik Indonesia
    Nomor 6856) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia
    Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang
    tidak dimaknai, “dikecualikan untuk masyarakat yang hidup secara turun temurun
    di dalam hutan dan tidak ditujukan untuk kepentingan komersial”; 2) Pasal 110B
    ayat (1) dalam Pasal 37 angka 20 Lampiran Undang Undang Nomor 6 Tahun 2023 sepanjang
    berkaitan dengan ketentuan norma Pasal 17 ayat (2) huruf b dalam Pasal 37 angka
    5 Lampiran Undang-Undang Nomor 6 Tahun 2023 tentang Penetapan Peraturan Pemerintah
    Pengganti Undang-Undang Nomor 2 Tahun 2022 tentang Cipta Kerja Menjadi Undang-Undang
    (Lembaran Negara Republik Indonesia Tahun 2023 Nomor 41, Tambahan Lembaran Negara
    Republik Indonesia Nomor 6856) bertentangan dengan Undang-Undang Dasar Negara
    Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang
    tidak dimaknai, “dikecualikan untuk masyarakat yang hidup secara turun temurun
    di dalam hutan dan tidak ditujukan untuk kepentingan komersial.”
