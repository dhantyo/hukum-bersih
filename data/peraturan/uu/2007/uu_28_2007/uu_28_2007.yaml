  amar: Menyatakan frasa "pelaksanaan hak dan kewajiban kuasa" dalam Pasal 32 ayat
    (3a) Undang-Undang Nomor 28 Tahun 2007 tentang Perubahan Ketiga atas Undang-Undang
    Nomor 6 Tahun 1983 tentang Ketentuan Umum dan Tata Cara Perpajakan sebagaimana
    telah diubah terakhir dengan Undang-Undang Nomor 16 Tahun 2009 tentang Penetapan
    Peraturan Pemerintah Pengganti Undang-Undang Nomor 5 Tahun 2008 tentang Perubahan
    Keempat atas Undang-Undang Nomor 6 Tahun 1983 Tentang Ketentuan Umum dan Tata
    Cara Perpajakan Menjadi Undang-Undang bertentangan dengan UUD NRI Tahun 1945 dan
    tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai hanya berkenaan
    dengan hal-hal yang bersifat teknis administratif dan bukan pembatasan dan/atau
    perluasan hak dan kewajiban warga negara
