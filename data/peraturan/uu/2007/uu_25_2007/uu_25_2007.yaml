  amar: '1. Pasal 22 Ayat (1) sepanjang menyangkut kata-kata “di muka sekaligus” dan
    “berupa: a. Hak Guna Usaha dapat diberikan dengan jumlah 95 (sembilan puluh lima)
    tahun dengan cara dapat diberikan dan diperpanjang di muka sekaligus selama 60
    (enam puluh) tahun dan dapat diperbarui selama 35 (tiga puluh lima) tahun; b.
    Hak Guna Bangunan dapat diberikan dengan jumlah 80 (delapan puluh) tahun dengan
    cara dapat diberikan dan diperpanjang di muka sekaligus selama 50 (lima puluh)
    tahun dan dapat diperbarui selama 30 (tiga puluh) tahun; dan c. Hak Pakai dapat
    diberikan dengan jumlah 70 (tujuh puluh) tahun dengan cara dapat diberikan dan
    diperpanjang di muka sekaligus selama 45 (empat puluh lima) tahun dan dapat diperbarui
    selama 25 (dua puluh lima) tahun”; 2. Pasal 22 Ayat (2) sepanjang menyangkut kata-kata
    “di muka sekaligus”; 3. Pasal 22 Ayat (4) sepanjang menyangkut kata-kata “sekaligus
    di muka”; Undang-Undang Nomor 25 Tahun 2007 tentang Penanaman Modal bertentangan
    dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat.'
