  amar: Penjelasan Pasal 22 ayat (3) Undang-Undang Nomor 17 Tahun 2025 tentang Anggaran
    Pendapatan dan Belanja Negara Tahun 2026 (Lembaran Negara Republik Indonesia Tahun
    2025 Nomor 179, Tambahan Lembaran Negara Republik Indonesia Nomor 7144) tidak
    bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan
    memiliki kekuatan hukum mengikat secara bersyarat sepanjang dimaknai “hanya berlaku
    untuk Anggaran Pendapatan dan Belanja Negara Tahun Anggaran 2026 sehingga untuk
    Anggaran Pendapatan dan Belanja Negara tahun-tahun berikutnya anggaran program
    makan bergizi yang bukan merupakan komponen utama pendidikan dipisah atau tidak
    menjadi bagian dari anggaran operasional penyelenggaraan pendidikan dan pemisahan
    dimaksud berlaku paling lambat dalam Anggaran Pendapatan dan Belanja Negara Tahun
    Anggaran 2028 atau paling lama 2 (dua) tahun sejak Putusan a quo diucapkan
