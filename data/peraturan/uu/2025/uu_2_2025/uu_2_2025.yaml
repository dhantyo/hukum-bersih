uji_materi:
- putusan: 202/PUU-XXIII/2025
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/241/putusan_mkri_14641_1784191288.pdf
  amar: '1.Menyatakan frasa “dengan cara prioritas” dalam Pasal 51B ayat (1) dan Pasal
    60B ayat (1) Undang-Undang Nomor 2 Tahun 2025 tentang Perubahan Keempat Atas Undang-Undang
    Nomor 4 Tahun 2009 tentang Pertambangan Mineral dan Batubara (Lembaran Negara
    Republik Indonesia Tahun 2025 Nomor 29, Tambahan Lembaran Negara Republik Indonesia
    Nomor 7100) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia
    Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang
    tidak dimaknai, “dengan cara pemberian prioritas yang hanya dapat diberikan dengan
    parameter yang jelas melalui proses penilaian secara objektif, transparan, dan
    akuntabel sehingga pemberian prioritas dimaksud tidak dipahami serta-merta sebagai
    tindakan penunjukan langsung”. 2. Menyatakan frasa ”dengan cara prioritas” dalam
    Pasal 51B ayat (2) dan Pasal 60B ayat (2) Undang-Undang Nomor 2 Tahun 2025 tentang
    Perubahan Keempat Atas Undang-Undang Nomor 4 Tahun 2009 tentang Pertambangan Mineral
    dan Batubara (Lembaran Negara Republik Indonesia Tahun 2025 Nomor 29, Tambahan
    Lembaran Negara Republik Indonesia Nomor 7100) bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat secara bersyarat sepanjang tidak dimaknai “dengan cara pemberian prioritas
    yang hanya dapat diberikan dengan parameter yang jelas melalui proses penilaian
    secara objektif, transparan, dan akuntabel sehingga pemberian prioritas dimaksud
    tidak dipahami serta-merta sebagai tindakan penunjukan langsung”. 3.Menyatakan
    frasa ”dan/atau global” dalam Pasal 51B ayat (2) huruf d dan Pasal 60B ayat (2)
    huruf d Undang-Undang Nomor 2 Tahun 2025 tentang Perubahan Keempat Atas Undang-Undang
    Nomor 4 Tahun 2009 tentang Pertambangan Mineral dan Batubara (Lembaran Negara
    Republik Indonesia Tahun 2025 Nomor 29, Tambahan Lembaran Negara Republik Indonesia
    Nomor 7100) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia
    Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang
    tidak dimaknai, “Pemberian dengan cara prioritas sebagaimana dimaksud pada ayat
    (1) dilaksanakan dengan mempertimbangkan: d. mengutamakan peningkatan nilai tambah
    dan pemenuhan rantai pasok dalam negeri dan jika rantai pasok dalam negeri telah
    terpenuhi, maka baru dapat melakukan pemenuhan rantai pasok global”. 4.Menolak
    permohonan para Pemohon untuk selain dan selebihnya.'
