- putusan: 273/PUU-XXIII/2025
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/251/putusan_mkri_273_PUU-XXIII_2025.pdf
  amar: Pasal 28 ayat (1) dalam Pasal 71 angka 2 Lampiran Undang-Undang Nomor 6 Tahun
    2023 tentang Penetapan Peraturan Pemerintah Pengganti Undang-Undang Nomor 2 Tahun
    2022 tentang Cipta Kerja Menjadi Undang-Undang (Lembaran Negara Republik Indonesia
    Tahun 2023 Nomor 41, Tambahan Lembaran Negara Republik Indonesia Nomor 6856) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai, “Besaran tarif
    penyelenggaraan jaringan telekomunikasi dan/atau penyelenggaraan jasa telekomunikasi
    ditetapkan oleh penyelenggara jaringan telekomunikasi dan/atau jasa telekomunikasi
    berdasarkan formula yang ditetapkan oleh Pemerintah Pusat dengan kewajiban menyediakan
    pilihan layanan jasa telekomunikasi yang menjamin sisa kuota milik pengguna jasa
    telekomunikasi tetap aktif dan dapat digunakan”
- putusan: 39/PUU-XXI/2023
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/187/39-PUU-XXI-2023.pdf
  amar: 1). Pasal 7 ayat (1) dalam Pasal 42 angka 5 Lampiran Undang-Undang Nomor 6
    Tahun 2023 tentang Penetapan Peraturan Pemerintah Pengganti Undang-Undang Nomor
    2 Tahun 2022 tentang Cipta Kerja Menjadi Undang-Undang (Lembaran Negara Republik
    Indonesia Tahun 2023 Nomor 41, Tambahan Lembaran Negara Republik Indonesia Nomor
    6856) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun
    1945 dan tidak memiliki kekuatan hukum mengikat sepanjang tidak dimaknai, “Rencana
    Umum Ketenagalistrikan Nasional disusun berdasarkan kebijakan energi nasional
    dan ditetapkan oleh Pemerintah Pusat setelah mendapat pertimbangan DPR RI”; 2).
    Kata "dapat" pada norma Pasal 10 ayat (2) dalam Pasal 42 angka 6 Lampiran Undang-Undang
    Nomor 6 Tahun 2023 tentang Penetapan Peraturan Pemerintah Pengganti Undang-Undang
    Nomor 2 Tahun 2022 tentang Cipta Kerja Menjadi Undang-Undang (Lembaran Negara
    Republik Indonesia Tahun 2023 Nomor 41, Tambahan Lembaran Negara Republik Indonesia
    Nomor 6856), bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia
