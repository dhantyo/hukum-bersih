  amar: Pasal 26 ayat (2) huruf d Undang-Undang Nomor 20 Tahun 2023 tentang Aparatur
    Sipil Negara (Lembaran Negara Republik Indonesia Tahun 2023 Nomor 141, Tambahan
    Lembaran Negara Republik Indonesia Nomor 6897) bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 293 1945 dan tidak mempunyai kekuatan hukum
    mengikat secara bersyarat sepanjang tidak dimaknai, “penerapan pengawasan Sistem
    Merit, termasuk pengawasan terhadap penerapan asas, nilai dasar, kode etik dan
    kode perilaku Aparatur Sipil Negara yang dilakukan oleh suatu lembaga independen”.
    Lembaga independen dimaksud harus dibentuk dalam waktu paling lama 2 (dua) tahun
    sejak Putusan a quo diucapkan.
