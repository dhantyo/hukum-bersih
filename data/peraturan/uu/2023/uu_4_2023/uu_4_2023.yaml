uji_materi:
- putusan: 164/PUU-XXIII/2025
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/242/putusan_mkri_164%3APUU-XXIII%3A2025%20.pdf
  amar: 1.Menyatakan norma Pasal 164 ayat (1) huruf d Undang-Undang Nomor 4 Tahun
    2023 tentang Pengembangan dan Penguatan Sektor Keuangan (Lembaran Negara Republik
    Indonesia Tahun 2023 Nomor 4, Tambahan Lembaran Negara Republik Indonesia Nomor
    6845) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun
    1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang tidak
    dimaknai, “dikecualikan untuk pembayaran manfaat pensiun yang kepesertaannya bersifat
    sukarela, yang terbentuk dari uang pesangon dan/atau uang penghargaan masa kerja
    dan uang penggantian hak dibayarkan secara sekaligus atau berkala”; 2.Memerintahkan
    pemuatan putusan a quo dalam Berita Negara Republik Indonesia sebagaimana mestinya;
    3.Menyatakan pengujian norma Pasal 161 ayat (2) dan Pasal 164 ayat (2) Undang-Undang
    Nomor 4 Tahun 2023 tentang Pengembangan dan Penguatan Sektor Keuangan (Lembaran
    Negara Republik Indonesia Tahun 2023 Nomor 4, Tambahan Lembaran Negara Republik
    Indonesia Nomor 6845) tidak dapat diterima.
- putusan: 85/PUU-XXII/2024
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/175/85-PUU-XXII-2024.pdf
  amar: Frasa "untuk mendapat persetujuan" sebagaimana termuat dalam Pasal 86 ayat
    (4), frasa "Menteri Keuangan memberikan persetujuan" sebagaimana termuat dalam
    ayat (6), dan frasa "yang telah mendapatkan persetujuan Menteri Keuangan" sebagaimana
    termuat dalam ayat (7) huruf a dalam Pasal 7 angka 57 Undang-Undang Nomor 4 Tahun
    2023 tentang Pengembangan dan Penguatan Sektor Keuangan (Lembaran Negara Republik
    Indonesia Tahun 2023 Nomor 4, Tambahan Lembaran Negara Republik Indonesia Nomor
    6845) adalah bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia
    Tahun 1945 dan tidak memiliki kekuatan hukum mengikat secara bersyarat sepanjang
    tidak dimaknai "persetujuan DPR" berlaku setelah pembentuk undang-undang melakukan
    perubahan paling lama 2 (dua) tahun sejak putusan a quo diucapkan.
