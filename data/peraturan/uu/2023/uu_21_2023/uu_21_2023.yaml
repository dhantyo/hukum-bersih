  amar: 1). Pasal 16A ayat (1) Undang-Undang Nomor 3 Tahun 2022 tentang Ibu Kota Negara
    (Lembaran Negara Republik Indonesia Tahun 2022 Nomor 41, Tambahan Lembaran Negara
    Republik Indonesia Nomor 6766) sebagaimana telah diubah dengan Undang-Undang Nomor
    21 Tahun 2023 tentang Perubahan atas Undang-Undang Nomor 3 Tahun 2022 tentang
    Ibu Kota Negara (Lembaran Negara Republik Indonesia Tahun 2023 Nomor 142, Tambahan
    Lembaran Negara Republik Indonesia Nomor 6898) bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat secara bersyarat sepanjang tidak dimaknai “Dalam hal HAT yang diperjanjikan
    sebagaimana dimaksud dalam Pasal 16 ayat (7) dalam bentuk hak guna usaha, diberikan
    hak, paling 318 lama 35 (tiga puluh lima) tahun; perpanjangan hak, paling lama
    25 (dua puluh lima) tahun; dan pembaruan hak, paling lama 35 (tiga puluh lima)
    tahun berdasarkan kriteria dan tahapan evaluasi”. 2). Pasal 16A ayat (2) Undang-Undang
    Nomor 3 Tahun 2022 tentang Ibu Kota Negara (Lembaran Negara Republik Indonesia
    Tahun 2022 Nomor 41, Tambahan Lembaran Negara Republik Indonesia Nomor 6766) sebagaimana
    telah diubah dengan Undang-Undang Nomor 21 Tahun 2023 tentang Perubahan atas Undang-Undang
    Nomor 3 Tahun 2022 tentang Ibu Kota Negara (Lembaran Negara Republik Indonesia
    Tahun 2023 Nomor 142, Tambahan Lembaran Negara Republik Indonesia Nomor 6898)
    bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan
    tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai
    “Dalam hal HAT yang diperjanjikan sebagaimana dimaksud dalam Pasal 16 ayat (7)
    dalam bentuk hak guna bangunan, diberikan hak, paling lama 30 (tiga puluh) tahun;
    perpanjangan hak, paling lama 20 (dua puluh) tahun; dan pembaruan hak, paling
    lama 30 (tiga puluh) tahun berdasarkan kriteria dan tahapan evaluasi”. 3). Pasal
    16A ayat (3) Undang-Undang Nomor 3 Tahun 2022 tentang Ibu Kota Negara (Lembaran
    Negara Republik Indonesia Tahun 2022 Nomor 41, Tambahan Lembaran Negara Republik
    Indonesia Nomor 6766) sebagaimana telah diubah dengan Undang-Undang Nomor 21 Tahun
    2023 tentang Perubahan atas Undang-Undang Nomor 3 Tahun 2022 tentang Ibu Kota
    Negara (Lembaran Negara Republik Indonesia Tahun 2023 Nomor 142, Tambahan Lembaran
    Negara Republik Indonesia Nomor 6898) bertentangan dengan Undang-Undang Dasar
    Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat
    secara bersyarat sepanjang tidak dimaknai “Dalam hal HAT yang diperjanjikan sebagaimana
    dimaksud dalam Pasal 16 ayat (7) dalam bentuk hak pakai, diberikan hak, paling
    lama 30 (tiga puluh) tahun; perpanjangan hak, paling lama 20 (dua puluh) tahun;
    dan pembaruan hak, paling lama 30 (tiga puluh) tahun berdasarkan kriteria dan
    tahapan evaluasi”. 4. Penjelasan Pasal 16A ayat (1), ayat (2), dan ayat (3) Undang
    Undang Nomor 3 Tahun 2022 tentang Ibu Kota Negara (Lembaran Negara Republik Indonesia
    Tahun 2022 Nomor 41, Tambahan Lembaran Negara 319 Republik Indonesia Nomor 6766)
    sebagaimana telah diubah dengan Undang Undang Nomor 21 Tahun 2023 tentang Perubahan
    atas Undang-Undang Nomor 3 Tahun 2022 tentang Ibu Kota Negara (Lembaran Negara
    Republik Indonesia Tahun 2023 Nomor 142, Tambahan Lembaran Negara Republik Indonesia
    Nomor 6898) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia
    Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat.
