uji_materi:
- putusan: 182/PUU-XXII/2024
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/238/putusan_mkri_182-PUU-XXII-2024.pdf
  amar: '1) Pasal 268 ayat (2) Undang-Undang Nomor 17 Tahun 2023 tentang Kesehatan
    (Lembaran Negara Republik Indonesia Tahun 2023 Nomor 105, Tambahan Lembaran Negara
    Republik Indonesia Nomor 6887) bertentangan dengan Undang-Undang Dasar Negara
    Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat secara
    bersyarat sepanjang tidak dimaknai “Konsil sebagaimana dimaksud pada ayat (1)
    berkedudukan di bawah dan bertanggung jawab kepada Presiden dan dalam menjalankan
    perannya bersifat independen”; 2). Frasa “Pemerintah Pusat”, dalam norma Pasal
    270 huruf a Undang-Undang Nomor 17 Tahun 2023 tentang Kesehatan (Lembaran Negara
    Republik Indonesia Tahun 2023 Nomor 105, Tambahan Lembaran Negara Republik Indonesia
    Nomor 6887) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia
    Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang
    tidak dimaknai “Pemerintah Pusat yang berasal dari unsur kementerian yang membidangi
    urusan kesehatan dan kementerian yang membidangi urusan pendidikan tinggi”, sehingga
    norma Pasal 270 huruf a Undang-Undang Nomor 17 Tahun 2023 tentang Kesehatan (Lembaran
    Negara Republik Indonesia Tahun 2023 Nomor 105, Tambahan Lembaran Negara Republik
    Indonesia Nomor 6887) selengkapnya berbunyi “Keanggotaan Konsil berasal dari unsur:
    a. Pemerintah Pusat yang berasal dari unsur kementerian yang membidangi urusan
    kesehatan dan kementerian yang membidangi urusan pendidikan tinggi;” 3). Frasa
    “oleh Konsil serta Kolegium dan ditetapkan oleh Menteri” dalam norma Pasal 291
    ayat (2) Undang-Undang Nomor 17 Tahun 2023 tentang Kesehatan (Lembaran Negara
    Republik Indonesia Tahun 2023 Nomor 105, Tambahan Lembaran Negara Republik Indonesia
    Nomor 6887) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia
    Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang
    tidak dimaknai “dengan melibatkan organisasi profesi yang ditetapkan oleh Menteri
    yang hanya bersifat administratif”, sehingga norma Pasal 291 ayat (2) Undang-Undang
    Nomor 17 Tahun 2023 tentang Kesehatan (Lembaran Negara Republik Indonesia Tahun
    2023 Nomor 105, Tambahan Lembaran Negara Republik Indonesia Nomor 6887) selengkapnya
    berbunyi “Standar profesi sebagaimana dimaksud pada ayat (1) untuk setiap jenis
    Tenaga Medis dan Tenaga Kesehatan disusun oleh Konsil serta Kolegium dengan melibatkan
    organisasi profesi yang ditetapkan oleh Menteri yang hanya bersifat administratif.”
    5. Menyatakan norma Pasal 311 ayat (1) Undang-Undang Nomor 17 Tahun 2023 tentang
    Kesehatan (Lembaran Negara Republik Indonesia Tahun 2023 Nomor 105, Tambahan Lembaran
    Negara Republik Indonesia Nomor 6887) bertentangan dengan Undang-Undang Dasar
    Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat
    secara bersyarat sepanjang tidak dimaknai “Tenaga Medis dan Tenaga Kesehatan membentuk
    wadah tunggal organisasi profesi sebagai “rumah besar” untuk berhimpunnya profesi
    Tenaga Medis dan Tenaga Kesehatan, yang pembentukannya dikoordinasikan oleh menteri
    koordinator dengan melibatkan kementerian-kementerian terkait yang dilakukan paling
    lama 1 (satu) tahun sejak Putusan a quo diucapkan”'
- putusan: 49/PUU-XXII/2024
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/177/49-PUU-XXII-2024.pdf
  amar: Pasal 212 ayat (2) Undang-Undang Nomor 17 Tahun 2023 tentang Kesehatan (Lembaran
    Negara Republik Indonesia Tahun 2023 Nomor 105, Tambahan Lembaran Negara Republik
    Indonesia Nomor 6887) bertentangan dengan Undang-Undang Dasar Negara Republik
    Indonesia Tahun 1945 dan tidak memiliki kekuatan hukum mengikat secara bersyarat
    sepanjang tidak dimaknai, “hanya diberlakukan bagi mahasiswa kesehatan program
    sarjana yang mengikuti kuliah setelah berlakunya Undang-Undang Nomor 17 Tahun
    2023 tentang Kesehatan, sedangkan bagi mahasiswa yang terdaftar berdasarkan Undang-Undang
    Nomor 36 Tahun 2014 tentang Tenaga Kesehatan, pada saat telah lulus dan memiliki
    sertifikat kompetensi serta mendapatkan STR dan SIP diwajibkan mengikuti pendidikan
    profesi yang materi dan kurikulumnya dirancang secara khusus dengan waktu yang
    lebih singkat sebelum perpanjangan SIP dilakukan”;
