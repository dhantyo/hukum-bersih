- putusan: 102/PUU-XVIII/2020
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/198/putusan_mkri_102-PUU-XVIII-2020.pdf
  amar: Frasa “Bank Umum” dalam Pasal 12A ayat (1) UndangUndang Nomor 10 Tahun 1998
    tentang Perubahan Atas UndangUndang Nomor 7 Tahun 1992 tentang Perbankan (Lembaran
    Negara Republik Indonesia Tahun 1998 Nomor 182, Tambahan Lembaran Negara Republik
    Indonesia Nomor 3790) bertentangan dengan Undang-Undang Dasar Negara Republik
    Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak
    dimaknai “Bank Umum dan Bank Perkreditan Rakyat”. Sehingga, Pasal 12A ayat (1)
    Undang-Undang Nomor 10 Tahun 1998 tentang Perubahan Atas Undang-Undang Nomor 7
    Tahun 1992 tentang Perbankan (Lembaran Negara Republik Indonesia Tahun 1998 Nomor
    182, Tambahan Lembaran Negara Republik Indonesia Nomor 3790) yang semula berbunyi,
    “Bank Umum dapat membeli sebagian atau seluruh agunan, baik melalui pelelangan
    maupun di luar pelelangan berdasarkan penyerahan secara sukarela oleh pemilik
    agunan atau berdasarkan kuasa untuk menjual di luar lelang dari pemilik agunan
    dalam hal Nasabah Debitur tidak memenuhi kewajibannya kepada bank, dengan ketentuan
    agunan yang dibeli tersebut wajib dicairkan secepatnya”, menjadi selengkapnya
    berbunyi “Bank Umum dan Bank Perkreditan Rakyat dapat membeli sebagian atau seluruh
    agunan, baik melalui pelelangan maupun di luar pelelangan berdasarkan penyerahan
    secara sukarela oleh pemilik agunan atau berdasarkan kuasa untuk menjual di luar
    lelang dari pemilik agunan dalam hal Nasabah Debitur tidak memenuhi kewajibannya
    kepada bank, dengan ketentuan agunan yang dibeli tersebut wajib dicairkan secepatnya."
