uji_materi:
- putusan: 128/PUU-XXIV/2026
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/246/putusan_mkri_128%3APUU-XXIV%3A2026.pdf
  amar: 1.Mengabulkan permohonan para Pemohon untuk sebagian; 2.Menyatakan Pasal 245
    Undang-Undang Nomor 7 Tahun 2017 tentang Pemilihan Umum (Lembaran Negara Republik
    Indonesia Tahun 2017 Nomor 182, Tambahan Lembaran Negara Republik Indonesia Nomor
    6109) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun
    1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang tidak
    dimaknai, “Daftar bakal calon sebagaimana dimaksud dalam Pasal 243 memuat keterwakilan
    perempuan paling sedikit 30% (tiga puluh persen) dan dalam hal ketentuan keterwakilan
    perempuan paling sedikit 30% (tiga puluh persen) tidak terpenuhi maka KPU, KPU
    Provinsi, KPU Kabupaten/Kota menggugurkan atau tidak mengikutsertakan partai politik
    peserta pemilihan umum tersebut pada daerah pemilihan bersangkutan”.
- putusan: 135/PUU-XXII/2024
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/196/putusan_mkri_%20135_PUU-XXII_2024.pdf
  amar: 1). Pasal 167 ayat (3) Undang-Undang Nomor 7 Tahun 2017 tentang Pemilihan
    Umum (Lembaran Negara Republik Indonesia Tahun 2017 Nomor 182, Tambahan Lembaran
    Negara Republik Indonesia Nomor 6109) bertentangan dengan Undang-Undang Dasar
    Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat
    secara bersyarat sepanjang ke depan tidak dimaknai, “Pemungutan suara dilaksanakan
    secara serentak untuk memilih anggota Dewan Perwakilan Rakyat, anggota Dewan Perwakilan
    Daerah, Presiden/Wakil Presiden, dan setelahnya dalam waktu paling singkat 2 (dua)
    tahun atau paling lama 2 (dua) tahun 6 (enam) bulan sejak pelantikan anggota Dewan
    Perwakilan Rakyat dan anggota Dewan Perwakilan Daerah atau sejak pelantikan Presiden/Wakil
    Presiden dilaksanakan pemungutan suara secara serentak untuk memilih anggota Dewan
    Perwakilan Rakyat Daerah provinsi, anggota Dewan Perwakilan Rakyat Daerah kabupaten/kota,
    dan gubernur/wakil gubernur, bupati/wakil bupati, dan walikota/wakil walikota
    pada hari libur atau hari yang diliburkan secara nasional”; 2). Pasal 347 ayat
    (1) Undang-Undang Nomor 7 Tahun 2017 tentang Pemilihan Umum (Lembaran Negara Republik
    Indonesia Tahun 2017 Nomor 182, Tambahan Lembaran Negara Republik Indonesia Nomor
    6109) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun
    1945 dan tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang ke
    depan tidak dimaknai, “Pemungutan suara diselenggarakan secara serentak untuk
    memilih anggota Dewan Perwakilan Rakyat, anggota Dewan Perwakilan Daerah, Presiden/Wakil
    Presiden, dan setelahnya dalam waktu paling singkat 2 (dua) tahun atau paling
    lama 2 (dua) tahun 6 (enam) bulan sejak pelantikan anggota Dewan Perwakilan Rakyat
    dan anggota Dewan Perwakilan Daerah atau sejak pelantikan Presiden/Wakil Presiden
    diselenggarakan pemungutan suara secara serentak untuk memilih anggota Dewan Perwakilan
    Rakyat Daerah provinsi, anggota Dewan Perwakilan Rakyat Daerah kabupaten/kota,
    dan gubernur/wakil gubernur, bupati/wakil bupati, dan walikota/wakil walikota”
- putusan: 166/PUU-XXI/2023
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/182/166-PUU-XXI-2023.pdf
  amar: Frasa “citra diri” yang berkaitan dengan foto/gambar dalam Pasal 1 angka 35
    Undang-Undang Nomor 7 Tahun 2017 tentang Pemilihan Umum (Lembaran Negara Republik
    Indonesia Tahun 2017 Nomor 182, Tambahan Lembaran Negara Republik Indonesia Nomor
    6109) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun
    1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai “foto/gambar
    tentang dirinya yang original dan terbaru serta tanpa direkayasa/dimanipulasi
    secara berlebihan dengan bantuan teknologi kecerdasan artifisial (artificial intelligence)”.
- putusan: 65/PUU-XXI/2023
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/224/putusan_mkri_65_PUU-XXI_2023.pdf
  amar: 1) Penjelasan Pasal 280 ayat (1) huruf h Undang-Undang Republik Indonesia
    Nomor 7 Tahun 2017 tentang Pemilihan Umum (Lembaran Negara Republik Indonesia
    Tahun 2017 Nomor 182 dan Tambahan Lembaran Negara Republik Indonesia Nomor 6109)
    sepanjang frasa ”Fasilitas pemerintah, tempat ibadah, dan tempat pendidikan dapat
    digunakan jika peserta pemilu hadir tanpa atribut kampanye pemilu atas undangan
    dari pihak penanggung jawab fasilitas pemerintah, tempat ibadah, dan tempat pendidikan”
    bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan
    tidak mempunyai kekuatan hukum mengikat; 2) Pasal 280 ayat (1) huruf h Undang-Undang
    Republik Indonesia Nomor 7 Tahun 2017 tentang Pemilihan Umum (Lembaran Negara
    Republik Indonesia Tahun 2017 Nomor 182 dan Tambahan Lembaran Negara Republik
    Indonesia Nomor 6109) bertentangan dengan Undang-Undang Dasar Negara Republik
    Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak
    dimaknai “mengecualikan fasilitas pemerintah dan tempat pendidikan sepanjang mendapat
    izin dari penanggung jawab tempat dimaksud dan hadir tanpa atribut kampanye pemilu”,
    sehingga Pasal 280 ayat (1) huruf h Undang-Undang Republik Indonesia Nomor 7 Tahun
    2017 tentang Pemilihan Umum selengkapnya berbunyi, “menggunakan fasilitas pemerintah,
    tempat ibadah, dan tempat pendidikan, kecuali untuk fasilitas pemerintah dan tempat
    pendidikan sepanjang mendapat izin dari penanggung jawab tempat dimaksud dan hadir
    tanpa atribut kampanye pemilu”
- putusan: 32/PUU-XIX/2021
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/162/putusan_mkri_8410.pdf
  amar: 1. Mengabulkan permohonan para Pemohon untuk sebagian; 2. Menyatakan ketentuan
    Pasal 458 ayat (13) Undang-Undang Nomor 7 Tahun 2017 (Lembaran Negara Republik
    Indonesia Tahun 2017 Nomor 182, Tambahan Lembaran Negara Republik Indonesia Nomor
    6109) bertentangan 148 dengan Undang-Undang Dasar Negara Republik Indonesia Tahun
    1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai, “Putusan
    sebagaimana dimaksud dalam ayat (10) mengikat bagi Presiden, KPU, KPU Provinsi,
    KPU Kabupaten/Kota, dan Bawaslu adalah merupakan keputusan pejabat TUN yang bersifat
    konkret, individual, dan final, yang dapat menjadi objek gugatan di peradilan
    TUN”; 3. Memerintahkan pemuatan putusan ini dalam Berita Negara Republik Indonesia
    sebagaimana mestinya; 4. Menolak permohonan para Pemohon selain dan selebihnya.
- putusan: 39/PUU-XVII/2019
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/159/putusan_mkri_6577.pdf
  amar: Amar Putusan:1. Mengabulkan permohonan para Pemohon untuk seluruhnya; 2. Menyatakan
    Pasal 416 ayat (1) Undang-Undang Nomor 7 Tahun 2017 tentang Pemilihan Umum (Lembaran
    Negara Republik Indonesia Tahun 2017 Nomor 182, Tambahan Lembaran Negara Republik
    Indonesia Nomor 6109) bertentangan dengan Undang-Undang Dasar Negara Republik
    Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak
    dimaknai “tidak berlaku untuk pemilihan umum Presiden dan Wakil Presiden yang
    hanya diikuti 2 (dua) pasangan calon”; 3. Memerintahkan pemuatan putusan ini dalam
    Berita Negara Republik Indonesia sebagaimana mestinya.
- putusan: 66/PUU-XV/2017
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/13/66_PUU-XV_2017.pdf
  amar: Pasal 571 huruf d Undang-Undang Nomor 7 Tahun 2017 tentang Pemilihan Umum
    bertentangan dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat.
- putusan: 53/PUU-XV/2017
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/10/53_PUU-XV_2017.pdf
  amar: Frasa "telah ditetapkan/" dalam Pasal 173 ayat (1); dan Pasal 173 ayat (3)
    Undang-Undang Nomor 7 Tahun 2017 tentang Pemilihan Umum bertentangan dengan UUD
    NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat.
