    sepanjang tidak dimaknai “Verifikasi partai politik yang dibentuk setelah Undang-Undang
    ini harus dilakukan paling lambat 2 ½ (dua setengah) tahun sebelum hari pemungutan
    suara untuk mengikuti pemilihan umum pada pemilihan umum pertama kali setelah
    partai politik yang bersangkutan didirikan dan berbadan hukum”
