  amar: a). Pasal 18 ayat (2) huruf a dan huruf b Undang-Undang Nomor 23 Tahun 2011
    tentang Pengelolaan Zakat yang menyatakan, ”a. terdaftar sebagai organisasi kemasyarakatan
    Islam yang mengelola bidang pendidikan, dakwah, dan sosial”; “b. berbentuk lembaga
    berbadan hukum” bertentangan dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan
    hukum mengikat sepanjang tidak dimaknai “terdaftar sebagai organisasi kemasyarakatan
    Islam yang mengelola bidang pendidikan, dakwah, dan sosial, atau lembaga berbadan
    hukum, harus mendapatkan izin dari pejabat yang berwenang, sedangkan untuk perkumpulan
    orang, perseorangan tokoh umat Islam (alim ulama), atau pengurus/takmir masjid/musholla
    di suatu komunitas dan wilayah yang belum terjangkau oleh BAZ dan LAZ, cukup dengan
    memberitahukan kegiatan pengelolaan zakat dimaksud kepada pejabat yang berwenang”.
    b) Pasal 18 ayat (2) huruf d Undang-Undang Nomor 23 Tahun 2011 tentang Pengelolaan
    Zakat yang menyatakan, “Memiliki pengawas syariat” bertentangan dengan UUD NRI
    Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai,
    ”pengawas syariat, baik internal, atau eksternal” c. Frasa, “Setiap orang” dalam
    Pasal 38 dan Pasal 41 Undang-Undang Nomor 23 Tahun 2011 tentang Pengelolaan Zakat
    Negara Republik Indonesia Nomor bertentangan dengan Undang-Undang Dasar Negara
    Republik Indonesia Tahun 1945 sepanjang tidak dimaknai dengan “mengecualikan perkumpulan
    orang, perseorangan tokoh umat Islam (alim ulama), atau pengurus/takmir masjid/musholla
    di suatu komunitas dan wilayah yang belum terjangkau oleh BAZ dan LAZ, dan telah
    memberitahukan kegiatan pengelolaan zakat dimaksud kepada pejabat yang berwenang”
