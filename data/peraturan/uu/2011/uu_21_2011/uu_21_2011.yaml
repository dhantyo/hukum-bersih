  amar: a. Frasa "dan bebas dari campur tangan pihak lain" yang mengikuti kata "independen"
    dalam Pasal 1 angka 1 Undang-Undang Nomor 21 Tahun 2011 tentang Otoritas Jasa
    Keuangan bertentangan dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat. b. Pasal 1 angka 1 Undang-Undang Nomor 21 Tahun 2011 tentang Otoritas
    Jasa Keuangan selengkapnya menjadi "Otoritas Jasa Keuangan, yang selanjutnya disingkat
    OJK, adalah lembaga yang independen, yang mempunyai fungsi, tugas dan wewenang
    pengaturan, pengawasan, pemeriksaan, dan penyidikan sebagaimana dimaksud dalam
    Undang-Undang ini
