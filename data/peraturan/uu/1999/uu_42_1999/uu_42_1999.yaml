  url: https://peraturan.bpk.go.id/DownloadUjiMateri/158/putusan_mkri_6694.pdf
  amar: Amar Putusan:1. Mengabulkan permohonan para Pemohon untuk sebagian; 2. Menyatakan
    Pasal 15 ayat (2) Undang-Undang Nomor 42 Tahun 1999 tentang Jaminan Fidusia (Lembaran
    Negara Republik Indonesia Tahun 1999 Nomor 168, Tambahan Lembaran Negara Republik
    Indonesia Nomor 3889) sepanjang frasa “kekuatan eksekutorial” dan frasa “sama
    dengan putusan pengadilan yang berkekuatan hukum tetap” bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat sepanjang tidak dimaknai “terhadap jaminan fidusia yang tidak ada kesepakatan
    tentang cidera janji (wanprestasi) dan debitur keberatan menyerahkan secara sukarela
    objek yang menjadi jaminan fidusia, maka segala mekanisme dan prosedur hukum dalam
    pelaksanaan eksekusi Sertifikat Jaminan Fidusia harus dilakukan dan berlaku sama
    dengan pelaksanaan eksekusi putusan pengadilan yang telah berkekuatan hukum tetap”;
    3. Menyatakan Pasal 15 ayat (3) Undang-Undang Nomor 42 Tahun 1999 tentang Jaminan
    Fidusia (Lembaran Negara Republik Indonesia Tahun 1999 Nomor 168, Tambahan Lembaran
    Negara Republik Indonesia Nomor 3889) sepanjang frasa “cidera janji” bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat sepanjang tidak dimaknai bahwa “adanya cidera janji tidak
    ditentukan secara sepihak oleh kreditur melainkan atas dasar kesepakatan antara
    kreditur dengan debitur atau atas dasar upaya hukum yang menentukan telah terjadinya
    cidera janji”. 4. Menyatakan Penjelasan Pasal 15 ayat (2) Undang-Undang Nomor
    42 Tahun 1999 tentang Jaminan Fidusia (Lembaran Negara Republik Indonesia Tahun
    1999 Nomor 168, Tambahan Lembaran Negara Republik Indonesia Nomor 3889) sepanjang
    frasa “kekuatan eksekutorial” bertentangan dengan Undang-Undang Dasar Negara Republik
    Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak
    dimaknai “terhadap jaminan fidusia yang tidak ada kesepakatan tentang cidera janji
    dan debitur keberatan menyerahkan secara sukarela objek yang menjadi jaminan fidusia,
    maka segala mekanisme dan prosedur hukum dalam pelaksanaan eksekusi Sertifikat
    Jaminan Fidusia harus dilakukan dan berlaku sama dengan pelaksanaan eksekusi putusan
    pengadilan yang telah berkekuatan hukum tetap”; 5. Memerintahkan pemuatan putusan
    ini dalam Berita Negara Republik Indonesia sebagaimana mestinya; 6. Menolak permohonan
    para Pemohon untuk selain dan selebihnya.
