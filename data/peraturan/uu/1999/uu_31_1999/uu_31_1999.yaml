uji_materi:
- putusan: 123/PUU-XXIII/2025
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/229/putusan_mkri_123PUU-XXIII2025.pdf
  amar: Pasal 14 Undang-Undang Nomor 31 Tahun 1999 tentang Pemberantasan Tindak Pidana
    Korupsi (Lembaran Negara Republik Indonesia Tahun 1999 Nomor 140, Tambahan Lembaran
    Negara Republik Indonesia Nomor 3874) sebagaimana telah diubah dengan Undang-Undang
    Nomor 20 Tahun 2001 tentang Perubahan Atas Undang-Undang Nomor 31 Tahun 1999 tentang
    Pemberantasan Tindak Pidana Korupsi (Lembaran Negara Republik Indonesia Tahun
    2001 Nomor 134, Tambahan Lembaran Negara Republik Indonesia Nomor 4150) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak memiliki
    kekuatan hukum mengikat 403 secara bersyarat sepanjang tidak dimaknai “dikecualikan
    apabila tindak pidana dalam undang-undang sektoral memenuhi unsur-unsur tindak
    pidana korupsi.”
- putusan: 25/PUU-XV/2016
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/5/25_PUU-XIV_2016.pdf
  amar: Kata "dapat" dalam Pasal 2 ayat (1) dan Pasal (3) Undang-Undang Nomor 31 Tahun
    2009 tentang Pemberantasan Tindak Pidana Korupsi sebagaimana diubah dengan Undang-Undang
    Nomor 20 Tahun 2001 bertentangan dengan UUD NRI Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat.
- putusan: 003/PUU-IV/2006
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/168/Putusan003PUUIV2006ttgUUPTPK.pdf
  amar: Penjelasan Pasal 2 ayat (1) Undang-undang Republik Indonesia Nomor 31 Tahun
    1999 tentang Pemberantasan Tindak Pidana Korupsi sebagaimana telah diubah dengan
    Undang-undang Nomor 20 Tahun 2001 tentang Perubahan Atas Undang-undang Nomor 31
    Tahun 1999 tentang Pemberantasan Tindak Pidana Korupsi sepanjang frasa yang berbunyi,
    ”Yang dimaksud dengan ’secara melawan hukum’ dalam Pasal ini mencakup perbuatan
    melawan hukum dalam arti formil maupun dalam arti materiil, yakni meskipun perbuatan
    tersebut tidak diatur dalam peraturan perundang-undangan, namun apabila perbuatan
    tersebut dianggap tercela karena tidak sesuai dengan rasa keadilan atau norma-norma
    kehidupan sosial dalam masyarakat, maka perbuatan tersebut dapat dipidana” bertentangan
    dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat dan bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945
