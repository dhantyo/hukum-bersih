  amar: Kata “dianggap” dalam norma Pasal 1 angka 9 Undang-Undang Nomor 30 Tahun 1999
    tentang Arbitrase dan Alternatif Penyelesaian Sengketa (Lembaran Negara Republik
    Indonesia Tahun 1999 Nomor 138, Tambahan Lembaran Negara Republik Indonesia Nomor
    3872) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun
    1945 dan tidak memiliki kekuatan hukum mengikat, sehingga norma Pasal 1 angka
    9 Undang-Undang Nomor 30 Tahun 1999 tentang Arbitrase dan Alternatif Penyelesaian
    Sengketa, selengkapnya menjadi berbunyi, “Putusan Arbitrase Internasional adalah
    putusan yang dijatuhkan oleh suatu lembaga arbitrase atau arbiter perorangan di
    luar wilayah hukum Republik Indonesia, atau putusan suatu lembaga arbitrase atau
    arbiter perorangan yang menurut ketentuan hukum Republik Indonesia sebagai suatu
    putusan arbitrase internasional.”
