uji_materi:
- putusan: 87/PUU-XXI/2023
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/184/87-PUU-XXI-2023.pdf
  amar: Pasal 42 Undang-Undang Nomor 30 Tahun 2002 tentang Komisi Pemberantasan Tindak
    Pidana Korupsi (Lembaran Negara Republik Indonesia Tahun 2002 Nomor 137, Tambahan
    Lembaran Negara Republik Indonesia Nomor 4250) yang menyatakan “Komisi Pemberantasan
    Korupsi berwenang mengkoordinasikan dan mengendalikan penyelidikan, penyidikan,
    dan penuntutan tindak pidana korupsi yang dilakukan bersama-sama oleh orang yang
    tunduk pada peradilan militer dan peradilan umum” bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat secara bersyarat sepanjang tidak dimaknai “Komisi Pemberantasan Korupsi
    berwenang mengkoordinasikan dan mengendalikan penyelidikan, penyidikan, dan penuntutan
    tindak pidana korupsi yang dilakukan bersama-sama oleh orang yang tunduk pada
    peradilan militer dan peradilan umum, sepanjang perkara dimaksud proses penegakan
    hukumnya ditangani sejak awal atau dimulai/ditemukan oleh Komisi Pemberantasan
    Korupsi.”
- putusan: 133/PUU-VII/2009
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/95/putusan_sidang_Putusan%20UU%20KPK_133_2009.pdf
  amar: Pasal 32 ayat (1) huruf c Undang-Undang Nomor 30 Tahun 2002 tentang Komisi
    Pemberantasan Tindak Pidana Korupsi bertentangan dengan UUD 1945 secara bersyarat
    (conditionally unconstitutional), kecuali harus dimaknai “pimpinan KPK berhenti
    atau diberhentikan secara tetap setelah dijatuhi pidana berdasarkan putusan pengadilan
    yang telah memperoleh kekuatan hukum tetap.”
