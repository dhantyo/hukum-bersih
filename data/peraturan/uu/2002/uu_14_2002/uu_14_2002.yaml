uji_materi:
- putusan: 26/PUU-XXI/2023
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/226/putusan_mkri_26_PUU-XXI_2023.pdf
  amar: Frasa “Departemen Keuangan” dalam Pasal 5 ayat (2) Undang-Undang Nomor 14
    Tahun 2002 tentang Pengadilan Pajak (Lembaran Negara Republik Indonesia Tahun
    2002 Nomor 27, Tambahan Lembaran Negara Republik Indonesia Nomor 4189) bertentangan
    dengan UUD 1945 dan tidak memiliki kekuatan hukum mengikat sepanjang tidak dimaknai
    menjadi “Mahkamah Agung yang secara bertahap dilaksanakan selambat-lambatnya tanggal
    31 Desember 2026”, sehingga Pasal 5 ayat (2) UU 14/2002 selengkapnya berbunyi,
    “Pembinaan organisasi, administrasi, dan keuangan bagi Pengadilan Pajak dilakukan
    oleh Mahkamah Agung yang secara bertahap dilaksanakan selambat-lambatnya tanggal
    31 Desember 2026”
- putusan: 6/PUU-XIV/2016
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/33/6_PUU-XIV_2016.pdf
  amar: a. Pasal 8 ayat (3) Undang-Undang Nomor 14 Tahun 2002 tentang Pengadilan Pajak
    bertentangan dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat.
    b. Frasa "telah berumur 65 tahun dalam Pasal 13 ayat (1) huruf c Undang-Undang
    Nomor 14 Tahun 2002 tentang Pengadilan Pajak bertentangan dengan UUD NRI Tahun
    1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai disamakan
    denan usia pemberhentian dengan hormat hakim tinggi pada pengadilan tinggi tata
    usaha negara.
