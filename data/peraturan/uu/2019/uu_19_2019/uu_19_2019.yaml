uji_materi:
- putusan: 70/PUU-XXIV/2026
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/233/putusan_mkri_70-PUU-XXIV-2026.pdf
  amar: Kata "melepaskan" dalam Pasal 29 huruf i Undang-Undang Nomor 19 Tahun 2019
    tentang Perubahan Kedua Atas Undang-Undang Nomor 30 Tahun 2002 tentang Komisi
    Pemberantasan Tindak Pidana Korupsi (Lembaran Negara Republik Indonesia Tahun
    2019 Nomor 197, Tambahan Lembaran Negara Republik Indonesia Nomor 6409) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai "nonaktif dari";
    3. Menyatakan frasa "tidak menjalankan" dalam Pasal 29 huruf j Undang-Undang Nomor
    19 Tahun 2019 tentang Perubahan Kedua Atas Undang-Undang Nomor 30 Tahun 2002 tentang
    Komisi Pemberantasan Tindak Pidana Korupsi (Lembaran Negara Republik Indonesia
    Tahun 2019 Nomor 197, Tambahan Lembaran Negara Republik Indonesia Nomor 6409)
    bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan
    tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai
    "nonaktif dari";
- putusan: 70/PUU-XVII/2019
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/154/putusan_mkri_7834.pdf
  amar: 1) Pasal 1 angka 3 Undang-Undang Nomor 19 Tahun 2019 tentang Perubahan Kedua
    Atas Undang-Undang Nomor 30 Tahun 2002 tentang Komisi Pemberantasan Tindak Pidana
    Korupsi (Lembaran Negara Republik Indonesia Tahun 2019 Nomor 197, Tambahan Lembaran
    Negara Republik Indonesia Nomor 6409) yang semula berbunyi “Komisi Pemberantasan
    Tindak Pidana Korupsi yang selanjutnya disebut Komisi Pemberantasan Korupsi adalah
    lembaga negara dalam rumpun kekuasaan eksekutif yang melaksanakan tugas pencegahan
    dan pemberantasan Tindak Pidana Korupsi sesuai dengan Undang-Undang ini”, bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai, “Komisi Pemberantasan
    Tindak Pidana Korupsi yang selanjutnya disebut Komisi Pemberantasan Korupsi adalah
    lembaga negara dalam rumpun kekuasaan eksekutif yang dalam melaksanakan tugas
    pemberantasan Tindak Pidana Korupsi bersifat independen dan bebas dari pengaruh
    kekuasaan manapun”. 2) Pasal 12B, Pasal 37B ayat (1) huruf b, dan Pasal 47 ayat
    (2) Undang-Undang Nomor 19 Tahun 2019 tentang Perubahan Kedua Atas Undang-Undang
    Nomor 30 Tahun 2002 tentang Komisi Pemberantasan Tindak Pidana Korupsi (Lembaran
    Negara Republik Indonesia Tahun 2019 Nomor 197, Tambahan Lembaran Negara Republik
    Indonesia Nomor 6409) bertentangan dengan Undang-Undang Dasar Negara Republik
    Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat; 3) Frasa “dipertanggungjawabkan
    kepada Dewan Pengawas” dalam Pasal 12C ayat (2) Undang-Undang Nomor 19 Tahun 2019
    tentang Perubahan Kedua Atas Undang-Undang Nomor 30 Tahun 2002 tentang Komisi
    Pemberantasan Tindak Pidana Korupsi (Lembaran Negara Republik Indonesia Tahun
    2019 Nomor 197, Tambahan Lembaran Negara Republik Indonesia Nomor 6409) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai “diberitahukan
    kepada Dewan Pengawas”. Sehingga, Pasal 12C ayat (2) Undang-Undang Nomor 19 Tahun
    2019 tentang Perubahan Kedua Atas Undang-Undang Nomor 30 Tahun 2002 tentang Komisi
    Pemberantasan Tindak Pidana Korupsi (Lembaran Negara Republik Indonesia Tahun
    2019 Nomor 197, Tambahan Lembaran Negara Republik Indonesia Nomor 6409) yang semula
    berbunyi “Penyadapan sebagaimana dimaksud dalam Pasal 12 ayat (1) yang telah selesai
    dilaksanakan harus dipertanggungjawabkan kepada Pimpinan Komisi Pemberantasan
    Korupsi dan Dewan Pengawas paling lambat 14 (empat belas) hari kerja terhitung
    sejak Penyadapan selesai dilaksanakan”, menjadi selengkapnya berbunyi “Penyadapan
    sebagaimana dimaksud dalam Pasal 12 ayat (1) yang telah selesai dilaksanakan harus
    dipertanggungjawabkan kepada Pimpinan Komisi Pemberantasan Korupsi dan diberitahukan
    kepada Dewan Pengawas paling lambat 14 (empat belas) hari kerja terhitung sejak
    Penyadapan selesai dilaksanakan”. 5. Menyatakan frasa “tidak selesai dalam jangka
    waktu paling lama 2 (dua) tahun” dalam Pasal 40 ayat (1) Undang-Undang Nomor 19
    Tahun 2019 tentang Perubahan Kedua Atas Undang-Undang Nomor 30 Tahun 2002 tentang
    Komisi Pemberantasan Tindak Pidana Korupsi (Lembaran Negara Republik Indonesia
    Tahun 2019 Nomor 197, Tambahan Lembaran Negara Republik Indonesia Nomor 6409)
    bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan
    tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai “tidak selesai
    dalam jangka waktu paling lama 2 (dua) tahun terhitung sejak diterbitkannya Surat
    Pemberitahuan Dimulainya Penyidikan (SPDP)”. Sehingga, Pasal 40 ayat (1) Undang-Undang
    Nomor 19 Tahun 2019 tentang Perubahan Kedua Atas Undang-Undang Nomor 30 Tahun
    2002 tentang Komisi Pemberantasan Tindak Pidana Korupsi (Lembaran Negara Republik
    Indonesia Tahun 2019 Nomor 197, Tambahan Lembaran Negara Republik Indonesia Nomor
    6409) yang semula berbunyi “Komisi Pemberantasan Korupsi dapat menghentikan penyidikan
    dan penuntutan terhadap perkara Tindak Pidana Korupsi yang penyidikan dan penuntutannya
    tidak selesai dalam jangka waktu paling lama 2 (dua) tahun”, menjadi selengkapnya
    berbunyi “Komisi Pemberantasan Korupsi dapat menghentikan penyidikan dan penuntutan
    terhadap perkara Tindak Pidana Korupsi yang penyidikan dan penuntutannya tidak
    selesai dalam jangka waktu paling lama 2 (dua) tahun terhitung sejak diterbitkannya
    Surat Pemberitahuan Dimulainya Penyidikan (SPDP).” 4) Menyatakan frasa “harus
    dilaporkan kepada Dewan Pengawas paling lambat 1 (satu) minggu” dalam Pasal 40
    ayat (2) Undang-Undang Nomor 19 Tahun 2019 tentang Perubahan Kedua Atas Undang-Undang
    Nomor 30 Tahun 2002 tentang Komisi Pemberantasan Tindak Pidana Korupsi (Lembaran
    Negara Republik Indonesia Tahun 2019 Nomor 197, Tambahan Lembaran Negara Republik
    Indonesia Nomor 6409) bertentangan dengan Undang-Undang Dasar Negara Republik
    Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak
    dimaknai “diberitahukan kepada Dewan Pengawas paling lambat 14 (empat belas) hari
    kerja”. Sehingga, Pasal 40 ayat (2) Undang-Undang Nomor 19 Tahun 2019 tentang
    Perubahan Kedua Atas Undang-Undang Nomor 30 Tahun 2002 tentang Komisi Pemberantasan
    Tindak Pidana Korupsi (Lembaran Negara Republik Indonesia Tahun 2019 Nomor 197,
    Tambahan Lembaran Negara Republik Indonesia Nomor 6409) yang semula berbunyi “Penghentian
    penyidikan dan penuntutan sebagaimana dimaksud pada ayat (1) harus dilaporkan
    kepada Dewan Pengawas paling lambat 1 (satu) minggu terhitung sejak dikeluarkannya
    surat perintah penghentian penyidikan dan penuntutan”, menjadi selengkapnya berbunyi
    “Penghentian penyidikan dan penuntutan sebagaimana dimaksud pada ayat (1) diberitahukan
    kepada Dewan Pengawas paling lambat 14 (empat belas) hari kerja terhitung sejak
    dikeluarkannya surat perintah penghentian penyidikan dan penuntutan”. 4) frasa
    “atas izin tertulis dari Dewan Pengawas” dalam Pasal 47 ayat (1) Undang-Undang
    Nomor 19 Tahun 2019 tentang Perubahan Kedua Atas Undang-Undang Nomor 30 Tahun
    2002 tentang Komisi Pemberantasan Tindak Pidana Korupsi (Lembaran Negara Republik
    Indonesia Tahun 2019 Nomor 197, Tambahan Lembaran Negara Republik Indonesia Nomor
    6409) bertentangan dengan Undang-Undang Dasar Negara Republik Indonesia Tahun
    1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai “dengan
    memberitahukan kepada Dewan Pengawas”. Sehingga, Pasal 47 ayat (1) Undang-Undang
    Nomor 19 Tahun 2019 tentang Perubahan Kedua Atas Undang-Undang Nomor 30 Tahun
    2002 tentang Komisi Pemberantasan Tindak Pidana Korupsi (Lembaran Negara Republik
    Indonesia Tahun 2019 Nomor 197, Tambahan Lembaran Negara Republik Indonesia Nomor
    6409) yang semula berbunyi, “Dalam proses penyidikan, penyidik dapat melakukan
    penggeledahan dan penyitaan atas izin tertulis dari Dewan Pengawas”, menjadi selengkapnya
    berbunyi “Dalam proses penyidikan, penyidik dapat melakukan penggeledahan dan
    penyitaan dengan memberitahukan kepada Dewan Pengawas.”
