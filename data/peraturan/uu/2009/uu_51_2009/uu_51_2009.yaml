  amar: a. Pasal 14A ayat (2) dan (3) Undang-Undang Nomor 51 Tahun 2009 tentang Perubahan
    Kedua Atas Undang-Undang Nomor 5 Tahun 1986 tentang Peradilan Tata Usaha Negara
    sepanjang kata "bersama" dan frasa "dan Komisi Yudisial" bertentangan dengan UUD
    NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat. b. Pasal 14 ayat (2)
    Undang-Undang Nomor 51 Tahun 2009 tentang Perubahan Kedua Atas Undang-Undang Nomor
    5 Tahun 1986 tentang Peradilan Tata Usaha Negara selengkapnya berbunyi "Proses
    seleksi pengangkatan hakim pengadilan tata usaha negara dilakukan oleh Mahkamah
    Agung", selengkapnya berbunyi "Ketentuan lebih lanjut mengenai proses seleksi
    diatur oleh Mahkamah Agung."
