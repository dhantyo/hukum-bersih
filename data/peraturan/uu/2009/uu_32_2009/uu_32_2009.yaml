  url: https://peraturan.bpk.go.id/DownloadUjiMateri/217/119_PUU-XXIII_2025.pdf
  amar: 'Penjelasan Pasal 66 Undang-Undang Nomor 32 Tahun 2009 tentang Perlindungan
    dan Pengelolaan Lingkungan Hidup (Lembaran Negara Republik Indonesia Tahun 2009
    Nomor 140, Tambahan Lembaran Negara Republik Indonesia Nomor 5059) bertentangan
    dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai: “ketentuan
    ini dimaksudkan untuk melindungi setiap orang, termasuk korban, pelapor, saksi,
    ahli, dan aktivis lingkungan yang berpartisipasi dalam upaya perlindungan dan
    pengelolaan lingkungan hidup dan/atau menempuh cara hukum akibat adanya pencemaran
    dan/atau perusakan lingkungan hidup. Perlindungan ini dimaksudkan untuk mencegah
    tindakan pembalasan melalui pemidanaan, gugatan perdata dan/atau upaya hukum lainnya
    dengan tetap memperhatikan kemandirian peradilan.”'
