  amar: a. Pasal 13A ayat (2) dan (3) Undang-Undang Nomor 50 Tahun 2009 tentang Perubahan
    Kedua Atas Undang-Undang Nomor 7 Tahun 1989 tentang Peradilan Agama sepanjang
    kata "bersama" dan frasa "dan Komisi Yudisial" bertentangan dengan UUD NRI Tahun
    1945 dan tidak mempunyai kekuatan hukum mengikat. b. Pasal 13A ayat (2) dan (3)
    Undang-Undang Nomor 50 Tahun 2009 tentang Perubahan Kedua Atas Undang-Undang Nomor
    7 Tahun 1989 tentang Peradilan Agama selengkapnya berbunyi "Proses seleksi pengangkatan
    hakim pengadilan agama dilakukan oleh Mahkamah Agung", selengkapnya berbunyi "Ketentuan
    lebih lanjut mengenai proses seleksi diatur oleh Mahkamah Agung."
