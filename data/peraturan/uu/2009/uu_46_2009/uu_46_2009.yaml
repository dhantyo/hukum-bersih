  amar: Pasal 10 ayat (5) Undang-Undang Nomor 46 Tahun 2009 tentang Pengadilan Tindak
    Pidana Korupsi (Lembaran Negara Republik Indonesia Tahun 2009 Nomor 155, Tambahan
    Lembaran Negara Republik Indonesia Nomor 5074) bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan hukum
    mengikat secara bersyarat sepanjang tidak dimaknai, “Hakim ad hoc sebagaimana
    dimaksud pada ayat (4) diangkat untuk masa jabatan selama 5 (lima) tahun dan dapat
    diangkat kembali untuk 1 (satu) kali masa jabatan tanpa seleksi ulang sepanjang
    masih memenuhi persyaratan perundang-undangan, serta dapat diangkat untuk masa
    jabatan 5 (lima) tahun berikutnya dengan terlebih dahulu mengikuti proses seleksi
    kembali sesuai dengan peraturan perundang undangan yang berlaku”. Sehingga Pasal
    10 ayat (5) Undang-Undang Nomor 46 Tahun 2009 tentang Pengadilan Tindak Pidana
    Korupsi (Lembaran Negara Republik Indonesia Tahun 2009 Nomor 155, Tambahan Lembaran
    Negara Republik Indonesia Nomor 5074) yang semula berbunyi “Hakim ad hoc sebagaimana
    dimaksud pada ayat (4) diangkat untuk masa jabatan selama 5 (lima) tahun dan dapat
    diangkat kembali untuk 1 (satu) kali masa jabatan”, menjadi selengkapnya berbunyi,
    “Hakim ad hoc sebagaimana dimaksud pada ayat (4) diangkat untuk masa jabatan selama
    5 (lima) tahun dan dapat diangkat kembali untuk 1 (satu) kali masa jabatan tanpa
    seleksi ulang sepanjang masih memenuhi persyaratan peraturan perundang undangan,
    serta dapat diangkat untuk masa jabatan 5 (lima) tahun berikutnya dengan terlebih
    dahulu mengikuti proses seleksi kembali sesuai dengan peraturan perundang-undangan
    yang berlaku.”
