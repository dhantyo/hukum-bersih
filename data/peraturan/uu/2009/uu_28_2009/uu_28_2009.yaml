uji_materi:
- putusan: 80/PUU-XV/2017
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/144/PULB_MK_80PUUXV2017_2017.PDF
  amar: Menyatakan Pasal 1 angka 28, Pasal 52 ayat (1) dan ayat (2), serta Pasal 55
    ayat (2) dan ayat (3) Undang-Undang Nomor 28 Tahun 2009 tentang Pajak Daerah Dan
    Retribusi Daerah (Lembaran Negara Republik Indonesia Tahun 2009 Nomor 130, Tambahan
    Lembaran Negara Republik Indonesia Nomor 5049) bertentangan dengan Undang-Undang
    Dasar Negara Republik Indonesia Tahun 1945 dan tidak memiliki kekuatan hukum mengikat.
    3. Menyatakan ketentuan Pasal 1 angka 28, Pasal 52 ayat (1) dan ayat (2), serta
    Pasal 55 ayat (2) dan ayat (3) Undang-Undang Nomor 28 Tahun 2009 tentang Pajak
    Daerah Dan Retribusi Daerah (Lembaran Negara Republik Indonesia Tahun 2009 Nomor
    130, Tambahan Lembaran Negara Republik Indonesia Nomor 5049) masih tetap berlaku
    sampai dengan dilakukan perubahan sesuai dengan tenggang waktu sebagaimana yang
    telah ditentukan dalam putusan ini; 4. Memerintahkan kepada pembentuk undang-undang
    untuk dalam jangka waktu paling lama 3 (tiga) tahun melakukan perubahan terhadap
    Undang-Undang Nomor 28 Tahun 2009 tentang Pajak Daerah Dan Retribusi Daerah (Lembaran
    Negara Republik Indonesia Tahun 2009 Nomor 130, Tambahan Lembaran Negara Republik
    Indonesia Nomor 5049) khususnya berkenaan dengan pengenaan pajak terhadap penggunaan
    listrik baik yang dihasilkan sendiri maupun yang dihasilkan dari sumber lain selain
    yang dihasilkan oleh pemerintah (PT PLN) sejak putusan ini diucapkan
- putusan: 46/PUU-XII/2014
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/47/46_PUU-XII_2014.pdf
