  amar: a. Pasal 14A ayat (2) dan (3) Undang-Undang Nomor 49 Tahun 2009 tentang Perubahan
    Kedua Atas Undang-Undang Nomor 2 Tahun 1986 tentang Peradilan Umum sepanjang kata
    "bersama" dan frasa "dan Komisi Yudisial" bertentangan dengan UUD NRI Tahun 1945
    dan tidak mempunyai kekuatan hukum mengikat. b. Pasal 14 ayat (2) Undang-Undang
    Nomor 49 Tahun 2009 tentang Perubahan Kedua Atas Undang-Undang Nomor 2 Tahun 1986
    tentang Peradilan Umum selengkapnya berbunyi "Proses seleksi pengangkatan hakim
    pengadilan negeri dilakukan oleh Mahkamah Agung", selengkapnya berbunyi "Ketentuan
    lebih lanjut mengenai proses seleksi diatur oleh Mahkamah Agung."
