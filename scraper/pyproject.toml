[project]
name = "hukum-bersih"
version = "0.1.0"
description = "Scraper and parser for Indonesian law and RUU documents"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hukum-bersih = "hukum_bersih.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
