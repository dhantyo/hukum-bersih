name: Indonesian VPN for government sites
description: >
  peraturan.go.id and other government sites answer only Indonesian IP addresses (finding of
  2026-11-21, see CLAUDE.md). This brings up a WireGuard tunnel to a VPN server in Indonesia
  for the duration of the job and routes ONLY those sites through it; everything else (GitHub,
  archive.org, package registries) keeps the runner's own connection. Does nothing when the
  WG_INDONESIA secret is not set, so workflows still run (and may hit the block) without it.
inputs:
  config:
    description: "WireGuard config (the WG_INDONESIA secret): a provider's .conf for a server in Indonesia"
    required: false
  hosts:
    description: Hosts routed through the tunnel
    default: "peraturan.go.id www.peraturan.go.id jdih.go.id jdih.setkab.go.id berkas.dpr.go.id www.dpr.go.id"
runs:
  using: composite
  steps:
    - name: Tunnel to Indonesia
      shell: bash
      env:
        WG_CONFIG: ${{ inputs.config }}
        HOSTS: ${{ inputs.hosts }}
      run: |
        if [ -z "$WG_CONFIG" ]; then
          echo "::notice::WG_INDONESIA is not set: no tunnel; government sites may refuse non-Indonesian IPs."
          exit 0
        fi
        sudo apt-get install -y -qq wireguard-tools resolvconf >/dev/null
        # route only the government hosts: their current IPv4 addresses, resolved here
        ips=$(for h in $HOSTS; do getent ahostsv4 "$h" | awk '{print $1"/32"}'; done | sort -u | paste -sd, -)
        if [ -z "$ips" ]; then echo "::warning::could not resolve the government hosts"; exit 0; fi
        # keep the runner's own DNS and default route: drop DNS=, replace AllowedIPs=
        printf '%s\n' "$WG_CONFIG" | sed -E '/^\s*DNS\s*=/d; s|^\s*AllowedIPs\s*=.*|AllowedIPs = '"$ips"'|' \
          | sudo tee /etc/wireguard/wg-id.conf >/dev/null
        sudo chmod 600 /etc/wireguard/wg-id.conf
        sudo wg-quick up wg-id
        echo "Routed through Indonesia: $ips"
        code=$(curl -s --http1.1 -o /dev/null -w '%{http_code}' --max-time 30 https://peraturan.go.id/ || true)
        echo "peraturan.go.id through the tunnel: ${code:-000}" | tee -a "$GITHUB_STEP_SUMMARY"
