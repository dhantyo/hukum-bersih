name: Probe BPK

# Which existing stealth-browser tool gets past peraturan.bpk.go.id's Cloudflare challenge
# (managed challenge, Turnstile) from a GitHub runner? Each tool runs directly and through the
# Indonesian VPN (when WG_INDONESIA is set). Script: .github/probe-bpk/probe_bpk.py.
# Results: the run's summary table and the `probe-*` artifacts (JSON + screenshot). No PDFs kept.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-bpk.yml", ".github/probe-bpk/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [playwright, seleniumbase, scrapling, camoufox]
        route: [direct, indonesia]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/indonesia-vpn
        if: matrix.route == 'indonesia'
        with:
          config: ${{ secrets.WG_INDONESIA }}
          hosts: "peraturan.bpk.go.id challenges.cloudflare.com"
      - name: Install ${{ matrix.tool }}
        run: |
          sudo apt-get install -y -qq python3-tk python3-dev python3-venv xvfb >/dev/null
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install -q curl_cffi
          case "${{ matrix.tool }}" in
            playwright)   pip install -q playwright && playwright install --with-deps chromium ;;
            seleniumbase) pip install -q seleniumbase ;;
            scrapling)    pip install -q "scrapling[fetchers]" && scrapling install ;;
            camoufox)     pip install -q "camoufox[geoip]" && python -m camoufox fetch ;;
          esac
          pip list 2>/dev/null | grep -i -E "^(playwright|patchright|seleniumbase|scrapling|camoufox|curl.cffi) " | tee versions.txt
          google-chrome --version | tee -a versions.txt
      - name: What Cloudflare sees
        run: curl -s --max-time 20 https://peraturan.bpk.go.id/cdn-cgi/trace | grep -E '^(ip|loc|colo)=' | tee trace.txt || true
      - name: Probe
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          mkdir -p out
          xvfb-run -a timeout 600 python .github/probe-bpk/probe_bpk.py "${{ matrix.tool }}" out || true
          python3 - <<'EOF'
          import json, pathlib
          f = pathlib.Path("out/${{ matrix.tool }}.json")
          r = json.loads(f.read_text()) if f.exists() else {"tool": "${{ matrix.tool }}", "error": "no result (crash or 600 s timeout)"}
          r["route"] = "${{ matrix.route }}"
          r["seen_as"] = " ".join(pathlib.Path("trace.txt").read_text().split())
          r["versions"] = pathlib.Path("versions.txt").read_text().strip().splitlines()
          pathlib.Path("out/${{ matrix.tool }}.json").write_text(json.dumps(r, ensure_ascii=False) + "\n")
          print(json.dumps(r, indent=1, ensure_ascii=False))
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.tool }}-${{ matrix.route }}
          path: out/
          retention-days: 14

  summary:
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: probe-*
          path: results
      - name: Summary table
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          print("| tool | route | seen as | home | detail | PDF in browser | cookie reuse (detail / PDF) | seconds | error |")
          print("|---|---|---|---|---|---|---|---|---|")
          for f in sorted(pathlib.Path("results").glob("*/*.json")):
              r = json.loads(f.read_text())
              pdf = r.get("pdf_in_browser") or {}
              reuse = r.get("cookie_reuse") or {}
              cr = " / ".join(f"{(reuse.get(k) or {}).get('status', '-')}" for k in ("detail", "pdf")) if reuse else "-"
              pdfs = f"{pdf.get('status')} {pdf.get('bytes')}B {pdf.get('head')!r}" if pdf else "-"
              print(f"| {r['tool']} | {r.get('route')} | {r.get('seen_as', '')} | {r.get('home_passed', '-')} | "
                    f"{r.get('detail_passed', '-')} | {pdfs} | {cr} | {r.get('home_seconds', '-')} | "
                    f"{(r.get('error') or r.get('note') or '')[:120]} |")
          EOF
