name: Import uploaded PDFs

# PDFs downloaded by hand (e.g. from peraturan.bpk.go.id in a browser) are attached to a GitHub
# release; this workflow records each in the source manifest (sha256) and converts it to text
# (pipeline/src/hukum_rapih/uploads.py). Files are matched to laws by
# name: "UU Nomor 4 Tahun 2009.pdf", "uu-no-4-tahun-2009.pdf", "UU_4_2009.pdf".
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag holding the PDFs"
        default: "uploads"
      source:
        description: "Where the PDFs came from (host)"
        default: "peraturan.bpk.go.id"

permissions:
  contents: write

concurrency:
  group: import-peraturan # never at the same time as the importer: both write data/
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HUKUM_RAPIH_OCR_CACHE: /home/runner/ocr-cache # raw OCR of scanned pages, kept between runs (.github/actions/ocr-cache)
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: ./.github/actions/ocr-cache
        with:
          step: restore
          path: ${{ env.HUKUM_RAPIH_OCR_CACHE }}
      - name: OCR tools for scanned PDFs (Indra reads them, Tesseract is the fallback)
        run: sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ind hunspell hunspell-id hunspell-en-us >/dev/null
      - run: |
          uv sync --extra ocr
          uv run python -c 'import indra_ocr; indra_ocr.load()'   # Indra's models (~76 MB) once, before the parallel OCR workers
        working-directory: pipeline
      - name: Download the release's PDFs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          mkdir -p "$RUNNER_TEMP/uploads"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.pdf' --pattern '*.PDF' \
            --dir "$RUNNER_TEMP/uploads"
          ls -la "$RUNNER_TEMP/uploads" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record, convert
        working-directory: pipeline
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          shopt -s nullglob nocaseglob
          uv run hukum-rapih import-pdf "$RUNNER_TEMP"/uploads/*.pdf --source "$SOURCE" \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          uv run hukum-rapih relations
      - name: Commit
        run: |
          git add data/
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git -c user.name="hukum-rapih bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "peraturan: import uploaded PDFs from ${{ inputs.source }} (release ${{ inputs.release }})"
          for i in 1 2 3 4 5; do
            git -c user.name="hukum-rapih bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              pull -q --no-rebase --no-edit origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep $((i * 20))
          done
          exit 1
      - uses: ./.github/actions/ocr-cache
        if: always()
        with:
          step: save
          path: ${{ env.HUKUM_RAPIH_OCR_CACHE }}
