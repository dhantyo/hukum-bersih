name: Retitle archive.org items

# Rewrites the title and description of archived items from the naming rule (docs/NAMING.md)
# and the source manifests. Only metadata changes; files are never uploaded or touched.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Document ids, separated by spaces"
        required: true

permissions:
  contents: read

jobs:
  retitle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: scraper
      - name: Retitle
        working-directory: scraper
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IDS: ${{ inputs.ids }}
        run: |
          read -r -d '' -a list <<< "$IDS" || true
          set +e
          uv run hukum-bersih archive-retitle "${list[@]}" | tee out.log
          status=${PIPESTATUS[0]}
          cat out.log >> "$GITHUB_STEP_SUMMARY"
          exit $status
