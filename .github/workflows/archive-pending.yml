name: Archive pending PDFs

# Daily: upload regulation PDFs that the importer recorded but did not archive (the archive.org
# keys only exist here as secrets). Batches; safe to rerun; skips what is already archived.
# Manifests merge with git's union driver (.gitattributes), so appends from the importer and
# from this job do not conflict.
on:
  schedule:
    - cron: "17 19 * * *"   # daily, 02:17 WIB
  workflow_dispatch:
    inputs:
      limit:
        description: "Max PDFs this run"
        default: "150"

permissions:
  contents: write

concurrency:
  group: archive-pending
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: pipeline
      - name: Archive
        working-directory: pipeline
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          LIMIT: ${{ inputs.limit || '150' }}
        # failures for single PDFs (site down, rate limit) are reported and retried next run
        run: uv run hukum-bersih archive-pending --limit "$LIMIT" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Commit manifests
        run: |
          git add data/sources/manifests
          if git diff --cached --quiet; then echo "Nothing archived"; exit 0; fi
          git -c user.name="hukum-bersih bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "sources: archive pending PDFs to archive.org"
          for i in 1 2 3 4 5; do
            git -c user.name="hukum-bersih bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              pull -q --no-rebase --no-edit origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep $((i * 20))
          done
          exit 1
