name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build Akoma Ntoso XML from data/
        working-directory: pipeline
        run: uv run hukum-bersih build-akn --out ../web/generated/akn
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test     # includes the M1 check: Pasal 5(2) of RUU Perampasan Aset changed
      - run: npm run build

  no-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed PDFs
        run: |
          if git ls-files | grep -iE '\.pdf$'; then
            echo "PDFs must not be committed (archive them on the Internet Archive instead)." >&2
            exit 1
          fi
