name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build Akoma Ntoso XML from data/
        working-directory: pipeline
        run: uv run hukum-bersih build-akn --out ../web/generated/akn
      # Blocking: any file that is not valid AKN 3.0 fails CI. Laws with no known date keep a
      # bare-year Work date (not made up) and are listed instead (scripts/validate_akn.py).
      - name: Validate the XML against the OASIS Akoma Ntoso 3.0 schema
        working-directory: pipeline
        run: uv run python scripts/validate_akn.py ../web/generated/akn
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test     # includes the M1 check: Pasal 5(2) of RUU Perampasan Aset changed
      - run: npm run build

  changes:
    runs-on: ubuntu-latest
    outputs:
      web-solid: ${{ steps.filter.outputs.web-solid }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web-solid:
              - 'web-solid/**'

  web-solid:
    needs: changes
    if: needs.changes.outputs.web-solid == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-solid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web-solid/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-solid/pnpm-lock.yaml
      # The Solid app type-checks and reads shared legal logic from web/src/lib, which needs web's dependencies.
      - name: Install the Astro app's dependencies
        working-directory: web
        run: npm ci
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec tsc --noEmit
      - run: pnpm run test --run
      - run: pnpm run build

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned release. shellcheck integration is off: it only raised style notes
      # (quoting, ls) on our scripts. actionlint does not lint a local action's own
      # action.yml; its inputs are checked where workflows call it.
      - name: Lint workflows with actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck= -verbose

  no-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed PDFs
        run: |
          if git ls-files | grep -iE '\.pdf$'; then
            echo "PDFs must not be committed (only their sha256 goes in data/sources/manifests/)." >&2
            exit 1
          fi
