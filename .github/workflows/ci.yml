name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  akn:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Build Akoma Ntoso XML from data/
        run: uv run hukum-bersih build-akn --out "$RUNNER_TEMP/akn"
      # Blocking: any file that is not valid AKN 3.0 fails CI. Laws with no known date keep a
      # bare-year Work date (not made up) and are listed instead (scripts/validate_akn.py).
      - name: Validate the XML against the OASIS Akoma Ntoso 3.0 schema
        run: uv run python scripts/validate_akn.py "$RUNNER_TEMP/akn"

  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'web/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec tsc --noEmit
      - run: pnpm run test --run
      - run: pnpm run build

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned release. shellcheck integration is off: it only raised style notes
      # (quoting, ls) on our scripts. actionlint does not lint a local action's own
      # action.yml; its inputs are checked where workflows call it.
      - name: Lint workflows with actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck= -verbose

  no-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refuse committed PDFs
        run: |
          if git ls-files | grep -iE '\.pdf$'; then
            echo "PDFs must not be committed (only their sha256 goes in data/sources/manifests/)." >&2
            exit 1
          fi
