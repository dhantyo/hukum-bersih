name: Probe BPK app

# Does the JDIH BPK Android app (id.go.bpk.jdih.pro) use an API we could read instead of the
# website? Downloads the app with apkeep (EFF), lists the URLs and API paths in its code and
# assets, and tries the hosts it finds. Keeps only that list (artifact), not the app.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-bpk-app.yml"]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R EFForg/apkeep --pattern 'apkeep-x86_64-unknown-linux-gnu' -O apkeep
          chmod +x apkeep
          mkdir -p apk
          ./apkeep -a id.go.bpk.jdih.pro apk/ || ./apkeep -a id.go.bpk.jdih.pro -d apk-pure apk/
          ls -la apk
      - name: URLs and API paths in the app
        run: |
          mkdir -p out x
          f=$(ls apk/* | head -1)
          case "$f" in *.xapk) unzip -q -o "$f" -d x; for a in x/*.apk; do unzip -q -o "$a" -d "x/$(basename "$a" .apk)"; done ;;
                       *) unzip -q -o "$f" -d x ;; esac
          find x -type f | sed 's|^x/||' | sort > out/files.txt
          grep -E 'libapp\.so|index\.android\.bundle|\.dex$|capacitor|cordova|flutter' out/files.txt | head -30 | tee out/framework.txt
          find x -type f \( -name '*.dex' -o -name '*.so' -o -name '*.bundle' -o -name '*.js' -o -name '*.json' -o -name '*.xml' \) -print0 \
            | xargs -0 strings -n 6 2>/dev/null \
            | grep -oE 'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+' | grep -viE 'schemas|w3\.org|android\.com|google|apache|firebase|crashlytics|github|mozilla|jquery|example' \
            | sort | uniq -c | sort -rn > out/urls.txt
          find x -type f \( -name '*.dex' -o -name '*.so' -o -name '*.bundle' -o -name '*.js' \) -print0 \
            | xargs -0 strings -n 4 2>/dev/null | grep -E '^/?api/|/api/|^/(peraturan|search|detail|download|jenis)' -i \
            | sort | uniq -c | sort -rn | head -300 > out/paths.txt
          head -60 out/urls.txt; head -60 out/paths.txt
      - name: Try the hosts
        run: |
          for h in $(grep -oE 'https?://[^/" ]+' out/urls.txt | sort -u | grep -i bpk); do
            for p in / /api /api/v1; do
              r=$(curl -s -o /dev/null -w '%{http_code} cf=%header{cf-mitigated} type=%header{content-type}' --max-time 20 "$h$p" || true)
              echo "$h$p $r" | tee -a out/hosts.txt
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpk-app-urls
          path: out/
          retention-days: 14
