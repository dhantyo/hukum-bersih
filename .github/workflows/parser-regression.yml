name: Parser regression

# The PDF parser on the regression set (pipeline/tests/regression.yaml: UU from 1947-2026, typed
# and scanned, counts read from the PDFs), and what the OCR spell fix (pdf/ocr_fix.py) changes on random scanned UU. Runs
# when the parser changes; fails if any law in the set is off.
on:
  workflow_dispatch:
    inputs:
      ocr_fix:
        description: "OCR spell fix report on N random scanned UU (0 = no)"
        default: "30"
      compare:
        description: "Compare the current parser's text with the stored text for these law ids (comma-separated, e.g. uu_16_2022,uu_7_2021; empty = skip)"
        default: ""
      compare_pages:
        description: "With compare: 1-based pages whose cleaned lines to print (comma-separated)"
        default: ""
  push:
    paths:
      [
        "pipeline/src/hukum_rapih/pdf/**",
        "pipeline/src/hukum_rapih/akn/**",
        "pipeline/src/hukum_rapih/closing.py",
        "pipeline/src/hukum_rapih/checks.py",
        "pipeline/tests/regression.yaml",
        "pipeline/scripts/regress.py",
        "pipeline/scripts/ocr_fix_report.py",
        "pipeline/scripts/compare_reparse.py",
        ".github/workflows/parser-regression.yml",
        ".github/actions/ocr-cache/**",
      ]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HUKUM_RAPIH_OCR_CACHE: /home/runner/ocr-cache # raw OCR of scanned pages, kept between runs (.github/actions/ocr-cache)
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: ./.github/actions/ocr-cache
        with:
          step: restore
          path: ${{ env.HUKUM_RAPIH_OCR_CACHE }}
      - run: sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ind hunspell hunspell-id hunspell-en-us >/dev/null
      - run: hunspell -d id_ID,en_US -G <<< "rumah house tidakada" # dictionaries present: prints 2 words
      - run: |
          uv sync --extra ocr --extra bpk
          uv run python -c 'import indra_ocr; indra_ocr.load()'   # Indra's models (~76 MB) once, before the parallel OCR workers
        working-directory: pipeline
      - name: Regression set
        working-directory: pipeline
        shell: bash # -o pipefail: the step fails when regress.py does
        run: uv run python scripts/regress.py 2>&1 | grep -v "MuPDF error\|^$" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: OCR spell fix report
        if: ${{ (inputs.ocr_fix || '30') != '0' }}
        working-directory: pipeline
        run: uv run python scripts/ocr_fix_report.py "${{ inputs.ocr_fix || '30' }}" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare with the stored texts
        if: ${{ inputs.compare != '' }}
        working-directory: pipeline
        env:
          COMPARE: ${{ inputs.compare }}
          COMPARE_PAGES: ${{ inputs.compare_pages }}
        run: uv run python scripts/compare_reparse.py --pages "$COMPARE_PAGES" ${COMPARE//,/ } 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/ocr-cache
        if: always()
        with:
          step: save
          path: ${{ env.HUKUM_RAPIH_OCR_CACHE }}
