name: Deploy site

# Builds the Astro site + Pagefind index and publishes it to Cloudflare Pages (project "hukum-bersih",
# production branch "main"; created automatically on the first run).
# Runs only when main changes (a merged PR or an import batch pushing data), or by hand.
# Pushes to other branches start no run at all.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Build Akoma Ntoso XML from data/
        working-directory: pipeline
        run: uv run hukum-bersih build-akn --out ../web/generated/akn
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Create Pages project if missing
        run: |
          npx wrangler pages project list | grep -qw hukum-bersih \
            || npx wrangler pages project create hukum-bersih --production-branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Always publish as the production deployment, whatever the repo's default branch is called.
      - run: npx wrangler pages deploy --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
