name: Check stored texts

# Runs the self-checks (pipeline/src/hukum_rapih/checks.py, decision 0026) over every stored
# text of one type, without PDFs, and writes the report worst first to the job summary and an
# artifact. Read-only: nothing is committed. Use it before and after a reparse to compare.
on:
  workflow_dispatch:
    inputs:
      jenis:
        description: "Type of regulation"
        default: "uu"
        type: choice
        options: [uu, perppu, uud, uud-perubahan, keppres]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Run the self-checks
        env:
          JENIS: ${{ inputs.jenis }}
        run: |
          uv run python scripts/check_texts.py "$JENIS" --out "$RUNNER_TEMP/check-texts.tsv" > "$RUNNER_TEMP/check-texts.txt"
          { echo '```'; tail -n 25 "$RUNNER_TEMP/check-texts.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: check-texts-${{ inputs.jenis }}
          path: |
            ${{ runner.temp }}/check-texts.tsv
            ${{ runner.temp }}/check-texts.txt
