name: Explore BPK

# Saves sample pages of peraturan.bpk.go.id (HTML only, no PDFs) as an artifact, to write and
# test the BPK importer against real pages. Script: .github/probe-bpk/explore.py.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/explore-bpk.yml", ".github/probe-bpk/explore.py"]

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Scrapling
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install -q curl_cffi "scrapling[fetchers]" && scrapling install
      - name: Explore
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          xvfb-run -a python .github/probe-bpk/explore.py out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpk-pages
          path: out/
          retention-days: 14
