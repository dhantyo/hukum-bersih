name: Fetch and archive

# Downloads source documents, uploads each to the Internet Archive, and commits the
# manifest lines (url, fetched_at, sha256, bytes, archive_url) to data/sources/manifests/.
# PDFs themselves never enter git. Needs repo secrets IA_ACCESS_KEY and IA_SECRET_KEY.
# Each document needs a readable doc id (docs/NAMING.md); archived as hukum-bersih-<doc id>.
on:
  workflow_dispatch:
    inputs:
      docs:
        description: "Pairs of 'doc-id URL', e.g. 'ruu-perampasan-aset-2026-11-19-draft-ruu-final https://berkas2.dpr.go.id/...' (separate pairs with spaces)"
        required: true
      title:
        description: "Optional Internet Archive title (single pair only)"
        required: false

permissions:
  contents: write

concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: scraper
      - name: Fetch
        working-directory: scraper
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          DOCS: ${{ inputs.docs }}
          TITLE: ${{ inputs.title }}
        run: |
          read -r -d '' -a list <<< "$DOCS" || true
          args=("${list[@]}")
          [ -n "$TITLE" ] && args+=(--title "$TITLE")
          set +e
          uv run hukum-bersih fetch "${args[@]}" | tee fetch.log
          status=${PIPESTATUS[0]}
          cat fetch.log >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Commit manifests
        if: always()
        run: |
          git add data/sources/manifests
          if git diff --cached --quiet; then echo "No new manifest entries"; exit 0; fi
          n=$(git diff --cached --numstat | awk '{s+=$1} END {print s}')
          git -c user.name="hukum-bersih bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "sources: archive $n document(s) to the Internet Archive"
          git push
