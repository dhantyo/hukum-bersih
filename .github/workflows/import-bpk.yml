name: Import from BPK

# Imports regulations from peraturan.bpk.go.id (JDIH BPK), the main source since 2026-11-21:
# metadata into data/, every PDF archived on archive.org as soon as it is downloaded, text for
# records that have none. Records imported earlier from peraturan.go.id keep their text (the BPK
# PDF is archived and parsed for comparison). Batches of 50, committed and pushed after each, so
# runs resume; once everything is in, runs only pick up new regulations.
# Cloudflare: a stealth browser (Scrapling) clears the check, curl_cffi downloads
# (pipeline/src/hukum_bersih/sources/bpk_session.py). No VPN needed: BPK is not geo-blocked.
on:
  schedule:
    - cron: "41 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      jenis:
        description: "Type of regulation"
        default: "uu"
        type: choice
        options: [uu, perppu, pp, perpres]
      batches:
        description: "Max batches of 50 (0 = until the time budget is used)"
        default: "0"
  push:
    branches: ["claude/**", "!claude/determined-curie-rq2b0s"]   # not the default branch
    paths: [".github/workflows/import-bpk.yml"]

permissions:
  contents: write

concurrency:
  group: import-peraturan        # never together with other jobs that write data/
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      JENIS: ${{ inputs.jenis || 'uu' }}
      # a push to a claude/** branch is a test run: one small batch
      BATCHES: ${{ github.event_name == 'push' && '1' || inputs.batches || '0' }}
      BATCH: ${{ github.event_name == 'push' && '5' || '50' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (with the stealth browser)
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          cd pipeline && uv sync --extra bpk && uv run scrapling install
      - name: Import in batches
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          git config user.name "hukum-bersih bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          deadline=$(( $(date +%s) + 320 * 60 ))       # stop starting batches after ~5h20m
          batch=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            batch=$((batch + 1))
            out=$(cd pipeline && xvfb-run -a uv run hukum-bersih import-bpk "$JENIS" --limit "$BATCH" 2>&1 || true)
            echo "$out"
            n=$(echo "$out" | grep -c '^ok' || true)
            echo "$out" | grep -E '^(ok|FAIL|STOP|done)' >> "$GITHUB_STEP_SUMMARY" || true
            (cd pipeline && uv run hukum-bersih relations)   # link amendments, revocations
            git add data/
            if ! git diff --cached --quiet; then
              git commit -qm "peraturan/$JENIS: $n from peraturan.bpk.go.id (PDFs archived)"
              for i in 1 2 3 4 5; do
                git pull -q --no-rebase --no-edit origin "${GITHUB_REF_NAME}" && git push -q && break
                sleep $((i * 20))
              done
            fi
            echo "$out" | grep -q '^STOP' && { echo "::error::Cloudflare stopped the import"; exit 1; }
            [ "$n" -eq 0 ] && break
            [ "$BATCHES" -gt 0 ] && [ "$batch" -ge "$BATCHES" ] && break
          done
          echo "From BPK: $(grep -l '^bpk:' -r data/peraturan/$JENIS --include='*.yaml' | wc -l) of $(find data/peraturan/$JENIS -name '*.yaml' | wc -l) records" | tee -a "$GITHUB_STEP_SUMMARY"
