name: Deploy Solid preview

on:
  workflow_dispatch:
  # A manual run needs this file on the default branch; until it is there, a push to the Solid
  # branch deploys the preview from the branch's own copy.
  push:
    branches: [feat/solid-reader]

permissions:
  contents: read

concurrency:
  group: solid-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-solid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: web-solid/.node-version
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web-solid/package.json
      - run: pnpm install --frozen-lockfile
      - name: Build Solid Worker
        run: |
          pnpm exec tsc --noEmit
          pnpm run test --run
          pnpm run build
      - name: Install the pipeline
        working-directory: pipeline
        run: uv sync
      # The pipeline reads data/ and writes the corpus: laws, collections, drafts, the catalog and the
      # Pagefind index. `--publish` stores it as releases/<id>/ and points active-release at it.
      - name: Prepare preview corpus
        working-directory: pipeline
        run: uv run hukum-bersih export-corpus --publish "$RUNNER_TEMP/solid-corpus"
      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
      - name: Publish the corpus to preview R2
        id: corpus
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RCLONE_CONFIG_PREVIEW_TYPE: s3
          RCLONE_CONFIG_PREVIEW_PROVIDER: Cloudflare
          RCLONE_CONFIG_PREVIEW_ACCESS_KEY_ID: ${{ secrets.SOLID_PREVIEW_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_PREVIEW_SECRET_ACCESS_KEY: ${{ secrets.SOLID_PREVIEW_R2_SECRET_ACCESS_KEY }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Cloudflare account ID is required}"
          : "${RCLONE_CONFIG_PREVIEW_ACCESS_KEY_ID:?Preview R2 access key is required}"
          : "${RCLONE_CONFIG_PREVIEW_SECRET_ACCESS_KEY:?Preview R2 secret key is required}"
          export RCLONE_CONFIG_PREVIEW_ENDPOINT="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          release="$(../.github/scripts/upload-release.sh "$RUNNER_TEMP/solid-corpus" preview:hukum-bersih-solid-preview)"
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"
      - name: Deploy preview Worker
        id: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.SOLID_PREVIEW_WORKERS_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Preview Workers API token is required}"
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/solid-deploy.jsonl"
          pnpm exec wrangler deploy
          url="$(jq -ers '[.[] | select(.type == "deploy") | .targets[] | select(test("^https://hukum-bersih-solid-preview\\.[a-z0-9-]+\\.workers\\.dev/?$"))] | last' "$WRANGLER_OUTPUT_FILE_PATH")"
          printf 'url=%s\n' "${url%/}" >> "$GITHUB_OUTPUT"
      - name: Smoke test deployed preview
        env:
          PREVIEW_URL: ${{ steps.worker.outputs.url }}
          RELEASE: ${{ steps.corpus.outputs.release }}
        run: |
          curl --retry 4 --fail-with-body -sS "$PREVIEW_URL/uu/11/2008/" -o "$RUNNER_TEMP/solid-law.html"
          grep -Fq 'id="pasal-27"' "$RUNNER_TEMP/solid-law.html"
          curl --fail-with-body -sS "$PREVIEW_URL/uu/11/2008/?bandingkan=uu_1_2024&dari=uu_11_2008" -o "$RUNNER_TEMP/solid-comparison.html"
          grep -Fq 'id="cmp-pasal-27a"' "$RUNNER_TEMP/solid-comparison.html"
          curl --fail-with-body -sS "$PREVIEW_URL/uu/11/2008/perubahan/" -o "$RUNNER_TEMP/solid-perubahan.html"
          grep -Fq 'url=/koleksi/ite/?bandingkan' "$RUNNER_TEMP/solid-perubahan.html"
          curl --fail-with-body -sS "$PREVIEW_URL/search-index/$RELEASE/pagefind-entry.json" -o "$RUNNER_TEMP/solid-index.json"
          jq -e '.languages.id.page_count > 1000' "$RUNNER_TEMP/solid-index.json"
          curl --fail-with-body -sS "$PREVIEW_URL/koleksi/ite/" -o /dev/null
          curl --fail-with-body -sS "$PREVIEW_URL/ruu/perampasan-aset/" -o /dev/null
          printf 'Preview: %s\n\nCorpus release: `%s`\n' "$PREVIEW_URL" "$RELEASE" >> "$GITHUB_STEP_SUMMARY"
