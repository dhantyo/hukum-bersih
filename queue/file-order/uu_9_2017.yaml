  - NOMOR 1 TAHUN 2017 TENTANG AKSES INFORMASI KEUANGAN
  - UNTUK KEPENTINGAN PERPAJAKAN MENJADI UNDANG-UNDANG
  - I. UMUM
  - Dalam rangka melaksanakan pembangunan nasional Negara
  - Kesatuan Republik Indonesia yang bertujuan untuk menyejahterakan dan
  - memakmurkan seluruh rakyat Indonesia secara merata dan berkeadilan,
  - sesuai dengan amanat Pembukaan Undang-Undang Dasar Negara
  - Republik Indonesia Tahun 1945, dibutuhkan pendanaan yang bersumber
  - dari penerimaan negara terutama yang berasal dari pajak, yang
  - pemungutannya diatur dengan undang-undang sebagai perwujudan
  - ketentuan Pasal 23A Undang-Undang Dasar Negara Republik Indonesia
  - Tahun 1945.
  - Upaya pemungutan pajak untuk kepentingan pembangunan nasional
  - masih mengalami kendala baik yang berasal dari faktor internal maupun
  - dari faktor eksternal. Dalam mengatasi kendala dari faktor internal, saat
  - ini Pemerintah telah dan sedang melakukan reformasi perpajakan pada
  - Direktorat Jenderal Pajak dengan tujuan antara lain untuk memperbaiki
  - organisasi, proses kerja, pengelolaan data dan informasi dari perbankan,
  - serta sumber daya manusia. Sedangkan dari faktor eksternal, selain
  - terjadinya pelemahan ekonomi dan perdagangan global, juga masih
  - banyak ditemukannya Wajib Pajak yang melakukan penghindaran pajak
  - ke luar Indonesia. Dengan adanya pusat-pusat pelarian
  last_page:
  - No.6112
  - Untuk mengatasi hal tersebut di atas, Presiden telah menetapkan
  - Peraturan Pemerintah Pengganti Undang-Undang Nomor 1 Tahun 2017
  - tentang Akses Informasi Keuangan Untuk Kepentingan Perpajakan pada
  - tanggal 8 Mei 2017, guna memberikan kepastian hukum mengenai
  - pemberian akses yang luas bagi otoritas perpajakan dalam menerima dan
  - memperoleh informasi keuangan bagi kepentingan perpajakan dan
  - memenuhi komitmen Indonesia dalam perjanjian internasional terkait
  - dengan pertukaran informasi keuangan secara otomatis.
  - Peraturan Pemerintah Pengganti Undang-Undang Nomor 1 Tahun
  - 2017 tentang Akses Informasi Keuangan Untuk Kepentingan Perpajakan
  - telah mendapat persetujuan Dewan Perwakilan Rakyat untuk kemudian
  - disahkan menjadi Undang-Undang tentang Penetapan Peraturan
  - Pemerintah Pengganti Undang-Undang Nomor 1 Tahun 2017 tentang
  - Akses Informasi Keuangan untuk Kepentingan Perpajakan menjadi
  - Undang-Undang berdasarkan ketentuan Pasal 22 ayat (2) Undang-Undang
  - Dasar Negara Republik Indonesia Tahun 1945.
