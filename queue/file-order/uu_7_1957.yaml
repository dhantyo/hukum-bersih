  - 112), perlu diubah dan ditambah;
  - 'Mengingat : Pasal 113 dan Pasal 114 Undang-undang Dasar Sementara Republik'
  - Indonesia;
  - Dengan persetujuan Dewan Perwakilan Rakyat;
