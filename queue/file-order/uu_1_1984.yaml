  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 1 TAHUN 1984
  - TENTANG
  - ANGGARAN PENDAPATAN DAN BELANJA NEGARA
  - TAHUN ANGGARAN 1984/1985
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - Presiden Republik Indonesia,
  - 'Menimbang : a. bahwa Anggaran Pendapatan dan Belanja Negara untuk Tahun'
  - Anggaran 1984/1985 perlu ditetapkan dengan Undang-Undang;
  - b. bahwa sebagai Anggaran Pendapatan dan Belanja Negara tahun
  - pertama dalam rangka pelaksanaan Rencana Pembangunan Lima
  - Tahun IV, Anggaran Pendapatan dan Belanja Negara Tahun
  - Anggaran 1984/1985 mengikuti prioritas nasional sebagaimana
  - ditetapkan di dalam Pola Umum PELITA Keempat yang
  - tercantum dalam Ketetapan Majelis Permusyawaratan Rakyat
  - Nomor II/MPR/1983 tentang Garis-Garis Besar Haluan Negara;
  - c. bahwa Anggaran Pendapatan dan Belanja Negara Tahun
  - Anggaran 1984/1985 adalah rencana kerja Pemerintah, khususnya
  - pelaksanaan tahun pertama rencana tahunan Pembangunan Lima
  - Tahun IV;
  - d. bahwa Anggaran Pendapatan dan Belanja Negara Tahun
  - Anggaran 1984/1985 di samping memelihara dan meneruskan
  - hasil-hasil yang telah dicapai dalam PELITA I, PELITA II, dan
  - PELITA III, juga meletakkan landasan bagi usaha-usaha
  - pembangunan selanjutnya;
  - e. bahwa untuk lebih menjaga kelangsungan jalannya
  - pembangunan, maka saldo-anggaran-lebih dan sisa kredit
  - anggaran proyek-proyek pada anggaran pembangunan Tahun
  - Anggaran 1984/1985 perlu diatur dalam Undang-Undang;
  - 'Mengingat : 1. Pasal 5 ayat (1) jo. Pasal 23 ayat (1) Undang-Undang Dasar 1945;'
  - 2. Ketetapan Majelis Permusyawaratan Rakyat Nomor II/MPR/1983
  - tentang Garis-Garis Besar Haluan Negara;
  - 3. Ketetapan Majelis Permusyawaratan Rakyat Nomor
  - VII/MPR/1983 tentang Pelimpahan Tugas dan Wewenang kepada
  - Presiden/Mandataris Majelis Permusyawaratan Rakyat dalam
  - rangka Pengsuksesan dan Pengamanan Pembangunan Nasional;
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Ayat (2)
  - Masalah kebijaksanaan kredit dan lalu lintas pembayaran luar negeri sebagian
  - besar berada di sektor bukan Pemerintah. Oleh sebab itu penyusunan
  - kebijaksanaan kredit dan devisa dalam bentuk dan arti seperti anggaran rutin
  - dan anggaran pembangunan sukar untuk dilaksanakan, sehingga untuk itu
  - dibuat dalam bentuk prognosa.
  - Ayat (3)
  - Cukup jelas.
  - Ayat (4)
  - Cukup jelas.
  - Ayat (5)
  - Cukup jelas.
  - Pasal 4
  - Cukup jelas.
  - Pasal 5
  - Pasal ini menentukan bahwa jika diperlukan Anggaran Pendapatan dan Belanja
  - Negara Tambahan dan Perubahan, maka pengajuannya kepada Dewan
  - Perwakilan Rakyat dilakukan selambat-lambatnya pada akhir Tahun Anggaran
  - 1984/1985.
  - Pasal 6
  - Perhitungan Anggaran Negara sebagaimana dimaksud dalam pasal ini
  - disampaikan kepada Dewan Perwakilan Rakyat dalam bentuk dan susunan
  - yang ditetapkan oleh Pemerintah dengan persetujuan Badan Pemeriksa
  - Keuangan.
  - Pasal 7
  - Cukup jelas.
  - Pasal 8
  - Cukup jelas.
