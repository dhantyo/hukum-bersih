  - I. UMUM
  - Dalam rangka mendukung terwujudnya tata kelola yang baik dalam
  - penyelenggaraan negara, pengelolaan keuangan negara perlu
  - diselenggarakan secara bertanggung jawab dan terbuka sesuai dengan
  - aturan pokok yang telah ditetapkan dalam Undang-Undang Dasar Negara
  - Republik Indonesia Tahun 1945. Sesuai dengan amanat Pasal 23E
  - Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Undang-
  - Undang Nomor 17 Tahun 2003 tentang Keuangan Negara, dan Undang-
  - Undang Nomor 14 Tahun 2015 tentang Anggaran Pendapatan dan Belanja
  - Negara Tahun Anggaran 2016 sebagaimana telah diubah dengan Undang-
  - Undang Nomor 12 Tahun 2016 tentang Perubahan atas Undang-Undang
  - Nomor 14 Tahun 2015 tentang Anggaran Pendapatan dan Belanja Negara
  - Tahun Anggaran 2016, Pemerintah menyusun pertanggungjawaban atas
  - pelaksanaan Anggaran Pendapatan dan Belanja Negara (APBN) Tahun
  - Anggaran 2016, berupa Laporan Keuangan Pemerintah Pusat (LKPP).
  - Sesuai dengan ketentuan peraturan perundang-undangan, pada
  - tahun 2016 Pemerintah Pusat menyusun dan menyajikan laporan
  - keuangan berdasarkan Standar Akuntansi Pemerintahan (SAP) berbasis
  - 'akrual. LKPP Tahun 2016 terdiri dari: (i) Laporan Realisasi APBN, (ii)'
  - Laporan Perubahan Saldo Anggaran Lebih, (iii) Neraca, (iv) Laporan
  last_page:
  - No.6113
  - dari tahap perencanaan, penganggaran, pelaksanaan, dan
  - pertanggungjawaban atas pelaksanaan anggaran;
  - g. melaksanakan Kewajiban Pelayanan Publik/Public Service
  - Obligation (PSO) angkutan orang dengan kereta api sesuai
  - dengan ketentuan yang berlaku.
  - Pasal 14
  - Cukup jelas.
