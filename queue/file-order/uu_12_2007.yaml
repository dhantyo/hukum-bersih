  - PENJELASAN
  - ATAS
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 12 TAHUN 2007
  - TENTANG
  - PEMBENTUKAN KABUPATEN BANDUNG BARAT
  - DI PROVINSI JAWA BARAT
  - I. UMUM
  - Provinsi Jawa Barat adalah provinsi yang dibentuk berdasarkan
  - Undang-Undang Nomor 11 Tahun 1950 tentang Pembentukan
  - Provinsi Jawa Barat. Provinsi Jawa Barat mempunyai luas +
  - 36.925,05 km2, secara geografis, geopolitik dan ketahanan
  - keamanan, sangat strategis dan memiliki makna penting dalam satu
  - kesatuan sistem pemerintahan di Indonesia dan sistem pemerintahan
  - daerah. Potensi sumber daya nasional di Provinsi Jawa Barat yang
  - tersebar di kabupaten dan kota, memiliki makna dan peran tersendiri
  - terhadap kepentingan pembangunan nasional dan daerah.
  - Kondisi demikian perlu mendapat perhatian pemerintah sejalan
  - dengan kebijakan nasional dalam percepatan pembangunan,
  - terutama di Provinsi Jawa Barat. Oleh karena itu diperlukan
  - peningkatan kemampuan penyelenggaraan pemerintahan daerahnya,
  - khususnya di Kabupaten Bandung melalui pembentukan daerah.
  - Berdasarkan hal tersebut di atas dan memperhatikan aspirasi yang
  - berkembang dalam masyarakat, yang selanjutnya dituangkan secara
  - formal dalam Surat Keputusan DPRD Kabupaten Bandung Nomor 11
  - Tahun 2004 tanggal 20 Agustus 2004 tentang Persetujuan DPRD
  - Kabupaten Bandung terhadap Pembentukan Kabupaten Bandung
  - Barat, Surat Usulan Bupati Bandung Nomor 135/1729/BINPENUM
  - tanggal 23 Agustus 2004 perihal Persetujuan DPRD Kabupaten
  - Bandung Terhadap Pembentukan Kabupaten Bandung Barat, Surat
  - Keputusan DPRD Provinsi Jawa Barat Nomor 135/Kep.DPRD-7/2005
  - tanggal 22 Maret 2005 tentang Persetujuan Terhadap Pembentukan
  - Kabupaten Bandung Barat, Surat Usulan Gubernur Jawa Barat
  - kepada Menteri Dalam Negeri Nomor 135.1/1197/Desen tanggal 11
  - April 2005 perihal Usul Pembentukan Kabupaten Bandung Barat di
  - Provinsi Jawa Barat, Surat Keputusan DPRD Kabupaten Bandung
  - Nomor 07 Tahun 2005 tanggal 21 Maret 2005 tentang Persetujuan
