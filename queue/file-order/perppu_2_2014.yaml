  - PENJELASAN
  - ATAS
  - PERATURAN PEMERINTAH
  - PENGGANTI UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 2 TAHUN 2014
  - TENTANG
  - PERUBAHAN ATAS UNDANG-UNDANG NOMOR 23 TAHUN 2014
  - TENTANG PEMERINTAHAN DAERAH
  - I. UMUM
  - Dengan berlakunya Peraturan Pemerintah Pengganti Undang-Undang
  - Nomor 1 Tahun 2014 tentang Pemilihan Gubernur, Bupati, dan Walikota
  - yang mengatur pemilihan kepala daerah dilakukan secara langsung dan
  - untuk memberikan kepastian hukum dalam pelaksanaan pemilihan
  - kepala daerah yang berlandaskan kedaulatan rakyat dan demokrasi
  - maka perlu dilakukan perubahan terhadap ketentuan mengenai tugas
  - dan wewenang DPRD Provinsi dan DPRD Kabupaten/Kota yang diatur
  - dalam Undang-Undang Nomor 23 Tahun 2014 tentang Pemerintahan
  - Daerah dengan menetapkan Peraturan Pemerintah Pengganti Undang-
  - Undang tentang Perubahan atas Undang-Undang Nomor 23 Tahun 2014
  - tentang Pemerintahan Daerah.
