id: uu_7_1984
title: Undang-Undang Nomor 7 Tahun 1984 tentang Pengesahan Konvensi Mengenai Penghapusan
  Segala Bentuk Diskriminasi Terhadap Wanita (Convention On The Elimination Of All
  Forms Of Discrimination Against Women)
files:
- bpk_file_id: 35789
  filename: UU Nomor 7 Tahun 1984.pdf
  pages: 6
  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 7 TAHUN 1984
  - TENTANG
  - PENGESAHAN KONVENSI MENGENAI PENGHAPUSAN SEGALA BENTUK
  - DISKIRIMINASI TERHADAP WANITA (CONVENTION ON THE ELIMINATION OF
  - ALL FORMS OF DISCRIMANATION AGAINST WOMEN)
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa segala warga negara bersamaan kedudukannya di dalam'
  - hukum dan pemerintahan, sehingga segala bentuk diskriminasi
  - terhadap wanita harus dihapuskan karena tidak sesuai dengan
  - Pancasila dan Undang-Undang Dasar 1945;
  - b. bahwa Majelis Umum Perserikatan Bangsa-Bangsa di dalam
  - sidangnya pada tanggal 18 Desember 1979, telah menyetujui
  - Konvensi mengenai Penghapusan Segala Bentuk Diskriminasi
  - terhadap Wanita (Convention on the Elimination of All Forms of
  - Discrimination Against Women);
  - c. bahwa ketentuan-ketentuan di dalam Konvensi tersebut di atas pada
  - dasarnya tidak bertentangan dengan Pancasila, Undang-Undang
  - Dasar 1945 dan peraturan perundang-undangan Republik Indonesia;
  - d. bahwa Pemerintah Republik Indonesia telah menandatangani
  - Konvensi tersebut pada tanggal 29 Juli 1980 sewaktu diadakan
  - Konperensi Sedunia Dasawarsa Perserikatan Bangsa-Bangsa bagi
  - Wanita di Kopenhagen;
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Dengan pertimbangan tersebut di atas Indonesia mengadakan pensyaratan terhadap
    Pasal
  - 29 ayat (1) Konvensi, hingga dengan demikian Indonesia menyatakan dirinya tidak
    terikat
  - oleh pasal tersebut.
  - Pasal 2
  - Cukup jelas.
  - TAMBAHAN LEMBARAN NEGARA REPUBLIK INDONESIA NOMOR 3277.
