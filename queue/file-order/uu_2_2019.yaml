  filename: UU Nomor 2 Tahun 2019 - salinan Kesepahaman.pdf
  pages: 14
  first_page:
  - REPUBLIK INDONESIA
  - NOTA KESEPAHAMAN
  - ANTARA
  - KEMENTERIAN PERTAHANAN REPUBLIK INDONESIA
  - DAN
  - KEMENTERIAN PERTAHANAN KERAJAAN SPANYOL
  - TENTANG KEGIATAN KERJA SAMA DI BIDANG PERTAHANAN
  - Kementerian Pertahanan Republik Indonesia dan Kementerian Pertahanan
  - Kerajaan Spanyol, selanjutnya disebut sebagai “Para Pihak”;
  - Mempertimbangkan pentingnya memajukan kerja sama pertahanan dalam
  - hubungan bilateral antara kedua negara dan pentingnya kerja sama tersebut
  - dalam pemeliharaan perdamaian dan keamanan internasional;
  - Mengakui adanya kebutuhan untuk memperkuat hubungan persahabatan dan
  - kerja sama teknik yang telah terjalin antara kedua negara yang didasarkan pada
  - penghormatan penuh atas hak kedaulatan dan integritas wilayah dan prinsip-
  - prinsip persamaan, tidak mencampuri urusan dalam negeri dan saling
  - menguntungkan;
  - Meneguhkan kembali komitmen internasional kedua negara terhadap prinsip-
  - prinsip dan norma-norma hukum internasional yang telah diakui secara umum;
  - dan
  - Sesuai dengan hukum dan peraturan perundang-undangan yang berlaku di
  - kedua negara.
  - 'Telah mencapai kesepahaman sebagai berikut:'
  - A. TUJUAN
  - Nota Kesepahaman ini bertujuan untuk membentuk kerangka kerja guna
  - meningkatkan kegiatan kerja sama di bidang hubungan pertahanan dan
  - militer antara Para Pihak dalam lingkup yang menjadi kepentingan bersama
  - berdasarkan prinsip-prinsip saling menghormati, saling percaya dan
  - keuntungan bersama.
