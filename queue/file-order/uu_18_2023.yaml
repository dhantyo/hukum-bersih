  - PRES EN
  - REPLBLIK INDONESIA
  - 1. Menugaskan Perum Bulog untuk melakukan impor daging sapi untuk memenuhi kebutuhan
    konsumsi dan
  - industri pangan, serta Horeka (Hotel, Restoran dan Kantin).
  - 2. Telah dilaksanakan juga beragam kegiatan aksi dalam pengendalian kerawanan
    pangan dan pemantapan
  - 'kewaspadaan pangan dan gizi, seperti: 1) Bantuan pangan untuk masyarakat yang
    mengalami rawan pangan'
  - dan gizi; 2) Penanganan daerah rentan rawan pangan; 3) Komunikasi informasi dan
    edukasi kerawanan
  - pangan; 4) Pencegahan dan kesiapsiagaan rawan pangan dan gizi; 5) Pengawasan pemenuhan
    persyaratan
  - gizi pangan; dan 6) Intervensi kewaspadaan pangan dan gizi.
  - 3. Promosi penganekaragaman konsumsi pangan, pengembangan desa B2SA serta pengembangan
    Dapur
  - B2SA.
  - Rencana ke depan yang akan dilaksanakan Badan Pangan Nasional untuk meningkatkan
    pencapaian kinerja
  - adalah sebagai berikut.
  - 1. Meningkatkan kualitas perencanaan;
  - 2. Meningkatkan kedisiplinan dalam melaksanakan rencana kegiatan;
  - 3. Melakukan akselerasi pelaksanaan program dan kegiatan;
  - 4. Melakukan percepatan pelaksanaan pengadaan barang/jasa;
  - 5. Meningkatkan kualitas belanja melalui peningkatan efisiensi dan efektivitas
    belanja;
  - 6. Meningkatkan kualitas dan kuantitas SDM yang menangani keuangan;
  - 7. Meningkatkan monitoring dan evaluasi.
