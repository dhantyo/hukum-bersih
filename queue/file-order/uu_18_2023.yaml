  - '- 1245 –'
  - Eselon Il. Selain menerapkan balance score card, hal lain yang dilakukan untuk
    mendorong penerapan
  - perencanaan kinerja berorientasi SMART-C adalah menyempurnakan manual IKU secara
    berkala.
  - 5. Menguatkan alignment antara kinerja organisasi dan kinerja individu melalui
    peningkatan keterkaitan
  - dan kesinambungan antara perjanjian kinerja dan sasaran kinerja pegawai. Pada
    2022, Kementerian
  - Koordinator Bidang Perekonomian telah menerapkan Sasaran Kinerja Pegawai sesuai
    dengan
  - Permenpan nomor 6 tahun 2022 tentang Sistem Manajemen Kinerja Pegawai Negeri Sipil.
    Diharapkan
  - penerapan Permenpan ini dapat memperlihatkan kontribusi kinerja individu terhadap
    kinerja
  - organisasi.
  - 6. Meningkatkan efektivitas pelaksanaan dialog kinerja di tingkat kementerian
    ataupun unit organisasi.
  - Dialog kinerja diharapkan tidak hanya menjadi forum pemantauan, tetapi juga menghasilkan
    strategi-
  - strategi perbaikan untuk pencapaian target kinerja yang lebih baik pada tahun
    berjalan.
  - 7. Penguatan perencanaan dan pelaksanaan inisiatif strategis dan rencana aksi.
    Inisiatif strategis dan
  - rencana aksi merupakan media unit kerja untuk dapat mencapai kinerja yang diharapkan.
    Inisiatif
  - strategis dan rencana aksi semestinya harus selaras dengan dokumen TOR.
