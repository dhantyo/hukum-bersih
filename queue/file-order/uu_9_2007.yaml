  - PENJELASAN
  - ATAS
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 9 TAHUN 2007
  - TENTANG
  - PEMBENTUKAN KABUPATEN MINAHASA TENGGARA
  - DI PROVINSI SULAWESI UTARA
  - I. UMUM
  - Provinsi Sulawesi Utara adalah provinsi yang dibentuk berdasarkan
  - Undang-Undang Nomor 13 Tahun 1964 tentang Penetapan Peraturan
  - Pemerintah Pengganti Undang-Undang Nomor 2 Tahun 1964 tentang
  - Pembentukan Daerah Tingkat I Sulawesi Tengah dan Daerah Tingkat
  - I Sulawesi Tenggara dengan Mengubah Undang-Undang Nomor 47
  - Prp 1960 tentang Pembentukan Daerah Tingkat I Sulawesi Utara-
  - Tengah dan Daerah Tingkat I Sulawesi Selatan Tenggara. Provinsi
  - Sulawesi Utara mempunyai luas + 13.930,73 km², secara geografis,
  - geopolitik dan ketahanan keamanan, sangat strategis dan memiliki
  - makna penting dalam satu kesatuan sistem pemerintahan di
  - Indonesia dan sistem pemerintahan daerah. Potensi sumber daya
  - nasional di Provinsi Sulawesi Utara yang tersebar di kabupaten dan
  - kota, memiliki makna dan peran tersendiri terhadap kepentingan
  - pembangunan nasional dan daerah.
  - Kondisi demikian perlu mendapat perhatian pemerintah sejalan
  - dengan kebijakan nasional dalam percepatan pembangunan. Oleh
  - karena itu diperlukan peningkatan kemampuan penyelenggaraan
  - pemerintahan daerahnya, khususnya di Kabupaten Minahasa
  - Selatan melalui pembentukan daerah.
  - Berdasarkan hal tersebut diatas dan memperhatikan aspirasi yang
  - berkembang dalam masyarakat yang selanjutnya dituangkan secara
  - formal dalam Keputusan DPRD Kabupaten Minahasa Selatan Nomor
  - 7 Tahun 2004 tanggal 29 Juni 2004 tentang Persetujuan
  - Pembentukan Daerah Kabupaten Minahasa Tenggara; Surat Bupati
  - Minahasa Selatan Nomor 127/VI/VII-2004 tanggal 1 Juli 2004
  - perihal Usul Pembentukan Kabupaten Minahasa Tenggara di Provinsi
  - Sulawesi Utara; Keputusan DPRD Sulawesi Utara Nomor 6 Tahun
  - 2004 tanggal 19 Agustus 2004 tentang Persetujuan Terhadap
  - Pembentukan Kabupaten Minahasa Tenggara; Surat Gubernur
  - Sulawesi Utara Nomor 135/I/403 tanggal 25 Agustus 2004 perihal
