title: Undang-Undang Nomor 2 Tahun 1994 tentang Tambahan Dan Perubahan Atas Anggaran
  Pendapatan Dan Belanja Negara Tahun Anggaran 1993/94
files:
- bpk_file_id: 34778
  filename: UU Nomor 2 Tahun 1994.pdf
  pages: 8
  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 2 TAHUN 1994
  - TENTANG
  - TAMBAHAN DAN PERUBAHAN ATAS ANGGARAN PENDAPATAN DAN
  - BELANJA NEGARA TAHUN ANGGARAN 1993/94
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa untuk lebih menyesuaikan dan menyempurnakan pelaksanaan'
  - program Pemerintah dalam Tahun Anggaran 1993/94 diperlukan
  - tambahan dan perubahan atas Anggaran Pendapatan dan Belanja
  - Negara Tahun Anggaran 1993/94 sebagaimana dimaksud dalam
  - Undang-undang Nomor 3 Tahun 1993;
  - b. bahwa tambahan dan perubahan dimaksud perlu diatur dengan
  - Undang-undang;
  - 'Mengingat : 1. Pasal 5 ayat (1), Pasal 20 ayat (1), dan Pasal 23 ayat (1)'
  - Undang-undang Dasar 1945;
  - 2. Indische Comptabiliteitswet (Staatsblad Tahun 1925 Nomor 448)
  - sebagaimana telah beberapa kali diubah, terakhir dengan
  - Undang-undang Nomor 9 Tahun 1968 tentang Perubahan Pasal 7
  - Indische Comptabiliteitswet (Lembaran Negara Tahun 1968 Nomor
  - 53, Tambahan Lembaran Negara Nomor 2860);
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Pasal 3
  - Ayat (1)
  - Yang dimaksud dengan sisa kredit anggaran proyek-proyek yang masih
  - diperlukan untuk penyelesaian proyek, meliputi sisa kredit anggaran proyek
  - yang berasal dari pelaksanaan Undang-undang Nomor 3 Tahun 1993 tentang
  - Anggaran Pendapatan dan Belanja Negara Tahun Anggaran 1993/94 maupun
  - sisa kredit anggaran proyek yang berasal dari pelaksanaan Undang-undang ini.
  - Ayat (2)
  - Berdasarkan tambahan dan perubahan sebagaimana dimaksud dalam Pasal 1
  - dan Pasal 2, dalam Tahun Anggaran 1993/94 terdapat sisa anggaran kurang
  - sebesar Rp 1.808.703.000.000,00 (satu triliun delapan ratus delapan miliar
  - tujuh ratus tiga juta rupiah), ditutup dengan sisa anggaran lebih yang terdapat
  - pada rekening Pemerintah di Bank Indonesia.
  - Pasal 4
  - Cukup jelas
  - Pasal 5
  - Cukup jelas
  - TAMBAHAN LEMBARAN NEGARA REPUBLIK INDONESIA NOMOR 3548
