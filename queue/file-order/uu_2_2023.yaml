  - PRESIDEN
  - REPUBUIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 2 TAHUN 2023
  - TENTANG
  - PENGESAHAN PERSETUJUAN ANTARA PEMERINTAH REPUBLIK INDONESIA
  - DAN PEMERINTAH REPUBLIK FIJI TENTANG KERJA SAMA
  - BIDANG PERTAHANAN (AGREEMENT BETWEEN THE GOVERNMENT
  - OF THE REPUBLIC OF INDONESIA AND THE GOVERNMENT
  - OF THE REPUBLIC OF FIJI CONCERNING COOPERATION
  - IN THE FIELD OF DEFENCE)
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang: a. bahwa hubungan luar negeri yang dilandasi politik bebas'
  - aktif merupakan salah satu perwujudan dari tujuan
  - Pemerintah Negara Kesatuan Republik Indonesia
  - sebagaimana tercantum dalam alinea keempat
  - Pembukaan Undang-Undang Dasar Negara Republik
  - Indonesia Tahun 1945, yaitu melindungi segenap bangsa
  - Indonesia dan seluruh tumpah darah Indonesia dan
  - untuk memajukan kesejahteraan umum, mencerdaskan
  - kehidupan bangsa dan ikut melaksanakan ketertiban
  - dunia yang berdasarkan kemerdekaan, perdamaian abadi
  - dan keadilan sosial;
  - b. bahwa untuk meningkatkan kerja sama di bidang
  - pertahanan, Pemerintah Republik Indonesia dan
  - Pemerintah Republik Fiji telah menandatangani
  - Persetujuan antara Pemerintah Republik Indonesia dan
  - Pemerintah Republik Fiji tentang Kerja Sama Bidang
  - Pertahanan (Agreement between the Government of the
  - Republic of Indonesia and the Government of the Republic
  - of Fiji concerning Cooperation in the Field of Defence) pada
  - tanggal 29 September 2017 di Jakarta, Indonesia;
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - 'Materi muatan dalam Persetujuan antara lain:'
  - '1. Ruang lingkup kerja sama mencakup:'
  - a. pertukaran kunjungan antarbadan pertahanan dan angkatan
  - bersenjata;
  - b. dialog dan konsultasi bilateral secara berkala mengenai isu
  - pertahanan dan militer strategis yang menjadi perhatian
  - bersama;
  - c. peningkatan kapasitas dalam bidang pertahanan dan militer
  - para Pihak, antara lain melalui seminar, lokakarya, program
  - pelatihan, dan pendidikan;
  - d. pertukaran intelijen militer;
  - e. peningkatan kerja sama dalam bidang industri pertahanan,
  - antara lain alih teknologi, penelitian bersama, produksi dan
  - pemasaran bersama, serta penjaminan mutu bersama; dan
  - f. bidang lain yang disepakati bersama;
  - 2. para pejabat berwenang yang dipercayakan untuk melaksanakan
  - Persetujuan;
  - 3. kerahasiaan yang meliputi pelindungan, pengungkapan, dan
  - pengiriman informasi rahasia sesuai dengan hukum dan peraturan
  - nasional masing-masing Pihak;
  - 4. pelindungan hak kekayaan intelektual yang timbul dari
  - pelaksanaan Persetujuan;
  - 5. pengaturan keuangan para Pihak;
  - 6. penyelesaian perselisihan yang timbul dari Persetujuan;
  - 7. amendemen berdasarkan persetujuan bersama para Pihak; dan
  - 8. ketentuan mengenai pemberlakuan, jangka waktu, dan
  - penghentian Persetujuan.
  - II. PASAL DEMI PASAL
  - Pasal 1
  - Cukup jelas.
  - Pasal 2
