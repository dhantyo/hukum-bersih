  pages: 8
  first_page:
  - REPUBLIK INDONESIA
  - PERSETUJUAN
  - ANTARA
  - PEMERINTAH REPUBLIK INDONESIA
  - DAN
  - PEMERINTAH REPUBLIK FIJI
  - TENTANG
  - KERJA SAMA BIDANG PERTAHANAN
  - Pemerintah Republik Indonesia dan Pemerintah Republik Fiji selanjutnya disebut
  - sebagai “Para Pihak”;
  - Berkeinginan untuk meningkatkan dan menguatkan hubungan bilateral yang telah
  - terjalin antara kedua negara melalui kegiatan-kegiatan kerja sama bidang
  - pertahanan berdasarkan prinsip-prinsip kesetaraan, saling percaya, dan
  - kesepahaman;
  - Mengakui bahwa penguatan kerja sama pertahanan akan bermanfaat bagi institusi
  - nasional masing-masing bidang pertahanan;
  - Berdasarkan hukum dan peraturan yang berlaku di masing-masing negara;
  - Telah menyetujui hal-hal sebagai berikut.
  - PASAL 1
  - TUJUAN
  - Tujuan dari Persetujuan ini adalah untuk menetapkan kerangka kerja umum dalam;
  - rangka meningkatkan kerja sama bilateral bidang pertahanan yang menjadi
  - kepentingan bersama Para Pihak berdasarkan prinsip-prinsip kesetaraan, saling
  - menguntungkan, dan menghormati penuh atas kedaulatan dan integritas wilayah.
  - PASAL 2
  - RUANG LINGKUP KERJA SAMA
  - 'Ruang lingkup kerja sama dalam Persetujuan ini mencakup:'
  - 1. Pertukaran kunjungan antarbadan Pertahanan dan Angkatan Bersenjata;
