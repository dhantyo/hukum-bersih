  first_page:
  - UNDANG-UNDANG REPUBLIK INDONESIA (UU)
  - NOMOR 23 TAHUN 1968 (23/1968)
  - TENTANG
  - PENETAPAN PERATURAN PEMERINTAH PENGGANTI UNDANG-UNDANG
  - NOMOR 1 TAHUN 1968 (LEMBARAN-NEGARA TAHUN 1968 NOMOR 49,
  - TAMBAHAN LEMBARAN NEGARA NOMOR 2858) TANDA
  - KEHORMATAN BINTANG KARTIKA EKA PAKCI
  - MENDJADI UNDANG-UNDANG
  - DENGAN RACHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang :'
  - a. bahwa untuk menghargai kesetiaan, kemampuan, kebijaksanaan dan
  - jasa-jasa luar biasa serta melebihi panggilan kewajiban dibidang tugas
  - kemiliteran untuk kepentingan Negara, Nusa dan Bangsa, baik yang
  - ditunjuk oleh Angkatan Darat khususnya, maupun oleh Warga Negara
  - Republik Indonesia bukan Anggota Angkatan Darat pada umumnya,
  - perlu diadakan suatu peraturan tentang Tanda Kehormatan ;
  - b. bahwa Tanda Kehormatan. tersebut akan merupakan suatu dorongan
  - untuk membangkitkan dan memupuk sifat-sifat keprajuritan serta
  - kesadaran berbakti dari tiap-tiap Anggota Angkatan Darat maupun
  - Warga Negara Republik Indonesian bukan Anggota Angkatan Darat
  - dalam membela dan mengabdi kepada Negara, Nusa dan Bangsa;
  - C. bahwa Peraturan Pemerintah Pengganti Undang-undang Nomor 1 tahun
  - 1968 (Lembaran-Negara tahun 1968 Nomor 49, Tambahan Lembaran-
  - Negara Nomor 2858 ) tentang Tanda Kehormatan Bintang Kartika Eka
  - Pakci yang dikeluarkan atas Pasal 22 ayat (1) Undang-undang Dasar
  - 1945, perlu ditetapkan menjadi Undang-undang.
  - 'Mengingat :'
  - 1. Pasal 5 ayat (1) jis. Pasal 22 ayat (2) dan Pasal 15 Undang- undang
  - Dasar 1945 ;
  - 2. Undang-undang Nomor 4 Drt, tahun 1959 ( Lembaran-Negara tahun
  - 1959 Nomor 44) tentang Ketentuan-ketentuan Umum Tanda-tanda
  - Kehormatan;
  - 3. Undang-undang Nomor 70 tahun 1958 (Lembaran-Negara tahun 1958
  - Nomor 124) tentang Tanda-tanda Penghargaan untuk Anggota
  - 'Angkatan Perang:'
  - Dengan persetujuan Dewan Perwakilan Rakyat Gotong Royong.
  - 'MEMUTUSKAN :'
  - 'Menetapkan : UNDANG-UNDANG REPUBLIK INDONESIA TENTANG PONETAPAN'
  - PERATURAN PEMERINTAH PENGGANTI UNDANG-UNDANG
  - NOMOR 1 TAHUN 1968 (LEMBARAN-NEGARA TAHUN 1968
  - NOMOR 49, TAMBAHAN LEMBARAN-NEGARA NOMOR 2858)
  last_page:
  - (4) Ketentuan ini ada hubungannya dengan Pasal 2 ayat (1). Ini
  - dimaksudkan, bahwa pemberian anugerah Bintang Kartika Eka
  - Pakci, terbuka kemungkinan secara ulangan dalam kelas yang
  - sama, dan tidak menghilangkan hak atas penganugerahan
  - Bintang dengan kelas yang lebih tinggi/lebih rendah.
  - Begitupun yang telah memperoleh Bintang dengan kelas
  - yang lebih tinggi dapat diberi anugerah Bintang dengan kelas
  - yang lebih rendah.
  - Pemenuhan syarat tersebut dalam Pasal-pasal 3,4 dan
  - 15 ayat (1) dengan ketentuan bahwa tindakan-tindakan prestasi
  - atau tugasnya untuk mana diberikan anugerah, tidak ada
  - hubungannya, sangkut-pautnya ataupun merupakan kelanjutan
  - dari tindakan, prestasi atau tugasnya yang telah mendapat
  - suatu anugerah.
  - Hal ini berdasarkan pendirian bahwa suatu tindakan,
  - atau prestasi/jasa yang sama tidak dapat dihargai dua kali atau
  - lebih.
