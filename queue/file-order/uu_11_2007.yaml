  first_page:
  - PENJELASAN
  - ATAS
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 11 TAHUN 2007
  - TENTANG
  - PEMBENTUKAN KABUPATEN GORONTALO UTARA
  - DI PROVINSI GORONTALO
  - I. UMUM
  - Provinsi Gorontalo adalah provinsi sebagaimana dimaksud dalam
  - Undang-Undang Nomor 38 Tahun 2000 tentang Pembentukan
  - Provinsi Gorontalo, mempunyai luas wilayah ± 12.125,44 km2.
  - Provinsi Gorontalo terletak di wilayah Republik Indonesia sebelah
  - timur, secara geografis, geopolitik dan ketahanan keamanan, sangat
  - strategis dan memiliki makna penting dalam satu kesatuan sistem
  - pemerintahan di Indonesia dan sistem pemerintahan daerah. Potensi
  - sumber daya nasional di Provinsi Gorontalo yang tersebar di
  - kabupaten dan kota, memiliki makna dan peran tersendiri terhadap
  - kepentingan pembangunan nasional dan daerah.
  - Kondisi demikian perlu mendapat perhatian Pemerintah sejalan
  - dengan kebijakan nasional dalam percepatan pembangunan kawasan
  - Indonesia timur, terutama di Provinsi Gorontalo. Oleh karena itu
  - diperlukan peningkatan kemampuan penyelenggaraan pemerintahan
  - daerahnya, khususnya di Kabupaten Gorontalo melalui pembentukan
  - daerah.
  - Berdasarkan hal tersebut di atas dan memperhatikan aspirasi yang
  - berkembang dalam masyarakat, yang selanjutnya dituangkan secara
  - formal dalam SK Persetujuan DPRD Kabupaten Gorontalo Nomor 4
  - Tahun 2004 tanggal 3 Pebruari 2004 tentang Rekomendasi Sikap
  - Mendukung Pembentukan Kabupaten Gorontalo Utara, Surat Usulan
  - Bupati Gorontalo Nomor 125/01/376/2004 tanggal 24 Pebruari 2004
  - perihal Usulan Pembentukan Kabupaten Gorontalo Utara, SK
  - Persetujuan DPRD Provinsi Gorontalo Nomor 01 Tahun 2004 tanggal
  - 25 Pebruari 2004 tentang Persetujuan Pembentukan Kabupaten
  - Gorontalo Utara, Surat Usulan Gubernur Gorontalo kepada Menteri
  - Dalam Negeri Nomor 135/Pem/389/2004 tanggal 25 Pebruari 2004
  - perihal Usulan Pembentukan Kabupaten Gorontalo Utara, SK. DPRD
