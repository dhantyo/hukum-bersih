  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 1 TAHUN 1979
  - DAFTAR KEJAHATAN YANG PELAKUNYA DAPAT DIEKSTRADISIKAN
  - 1. Pembunuhan.
  - 2. Pembunuhan yang direncanakan.
  - 3. Penganiayaan yang berakibat luka-luka berat atau matinya orang, penganiayaan
  - yang direncanakan dan penganiayaan berat.
  - 4. Perkosaan, perbuatan cabul dengan kekerasan.
  - 5. Persetubuhan dengan seorang wanita di luar perkawinan atau perbuatan-perbuatan
  - cabul dengan seseorang padahal diketahui, bahwa orang itu pingsan atau tak
  - berdaya atau orang itu belum berumur 15 tahun atau belum mampu dikawin.
  - 6. Perbuatan cabul yang dilakukan oleh orang yang cukup umur dengan orang lain
  - sama kelamin yang belum cukup umur.
  - 7. Memberikan atau mempergunakan obat-obat dan atau alat-alat dengan maksud
  - menyebabkan gugur atau mati kandungan seorang wanita.
  - 8. Melarikan wanita dengan kekerasan, ancaman kekerasan atau tipu muslihat, dengan
  - sengaja melarikan seseorang yang belum cukup umur.
  - 9. Perdagangan wanita dan perdagangan anak laki-laki yang belum cukup umur.
  - 10. Penculikan dan penahanan melawan hukum.
  - 11. Perbudakan.
  - 12. Pemerasan dan pengancaman.
  - 13. Meniru atau memalsukan mata uang atau uang kertas negeri atau uang kertas
    bank
  - atau mengedarkan mata uang kertas negeri atau kertas bank yang ditiru atau
  - dipalsukan.
  - 14. Menyimpan atau memasukkan uang ke Indonesia yang telah ditiru atau dipalsukan.
  - 15. Pemalsuan dan kejahatan yang bersangkutan dengan pemalsuan.
  - 16. Sumpah palsu.
  - 17. Penipuan.
  - 18. Tindak pidana-tindak pidana berhubung dengan kebangkrutan. 19. Penggelapan.
  - 20. Pencurian, perampokan.
  - 21. Pembakaran dengan sengaja.
  - 22. Pengrusakan barang atau bangunan dengan sengaja.
  - 23. Penyelundupan.
  - 24. Setiap tindak kesengajaan yang dilakukan dengan maksud membahayakan
  - keselamatan kereta api, kapal laut atau kapal terbang dengan penumpang-
  - penumpangnya.
  - 25. Menenggelamkan atau merusak kapal di tengah laut.
  - 26. Penganiayaan di atas kapal di tengah laut dengan maksud menghilangkan nyawa
  - atau menyebabkan luka berat.
  - 27. Pemberontakan atau permufakatan untuk memberontak oleh 2 (dua) orang atau
  - lebih di atas kapal di tengah laut menentang kuasa nakhoda, penghasutan untuk
  - memberontak.
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - 28. Pembajakan laut.
  - 29. Pembajakan udara, kejahatan penerbangan dan kejahatan terhadap sarana/prasarana
  - penerbangan.
  - 30. Tindak Pidana Korupsi.
  - 31. Tindak Pidana Narkotika dan obat-obat berbahaya lainnya.
  - 32. Perbuatan-perbuatan yang melanggar Undang-undang Senjata Api, bahan-bahan
  - peledak dan bahan-bahan yang menimbulkan kebakaran.
