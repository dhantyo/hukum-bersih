  first_page:
  - PERJANJIAN
  - ANTARA
  - REPUBLIK INDONESIA DAN REPUBLIK KOREA
  - TENTANG
  - BANTUAN HUKUM TIMBAL BALIK DALAM MASALAH PIDANA
  - Republik Indonesia dan Republik Korea (dalam hal ini disebut sebagai
  - “Para Pihak”);
  - BERHASRAT untuk meningkatkan kerjasama yang efektif kedua negara
  - dalam pencegahan penyidikan, penuntutan dan penanggulangan kejahatan
  - melalui bantuan hukum timbal balik dalam masalah pidana;
  - 'TELAH MENYETUJUI hal-hal sebagai berikut :'
  - Pasal 1
  - RUANG LINGKUP PENERAPAN PERJANJIAN
  - 1. Para Pihak, berdasarkan ketentuan Perjanjian ini, saling memberikan
  - bantuan dalam maslah pidana.
  - 2. Yang dimaksud oleh Perjanjian ini, masalah pidana adalah penyidikan,
  - penuntutan atau proses acara yang berkaitan dengan setiap kejahatan
  - yang dapat dihukum pada saat permintaan bantuan diajukan, berdasarkan
  - juridiksi pihak yang berwenang di Pihak Peminta.
  - 3. Masalah pidana meliputi juga masalah mengenai kejahatan terhadap
  - hukum yang berkaitan dengan pajak, kepabeanan, pengawasan
  - pertukaran mata uang atau masalah penghasilan lainnya, tetapi tidak
  - meliputi masalah yang tidak ada hubungannya dengan proses acara
  - tersebut.
  last_page:
  - 2. Perjanjian ini akan berlaku untuk Perjanjian yang dilakukan baik
  - sebelum dan setelah tanggal mulai berlakunya Perjanjian ini.
  - 3. Salah satu Pihak dapat mengakhiri Perjanjian ini setiap saat melalui
  - pemberitahuan tertulis. Pengakhiran akan mulai berlaku enam (6)
  - bulan setelah tanggal pemberitahuan.
  - 4. Pengakhiran Perjanjian ini tidak akan mempengaruhi penyelesaian
  - dari setiap kegiatan yang sedang berjalan yang disetujui Para Pihak
  - berdasarkan Perjanjian ini.
  - SEBAGAI BUKTI, yang bertandatangan dibawah ini, yang diberi kuasa
  - oleh Pemerintah masing-masing telah menandatangani Perjanjian ini.
  - DIBUAT dalam rangkap dua diSeou.. pada tanggal.0. %.
  - pada tahun dua ribu dua, dalam bahasa Indonesia, bahasa Korea, dan bahasa
  - Inggris, semua naskah mempunyai kekuatan yang sama.
  - Dalam hal terjadi perbedaan penafsiran, naskah dalam bahasa Inggris akan
  - diberlakukan.
  - UNTUK REPUBLIK INDONESIA UNTUK REPUBLIK KOREA
