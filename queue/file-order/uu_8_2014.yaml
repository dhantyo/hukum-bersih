  - 인도네시아공화국과 대한민국간의
  - 형사사법공조조약
  - 인도네시아공화국과 대한민국(이하 “당사국”이라 한다)은,
  - 형사사건에서의 협조 및 공조를 통하여 양국이 범죄의 예방·수사·기소 및
  - 진압에 있어서의 효율성을 증진하기를 희망하여,
  - 다음과 같이 합의하였다.
  - 제 1 조
  - 적용범위
  - 1. 당사국은 이 조약의 규정에 따라 형사사건에서 상호공조를 제공한다.
  - 2. 이 조약의 목적상, “형사사건”이라 함은 공조요청시에 그 처벌이 요청국의
  - 권한있는 당국의 관할권에 속하는 범죄에 대한 수사·기소 또는 재판절차를ᄆ
  - 한다.
  - 3. 형사사전은 조세·관세·외국환관리 또는 그 밖의 재정문제에 관한 빕에
  - 위배되는 범ᆸ죄에 관련된 사건을 포함하나, 이에 관한 비형사 재판절차는 그러하
  - 지 아니하다.
  - 4. 공조는 다음을 포함한다.
  - 가. 관계인으로부터의 증거·진술의 취득
  - 나. 정보·서류·기록 및 증거물의 제공
  - 다. 사람이나 물건의 소재 또는 동일성의 확인
  - 라. 서류의 송달
  last_page:
