  - TREATY
  - BETWEEN
  - THE REPUBLIC OF INDONESIA AND:THE REPUBLIC OF KOREA
  - 'ON'
  - MUTUAL LEGAL ASSISTANCE IN CRIMINAL MATTERS
  - as "the Parties"); The Republic of Indonesia and the Republic of Korea (hereinafter
    referred to
  - investigation, prosecution and suppression of erime through cooperation and DFSIRING
    to improve the effectiveness of both countries in the prevention,
  - mutual assistance in criminal matters;
  - 'HAVE AGREED as follows:'
  - Article 1
  - SCOPE OF-APPLICATION
  - 1. The Parties shall, in accordance-with the provisions of this Treaty,
  - grant each other assistance in criminal matters.
  - 2. For the purposes of this Treaty3 criminal matters mean investigations,
  - prosecutions or proceedings relating to any offence the punishment of
  - which at the time of the request. for assistance, falls within the
  - jurisdiction of the competent authorities.of the Requesting Party.
  - 3. Criminal matters also include matters connected with offences against
  - a law related to taxation, customs duties, foreign exchange control or
  - other revenue matters, but not-connection with non-criminal
  - proceedings relating thereto.
  - '4. Assistance shall include:'
  - (a) taking evidence or statements from persons;
  - (b) providing information, documents, records and articles of
  - evidence;
  - (c) locating or identifying persons or items;
  - (d) serving documents;
  - (e) executing requests for seareh and seizure;
  - '1:'
