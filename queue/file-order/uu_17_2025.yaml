  - TAHUN ANGGARAN 2026
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa Anggaran Pendapatan dan Belanja Negara'
  - memegang peranan penting untuk menopang sendi-
  - sendi kehidupan bernegara dan penyelenggaraan
  - pemerintahan, sehingga harus dilaksanakan secara
  - efisien, efektif, akuntabel, dan transparan guna
  - mewujudkan kesejahteraan rakyat sesuai dengan cita-
  - cita dan mandat yang tercantum dalam Undang-
  - Undang Dasar Negara Republik Indonesia Tahun 1945;
  - b. bahwa untuk mewujudkan cita-cita dan mandat
  - sebagaimana dimaksud dalam huruf a, dan seiring
  - dengan meningkatnya tantangan baik yang berasal
  - dari dalam negeri maupun faktor eksternal yang masih
  - terus berlangsung, Anggaran Pendapatan dan Belanja
  - Negara melalui pelaksanaan tiga fungsi utamanya
  - yaitu alokasi, distribusi, dan stabilisasi bertujuan
  - mewujudkan sekurang-kurangnya kebutuhan dasar
  - masyarakat dan layanan dasar termasuk namun tidak
  - terbatas pada bidang pendidikan, kesehatan,
  - perlindungan sosial, ketahanan pangan, ketahanan
  - energi, dan pertahanan semesta;
  - c. bahwa untuk mewujudkan Anggaran Pendapatan dan
  - Belanja Negara yang memenuhi kebutuhan dasar
  - masyarakat dan layanan dasar sebagaimana dimaksud
  - dalam huruf b, Anggaran Pendapatan dan Belanja
  - Negara tahun anggaran 2026 dirancang agar
  - memberikan fleksibilitas bagi Pemerintah untuk
  - melakukan pergeseran anggaran baik belanja
  - Pemerintah Pusat maupun Transfer ke Daerah, dan
  - pembiayaan investasi, untuk mendukung program
  - prioritas Pemerintah yang ditujukan untuk
  - pemenuhan kebutuhan masyarakat, dengan tetap
  - menjaga tata kelola dan prinsip-prinsip pengelolaan
  - keuangan negara yang baik;
