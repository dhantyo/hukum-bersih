  - I. UMUM
  - Dalam rangka mendukung terwujudnya tata kelola yang baik
  - dalam penyelenggaraan negara, pengelolaan keuangan negara perlu
  - diselenggarakan secara terbuka dan bertanggung jawab sesuai
  - dengan aturan pokok yang telah ditetapkan dalam Undang-Undang
  - Dasar Negara Republik Indonesia Tahun 1945. Sesuai dengan
  - amanat Pasal 23E Undang-Undang Dasar Negara Republik Indonesia
  - Tahun 1945, Undang-Undang Nomor 17 Tahun 2003 tentang
  - Keuangan Negara, dan Undang-Undang Nomor 23 Tahun 2013
  - tentang Anggaran Pendapatan dan Belanja Negara Tahun Anggaran
  - 2014 sebagaimana telah diubah dengan Undang-Undang Nomor 12
  - Tahun 2014, Pemerintah menyusun pertanggungjawaban atas
  - pelaksanaan Anggaran Pendapatan dan Belanja (APBN) Tahun
  - Anggaran 2014, berupa Laporan Keuangan Pemerintah Pusat (LKPP)
  - 'yang terdiri atas: (i) Laporan Realisasi APBN, (ii) Neraca, (iii) Laporan'
  - Arus Kas, dan (iv) Catatan atas Laporan Keuangan.
  - Laporan Realisasi APBN menggambarkan perbandingan antara
  - anggaran dan realisasi APBN Tahun Anggaran 2014, yang mencakup
  - unsur-unsur pendapatan, belanja, dan pembiayaan. Neraca adalah
  - laporan yang menggambarkan posisi keuangan Pemerintah Pusat
  - mengenai aset, kewajiban, dan ekuitas dana pada tanggal 31
  - Desember 2014. Laporan Arus Kas adalah laporan yang menyajikan
  last_page:
  - No.5741
  - g. menyebarluaskan informasi LKPP kepada masyarakat
  - dalam rangka peningkatan pemahaman terhadap
  - pengelolaan keuangan Pemerintah Pusat dan
  - peningkatan penggunaan informasi LKPP.
  - h. mengambil langkah-langkah yang terstruktur dalam
  - rangka penyajian informasi Sumber Daya Alam (SDA).
