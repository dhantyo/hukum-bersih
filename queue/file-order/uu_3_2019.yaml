  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa hubungan luar negeri yang dilandasi politik bebas'
  - aktif merupakan salah satu perwujudan dari tujuan
  - Pemerintah Negara Kesatuan Republik Indonesia untuk
  - melindungi segenap bangsa dan seluruh tumpah darah
  - Indonesia, memajukan kesejahteraan umum,
  - mencerdaskan kehidupan bangsa dan ikut melaksanakan
  - ketertiban dunia yang berdasarkan kemerdekaan,
  - perdamaian abadi, dan keadilan sosial;
  - b. bahwa untuk meningkatkan kerja sama di bidang
  - pertahanan antara Pemerintah Republik Indonesia
  - dan Pemerintah Republik Serbia, pada tanggal
  - 13 September 2011 di Jakarta, Indonesia telah
  - ditandatangani Nota Kesepahaman antara Pemerintah
  - Republik Indonesia dan Pemerintah Republik Serbia
  - tentang Kerja Sama di Bidang Pertahanan (Memorandum of
  - Understanding between the Government of the Republic of
  - Indonesia and the Government of the Republic of Serbia on
  - Cooperation in the Field of Defence);
  - c. bahwa sesuai dengan ketentuan Pasal 10 Undang-Undang
  - Nomor 24 Tahun 2000 tentang Perjanjian Internasional,
  - pengesahan perjanjian internasional berkenaan dengan
  - pertahanan dilakukan dengan Undang-Undang;
