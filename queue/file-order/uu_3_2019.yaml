  - DAN
  - PEMERINTAH REPUBLIK SERBIA
  - TENTANG
  - KERJA SAMA DI BIDANG PERTAHANAN
  - Pemerintah Republik Indonesia dan Pemerintah Republik Serbia (selanjutnya disebut
  - sebagai "Pihak"),
  - Mengingat hubungan persahabatan dan kerja sama yang ada antara dua Negara,
  - Pemerintah, dan Masyarakat;
  - Berkeinginan untuk meningkatkan dan memperkuat hubungan bilateral yang telah
  - terjalin antara kedua negara melalui kegiatan kerja sama di bidang pertahanan;
  - Dengan mempertimbangkan tujuan dan prinsip-prinsip Piagam Perserikatan
  - 'Bangsa Bangsa untuk memberikan kontribusi bagi perdamaian dan keamanan dunia:'
  - Bertindak dalam semangat kemitraan dan kerja sama dengan ingin
  - mengembangkan hubungan baik di bidang pertahanan, dalam rangka untuk saling
  - menghargai, meningkatkan kepercayaan diri, dan saling pengertian.
  - Menyadari bahwa memperkuat kerja sama di bidang pertahanan akan
  - menguntungkan bagi pertahanan nasional kedua negara, khususnya Angkatan
  - Bersenjata;
  - Sesuai dengan hukum dan peraturan perundang-undangan yang berlaku di masing.
  - masing negara.
