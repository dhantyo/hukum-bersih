  - PEKERJA SOSIAL
  - I. UMUM
  - Penyelenggaraan kesejahteraan sosial merupakan bagian integral dari
  - pembangunan nasional sebagai perwujudan dari upaya mencapai tujuan
  - bangsa yang diamanatkan dalam Undang-Undang Dasar Negara Republik
  - Indonesia Tahun 1945 dan perwujudan nilai Pancasila. Penyelenggaraan
  - kesejahteraan sosial salah satunya ditujukan untuk mengatasi berbagai
  - masalah kesejahteraan sosial yang dihadapi individu, keluarga, kelompok,
  - dan masyarakat agar mampu meningkatkan kualitas dan standar
  - kehidupannya secara adil dan merata.
  - Penyelenggaraan kesejahteraan sosial yang dilakukan selama ini oleh
  - Pemerintah belum sepenuhnya mampu mengatasi permasalahan sosial di
  - masyarakat. Selain itu, adanya perubahan sosial di masyarakat
  - berdampak pada meningkatnya masalah sosial dan disertai dengan
  - munculnya masalah sosial baru. Masalah sosial yang dialami atau
  - dihadapi selama ini oleh individu, keluarga, kelompok, dan masyarakat
  - belum diberikan pelayanan yang sesuai dengan standar Praktik Pekerjaan
  - Sosial serta ketersediaan Pekerja Sosial yang tidak sebanding dengan
  - jumlah Klien.
  - Pada saat ini belum ada peraturan perundang-undangan yang
  - mengatur tentang Pekerja Sosial. Pengaturan Pekerja Sosial sangat
  - diperlukan sebagai pedoman formal (legalitas) bagi Pekerja Sosial dalam
  - melaksanakan praktiknya di Indonesia. Selain itu, Pekerja Sosial sebagai
  - salah satu komponen utama penyelenggara kesejahteraan sosial kepada
