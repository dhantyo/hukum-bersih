  first_page:
  - PENJELASAN
  - ATAS
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 8 TAHUN 2007
  - TENTANG
  - PEMBENTUKAN KOTA SUBULUSSALAM
  - DI PROVINSI NANGGROE ACEH DARUSSALAM
  - I. UMUM
  - Provinsi Nanggroe Aceh Darussalam dibentuk berdasarkan dalam
  - Undang-Undang Nomor 24 Tahun 1956 tentang Pembentukan
  - Daerah Otonom Provinsi Aceh dan Perubahan Pembentukan Provinsi
  - Sumatera Utara dan Undang-Undang Nomor 11 Tahun 2006 tentang
  - Pemerintahan Aceh. Provinsi Nanggroe Aceh Darussalam mempunyai
  - luas wilayah ± 56500,51 km2, secara geografis, geopolitik, dan
  - ketahanan keamanan, Provinsi Nanggroe Aceh Darussalam sangat
  - strategis dan memiliki makna penting dalam satu kesatuan sistem
  - pemerintahan di Indonesia dan sistem pemerintahan daerah. Potensi
  - sumber daya nasional di Provinsi Nanggroe Aceh Darussalam yang
  - tersebar di kabupaten dan kota, memiliki makna dan peran tersendiri
  - terhadap kepentingan nasional dan daerah.
  - Berdasarkan hal tersebut di atas dan memperhatikan aspirasi yang
  - berkembang dalam masyarakat, yang selanjutnya dituangkan secara
  - formal dalam SK Persetujuan DPRD Kabupaten Aceh Singkil Nomor
  - 13/KPTS/DPRD/2002 tanggal 30 Desember 2002 tentang
  - Persetujuan Pembentukan Pemerintah Kota Subulussalam, Surat
  - Usulan Bupati Aceh Singkil Nomor 146.1/009/2003 tanggal 4
  - Januari 2003 perihal Usulan Pembentukan Kota Subulussalam, SK
  - Persetujuan Provinsi NAD Nomor 100/2.524/2003 tanggal 7
  - November 2003 (Surat Ketua DPRD) tentang Pembentukan
  - Pemerintahan Kota Subulussalam, Surat Usulan Gubernur NAD
  - kepada Menteri Dalam Negeri 135/135/20285 tanggal 16 Agustus
  - 2004 perihal Usul Pembentukan Kota Subulussalam dan SK DPRD
  - Kabupaten Aceh Singkil Nomor 16/KPTS/DPRD/2002 tanggal 30
  - Desember 2002 tentang Penetapan Ibu Kota Calon Kota
  - Subulussalam.
  - Kabupaten Aceh Singkil mempunya luas wilayah ± 3.576,00 km2,
  - dimekarkan menjadi 2 (dua) daerah otonom yang terdiri dari
  - Kabupaten Aceh Singkil sebagai kabupaten induk, dan Kota
  - Subulussalam sebagai kota pemekaran.
