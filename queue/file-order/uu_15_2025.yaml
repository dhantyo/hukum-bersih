  - e. Masih terdapat kelompok kerja yang memiliki awareness dan sense of
  - belonging yang rendah terhadap upaya pencapaian indikator kegiatan
  - utama maupun indikator reformasi birokrasi tematik.
  - Oleh karena itu, BNN terus berupaya meningkatkan kualitas
  - 'pelaksanaan Reformasi Birokrasi melalui upaya-upaya sebagai berikut:'
  - 1. melakukan penyesuaian target indikator kegiatan utama dengan
  - memperhatikan target nasional dan capaian tahun sebelumnya;
  - 2. memastikan rencana aksi setiap kegiatan utama merupakan solusi
  - atau pemecahan masalah tata kelola yang terkait dengan isu dan
  - permasalahan BNN, mampu menjawab rekomendasi hasil penilaian
  - eksternal, dan bukan rencana aksi yang bersifat pemenuhan
  - administrasi;
  - 3. memastikan ketersediaan sumber daya yang menunjang pelaksanaan
  - rencana aksi Reformasi Birokrasi General maupun Tematik dengan
  - tetap menyelaraskan dengan dokumen perencanaan, baik jangka
  - menengah maupun jangka pendek; dan
  - 4. melakukan penguatan terhadap kelompok kerja untuk meningkatkan
  - awareness dan pemahaman pencapaian indikator dari kegiatan utama,
  - agar penilaian dari K/L masih dapat berjalan dengan baik.
  - PRESIDEN REPUBLIK INDONESIA,
