  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang: a. bahwa untuk mewujudkan pengelolaan keuangan negara'
  - yang dilaksanakan secara terbuka dan bertanggung jawab
  - untuk sebesar-besarnya kemakmuran rakyat, telah
  - dibentuk Undang-Undang Nomor 19 Tahun 2023 tentang
  - Anggaran Pendapatan dan Belanja Negara Tahun
  - Anggaran 2024;
  - b. bahwa untuk melaksanakan ketentuan Pasal 3 ayat (2)
  - Undang-Undang Nomor 17 Tahun 2003 tentang Keuangan
  - Negara dan ketentuan Pasal 41 Undang-Undang Nomor
  - 19 Tahun 2023 tentang Anggaran Pendapatan dan Belanja
  - Negara Tahun Anggaran 2024, perlu dilakukan
  - pertanggungjawaban atas pelaksanaan Anggaran
  - Pendapatan dan Belanja Negara Tahun Anggaran 2024;
  - c. bahwa berdasarkan pertimbangan sebagaimana
  - dimaksud dalam huruf a dan huruf b, perlu membentuk
  - Undang-Undang tentang Pertanggungjawaban atas
  - Pelaksanaan Anggaran Pendapatan dan Belanja Negara
  - Tahun Anggaran 2024;
  - 'Mengingat : 1. Pasal 5 ayat (1), Pasal 20, Pasal 23 ayat (1) dan Pasal 23E'
  - Undang-Undang Dasar Negara Republik Indonesia Tahun
  - 1945;
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - j. menetapkan ukuran dan indikator keberhasilan pelaksanaan
  - belanja K/L dalam rangka spending better belanja Negara yang
  - lebih akurat, melalui penguatan dan penajaman kerangka kerja
  - logis setiap program di K/L, agar memiliki dampak (outcome) dan
  - prestasi kerja yang mampu menjadi sumbangan dalam
  - pertumbuhan perekonomian nasional dan kesejahteraan rakyat,
  - capaian sasaran indikator prioritas nasional dikaitkan dengan
  - program, alokasi anggaran dan K/L yang bertugas.
  - k. menerapkan kebijakan bahwa dalam hal sasaran indikator
  - prioritas nasional yang dilaksanakan oleh K/L tidak tercapai maka
  - berimplikasi pada tunjangan kinerja K/L yang bertanggungjawab
  - atas capaian tersebut.
  - 1. melakukan perbaikan tata kelola perencanaan pembiayaan utang,
  - terutama penerbitan Surat Berharga Negara yang dilakukan
  - dengan kriteria tertentu, secara pruden dalam batas yang aman
  - dan terkendali, serta untuk menjaga kesinambungan fiskal,
  - dengan prioritas pada sektor produktif, peningkatan nilai tambah
  - dan transfer teknologi, serta dampak sosial ekonomi yang tinggi
  - termasuk mendorong pembiayaan kreatif dan inovatif, seperti
  - Kerjasama Pemerintah dan Badan Usaha (KPBU) dan blended
  - financing.
  - m. menindaklanjuti seluruh hasil pemeriksaan Badan Pemeriksa
  - Keuangan termasuk temuan audit dalam LKPP maupun temuan
  - dalam setiap entitas auditee atau K/L.
  - Pasal 13
  - Cukup jelas.
