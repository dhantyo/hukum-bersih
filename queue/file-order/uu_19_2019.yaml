  - TENTANG KOMISI PEMBERANTASAN TINDAK PIDANA KORUPSI
  - I. UMUM
  - Tindak Pidana Korupsi di Indonesia sudah meluas dalam masyarakat.
  - Perkembangannya terus meningkat dari tahun ke tahun, baik dari jumlah kasus
  - yang terjadi dan jumlah kerugian keuangan negara maupun dari segi kualitas
  - tindak pidana yang dilakukan semakin sistematis serta lingkupnya yang
  - memasuki seluruh aspek kehidupan masyarakat.
  - Meningkatnya Tindak Pidana Korupsi yang tidak terkendali akan membawa
  - bencana tidak saja terhadap kehidupan perekonomian nasional tetapi juga pada
  - kehidupan berbangsa dan bernegara pada umumnya. Tindak Pidana Korupsi
  - yang meluas dan sistematis juga merupakan pelanggaran terhadap hak-hak
  - sosial dan hak-hak ekonomi masyarakat, dan karena itu semua Tindak Pidana
  - Korupsi tidak lagi dapat digolongkan sebagai kejahatan biasa melainkan telah
  - menjadi suatu kejahatan luar biasa. Begitu pun dalam upaya
  - pemberantasannya tidak lagi dapat dilakukan secara biasa, tetapi dituntut cara-
  - cara yang luar biasa.
  - Dalam upaya pemberantasan Tindak Pidana Korupsi, yang
  - pelaksanaannya dilakukan secara optimal, intensif, efektif, profesional serta
  - berkesinambungan. Dengan berdasarkan ketentuan Pasal 43 Undang-Undang
  - Nomor 31 Tahun 1999 tentang Pemberantasan Tindak Pidana Korupsi
  - sebagaimana telah diubah dengan Undang-Undang Nomor 20 Tahun 2001,
  - badan khusus tersebut yang selanjutnya disebut Komisi Pemberantasan
