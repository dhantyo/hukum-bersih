  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa dalam rangka mewujudkan masyarakat yang'
  - adil, makmur, dan sejahtera berdasarkan Pancasila
  - dan Undang-Undang Dasar Negara Republik Indonesia
  - Tahun 1945, perlu penyelenggaraan negara yang
  - bersih dari kolusi, korupsi dan nepotisme;
  - b. bahwa kepolisian, kejaksaan, dan Komisi
  - Pemberantasan Tindak Pidana Korupsi sebagai
  - lembaga yang menangani perkara tindak pidana
  - korupsi perlu ditingkatkan sinergitasnya sehingga
  - masing-masing dapat berdaya guna dan berhasil guna
  - dalam upaya pemberantasan tindak pidana korupsi
  - berdasarkan asas kesetaraan kewenangan dan
  - perlindungan terhadap hak asasi manusia;
  - c. bahwa pelaksanaan tugas Komisi Pemberantasan
  - Tindak Pidana Korupsi perlu terus ditingkatkan
  - melalui strategi pencegahan dan pemberantasan
  - tindak pidana korupsi yang komprehensif dan sinergis
  - tanpa mengabaikan penghormatan terhadap hak asasi
