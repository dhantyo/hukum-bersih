  first_page:
  - KONVENSI ASEAN TENTANG PEMBERANTASAN TERORISME
  - Negara-Negara Anggota Perhimpunan Bangsa-Bangsa Asia Tenggara (ASEAN)--Brunei
    Darussalam,
  - Kerajaan Kamboja, Republik Indonesia, Republik Rakyat Demokratik Lao, Malaysia,
    Uni Myanmar,
  - Republik Filipina, Republik Singapura, Kerajaan Thailand, dan Republik Sosialis
    Viet Nam--selanjutnya
  - disebut sebagai ‘para Pihak’;ara Pihak”;
  - MENGINGAT Piagam Perserikatan Bangsa-Bangsa dan prinsip-prinsip hukum internasional
    yang relevan,
  - konvensi-konvensi dan protokol-protokol internasional yang relevan berkaitan dengan
    pemberantasan
  - terorisme, serta resolusi-resolusi Perserikatan Bangsa-Bangsa yang relevan tentang
    langkah-langkah yang
  - dimaksudkan untuk memberantas terorisme internasional, dan menegaskan kembali
    komitmen kami untuk
  - melindungi hak asasi manusia, perlakuan adil, aturan hukum, dan proses hukum semestinya
    serta prinsip-
  - prinsip yang terkandung dalam Perjanjian Persahabatan dan Kerja Sama di Asia Tenggara
    yang dibuat di
  - Bali pada tanggal 24 Februari 1976;
  - MENEGASKAN KEMBALI bahwa terorisme tidak dapat dan tidak boleh dihubungkan dengan
    agama,
  - kewarganegaraan, peradaban, atau kelompok etnis apa pun;
  - MENGINGAT juga Deklarasi ASEAN tentang Aksi Bersama Pemberantasan Terorisme dan
    Deklarasi
  - tentang Terorisme yang masing-masing diterima pada Konferensi Tingkat Tinggi ASEAN
    pada tahun 2001
  - dan 2002;
  - MENEGASKAN KEMBALI komitmen kami pada Program Aksi Vientiane yang dibuat di Vientiane
    pada
  - tanggal 29 November 2004, khususnya penekanannya dalam ‘membentuk dan berbagi
    norman-norma’,
  - dan kebutuhan, antara lain, untuk membantu penandatanganan suatu Perjanjian Bantuan
    Hukum Timbal
  - Balik ASEAN, dan suatu Konvensi ASEAN tentang Pemberantasan Terorisme, dan pembentukan
    suatu
  - Perjanjian Ekstradisi ASEAN, yang diamanatkan oleh Deklarasi ASEAN Concord tahun
    1976;
  - MEMPERHATIKAN DENGAN SAKSAMA atas bahaya serius yang ditimbulkan oleh terorisme
    terhadap
  - manusia-manusia tidak bersalah, infrastruktur dan lingkungan, perdamaian dan stabilitas
    kawasan dan
  - internasional, serta pembangunan ekonomi;
  - MENYADARI pentingnya pengidentifikasian dan penyelesaian secara efektif akar permasalahan
    terorisme
  - dalam perumusan setiap langkah pemberantasan terorisme;
  - MENYATAKAN KEMBALI bahwa terorisme, dalam segala bentuk dan manifestasinya, yang
    dilakukan di
  - mana pun, kapan pun, dan oleh siapa pun, merupakan suatu ancaman besar bagi perdamaian
    dan
  - keamanan internasional dan tantangan langsung bagi pencapaian perdamaian, kemajuan,
    dan
  - kesejahteraan ASEAN, dan perwujudan Visi ASEAN 2020;
  last_page:
  - JENDERAL (PURN) SURAYUD CHULANONT
