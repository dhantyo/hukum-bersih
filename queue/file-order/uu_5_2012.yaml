  filename: UU Nomor 5 Tahun 2012.pdf
  pages: 5
  first_page:
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 5 TAHUN 2012
  - TENTANG
  - PENGESAHAN ASEAN CONVENTION ON COUNTER TERRORISM
  - (KONVENSI ASEAN MENGENAI PEMBERANTASAN TERORISME)
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa pelaksanaan hubungan luar negeri bebas aktif yang'
  - didasarkan atas asas persamaan derajat, saling
  - menguntungkan, dan saling menghormati, merupakan salah
  - satu perwujudan dari tujuan Pemerintah Republik Indonesia,
  - yaitu ikut serta melaksanakan ketertiban dunia yang
  - berdasarkan kemerdekaan, perdamaian abadi, dan keadilan
  - sosial;
  - b. bahwa tindakan terorisme merupakan kejahatan yang bersifat
  - lintas batas negara dan telah mengakibatkan hilangnya
  - nyawa tanpa memandang korban, menimbulkan ketakutan
  - masyarakat secara luas, hilangnya kemerdekaan, serta
  - kerugian harta benda, oleh karena itu perlu dilaksanakan
  - langkah-langkah pemberantasan melalui kerja sama regional;
  - c. bahwa pada Konferensi Tingkat Tinggi ASEAN ke – 12, di
  - Cebu, Filipina, tanggal 13 Januari 2007, Pemerintah
  - Indonesia telah menandatangani ASEAN Convention on
  - Counter Terrorism (Konvensi ASEAN mengenai Pemberantasan
  - Terorisme);
  - d. bahwa berdasarkan pertimbangan sebagaimana dimaksud
  - dalam huruf a, huruf b, dan huruf c, perlu mengesahkan
  - ASEAN Convention on Counter Terrorism (Konvensi ASEAN
  - mengenai Pemberantasan Terorisme) dengan Undang-
  - Undang;
  - 'Mengingat : 1. Pasal 5 ayat (1), Pasal 11, dan Pasal 20 Undang-Undang'
  - Dasar Negara Republik Indonesia Tahun 1945;
  - 2. Undang-Undang Nomor 37 Tahun 1999 tentang Hubungan
  - Luar Negeri (Lembaran Negara Republik Indonesia Tahun
  - 1999 Nomor 156, Tambahan Lembaran Negara Republik
  - Indonesia Nomor 3882);
  last_page:
  - Dalam kehidupan berbangsa dan bernegara, kerja sama keamanan
  - dengan negara sahabat tidak dapat dihindari dan perlu terus dipupuk dan
  - ditingkatkan berdasarkan prinsip-prinsip saling menguntungkan,
  - kesetaraan dan penghormatan penuh atas kedaulatan setiap negara. Oleh
  - karena itu, Pemerintah Republik Indonesia memandang perlu
  - meningkatkan kerja sama keamanan dengan negara yang tergabung
  - dalam ASEAN dalam menanggulangi kejahatan terorisme di bawah payung
  - Konvensi ASEAN mengenai Pemberantasan Terorisme yang telah
  - ditandatangani pada Konferensi Tingkat Tinggi ASEAN ke-12 di Cebu,
  - Filipina, tanggal 13 Januari 2007.
  - Seluruh prinsip yang terkandung dalam Konvensi ASEAN mengenai
  - Pemberantasan Terorisme antara lain memuat pandangan bahwa
  - terorisme tidak dapat dan tidak boleh dihubungkan dengan agama,
  - kewarganegaraan, peradaban, atau kelompok etnis apa pun, menghormati
  - kedaulatan, kesetaraan, integritas wilayah dan identitas nasional, tidak
  - campur tangan urusan dalam negeri, menghormati yurisdiksi
  - kewilayahan, adanya bantuan hukum timbal balik, ekstradisi, serta
  - mengedepankan penyelesaian perselisihan secara damai. Selain itu, di
  - dalam Konvensi ASEAN ini secara khusus terdapat prinsip yang
  - merupakan nilai tambah yang tidak dimiliki oleh Konvensi serupa yang
  - memuat ketentuan mengenai program rehabilitasi bagi tersangka
  - terorisme, perlakuan yang adil dan manusiawi serta penghormatan
  - terhadap hak asasi manusia dalam proses penanganannya.
  - II. PASAL DEMI PASAL
