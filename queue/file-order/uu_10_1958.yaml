  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Lampiran 1a
  - Undang-undang No. 10 tahun 1958
  - PERSETUJUAN PERUBAHAN.
  - Persetujuan ini dibuat dan berlaku mulai pada hari ke 21 bulan Juni 1956 oleh
    dan
  - antara Republik Indonesia (dalam selanjutnya disebut "Indonesia") dan Export-Import
  - Bank of Washington (dalam selanjutnya disebut "Eximbank"), suatu badan Pemerintah
  - Amerika Serikat, yang merubah persetujuan tertanggal 12 Januari 1951, sebagai
    yang
  - sebelum ini diubah dan ditambah dengan persetujuan-persetujuan tertanggal 3 Nopember
  - 1952 dan 10 Agustus 1954 antara fihak-fihak termaksud, (selanjutnya dinamakan
  - Persetujuan").
  - 'MENYATAKAN:'
  - Bahwa menurut Persetujuan, Eximbank telah mengadakan untuk kepentingan
  - Indonesia suatu kelonggaran kredit yang tidak melebihi Delapan puluh Tiga Juta
    Dua
  - Ratus Satu Ribu Dua Ratus Dollar (S 83.201.200) untuk membantu Indonesia dalam
  - pemodalan rekonstruksi dan pembangunan sektor-sektor hayati dalam perekonomian
  - Indonesia, menurut syarat-syarat terurai dalam Persetujuan itu; dan
  - Bahwa Persetujuan menetapkan bahwa uang-muka yang diberikan oleh Eximbank
  - berdasar atas Persetujuan, akan dibayar kembali dalam tigapuluh (30) angsuran
    tengah-
  - tahunan yang kurang-lebih sama besarnya dimulai pada 1 Maret 1956 dan dibuktikan
  - dengan promos atau promes-promes Indonesia yang dapat diperdagangkan menurut
  - syarat-syarat tertentu yang diuraikan disana; dan
  - Bahwa, menurut Persetujuan termaksud, Indonesia hingga kini mengeluarkan dan
  - menyerahkan kepada Eximbank duabelas (12) surat-surat promes yang dapat
  - diperdagangkan, masing-masing dalam jumlah uang sebesar Enam Juta Dollar ($
  - 6.000.000) dan masing-masing menurut ketentuan bahwa jumlah pokok yang dibuktikan
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - perlu menurut Undang undang Dasar, Undang-undang serta peraturan-peraturan guna
  - meratifikasi Persetujuan Perubahan ini, bahwa Persetujuan Perubahan ini, yang
  - ditandatangani atas nama Indonesia, mengikat Indonesesia menurut hukum, sesuai
    dengan
  - syarat-syaratnya; dan bahwa surat-surat promes baru terurai di sini yang dikeluarkan
    oleh
  - Indonesia untuk membuktikan uang-uang-muka dalam rangka kredit itu akan merupakan
  - kewajiban-kewajiban Indonesia yang sah dan mengikat, sesuai dengan syarat-syaratnya.
  - Pendapat atau pendapa-pendapat akan menunjuk kepada undang-undang, surat- surat
  - kuasa atau naskah-naskah lain yang bersangkutan, dan jika dikehendaki oleh Eximbank,
  - akan dilengkapi dengan salinan-salinannya yang disahkan.
  - Jika pendapat-pendapat atau naskah-naskah tadi tidak tertulis dalam bahasa Inggris,
  - maka akan diberikan terjemahannya yang disahkan.
  - Sebagai bukti pernyataan ini, maka Republik Indonesia dan Expor Import Bank of
  - Washington telah membuat sebagaimana mesti Persetujuan Perubahan ini dalam rangkap
  - dua di Washington, District of Columbia, Amerika Serikat, pada tanggal tersebut
    dimuka.
  - Republik Indonesia
  - ttd.
  - Moekarto Notowidigdo
  - Duta besar Luarbiasa dan
  - berkuasa penuh pada
  - Amerika Serikat.
