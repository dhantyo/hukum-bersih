  - PRESIDEN
  - REPUBLIK INDONESIA
  - Persetujuan Indonesia Eximbank tertanggal 17 Desember 1956 (lampiran 3a 3b)
  - bermaksud menegaskan persetujuan kredit guna memodali pembelian-pembelian alat-alat
  - telekomunikasi. Berhubung dengan meningkatnya penggunaan hubungan kawat (tilgram),
  - baik untuk perhubungan di dalam maupun ke luar negeri maka sejak 1950 sudah dirasa
  - mendesaknya modernisasi alat-alat perlengkapan kawat. Usaha modernisasi ini dimulai
  - dengan pembelian alat-alat perlengkapan dengan kredit Exim sebesar $ 260.000,-
  - Berhubung dengan pengalaman-pengalaman baik diperoleh dengan alat-alat perlengkapan
  - itu, maka Pemerintah memutuskan untuk memperluas fasilitas-pasilitas perhubungan
  - dengan memecah pusat-pusat perhubungan, yakni untuk perhubungan dalam negeri
  - dipusatkan di Bandung, dan perhubungan ke luar negeri di Jakarta. Pula pembaharuan
  - alat-alat tersebut lebih mendesak oleh karena sangat tuanya alat-alat kawat. Juga
    kantor-
  - kantor di daerah mendapat bagian dalam pembaharuan ini, sehingga perhubungan kawat
  - antar-daerah akan dapat lebih lancar, adanya.
  - Persetujuan Indonesia-Eximbank tertanggal 3 Mei 1957 (Lampiran 4a, 4b)
  - bermaksud menegaskan persetujuan kredit guna memodali pembelian lokomotif-
  - lokomotif diesel buat Jawatan Kereta Api. Lokomotif-lokomotif diesel General Electric
  - yang dibeli dengan kredit Exim dalam tahun 1950 ternyata sangat memuaskan, sehingga
  - Pimpinan Jawatan Kereta Api memutuskan untuk membeli lagi lokomotif diesel, kali
    ini
  - dari General Motors yang menurut statistik-statistik lebih hemat dari pada General
  - Electric.
  - TAMBAHAN LEMBARAN NEGARA REPUBLIK INDONESIA NOMOR 1551
