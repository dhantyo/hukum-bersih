id: uu_5_1960
title: Undang-Undang Nomor 5 Tahun 1960 tentang Peraturan Dasar Pokok-Pokok Agraria
files:
- bpk_file_id: 40571
  filename: UU Nomor 5 Tahun 1960.pdf
  pages: 33
  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 5 TAHUN 1960
  - TENTANG
  - PERATURAN DASAR POKOK-POKOK AGRARIA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa didalam Negara Republik Indonesia yang susunan'
  - kehidupan rakyatnya, termasuk perekonomiannya, terutama
  - masih bercorak agraris, bumi, air dan ruang angkasa, sebagai
  - karunia Tuhan Yang Maha Esa mempunyai fungsi yang amat
  - penting untuk membangun masyarakat yang adil dan makmur;
  - b. bahwa hukum agraria yang masih berlaku sekarang ini sebagian
  - tersusun berdasarkan tujuan dan sendi-sendi dari pemerintahan
  - jajahan dan sebagian dipengaruhi olehnya, hingga bertentangan
  - dengan kepentingan rakyat dan Negara didalam menyelesaikan
  - revolusi nasional sekarang ini serta pembangunan semesta;
  - c. bahwa hukum agraria tersebut mempunyai sifat dualisme, dengan
  - berlakunya hukum adat disamping hukum agraria yang didasarkan
  - atas hukum barat;
  - d. bahwa bagi rakyat asli hukum agraria penjajahan itu tidak
  - menjamin kepastian hukum;
  - 'Berpendapat : a. bahwa berhubung dengan apa yang tersebut dalam pertimbangan-'
  - pertimbangan diatas perlu adanya hukum agraria nasional, yang
  - berdasar atas hukum adat tentang tanah, yang sederhana dan
  - menjamin kepastian hukum bagi seluruh rakyat Indonesia, dengan
  - tidak mengabaikan unsur-unsur yang bersandar pada hukum
  - agama;
  - b. bahwa hukum agraria nasional harus memberi kemungkinan akan
  - tercapainya,fungsi bumi, air dan ruang angkasa, sebagai yang
  - dimaksud diatas dan harus sesuai dengan kepentingan rakyat
  - Indonesia serta memenuhi pula keperluannya menurut
  - permintaan zaman dalam segala soal agraria;
  - c. bahwa hukum agraria nasional itu harus mewujudkan penjelmaan
  - dari pada Ketuhanan Yang Maha Esa, Perikemanusiaan.
  - Kebangsaan, Kerakyatan dan Keadilan Sosial, sebagai azas
  - kerokhanian Negara dan cita-cita bangsa, seperti yang tercantum
  - didalam Pembukaan Undang-undang Dasar.
  - d. bahwa hukum agraria tersebut harus pula merupakan pelaksanaan
  - dari pada Dekrit Presiden tanggal 5 Juli 1959, ketentuan dalam
  - pasal 33 Undang-undang Dasar dan Manifesto Politik Republik
  - Indonesia, sebagai yang ditegaskan dalam pidato Presiden tanggal
  - 17 Agustus 1960, yang mewajibkan Negara untuk mengatur
  - pemilikan tanah dan memimpin penggunaannya, hingga semua
  - tanah diseluruh wilayah kedaulatan bangsa dipergunakan untuk
  - sebesar-besar kemakmuran rakyat, baik secara perseorangan
  - maupun secara gotong-royong;
  - e. bahwa berhubung dengan segala sesuatu itu perlu diletakkan
  - sendi-sendi dan disusun ketentuan-ketentuan pokok baru dalam
  - bentuk Undang-undang yang akan merupakan dasar bagi
  - penyusunan hukum agraria nasional tersebut diatas;
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Pasal 53.
  - Sudah dijelaskan dalam penjelasan pasal 16.
  - Pasal 54.
  - Pasal ini diadakan berhubung dengan ketentuan dalam pasal 21 dan 26. Seseorang
  - yang telah menyatakan menolak kewarganegaraan R.R.C. tetapi pada tanggal mulai
  - berlakunya undang-undang ini belum mendapat pengesahan akan terkena oleh
  - ketentuan konversi pasal I ayat 3, pasal II ayat 2 dan pasal VIII. Tetapi setelah
  - pengesahan penolakan itu diperolehnya maka baginya terbuka kemungkinan untuk
  - memperoleh hak atas tanah sebagai seorang yang berkewarganegaraan Indonesia
  - tunggal. Hal itu berlaku juga bagi orang-orang yang disebutkan didalam pasal 12
  - Peraturan Pemerintah No. 20 tahun 1959, yaitu sebelumnya diperoleh pengesahan
    dari
  - instansi yang berwenang.
  - Pasal 55.
  - Sudah dijelaskan dalam penjelasan pasal 30.
  - Ayat 1 mengenai modal asing yang sekarang sudah ada, sedang ayat 2 menunjuk pada
  - modal asing baru. Sebagaimana telah ditegaskan dalam penjelasan pasal 30 pemberian
  - hak baru menurut ayat 2 ini hanya dimungkinkan kalau hal itu diperlukan oleh undang-
  - undang pembangunan Nasional semesta berencana.
  - 'Kedua : Hak-hak yang ada sekarang ini menurut ketentuan konversi ini semuanya'
  - menjadi hak-hak baru menurut Undang-undang Pokok Agraria.
  - Hak guna-usaha dan hak guna-bangunan yang disebut dalam pasal I, II, III, IV
  - dan V berlangsung dengan syarat-syarat umum yang ditetapkan dalam
  - Peraturan yang dimaksud dalam pasal 50 ayat 2 dan syarat-syarat khusus
  - yang bersangkutan dengan keadaan tanahnya dan sebagai yang disebutkan
  - dalam akta haknya yang di- konversi itu, sepanjang tidak bertentangan
  - dengan peraturannya yang baru.
  - 'Ketiga : Perubahan susunan pemerintahan desa perlu diadakan untuk menjamin'
  - pelaksanaan yang sebaik-baiknya dari- pada perombakan hukum agraria
  - menurut Undang-undang ini. Pemerintah desa akan merupakan pelaksana
  - yang mempunyai peranan yang sangat penting.
  - 'Keempat : Ketentuan ini bermaksud menghapuskan hak- hak yang masih bersifat'
  - feodal dan tidak sesuai dengan ketentuan undang-undang ini.
  - Termasuk Lembaran-Negara No. 104 tahun 1960.
