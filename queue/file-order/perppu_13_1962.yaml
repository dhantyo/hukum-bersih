  filename: PERPU No. 13 Tahun 1962.pdf
  pages: 11
  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - PERATURAN PEMERINTAH PENGGANTI UNDANG-UNDANG
  - NOMOR 13 TAHUN 1962
  - TENTANG
  - SUMBANGAN WAJIB ISTIMEWA TAHUN 1962 ATAS KENDARAAN BERMOTOR
  - Presiden Republik Indonesia,
  - 'Menimbang : 1. bahwa untuk mengatasi kebutuhan keuangan Negara berhubung'
  - dengan memuncaknya pembebasan Irian Barat dan mengingat
  - keadaan keuangan Negara dewasa ini, Pemerintah berpendapat,
  - bahwa sudah selayaknya jika golongan-golongan yang memiliki
  - kendaraan bermotor memberikan pengorbanan istimewa kepada
  - Pemerintah;
  - 2. bahwa untuk memberikan bentuk pada pengorbanan tersebut,
  - Pemerintah memandang perlu menetapkan suatu Sumbangan
  - Wajib Istimewa bagi golongan-golongan dimaksud;
  - 3. bahwa karena keadaan yang mendesak sumbangan ini perlu
  - segera diadakan dengan Peraturan Pemerintah Pengganti Undang-
  - undang;
  - 'Mengingat : Pasal 22 ayat (1) Undang-undang Dasar 1945:'
  - 'Memutuskan :'
  - 'Menetapkan : Peraturan tentang Sumbangan Wajib Istimewa tahun 1962 atas'
  - Kendaraan Bermotor.
  - Pasal 1. …
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Pasal 10.
  - Untuk penertiban pelunasan Sumbangan Wajib Istimewa ini dan pendafaran
  - kendaraan bermotor diperlukan suatu pendaftaran kembali kendaraan bermotor.
  - Peraturan-peraturan yang diperlukan untuk itu akan dikeluarkan oleh Departemen-
  - departemen yang bersangkutan setelah diadakan musyawarah.
  - Pasal 11 s/d 14.
  - Cukup jelas.
  - 'Diketahui :'
  - Sekretaris Negara,
  - ttd
  - MOHD. ICHSAN.
  - TAMBAHAN LEMBARAN NEGARA TAHUN 1962 NOMOR 2483
