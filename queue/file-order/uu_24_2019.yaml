  - TAMBAHAN
  - LEMBARAN NEGARA R.I
  - No. 6414 KESRA. Ekonomi Kreatif (Penjelasan atas Lembaran
  - Negara Republik Indonesia Tahun 2019 Nomor 212)
  - PENJELASAN
  - ATAS
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 24 TAHUN 2019
  - TENTANG
  - EKONOMI KREATIF
  - I. UMUM
  - Pembukaan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945
  - mengamanatkan bahwa tujuan nasional bangsa Indonesia adalah
  - melindungi segenap bangsa Indonesia dan seluruh tumpah darah
  - Indonesia, memajukan kesejahteraan umum dan mencerdaskan kehidupan
  - bangsa, serta ikut melaksanakan ketertiban dunia yang berdasarkan
  - kemerdekaan, perdamaian abadi, dan keadilan sosial. Selanjutnya, Pasal
  - 33 ayat (4) Undang-Undang Dasar Negara Republik Indonesia Tahun 1945
  - mengamanatkan bahwa “Perekonomian nasional diselenggarakan berdasar
  - atas demokrasi ekonomi dengan prinsip kebersamaan, efisiensi
  - berkeadilan, berkelanjutan, berwawasan lingkungan, kemandirian, serta
  - dengan menjaga keseimbangan kemajuan dan kesatuan ekonomi nasional”.
  - Dalam mencapai masyarakat adil dan makmur yang mampu memajukan
  - kesejahteraan umum, negara Indonesia harus mengoptimalkan seluruh
  - sumber daya ekonomi, terutama mengoptimalkan kreativitas sumber daya
  - manusia yang berbasis warisan budaya, ilmu pengetahuan, dan/atau
  - teknologi.
  - Untuk mengoptimalkan sumber daya manusia tersebut, diperlukan
  - pengelolaan potensi Ekonomi Kreatif secara sistematis, terstruktur, dan
  - berkelanjutan. Oleh karena itu, diperlukan pengarusutamaan Ekonomi
  - Kreatif dalam rencana pembangunan nasional melalui pengembangan
