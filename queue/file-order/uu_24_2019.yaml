  - NOMOR 24 TAHUN 2019
  - TENTANG
  - EKONOMI KREATIF
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa Indonesia memiliki kekayaan warisan budaya'
  - yang perlu dimanfaatkan menjadi produk yang
  - menciptakan nilai tambah melalui pengembangan
  - ekonomi kreatif untuk memajukan kesejahteraan umum
  - sebagaimana diamanatkan dalam Undang-Undang
  - Dasar Negara Republik Indonesia Tahun 1945;
  - b. bahwa Pemerintah dan/atau Pemerintah Daerah
  - bertanggung jawab dalam menciptakan dan
  - mengembangkan ekosistem ekonomi kreatif sehingga
  - mampu memberikan kontribusi bagi perekonomian
  - nasional dan meningkatkan daya saing global guna
  - tercapainya tujuan pembangunan berkelanjutan;
  - c. bahwa untuk memberikan dasar kepastian hukum
  - kepada Pemerintah dan/atau Pemerintah Daerah dalam
  - menciptakan dan mengembangkan ekosistem ekonomi
  - kreatif, perlu pengaturan tentang ekonomi kreatif;
  - d. bahwa berdasarkan pertimbangan sebagaimana
  - dimaksud dalam huruf a, huruf b, dan huruf c, perlu
  - membentuk Undang-Undang tentang Ekonomi Kreatif;
