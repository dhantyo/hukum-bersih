  first_page:
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 10 TAHUN 2014
  - TENTANG
  - PENGESAHAN INTERNATIONAL CONVENTION FOR THE SUPPRESSION OF
  - ACTS OF NUCLEAR TERRORISM
  - (KONVENSI INTERNASIONAL PENANGGULANGAN
  - TINDAKAN TERORISME NUKLIR)
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang: a. bahwa tujuan Pemerintah Negara Indonesia sebagaimana'
  - tertuang dalam Pembukaan Undang-Undang Dasar Negara
  - Republik Indonesia Tahun 1945 adalah untuk melindungi
  - segenap bangsa Indonesia dan seluruh tumpah darah
  - Indonesia, memajukan kesejahteraan umum, mencerdaskan
  - kehidupan bangsa serta ikut melaksanakan ketertiban dunia
  - yang berdasarkan kemerdekaan, perdamaian abadi, dan
  - keadilan sosial;
  - b. bahwa berdasarkan pertimbangan sebagaimana dimaksud
  - dalam huruf a, Pemerintah Indonesia sebagai bagian dari
  - masyarakat internasional berkomitmen untuk mendukung
  - upaya penanggulangan tindakan terorisme, khususnya
  - terorisme nuklir;
  - c. bahwa tindak pidana terorisme nuklir merupakan kejahatan
  - internasional yang menimbulkan bahaya terhadap
  - keamanan dan perdamaian dunia serta kemanusiaan dan
  - peradaban sehingga pencegahan dan pemberantasannya
  - memerlukan kerja sama antarnegara;
  last_page:
  - LAMPIRAN
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 10 TAHUN 2014
  - TENTANG
  - PENGESAHAN INTERNATIONAL CONVENTION FOR THE SUPPRESSION OF
  - ACTS OF NUCLEAR TERRORISM
  - (KONVENSI INTERNASIONAL PENANGGULANGAN TINDAKAN
  - TERORISME NUKLIR)
  - PERNYATAAN TERHADAP PASAL 4 DAN PENSYARATAN TERHADAP
  - PASAL 23 AYAT (1) KONVENSI INTERNASIONAL PENANGGULANGAN
  - TINDAKAN TERORISME NUKLIR
  - 'Pernyataan:'
  - Pemerintah Republik Indonesia mendeklarasikan bahwa Pasal 4 tidak
  - ditafsirkan sebagai bentuk dukungan, dorongan, pembiaran, pembenaran,
  - atau legitimasi penggunaan atau ancaman penggunaan senjata nuklir untuk
  - tujuan apapun juga.
  - 'Pensyaratan:'
  - Pemerintah Republik Indonesia menyatakan tidak terikat oleh Pasal 23 ayat
  - (1) Konvensi ini dan berpendirian bahwa setiap sengketa yang terkait dengan
  - interpretasi atau penerapan Konvensi ini hanya dapat diajukan kepada
  - arbitrase atau Mahkamah Internasional dengan persetujuan dari para Pihak
  - yang bersengketa.
  - PRESIDEN REPUBLIK INDONESIA,
  - ttd.
  - DR. H. SUSILO BAMBANG YUDHOYONO
