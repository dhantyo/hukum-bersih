  first_page:
  - KONVENSI INTERNASIONAL PENANGGULANGAN TINDAKAN TERORISME NUKLIR
  - PERSERIKATAN BANGSA-BANGSA 2005
  - Konvensi Internasional untuk Penanggulangan Tindakan Terorisme Nuklir
  - Negara Pihak terhadap konvensi ini,
  - Mengingat tujuan dan prinsip Piagam Perserikatan Bangsa-Bangsa dalam menjaga perdamaian
  - dan keamanan internasional dan peningkatan hubungan berbangsa dan bernegara serta
    kerja
  - sama antarnegara,
  - Mengingat Deklarasi pada Peringatan Lima Puluh Tahun Berdirinya Perserikatan Bangsa-
  - Bangsa pada tanggal 24 Oktober 1995,
  - Mengakui hak semua negara untuk mengembangkan dan menerapkan tenaga nuklir untuk
  - maksud damai dan kepentingan yang sah terhadap manfaat potensial yang akan diperoleh
    dari
  - penerapan tenaga nuklir untuk maksud damai,
  - Mengingat Konvensi tentang Proteksi Fisik Bahan Nuklir Tahun 1980,
  - Sangat memperhatikan semakin meluasnya tindakan terorisme di seluruh dunia dalam
    segala
  - bentuk dan manifestasinya,
  - Mengingat Deklarasi tentang Langkah untuk Memberantas Terorisme Internasional,
  - sebagaimana terlampir pada resolusi Majelis Umum 49/60 tanggal 9 Desember 1994,
    yang
  - antara lain menyatakan bahwa negara anggota Perserikatan Bangsa-Bangsa, secara
    formal
  - menyepakati untuk mengutuk tindakan, metode dan praktik terorisme sebagai tindakan
    kriminal
  - dan tidak dapat dibenarkan, yang dilakukan di mana pun dan oleh siapa pun, termasuk
    yang
  - membahayakan hubungan persahabatan antarnegara dan antarmanusia dan yang mengancam
  - integritas wilayah dan keamanan negara,
  - Memperhatikan bahwa deklarasi juga mendukung negara “untuk menilai meninjau ulang
    secara
  - mendesak lingkup ketentuan internasional yang ada untuk pencegahan, pemberantasan,
    dan
  - penghapusan terorisme dalam segala bentuk dan manifestasinya, dengan tujuan menjamin
  - adanya kerangka hukum yang komprehensif yang mencakup seluruh aspek permasalahan”,
  - Mengingat resolusi Majelis Umum 51/210 tanggal 17 Desember 1996 dan Deklarasi
    Tambahan
  - terhadap Deklarasi tentang Langkah untuk Memberantas Terorisme Internasional tahun
    1994
  - sebagaimana terlampir dalam deklarasi tersebut,
  - Mengingat juga bahwa, sesuai dengan resolusi Majelis Umum 51/210, suatu panitia
    ad hoc
  - ditetapkan untuk mengelaborasi, antara lain, suatu konvensi internasional untuk
    penanggulangan
  - tindakan terorisme nuklir sebagai tambahan bagi instrumen internasional terkait
    yang telah ada,
  last_page:
  - Pasal 27
  - 1. Setiap Negara Pihak dapat menarik diri dari konvensi ini melalui pemberitahuan
    tertulis
  - kepada Sekretaris Jenderal Perserikatan Bangsa-Bangsa.
  - 2. Penarikan diri wajib mulai diberlakukan setahun setelah tanggal pemberitahuan
    diterima
  - oleh Sekretaris Jenderal Perserikatan Bangsa-Bangsa.
  - Pasal 28
  - Konvensi asli, dengan bahasa Arab, bahasa Cina, bahasa Inggris, bahasa Perancis,
    bahasa Rusia,
  - dan bahasa Spanyol sama autentiknya, wajib disimpan di Sekretaris Jenderal Perserikatan
  - Bangsa-Bangsa, yang wajib mengirimkan salinan-tersertifikasi kepada seluruh negara.
  - DI HADAPAN SAKSI, yang bertanda tangan di bawah ini, sesuai dengan kewenangan
    yang
  - diberikan pemerintah mereka, telah menandatangani konvensi ini, yang terbuka untuk
  - penandatanganan di Markas Besar Perserikatan Bangsa-Bangsa di New York tanggal
    14
  - September 2005.
