  - TENTANG
  - PENGESAHAN PERJANJIAN ANTARA PEMERINTAH REPUBLIK INDONESIA
  - DAN PEMERINTAH REPUBLIK SINGAPURA TENTANG
  - EKSTRADISI BURONAN (TREATY BETWEEN THE GOVERNMENT
  - OF THE REPUBLIC OF INDONESIA AND THE GOVERNMENT OF THE REPUBLIC
  - OF SINGAPORE FOR THE EXTRADITION OF FUGITIVES)
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang: a. bahwa untuk melindungi segcnap bangsa Indonesia dan'
  - seluruh tumpah darah Indonesia dan untuk memajukan
  - kesejahteraan umum, mencerdaskan kehidupan bangsa,
  - dan ikut melaksanakan ketertiban dunia yang
  - berdasarkan kemerdekaan, perdamaian abadi, dan
  - kcadilan sosial, Pemerintah Republik Indonesia sebagai
  - bagian dari masyarakat internasional melakukan
  - hubungan dan kerja sama internasional yang
  - diwujudkan dalam perjanjian internasional;
  - b. bahwa untuk meningkatkan kerja sama di bidang
  - pcncgakan hukum, Pemerintah Republik Indonesia dan
  - Pemerintah Republik Singapura telah menandatangani
  - Perjanjian antara Pemerintah Republik Indonesia
  - dan Pemerintah Republik Singapura tentang
  - Ekstradisi Buronan (Treaty between the Government of
  - the Republic of Indonesia and the Government of the
  - Republic of Singapore for the Extradition of Fugitives) pada
  - tanggal 25 Januari 2022 di Bintan, Indonesia, sehingga
  - perlu ditindaklanjuti dengan melakukan pengesahan atas
  - Perjanjian tersebut sesuai dengan Undang-Undang
  - Nomor 24 Tahun 2000 tentang Perjanjian Internasional;
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Menyadari hal tersebut maka Pemerintah Republik Indonesia dan
  - Pemerintah Republik Singapura telah menandatangani Perjanjian antara
  - Pemerintah Republik Indonesia dan Pemerintah Republik Singapura
  - tentang Ekstradisi Buronan (Treaty between the Government of the
  - Republic of Indonesia and the Government of the Republic of Singapore for
  - the Extradition of Fugitives) pada tanggal 25 Januari 2022 di Bintan,
  - Indonesia. Dengan adanya perjanjian internasional tersebut, hubungan
  - dan kerja sama antara kedua negara dalam bidang penegakan hukum
  - dan pemberantasan tindak pidana atas dasar prinsip saling
  - menguntungkan (mutual benefit) diharapkan semakin meningkat.
  - Dalam Perjanjian antara Pemerintah Republik Indonesia dan
  - Pemerintah Republik Singapura tersebut, diatur antara lain kesepakatan
  - Para Pihak untuk melakukan ekstradisi, tindak pidana yang dapat
  - diekstradisikan, dasar ekstradisi, pengecualian wajib terhadap
  - ekstradisi, permintaan dan dokumen pendukung, serta pengaturan
  - penyerahan.
  - Dengan disahkannya Undang-Undang tentang Pengesahan
  - Perjanjian antara Pemerintah Republik Indonesia dan Pemerintah
  - Republik Singapura tentang Ekstradisi Buronan (Treaty between the
  - Government of the Republic of Indonesia and the Government of the
  - Republic of Singapore for the Extradition of Fugitives) akan mendukung
  - penegakan hukum di Indonesia.
  - II. PASAL DEMI PASAL
  - Pasal 1
  - Cukup jelas.
  - Pasal 2
  - Cukup jelas.
  - TAMBAHAN LEMBARAN NEGARA REPUBLIK INDONESIA NOMOR 6846
