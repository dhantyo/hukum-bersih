  - TENTANG EKSTRADISI BURONAN
  - Pemerintah Republik Indonesia dan Pemerintah Republik Singapura,
  - Berkehendak meningkatkan kerja sama yang efektif dan membentuk ekstradisi
  - timbal balik terhadap buronan pelaku tindak pidana yang dapat dihukum
  - berdasarkan hukum pidana sesuai dengan hukum acara pidana yang berlaku
  - pada pengadilan pidana; dan
  - Mengingat Perjanjian antara Pemerintah Republik Indonesia dan Pemerintah
  - Republik Singapura tentang Ekstradisi Buronan yang ditandatangani pada 27
  - April 2007 (“Perjanjian Ekstradisi 2007”) di Tampak Siring, Bali, Indonesia, belum
  - berlaku,
  - 'TELAH MENYETUJUI sebagai berikut:'
  last_page:
  - IN WITNESS WHEREOF the undersigned, duly authorised by their respective
  - Governments, have signed this Treaty.
  - Done at Bintan, Indonesia on 25 January 2022 in the English and Indonesian
  - languages, both texts being equally authentic. In case of any divergence of
  - interpretation, the English text shall prevail.
