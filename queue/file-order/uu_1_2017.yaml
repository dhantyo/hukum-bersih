  first_page:
  - LINAN
  - PRESIDEN
  - REPUBLIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 1 TAHUN 2017
  - TENTANG
  - PENGESAHAN PERJANJIAN ANTARA REPUBLIK INDONESIA DAN REPUBLIK
  - SINGAPURA TENTANG PENETAPAN GARIS BATAS LAUT WILAYAH
  - KEDUA NEGARA DI BAGIAN TIMUR SELAT SINGAPURA, 2014
  - (TREATY BETWEEN THE REPUBLIC OF INDONESIA AND THE REPUBLIC OF
  - SINGAPORE RELATING TO THE DELIMITATION OF THE TERRITORIAL SEAS OF
  - THE TWO COUNTRIES IN THE EASTERN PART OF
  - THE STRAIT OF SINGAPORE, 2014)
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang: a. bahwa Negara Kesatuan Republik Indonesia sebagai negara'
  - kepulauan yang berciri nusantara mempunyai kedaulatan
  - atas wilayahnya, termasuk di Laut Wilayah, untuk dikelola
  - dan dimanfaatkan sebesar-besarnya bagi kesejahteraan dan
  - kemakmuran rakyat Indonesia sebagaimana diamanatkan
  - dalam Undang-Undang Dasar Negara Republik Indonesia
  - Tahun 1945;
  - b. bahwa untuk melaksanakan ketentuan Konvensi
  - Perserikatan Bangsa-Bangsa tentang Hukum Laut, 1982
  - (United Nations Convention on the Law of the Sea, 1982) yang
  - disahkan melalui Undang-Undang Nomor 17 Tahun 1985
  - tentang Pengesahan United Nations Convention on the Law of
  - the Sea (Konvensi Perserikatan Bangsa-Bangsa tentang
  - Hukum Laut) dan Undang-Undang Nomor 43 Tahun 2008
  - tentang Wilayah Negara, Indonesia berkewajiban untuk
  - menetapkan garis batas laut wilayahnya melalui
  - perundingan;
  last_page:
  - PRE DE
  - REPUBLIK IN DONESIA
  - 2. Garis batas Laut Wilayah Republik Indonesia dan Republik Singapura
  - di Selat Singapura bagian timur dari titik 6 garis batas yang disepakati
  - dalam Perjanjian Tahun 1973 sebagai suatu garis yang terdiri atas
  - 'garis lurus yang ditarik antara titik koordinat sebagai berikut:'
  - Titik Lintang Bujur
  - 6 1°16’10.2” LU 104°02’00.0” BT
  - 7 1°16’22.8” LU 104°02’16.6” BT
  - 8 1°16'34.1” LU 104°07’06.3” BT
  - 3. Garis batas Laut Wilayah kedua negara digambarkan dalam Peta
  - Lampiran yang merupakan bagian yang tidak terpisahkan dari
  - Perjanjian.
  - 4. Letak sebenarnya dari titik koordinat di atas laut sebagaimana
  - dimaksud pada angka 2 akan ditetapkan dengan suatu cara yang
  - 'disetujui bersama oleh:'
  - a. Badan Informasi Geospasial dan Dinas Hidro-Oseanografi Tentara
  - Nasional Indonesia Angkatan Laut; dan
  - b. Maritime and Port Authority of Singapore dan Singapore Land
  - Authority.
