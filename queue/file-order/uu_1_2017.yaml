id: uu_1_2017
title: Undang-Undang Nomor 1 Tahun 2017 tentang Pengesahan Perjanjian Antara Republik
  Indonesia Dan Republik Singapura Tentang Penetapan Garis Batas Laut Wilayah Kedua
  Negara Di Bagian Timur Selat Singapura, 2014 (Treaty Between The Republic Of Indonesia
  And The Republic Of Singapore Relating To The Delimitation Of The Territorial Seas
  Of The Two Countries In The Eastern Part Of The Strait Of Singapore, 2014)
