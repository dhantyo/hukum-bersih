title: Undang-Undang Nomor 32 Tahun 1954 tentang Penetapan Berlakunya Undang-Undang
  Republik Indonesia Tanggal 21 Nopember 1946 No.22 Tahun 1946 Tentang Pencatatan
  Nikah, Talak Dan Rujuk Di Seluruh Daerah Luar Jawa Dan Madura
files:
