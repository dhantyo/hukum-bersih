  filename: UU Nomor 32 Tahun 1954.pdf
  pages: 10
  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 32 TAHUN 1954
  - TENTANG
  - PENETAPAN BERLAKUNYA UNDANG-UNDANG REPUBLIK INDONESIA
  - TANGGAL 21 NOPEMBER 1946 NO.22 TAHUN 1946
  - TENTANG PENCATATAN NIKAH, TALAK DAN RUJUK
  - DI SELURUH DAERAH LUAR JAWA DAN MADURA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : 1. bahwa kini di Indonesia berlaku beberapa macam peraturan tentang'
  - 'pencatatan nikah, talak dan rujuk bagi Umat Islam antara lain-lain:'
  - a. Undang-undang Republik Indonesia tanggal 21 Nopember 1946
  - No. 22 tahun 1946 dan
  - b. Huwelijksordonnantie Buitengewesten 1932 No. 482;
  - c. Peraturan-peraturan tentang pencatatan nikah, talak dan rujuk yang
  - berlaku didaerah-daerah Swapraja;
  - d. Peraturan-peraturan lain yang berlaku didaerah diluar Jawa dan
  - Madura;
  - 2. bahwa Undang-undang Republik Indonesia No. 22 tahun 1946, yang
  - dalam penjelasannya, diperuntukkan buat seluruh Indonesia;
  - 3. bahwa berhubung dengan terbentuknya Negara Kesatuan Republik
  - Indonesia perlu adanya satu macam Undang-undang tentang
  - pencatatan nikah, talak dan rujuk;
  - 'Mengingat : Pasal 89 dan pasal 117 Undang-undang Dasar Sementara Republik'
  - Indonesia;
  - Dengan persetujuan Dewan Perwakilan Rakyat
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Lain-lain pasal sudah terang dan tidak perlu dijelaskan lagi.
  - TERMASUK LEMBARAN NEGARA NOMOR 98 TAHUN 1954.
  - 'Diketahui:'
  - MENTERI KEHAKIMAN,
  - DJODY GONDOKUSUMO.
  - TAMBAHAN LEMBARAN NEGARA NOMOR 694
- bpk_file_id: 39742
  filename: UU Nomor 32 Tahun 1954_LAMPIRAN.pdf
  pages: 8
  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Lampiran Undang-undang
  - No. 32 tahun 1954.
  - UNDANG-UNDANG No. 22 TAHUN 1946
  - TENTANG
  - PENCATATAN NIKAH, TALAK DAN RUJUK.
  - PRESIDEN REPUBLIK INDONESIA
  - 'Menimbang : 1. bahwa peraturan pencatatan nikah, talak dan rujuk seperti yang
    diatur'
  - didalam Huwelijksoronnantie S. 1929 No. 348 jo. S. 1931 No. 467.
  - Vorstenlandsche Huwelijksordonnantie S. 1933 No. 98 dan
  - Huwelijksordonnantie Buitengewesten S. 1932 No. 482 tidak sesuai
  - lagi dengan keadaan pada masa sekarang, sehingga perlu diadakan
  - peraturan baru yang sempurna dan memenuhi syarat keadilan sosial;
  - 2. bahwa pembuatan peraturan baru yang dimaksudkan diatas tidak
  - mungkin dilaksanakan didalam waktu yang singkat;
  - 3. bahwa sambil menunggu peraturan baru itu perlu segera diadakan
  - peraturan pencatatan nikah, talak dan rujuk untuk memenuhi keperluan
  - yang sangat mendesak;
  - 'Mengingat : ayat 1 pasal 5, ayat 1 pasal 20, dan pasal IV dari Aturan Peralihan'
  - Undang-undang Dasar, dan Maklumat Wakil Presiden Republik
  - Indonesia tertanggal 16 Oktober 1945 No. X;
  - Dengan persetujuan Badan Pekerja Komite Nasional Pusat;
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Didaerah-daerah yang dulu masuk Negara Bagian sebagai Negara Sumatera Timur,
  - Pasundan, Negara Jawa Timur dan sebagainya, berhubung dengan pergantian-pergantian
  - Pemerintah mungkin masih ada daerah-daerah yang masih menjalankan peraturan-
  - peraturan tentang pencatatan Nikah, Talak dan Rujuk yang lain dari pada Undang-undang
  - No, 22 tahun 1946 tersebut diatas.
  - Untuk menghilangkan keragu-raguan ini, maka dinyatakan bahwa Undang-undang No.
    22
  - tahun 1946 berlaku untuk seluruh Indonesia, untuk tempat-tempat yang menjalankan
  - Undang-undang tersebut ditetapkan menjalankan Undang-undang itu mulai tanggal
    1
  - April 1951. Begitu itu agar supaya dapat diatur peralihan, hingga tidak terjadi
    stagnatie,
  - vacuum, atau kekacauan.
  - Dengan dicabutnya semua peraturan tentang pencatatan Nikah, Talak dan Rujuk dan
  - digantikannya dengan Undang-undang No. 22 tahun 1946, maka akan ada peraturan
  - tentang pencatatan Nikah, Talak dan Rujuk yang satu, yang berlaku untuk seluruh
  - Indonesia.
  - Perlu kiranya diketahui, bahwa Undang-undang ini hanya mengenai pencatatan Nikah,
  - Talak dan Rujuk dan tidak mengurangai usaha-usaha yang tengah dikerjakan oleh
    Panitya
  - Penyelidik Hukum Perkawinan Talak dan Rujuk yang dipimpin oleh Saudara Mr. Teuke
  - Mohd. Hasan, didalam mempersiapkan Undang-undang baru sesuai dengan keinginan-
  - keinginan yang diajukan didalam Parlemen a.l. Saudara yang terhormat Nyonya
  - Mudigdio.
