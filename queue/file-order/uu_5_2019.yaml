  first_page:
  - REPUBLIK INDONESIA
  - PERSETUJUAN
  - ANTARA
  - PEMERINTAH REPUBLIK INDONESIA
  - DAN
  - PEMERINTAH REPUBLIK BELARUS
  - TENTANG KERJA SAMA INDUSTRI PERTAHANAN
  - Pemerintah Republik Indonesia dan Pemerintah Republik Belarus, selanjutnya
  - disebut sebagai Para Pihak;
  - Mempertimbangkan hubungan yang bersahabat dan kooperatif antara kedua
  - negara;
  - Berkeinginan untuk meningkatkan dan memperkuat hubungan bilateral yang
  - sudah terjalin melalui kerja sama industri pertahanan antara kedua negara;
  - Menyadari bahwa penguatan kerja sama industri pertahanan akan
  - menguntungkan kedua industri pertahanan nasional;
  - Bertujuan untuk meningkatkan kegiatan kerja sama di bidang industri pertahanan
  - antara kedua negara yang didasarkan pada penghormatan penuh atas kedaulatan
  - dan integritas wilayah dan prinsip-prinsip persamaan, tidak mencampuri urusan
  - dalam negeri, dan saling menguntungkan;
  - Sesuai dengan hukum dan peraturan perundang-undangan yang berlaku di kedua
  - negara;
  - 'Telah menyetujui sebagai berikut:'
  last_page:
  - IN WITNESS WHEREOF, the undersigned being duly authorized by the Parties,
  - have signed the present Agreement.
  - Done in Jakarta, on the 19h day of March 2013, in two original copies in
  - Indonesian, Russian and English languages, all texts being equally authentic.
    In
  - case of any divergence in the interpretation of the provisions of this Agreement,
    the
  - English text shall prevail.
