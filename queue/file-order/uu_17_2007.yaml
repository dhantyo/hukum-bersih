  - BAB V
  - PENUTUP
  - Rencana Pembangunan Jangka Panjang Nasional Tahun 2005–2025
  - yang berisi visi, misi, dan arah pembangunan nasional merupakan pedoman
  - bagi pemerintah dan masyarakat di dalam penyelenggaraan pembangunan
  - nasional 20 tahun ke depan.
  - RPJPN ini juga menjadi acuan di dalam penyusunan RPJP Daerah dan
  - menjadi pedoman bagi calon Presiden dan calon Wakil Presiden dalam
  - menyusun visi, misi, dan program prioritas yang akan menjadi dasar dalam
  - penyusunan Rencana Pembangunan Jangka Menengah (RPJM) lima tahunan
  - dan Rencana Kerja Pemerintah (RKP). Keberhasilan pembangunan nasional
  - dalam mewujudkan visi Indonesia yang mandiri, maju, adil, dan makmur
  - perlu didukung oleh (1) komitmen dari kepemimpinan nasional yang kuat dan
  - demokratis; (2) konsistensi kebijakan pemerintah; (3) keberpihakan kepada
  - rakyat; dan (4) peran serta masyarakat dan dunia usaha secara aktif.
