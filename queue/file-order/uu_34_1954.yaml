id: uu_34_1954
title: Undang-Undang Nomor 34 Tahun 1954 tentang Pemakaian Gelar "Akuntan" ("Accontant")
files:
- bpk_file_id: 39745
  filename: UU Nomor 34 Tahun 1954.pdf
  pages: 9
  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 34 TAHUN 1954
  - TENTANG
  - PEMAKAIAN GELAR "AKUNTAN" ("ACCONTANT")
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa perlu menetapkan ketentuan-ketentuan untuk mengatur urusan'
  - akuntansi;
  - b. bahwa dirasa perlu memperlindungi gelar "akuntan" ("accountan")
  - dengan undang-undang;
  - 'Mengingat : pasal 89 Undang-undang Dasar Sementara Republik Indonesia;'
  - Dengan persetujuan Dewan Perwakilan Rakyat;
  - 'MEMUTUSKAN :'
  - 'Menetapkan : UNDANG-UNDANG TENTANG PEMAKAIAN GELAR'
  - '"AKUNTAN" ("ACCOUNTANT").'
  - Pasal 1
  - Dengan tidak mengurangi ketentuan dalam peraturan gaji resmi
  - mengenai berbagai jabatan pada Jawatan Akuntan Negeri dan Jawatan
  - Akuntan Pajak, hak memakai gelar "akuntan" ("accountant") dengan
  - penjelasan atau tambahan maupun tidak, hanya diberikan kepada mereka
  - yang mempunyai ijazah akuntan sesuai dengan ketentuan dan
  - berdasarkan undang-undang ini.
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Pasal 6
  - Bilamana pelaksanaan undang-undang ini memerlukan peraturan lebih lanjut
  - berhubung dengan kebutuhan-kebutuhan dalam praktek dan sebagainya, maka kuasa
  - untuk merancangkan peraturan itu diberikan kepada Menteri Keuangan.
  - Pasal 7
  - Waktu sampai 1 April 1955 diperlukan sebagai masa peralihan bagi mereka yang
  - sekarang ini menjalankan pekerjaan akuntan untuk menyesuaikan diri pada ketentuan-
  - ketentuan dalam undang-undang ini.
  - Termasuk Lembaran Negara No. 103 tahun 1954.
  - 'Diketahui:'
  - MENTERI KEHAKIMAN,
  - DJODY GONDOKUSUMO.
  - TAMABAHAN LEMBARAN NEGARA NOMOR 705
