  - epkumham.go.id
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 34 TAHUN 1954
  - TENTANG
  - PEMAKAIAN GELAR "AKUNTAN" ("ACCONTANT")
  - Presiden Republik Indonesia,
  - 'Menimbang : a. bahwa perlu menetapkan ketentuan-ketentuan untuk mengatur urusan'
  - akuntansi;
  - b. bahwa dirasa perlu memperlindungi gelar "akuntan" ("accountan") dengan
  - undang-undang;
  - 'Mengingat : pasal 89 Undang-undang Dasar Sementara Republik Indonesia;'
  - Dengan persetujuan Dewan Perwakilan Rakyat;
  - 'MEMUTUSKAN :'
  - 'Menetapkan: UNDANG-UNDANG TENTANG PEMAKAIAN GELAR "AKUNTAN"'
  - ("ACCOUNTANT").
  - Pasal 1
  - Dengan tidak mengurangi ketentuan dalam peraturan gaji resmi mengenai berbagai
    jabatan pada
  - Jawatan Akuntan Negeri dan Jawatan Akuntan Pajak, hak memakai gelar "akuntan"
    ("accountant")
  - dengan penjelasan atau tambahan maupun tidak, hanya diberikan kepada mereka yang
    mempunyai
  - ijazah akuntan sesuai dengan ketentuan dan berdasarkan undang-undang ini.
  - Pasal 2
  - 'Dengan ijazah tersebut dalam pasal 1 dimaksud:'
  - a. ijazah yang diberikan oleh sesuatu universitas Negeri atau badan perguruan
    tinggi lain yang
  - dibentuk menurut undang- undang atau diakui Pemerintah, sebagai tanda bahwa pendidikan
  - untuk akuntan pada badan perguruan tinggi tersebut telah selesai dengan hasil
    baik;
  - b. ijazah yang diterima sesudah lulus dalam sesuatu ujian lain yang menurut pendapat
    Panitia
  - Ahli termaksud dalam pasal 3, guna menjalankan pekerjaan akuntan dapat disamakan
  - dengan ijazah tersebut pada huruf a pasal ini.
  - Pasal 3
  - (1) Menteri Pemdidikan, Pengajaran dan Kebudayaan mengangkat Panitia Ahli, yang
    bertugas
  - mempertimbangkan apakah sesuatu ijazah bagi menjalankan pekerjaan akuntan dapat
  - disamakan dengan ijazah tersebut pada pasal 2 huruf a.
  - (2) Menteri Pendidikan, Pengajaran dan Kebudayaan bersama Menteri Keuangan mengatur
  - susunan dan cara kerja panitia itu.
  - (3) Menteri Keuangan berhak memberi tugas lain kepada panitia tersebut dalam ayat
    1 untuk
  - menjamin kesempurnaan urusan akuntansi c.q. untuk mengatur lebih lanjut urusan
  - akuntansi.
  - (4) Tiap-tiap akuntan berijazah mendaftarkan nama untuk dimuat dalam suatu register
    negara
