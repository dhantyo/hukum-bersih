  - VII. PENUTUP
  - Demikianlah laporan pertanggungjawaban pengelolaan SBN ini dibuat dalam
  - rangka pemenuhan amanat sebagaimana dituangkan pada pasal 16 Undang-Undang
  - Nomor 24 Tahun 2002 tentang Surat Utang Negara dan pasal 27 Undang-Undang
  - Nomor 19 Tahun 2008 tentang Surat Berharga Syariah Negara dan dilampirkan
  - sebagai bagian dari pertanggungjawaban pelaksanaan APBN. Besar harapan
  - Pemerintah agar masyarakat juga dapat mengetahui secara jelas dan transparan
  - informasi terkait dengan pengelolaan Surat Berharga Negara, sesuai komitmen
  - Pemerintah untuk mengelola sektor keuangan yang transparan, profesional dan
  - bertanggung jawab.
