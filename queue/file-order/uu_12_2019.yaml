  - e. Koreksi Lainnya pada BUN Pengelolaan Penerusan Pinjaman
  - Koreksi Lainnya pada BUN Pengelolaan Penerusan Pinjaman pada TA 2018 dan TA 2017
  - masing-masing sebesar minus Rp37.540.106.239 dan minus Rp19.692.179.601.
  - Koreksi Lainnya pada BUN Pengelolaan Penerusan Pinjaman pada TA 2018 merupakan
  - pencatatan NoD yang telah diakui sebagai piutang pada tahun 2015-2016, namun baru
  - diterbitkan SP3 pada TA 2018. Pada tahun 2015-2016, NoD tersebut dicatat dengan
  - menggunakan akun ekuitas sebagai kontra akun pencatatan akibat penerbitan SP3
    pada
  - TA 2018.
  - f. Koreksi Lainnya pada BUN Pengelolaan Transfer ke Daerah dan Dana Desa (TKDD)
  - Koreksi Lainnya pada BUN Pengeloaan TKDD pada TA 2018 dan TA 2017 masing-
  - masing sebesar minus Rp2.482.307.601.567 dan minus Rp499.016.564.819. Koreksi
  - 'Lainnya pada BUN Pengeloaan TKDD sebesar minus Rp2.482.307.601.567 terdiri dari:'
  - 1) Koreksi Piutang atas Reklasifikasi Piutang TKDD Lainnya menjadi Piutang Transfer
  - Ke Daerah (TKD) sebesar minus Rp525.000.898,171;
  - 2) Koreksi Utang atas Reklasifikasi Utang TKDD Lainnya menjadi Utang TKD sebesar
  - minus Rp1.132.751.524.393;
  - 3) Koreksi pencatatan berupa penyesuaian nilai kurang bayar tahun-tahun sebelum
  - 2018 sebesar minus Rp1.511.419.195.409;
  - 4) Koreksi pencatatan berupa penyesuaian nilai kurang bayar tahun-tahun sebelum
  - 2018 sebesar Rp686.864.016.406.
  - g. Koreksi Lainnya pada BUN Pengelolaan Belanja Subsidi dan Lain-lain (BSBL)
  - Koreksi Lainnya pada BUN Pengelolaan BSBL pada TA 2018 dan TA 2017 masing-
  - masing sebesar minus Rp449.954.500 dan minus Rp277.255.821. Koreksi Lainnya
  - pada BUN Pengelolaan Belanja Subsidi sebesar Rp449.954,500 berasal dari koreksi
    atas
  - saldo Kas di Bendahara Pengeluaran BUN Pengelolaan BSBL yang telah dilikuidasi,
    yaitu
  - Panwaslu Lampung tengah dan Panwaslu Tapanuli Utara.
