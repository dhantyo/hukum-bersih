  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 9 TAHUN 2019
  - TENTANG
  - PENGESAHAN PERJANJIAN ANTARA REPUBLIK INDONESIA DAN REPUBLIK
  - ISLAM IRAN TENTANG EKSTRADISI (TREATY BETWEEN THE REPUBLIC OF
  - INDONESIA AND THE ISLAMIC REPUBLIC OF IRAN ON EXTRADITION
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa untuk melindungi segenap bangsa Indonesia dan'
  - seluruh tumpah darah Indonesia, dan untuk memajukan
  - kesejahteraan umum, mencerdaskan kehidupan bangsa, dan
  - ikut melaksanakan ketertiban dunia yang berdasarkan
  - kemerdekaan, perdamaian abadi, dan keadilan sosial,
  - Pemerintah Republik Indonesia sebagai bagian dari
  - masyarakat internasional melakukan hubungan dan kerja
  - sama internasional yang diwujudkan dalam perjanjian
  - internasional;
  - b. bahwa untuk meningkatkan kerja sama di bidang penegakan
  - hukum, Pemerintah Republik Indonesia dan Pemerintah
  - Republik Islam Iran telah menandatangani Perjanjian antara
  - Republik Indonesia dan Republik Islam Iran tentang
  - Ekstradisi (Treaty between the Republic of Indonesia and
  - the Islamic Republic of Iran on Extradition) pada tanggal
  - 14 Desember 2016 di Tehran, Iran, sehingga perlu
  - ditindaklanjuti dengan melakukan pengesahan atas
  - Perjanjian tersebut sesuai dengan Undang-Undang Nomor
  - 24 Tahun 2000 tentang Perjanjian Internasional;
  - c. bahwa berdasarkan pertimbangan sebagaimana dimaksud
  - dalam huruf a dan huruf b, perlu membentuk Undang-
  - Undang tentang Pengesahan Perjanjian antara Republik
  - Indonesia dan Republik Islam Iran tentang Ekstradisi (Treaty
  - between the Republic of Indonesia and the Islamic Republic of
  - Iran on Extradition);
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Menyadari adanya pelaku kejahatan yang meloloskan diri dari
  - penyidikan, penuntutan, dan pelaksanaan pidana dari negara tempat
  - kejahatan dilakukan, Pemerintah Republik Indonesia dan Pemerintah
  - Republik Islam Iran telah sepakat mengadakan kerja sama Ekstradisi
  - yang telah ditandatangani pada tanggal 14 Desember 2016 di Tehran,
  - Iran. Dengan adanya perjanjian tersebut, hubungan dan kerja sama
  - antara kedua negara dalam bidang penegakan hukum dan
  - pemberantasan kejahatan atas dasar kerja sama yang saling
  - menguntungkan (mutual benefit), diharapkan semakin meningkat.
  - Dalam Perjanjian antara Republik Indonesia dan Republik Islam Iran
  - tentang Ekstradisi ini diatur antara lain mengenai kesepakatan Para
  - Pihak untuk melakukan ekstradisi, tindak pidana yang dapat
  - diekstradisikan, permintaan ekstradisi, alasan penolakan ekstradisi,
  - saluran komunikasi, otoritas pusat, penyerahan orang yang
  - diekstradisikan, biaya, kewajiban internasional, penyelesaian perbedaan,
  - dan amandemen perjanjian.
  - Dengan disahkannya Undang-Undang tentang Pengesahan
  - Perjanjian antara Republik Indonesia dan Republik Islam iran tentang
  - Ekstradisi (Treaty beiweer the Republic of Indonesia and the Islamic
  - Republic of Iran on Extradition) akan mendukung penegakan hukum di
  - Indonesia teritama yang berkaitan dengan kejahatan lintas negara
  - (transnational crime).
  - II. PASAL DEMI PASAL
  - Pasal 1
  - Cukup jelas.
  - Pasal 2
  - Cukup jelas.
  - TAMBAHAN LEMBARAN NEGARA REPUBLIK INDONESIA NOMOR 6371
