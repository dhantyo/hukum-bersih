  - REPUBLIK INDONESIA
  - DAN
  - REPUBLIK ISLAM IRAN
  - TENTANG
  - EKSTRADISI
  - Republik Indonesia dan Republik Islam Iran (selanjutnya disebut sebagai "Para
  - Pihak”);
  - Berkeinginan mengadakan kerja sama yang lebih efektif antara kedua negara
  - dalam pencegahan dan pemberantasan kejahatan berdasarkan saling
  - penghormatan terhadap kedaulatan, kesetaraan dan saling menguntungkan;
  - 'Telah menyetujui hal-hal sebagai berikut:'
  - PASAL1
  - KEWAJIBAN UNTUK MELAKUKAN EKSTRADISI
  - Setiap Pihak sepakat untuk melakukan ekstradisi kepada Pihak lainnya, sesuai
  - dengan ketentuan Perjanjian ini dan hukum domestiknya masing-masing, atas
  - setiap orang yang ditemukan berada di wilayah Pihak Diminta dan dicari oleh
  - Pihak Peminta untuk penuntutan, persidangan, atau pelaksanaan hukuman untuk
  - tindak pidana yang dapat diekstradisikan, meskipun tindak pidana tersebut
  - dilakukan sebelum atau setelah berlakunya Perjanjian ini.
  - PASAL 2
  - TINDAK PIDANA YANG DAPAT DIEKSTRADISIKAN
  - 1. Suatu tindak pidana merupakan tindak pidana yang dapat diekstradisikan,
  - apabila tindak pidana tersebut dapat dihukum menurut hukum kedua Pihak
