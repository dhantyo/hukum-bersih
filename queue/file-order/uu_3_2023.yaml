  - PERJANJIAN
  - ANTARA
  - PEMERINTAH REPUBLIK INDONESIA
  - DAN
  - PEMERINTAH REPUBLIK SINGAPURA
  - TENTANG
  - KERJA SAMA PERTAHANAN
  - Pemerintah Republik Indonesia dan Pemerintah Republik Singapura,
  - selanjutnya disebut “Para Pihak”;
  - Mengakui kepentingan yang sama antara kedua Negara untuk
  - meningkatkan hubungan bertetangga yang baik, hubungan yang
  - bersahabat dan kerjasama saling menguntungkan diantara mereka;
  - Menyadari nilai strategis dari hubungan khusus antara Tentara Nasional
  - Indonesia dan Angkatan Bersenjata Singapura, dan manfaat bersama
  - dalam pengembangan profesionalisme dan interoperabilitas dari kedua
  - Angkatan Bersenjata melalui kerjasama pertahanan yang sukses dan
  - telah berlangsung lama;
  - Mengakui bahwa Republik Singapura memiliki keterbatasan geografis
  - dan memiliki kebutuhan yang mendesak untuk daerah latihan;
  - Berkeinginan untuk meningkatkan dan memperkuat hubungan bilateral
  - yang telah ada antara Para Pihak melalui kegiatan kerjasama dibidang
  - pertahanan yang saling menguntungkan;
  - Memperhatikan bahwa peningkatan kerjasama pertahanan akan
  - memberi kontribusi pada hubungan pertahanan nasional kedua belah
  - pihak yang saling menguntungkan;
  - Mengingat prinsip-prinsip hukum internasional, khususnya yang
  - tercantum pada Piagam Perserikatan Bangsa Bangsa 26 Juni 1945,
  - Perjanjian Persahabatan dan Kerjasama di Asia Tenggara 24 Februari
  - 1976, Konvensi Hukum Laut Perserikatan Bangsa Bangsa 10 Desember
  - 1982 dan Perjanjian Zona Bebas Nuklir Asia Tenggara 15 Desember
  - 1995;
