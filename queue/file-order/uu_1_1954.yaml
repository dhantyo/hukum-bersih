title: Undang-Undang Nomor 1 Tahun 1954 tentang Penetapan Undangundang Darurat No
  11 Tahun 1952 Tentang Pengubahan Dan Penambahan Dari Quotordonnantie Op De Vennootschapsbelasting
  1925Quot Yang Memberikan Pula Aturan Kelengkapan Lebih Lanjut Mengenai Pajak Ini
  Lembarannegara No 83 Tahun 1952 Sebagai Undangundang
