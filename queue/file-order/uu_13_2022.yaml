  - No. 6801
  - Angka 16
  - Pasal 98
  - Ayat (1)
  - Yang dimaksud dengan “Perancang Peraturan Perundang-
  - undangan” adalah pegawai negeri sipil yang diberi tugas,
  - tanggung jawab, wewenang, dan hak, secara penuh oleh
  - pejabat yang berwenang untuk melakukan kegiatan
  - penyusunan Rancangan Peraturan Perundang-undangan
  - dan/atau instrumen hukum lainnya sesuai dengan
  - ketentuan Peraturan Perundang-undangan.
  - Ayat (1a)
  - Cukup jelas.
  - Ayat (2)
  - Cukup jelas.
  - Angka 17
  - Pasal 99
  - Yang dimaksud dengan “analis legislatif” adalah aparatur sipil
  - negara yang bertugas memberikan dukungan dalam
  - pembentukan Undang-Undang, Peraturan Daerah Provinsi, dan
  - Peraturan Daerah Kabupaten/Kota.
  - Yang dimaksud dengan “tenaga ahli” adalah tenaga ahli pada
  - alat kelengkapan DPR, DPD, serta DPRD Provinsi dan DPRD
  - Kabupaten/Kota.
  - Angka 18
  - Cukup jelas.
  - Angka 19
  - Cukup jelas.
  - Pasal II
  - Cukup jelas.
