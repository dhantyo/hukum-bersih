  first_page:
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 9 TAHUN 2012
  - TENTANG
  - PENGESAHAN OPTIONAL PROTOCOL TO THE CONVENTION ON THE RIGHTS
  - OF THE CHILD ON THE INVOLVEMENT OF
  - CHILDREN IN ARMED CONFLICT
  - (PROTOKOL OPSIONAL KONVENSI HAK-HAK ANAK MENGENAI
  - KETERLIBATAN ANAK DALAM KONFLIK BERSENJATA)
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa anak mempunyai hak untuk tumbuh dan'
  - berkembang secara sehat dan wajar baik jasmani dan
  - rohani maupun sosial dan intelektualnya, termasuk
  - dalam keadaan konflik bersenjata;
  - b. bahwa keterlibatan anak dalam konflik bersenjata baik
  - perekrutan maupun sasaran konflik bersenjata
  - merupakan pelanggaran terhadap hak-hak anak dan
  - dapat menimbulkan dampak yang serius dan jangka
  - panjang bagi tumbuh dan kembang anak;
  - c. bahwa selaras dengan keinginan bangsa Indonesia untuk
  - memberikan perlindungan terhadap anak khususnya
  - keterlibatan anak dalam konflik bersenjata yang
  - merupakan komitmen bersama masyarakat internasional
  - sebagaimana diwujudkan dalam Optional Protocol to the
  - Convention on the Rights of the Child on the Involvement of
  - Children in Armed Conflict (Protokol Opsional Konvensi
  - Hak-hak Anak mengenai Keterlibatan Anak dalam Konflik
  - Bersenjata);
  last_page:
  - LAMPIRAN
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 9 TAHUN 2012
  - TENTANG
  - PENGESAHAN OPTIONAL PROTOCOL TO THE CONVENTION ON THE RIGHTS OF
  - THE CHILD ON THE INVOLVEMENT OF CHILDREN IN ARMED CONFLICT
  - (PROTOKOL OPSIONAL KONVENSI HAK-HAK ANAK MENGENAI
  - KETERLIBATAN ANAK DALAM KONFLIK BERSENJATA)
  - DECLARATION PURSUANT TO THE ARTICLE 3 PARAGRAPH 2 OF THE OPTIONAL
  - PROTOCOL TO THE CONVENTION ON THE RIGHTS OF THE CHILD ON THE
  - INVOLVEMENT OF CHILDREN IN ARMED CONFLICT
  - 'Declaration:'
  - The Government of the Republic of Indonesia declares in pursuant to Article 3
  - Paragraph 2 of the Optional Protocol to the Convention on the Rights of the Child
  - 'on the Involvement of Children in Armed Conflict that:'
  - The minimum age for voluntary recruitment into the Indonesian National Armed
  - Forces is 18 years old. Further, Article 28 Paragraph (1) d of the Law Number
  - 34 Year 2004 on the Indonesian National Armed Forces regulates that “at the
  - time of inauguration as a Soldier, he/she shall be 18 (eighteen) years old at
    the
  - minimum”.
  - The recruitment of the member of the Indonesian National Armed Forces is
  - genuinely voluntary. It is conducted openly and the public announcement is
  - carried out by utilizing various means of communication and information
  - technology. The recruitment requires, among others, birth certificate and proof
  - of consent of parents or legal guardians, including for those who have aged
  - 18 years.
  - PRESIDENT OF THE REPUBLIC OF INDONESIA,
  - signed
  - DR. H. SUSILO BAMBANG YUDHOYONO
  - Salinan sesuai dengan aslinya
  - KEMENTERIAN SEKRETARIAT NEGARA RI
  - Asisten Deputi Hukum,
  - Suripto
- bpk_file_id: 28438
  filename: Lampiran UU 009 2012.pdf
  pages: 6
  first_page:
  - PROTOKOL OPSIONAL KONVENSI HAK-HAK ANAK
  - MENGENAI
  - KETERLIBATAN ANAK DALAM KONFLIK BERSENJATA
  - Negara-Negara Pihak pada Protokol ini,
  - Didorong oleh dukungan penuh terhadap Konvensi tentang Hak-Hak Anak, yang menunjukkan
  - komitmen luas yang ada untuk berupaya dengan segala daya bagi pemajuan dan perlindungan
  - hak-hak anak,
  - Menegaskan kembali bahwa hak-hak anak memerlukan perlindungan khusus dan menghimbau
  - untuk terus memperbaiki situasi anak tanpa pembedaan, serta untuk perkembangan
    dan
  - pendidikan mereka dalam kondisi damai dan aman,
  - Khawatir atas dampak yang merusak dan meluas dari konflik bersenjata pada anak-anak
    dan
  - konsekuensi jangka panjang dari hal tersebut bagi perdamaian abadi, keamanan dan
  - pembangunan,
  - Mengutuk dijadikannya anak sebagai target dalam berbagai situasi konflik bersenjata
    dan
  - serangan-serangan langsung terhadap berbagai objek yang dilindungi oleh hukum
    internasional,
  - termasuk tempat-tempat yang secara umum dihadiri oleh anak-anak dalam jumlah yang
  - signifikan, seperti sekolah dan rumah sakit,
  - Mencatat diadopsinya Statuta Mahkamah Pidana Internasional dan, khususnya, digolongkannya
  - tindakan merekrut atau memasukan anak di bawah usia 15 tahun atau menggunakan
    mereka untuk
  - terlibat secara aktif dalam peperangan baik dalam konflik bersenjata internasional
    maupun non-
  - internasional sebagai sebuah kejahatan perang,
  - Mempertimbangkan, oleh karenanya, bahwa untuk lebih memperkuat implementasi hak-hak
    yang
  - diakui dalam Konvensi Hak-Hak Anak, terdapat kebutuhan untuk meningkatkan perlindungan
  - anak dari keterlibatan dalam konflik bersenjata,
  - Mencatat bahwa Pasal 1 dari Konvensi Hak-Hak Anak mengatur secara spesifik bahwa,
    untuk
  - tujuan Konvensi ini, anak adalah setiap orang yang berusia dibawah l8 tahun kecuali
    diatur oleh
  - hukum yang berlaku terhadap anak, mayoritas dicapai terlebih dulu,
  - Meyakini bahwa sebuah protokol opsional terhadap Konvensi tersebut yang menaikkan
    batas
  - umur perekrutan yang dimungkinkan bagi orang-orang untuk menjadi anggota angkatan
  - bersenjata dan partisipasi mereka dalam peperangan akan secara efektif berkontribusi
    terhadap
  - penerapan prinsip bahwa kepentingan terbaik bagi anak harus menjadi pertimbangan
    utama dalam
  - semua tindakan yang menyangkut anak,
  last_page:
  - menandatangani Konvensi Hak-Hak Anak. Penarikan diri tersebut akan berlaku satu
    tahun
  - setelah tanggal penerimaan pemberitahuan oleh Sekretaris Jenderal Perserikatan
    Bangsa-
  - Bangsa. Namun, jika, pada tahun berakhirnya penarikan diri tersebut Negara Pihak
    terlibat
  - dalam konflik bersenjata, penarikan diri tersebut tidak dapat berlaku sebelum
    berakhirnya
  - konflik bersenjata.
  - 2. Penarikan diri tersebut tidak akan berdampak pada bebasnya Negara Pihak tersebut
    dari
  - kewajiban-kewajibannya di bawah Protokol berkaitan dengan setiap tindakan yang
    terjadi
  - sebelum tanggal penarikan diri berlaku. Tidak juga penarikan diri semacam itu
    boleh
  - mengurangi dengan cara apapun pertimbangan yang berlanjut atas segala permasalahan
    yang
  - sedang dalam pembahasan Komite sebelum tanggal penarikan diri mulai berlaku.
  - Pasal 12
  - 1. Suatu Negara Pihak dapat mengusulkan sebuah amendemen dan mengajukannya kepada
  - Sekretaris Jenderal Perserikatan Bangsa-Bangsa. Sekretaris Jenderal harus segera
    setelah itu
  - mengkomunikasikan usulan amendemen tersebut kepada Negara-Negara Pihak, dengan
  - permintaan bahwa mereka menandakan apakah mereka mendukung diadakannya sebuah
  - konferensi Negara-Negara Pihak dengan tujuan untuk mempertimbangkan dan mengambil
  - suara atas proposal tersebut. Dalam keadaan di mana, dalam empat bulan sejak tanggal
  - komunikasi tersebut, setidaknya satu per tiga Negara Pihak menyetujui konferensi
    tersebut,
  - Sekretaris Jenderal harus mengadakan konferensi di bawah naungan Perserikatan
    Bangsa-
  - Bangsa. Setiap amendemen yang diadopsi oleh mayoritas Negara Pihak yang hadir
    dan
  - memberikan suara pada konferensi harus diserahkan kepada Majelis Umum untuk
  - persetujuan.
  - 2. Suatu amendemen yang diadopsi sesuai dengan ayat (1) dari Pasal ini harus berlaku
    ketika
  - telah disetujui oleh Majelis Umum Perserikatan Bangsa-Bangsa dan diterima oleh
    dua per tiga
  - mayoritas Negara Pihak.
  - 3. Ketika sebuah amandemen berlaku, amendemen tersebut harus mengikat para Negara
    Pihak
  - yang menerimanya, Negara Pihak lain yang masih terikat oleh ketentuan-ketentuan
    Protokol
  - ini, dan semua amendemen sebelumnya yang telah mereka terima.
  - Pasal 13
  - 1. Protokol ini, yang teks berbahasa Arab, China, Inggris, Perancis, Rusia dan
    Spanyol sama
  - otentiknya, harus disimpan dalam arsip Perserikatan Bangsa-Bangsa.
  - 2. Sekretaris Jenderal Perserikatan Bangsa-Bangsa harus mengirimkan salinan resmi
    Protokol ini
  - kepada semua Negara Pihak Konvensi dan semua Negara yang telah menandatangani
  - Konvensi.
