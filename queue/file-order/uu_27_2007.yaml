  first_page:
  - PENJELASAN
  - ATAS
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 27 TAHUN 2007
  - TENTANG
  - PENGELOLAAN WILAYAH PESISIR DAN PULAU-PULAU KECIL
  - I. UMUM
  - 1. Dasar Pemikiran
  - Dalam satu dekade ini terdapat kecenderungan bahwa Wilayah
  - Pesisir dan Pulau-Pulau Kecil yang rentan mengalami kerusakan akibat
  - aktivitas Orang dalam memanfaatkan sumber dayanya atau akibat
  - bencana alam. Selain itu, akumulasi dari berbagai kegiatan eksploitasi
  - yang bersifat parsial/sektoral di Wilayah Pesisir dan Pulau-Pulau Kecil
  - atau dampak kegiatan lain di hulu wilayah pesisir yang didukung
  - peraturan perundang-undangan yang ada sering menimbulkan
  - kerusakan Sumber Daya Pesisir dan Pulau-Pulau Kecil. Peraturan
  - perundang-undangan yang ada lebih berorientasi pada eksploitasi
  - Sumber Daya Pesisir dan Pulau-Pulau Kecil tanpa memperhatikan
  - kelestarian sumber daya. Sementara itu, kesadaran nilai strategis dari
  - pengelolaan wilayah pesisir dan pulau-pulau kecil secara
  - berkelanjutan, terpadu, dan berbasis masyarakat relatif kurang.
  - Kurang dihargainya hak masyarakat adat/lokal dalam pengelolaan
  - Sumber Daya Pesisir dan Pulau-Pulau Kecil seperti sasi, mane’e,
  - panglima laot, awig-awig, terbatasnya ruang untuk partisipasi
  - masyarakat dalam pengelolaan Sumber Daya Pesisir dan Pulau-Pulau
  - Kecil menunjukkan bahwa prinsip pengelolaan pesisir dan pulau-pulau
  - kecil terpadu belum terintegrasi dengan kegiatan pembangunan dari
  - berbagai sektor dan daerah. Sistem pengelolaan pesisir tersebut belum
  - mampu mengeliminasi faktor-faktor penyebab kerusakan dan belum
  - memberi kesempatan kepada sumber daya hayati untuk dapat pulih
  - kembali secara alami atau sumber daya nonhayati disubstitusi dengan
  - sumber daya lain.
  - Oleh sebab itu, keunikan wilayah pesisir dan pulau-pulau kecil
  - yang rentan berkembangnya konflik dan terbatasnya akses
  - pemanfaatan bagi masyarakat pesisir dan pulau-pulau kecil, perlu
  - dikelola secara baik agar dampak aktivitas manusia dapat dikendalikan
  - dan sebagian wilayah pesisir dipertahankan untuk konservasi.
  - Masyarakat perlu didorong untuk mengelola wilayah pesisirnya dengan
