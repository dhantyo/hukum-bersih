  - Daftar Parameter Karakteristik bagi Skrening Kejadian
  - Standar Pusat Dana Internasional
  - 1. Kriteria pemantauan kejadian standar Pusat Data Internasional harus berdasarkan
  - pada parameter karakteristik kejadian standar yang ditentukan selama proses penggabungan
    data dari
  - semua teknologi pemantauan di sistem pemantauan internasioanal . Pemantauan kejadian
    standar harus
  - menggunakan baik kriteria global maupun tambahan untuk mempertimbangkan variasi
    regional yang
  - memungkinkan
  - 2. Bagi kejadian yang dideteksi oleh komponen seismik sistem pemantauan
  - 'Internasional, parameter berikut ini dapat dipergunakan :'
  - '- Lokasi Kejadian ;'
  - '- Dalamnya kejadian ;'
  - '- Perbandingan besarnya gelombang dipermukaan ke badan gelombang ;'
  - '- Isi frekuensi sinyal ;'
  - '- Fase perbandingan spektrum ;'
  - '- Lekukan spektrum ;'
  - '- Gerakan pertama gelombang P ;'
  - '- Mekanisme fokal ;'
  - '- Kebangkitan relatif'
  - '- Ukuran perbandingan terhadap kejadian lain dan kelompok kejadian : dan'
  - '- Diskriminasi wilayah bila diterapkan'
  - 3. Kejadian yang dideteksi oleh komponen hidroakustik sistem pemantauan
  - 'Internasioanl, parameter berikut dapat digunakan , antara lain :'
  - '- Isi frekuensi sinyal termasuk frekuensi sudut, energi ukuran luas frekuensi'
  - pusat utama dan ukuran lebar ;
  - '- Frekuensi tergantung lamanya sinyal ;'
  - '- Perbandingan spektrum ;'
  - '- Indikasi signal gelombang pulsa dan penundaan gelembung pulsa'
  - 4. Kejadian yang dideteksi oleh komponen infra merah, parameter berikut dapat
  - 'digunakan, antara lain :'
  - '- Isi Frekuensi sinyal dan dispersi ;'
  - '- Lamanya sinyal; dan'
  - '- Puncak tertinggi .'
  - 5. Kejadian yang dideteksi oleh komponen radionuklida sistem pemantauan
