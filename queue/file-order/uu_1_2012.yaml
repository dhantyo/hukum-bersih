  first_page:
  - TRAKTAT PELARANGAN MENYELURUH
  - UJI – COBA NUKLIR
  - PEMBUKAAN
  - Negara – negara Pihak pada Konvensi ini (dalam hal ini disebut “ Negara–Negara
    Pihak”)
  - Menyambut baik perjanjian–perjanjian internasional dan langkah–langkah positif
    lainnya akhir–akhir
  - ini dibidang perlucutan senjata nuklir, termasuk berbagai pengurangan arsenal
    senjata nuklir, maupun
  - dibidang pencegahan proliferasi nuklir dan segala aspeknya,
  - Menggarisbawahi pentingnya pelaksanaan perjanjian–perjanjian dan langkah–langkah
    termaksud
  - secara penuh dan segera,
  - Berkeyakinan bahwa situasi internasional saat ini memberikan kesempatan untuk
    mengambil
  - langkah efektif lebih lanjut terhadap perlucutan senjata nuklir dan terhadap proliferasi
    senjata nuklir dan
  - segala aspeknya, dan menyatakan keinginan mereka untuk mengambil langkah – langkah
    tersebut,
  - Menekankan perlunya usaha–usaha sistematik dan progresif secara terus menerus
    untuk
  - mengurangi senjata nuklir secara global, dengan tujuan utama menghapuskan senjata
    tersebut, dan
  - perlucutan senjata secara umum dan menyeluruh dibawah pengawasan internasional
    yang ketat dan
  - efektif,
  - Mengakui bahwa penghentian semua uji coba ledakan senjata nuklir dan semua ledakan
    nuklir lain,
  - dengan cara menghambat perkembangan dan perbaikan kualitatif senjata nuklir dan
    menghentikan
  - perkembangan senjata nuklir canggih tipe baru, merupakan langkah efektif bagi
    perlucutan senjata nuklir
  - dan non proliferasi dalam segala aspeknya,
  - Lebih lanjut mengakui bahwa penghentian semua ledakan nuklir tersebut akan merupakan
  - langkah yang berarti bagi terwujudnya suatu proses yang sistematik untuk mencapai
    perlucutan senjata
  - nuklir,
  - Berkeyakinan bahwa cara paling efektif untuk mengakhiri uji coba nuklir adalah
    melalui
  - perampungan trakta pelarangan menyeluruh uji coba nuklir secara universal dan
    dapat diverifikasi secara
  - internasional dan efektif, yang sejak lama menjadi tujuan prioritas utama masyarakat
    internasional di
  - bidang perlucutan senjata dan non proliferasi.
  - Mencatat aspirasi–aspirasi yang dicetuskan oleh para pihak Traktat Pelarangan
    Uji Coba Senjata
  - Nuklir di Atmosfir, Ruang Angkasa dan Bawah Air tahun 1963 untuk mencari pencapaian
    tidak
  - dilanjutkannya semua uji ledakan senjata nuklir sepanjang masa,
  - Mencatat pula pandangan–pandangan yang menyatakan bahwa Traktat ini dapat memberi
  - sumbangan bagi perlindungan lingkungan hidup,
  - Menegaskan maksud untuk menarik kepatuhan semua nega terhadap Traktat dan tujuannya
    untuk
  - member sumbangan efektif bagi pencegahan proliferasi senjata nuklir dan segala
    aspeknya, bagi proses
  - perlucutan senjata nuklir dan akhirnya bagi peningkatan perdamaian dan keamanan
    dunia.
