  first_page:
  - REPUBLIK INDONESIA
  - PERJANJIAN EKSTRADISI
  - ANTARA
  - REPUBLIK INDONESIA
  - DAN
  - REPUBLIK INDIA
  - Pemerintah Republik Indonesia dan Pemerintah Republik India (selanjutnya disebut
  - sebagai “Para Pihak”);
  - Berkeinginan mengadakan kerja sama yang lebih efektif antara kedua Negara dalam
  - pemberantasan kejahatan berdasarkan saling penghormatan terhadap kedaulatan,
  - kesetaraan dan saling menguntungkan;
  - 'TELAH MENYETUJUI sebagai berikut:'
  - PASAL 1
  - KEWAJIBAN UNTUK MELAKUKAN EKSTRADISI
  - Masing-masing Pihak sepakat untuk saling melakukan ekstradisi, sesuai dengan
  - ketentuan Perjanjian ini, setiap orang yang ditemukan berada di wilayah Negara
  - Diminta dan dicari oleh Negara Peminta untuk penuntutan atau penjatuhan atau
  - pelaksanaan hukuman untuk tindak pidana yang dapat diekstradisikan, meskipun tindak
  - pidana tersebut dilakukan sebelum atau setelah berlakunya Perjanjian ini.
  - PASAL 2
  - TINDAK PIDANA YANG DAPAT DIEKSTRADISIKAN
  - 1. Suatu tindak pidana merupakan tindak pidana yang dapat diekstradisikan, apabila
  - tindak pidana tersebut dapat dihukum menurut hukum kedua Pihak, dengan
  - ancaman pidana penjara paling sedikit satu tahun atau dengan hukuman yang
  - lebih berat.
  - 2. Suatu tindak pidana juga merupakan tindak pidana yang dapat diekstradisikan,
  - apabila tindak pidana tersebut meliputi suatu percobaan atau permufakatan jahat
  - untuk melakukan, pembantuan atau penganjuran, pemberian nasehat atau
  - pemberian kesempatan, atau penyertaan untuk melakukan tindak pidana
  - sebagaimana tersebut pada Ayat Pertama.
  - 3. Menurut Pasal ini, dalam menentukan apakah suatu perbuatan merupakan tindak
  - pidana berdasarkan hukum kedua Pihak, tidak menjadi persoalan apakah hukum
  - para Pihak menempatkan perbuatan yang dilakukan dalam golongan tindak
  - pidana yang sama atau menyebutkan tindak pidana tersebut dengan terminologi
  - yang sama. Keseluruhan perbuatan yang dituduhkan akan dipertimbangkan,
  - terlepas adanya perbedaan elemen-elemen dasar tindak pidana yang dimintakan
  - ekstradisinya.
