  - PRESIDEN
  - REPUBLIK INDONESIA
  - Republic of Indonesia and the Swiss Confederation) pada tanggal
  - 4 Februari 2019 di Bern, Swiss. Untuk lebih meningkatkan efektivitas
  - kerja sama di bidang hukum dalam penanggulangan dan pemberantasan
  - tindak pidana, terutama yang bersifat transnasional, perjanjian bantuan
  - timbal balik dalam masalah pidana harus memperhatikan prinsip umum
  - hukum internasional yang menitikberatkan pada asas penghormatan
  - kedaulatan negara dan kedaulatan hukum, kesetaraan, dan saling
  - menguntungkan serta mengacu pada asas tindak pidana ganda (double
  - criminality).
  - Perjanjian tentang Bantuan Hukum Timbal Balik dalam Masalah
  - Pidana antara Republik Indonesia dan Konfederasi Swiss (Treaty on
  - Mutual Legal Assistance in Criminal Matters between the Republic of
  - Indonesia and the Swiss Confederation) ini mengatur antara lain mengenai
  - ruang lingkup bantuan hukum timbal balik, otoritas pusat, prosedur
  - pelaksanaan bantuan, biaya, kewajiban internasional, konsultasi,
  - penyelesaian perselisihan, dan amendemen perjanjian.
