  - Selanjutnya disebut sebagai Para Pihak
  - MENIMBANG ikatan persahabatan dan kerja sama yang menyatukan keduanya;
  - MENGAKUI bahwa upaya melawan kejahatan lintas negara adalah tanggung
  - jawab bersama masyarakat internasional;
  - MENYADARI perlunya untuk memperkuat kerja sama hukum, terutama bantuan
  - hukum timbal balik, untuk mencegah meningkatnya tindak pidana;
  - BERKEINGINAN untuk saling memberikan bantuan hukum timbal balik seluas-
  - luasnya guna memerangi kejahatan dan meningkatkan efektivitas kerja sama
  - dalam penyidikan, penuntutan dan penjatuhan pidana;
  - DENGAN MEMPERHATIKAN Konstitusi, dan peraturan perundang-undangan
