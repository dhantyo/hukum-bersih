  - 2. Jede der beiden Vertragsparteien kann diesen Vertrag jederzeit durch
  - schriftliche Mitteilung an die andere Vertragspartei auf diplomatischem Weg
  - kündigen. In diesem Fall tritt der Vertrag sechs Monate nach Erhalt dieser
  - Mitteilung ausser Kraft. Auf laufende Rechtshilfeverfahren hat die Kündigung
  - keine Auswirkungen.
  - ZU URKUND DESSEN haben die von ihren Regierungen hierzu gehörig
  - Bevollmächtigten diesen Vertrag unterzeichnet.
  - GESCHEHEN in Bern, am 4. Februar 2019, in zwei Urschriften in englischer,
  - indonesischer und deutscher Sprache, wobei jeder Wortlaut gleichermassen
  - verbindlich ist. Im Falle von sich widersprechenden Auslegungen ist die englische
  - Fassung massgebend.
