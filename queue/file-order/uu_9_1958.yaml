  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - MEMORI PENJELASAN
  - MENGENAI
  - USUL UNDANG-UNDANG TENTANG PINJAMAN
  - REPUBLIK INDONESIA DARI REPUBLIK-REPUBLIK SOVIET SOSIALIS.
  - Pada tanggal 15 September 1956 telah ditanda-tangani Persetujuan Pokok tentang
  - kerja-sama dalam lapangan ekonomi dan teknik antara Republik Indonesia dan Uni
  - Republik-republik Soviet Sosialis.
  - Persetujuan tersebut selain memuat ketentuan tentang kerja-sama dalam pembangunan
  - perusahaan-perusahaan industri dan perusahaan-perusahaan lainnya yang dibutuhkan
  - untuk perkembangan ekonomi Indonesia, memuat pula kesediaan Uni Republik-republik
  - Soviet Sosialis untuk memberikan kredit sampai jumlah seharga US.$ 100 juta kepada
  - Pemerintah Republik Indonesia.
  - Pada hakekatnya yang terpenting di dalam Persetujuan Pokok tersebut adalah
  - kemungkinan mendapatkan kredit yang akan dipergunakan untuk pembelian barang-
  - barang yang diperlukan bagi pembangunan ekonomi negara atas dasar pertimbangan-
  - pertimbangan yang lazim mengenai harga, mutu dan waktu penyerahan. Barang-barang
  - 'yang dimaksudkan akan terdiri antara lain dari: alat-alat pembangkit tenaga listrik,'
  - pembuatan jalan, pertambangan.
  - Maksud rancangan Undang-undang ini ialah untuk mendapatkan persetujuan Dewan
  - Perwakilan Rakyat atas kredit tersebut, sesuai dengan pasal 1 18 Undang-undang
    Dasar
  - Sementara.
  - PENJELASAN PASAL DEMI PASAL
  - Oleh karena pasal-pasal dalam rancangan Undang-undang ini telah cukup jelas,
  - maka tidak perlu diadakan penjelasan pasal demi pasal lagi.
  - 'Diketahui:'
  - Menteri Kehakiman,
  - ttd
  - G. A. MAENGKOM.
  - TAMBAHAN LEMBARAN NEGARA REPUBLIK INDONESIA NOMOR 1550
- bpk_file_id: 40927
  filename: UU Nomor 9 Tahun 1958(LAMPIRAN).pdf
  pages: 6
  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - PERSETUJUAN POKOK TENTANG KERJA-SAMA DALAM LAPANGAN
  - EKONOMI DAN TEKNIK ANTARA REPUBLIK INDONESIA
  - DAN UNI REPUBLIK-REPUBLIK SOVIET SOSIALIS
  - Dengan keinginan untuk memperkembangkan kerja-sama ekonomi dan teknik antara
  - kedua negara berdasarkan hak sama rata dan saling menguntungkan, Pemerintah Republik
  - Indonesia dan Pemerintah Uni Republik-republik Soviet Sosialis telah mencapai
  - 'persetujuan sebagai berikut :'
  - Pasal 1.
  - Pemerintah Uni Republik-republik Soviet Sosialis menyetujui untuk kerja-sama dengan
  - Pemerintah Republik Indonesia dalam pembangunan perusahaan-perusahaan industri
    dan
  - perusahaan-perusahaan lainnya yang dibutuhkan untuk perkembangan ekonomi Republik
  - Indonesia. Banyak dan sifatnya perusahaan-perusahaan yang akan didirikan dengan
  - bantuan Uni Republik-republik Soviet Sosialis akan ditentukan selanjutnya atas
    dasar
  - saling persetujuan antara kedua belah pihak berhubung dengan penyelesaian pekerjaan-
  - pekerjaan pemeriksaan (exploration) dan pekerjaan-pekerjaan penyelidikan (research)
  - yang dimaksudkan dalam pasal ke-2.
  - Pasal 2.
  - Atas permintaan Pemerintah Republik Indonesia, organisasi-organisasi Uni Republik-
  - republik Soviet Sosialis dengan kerja-sama dengan organisasi-organiasi Indonesia
    mulai
  - melakukan pekerjaan-pekerjaan pemeriksaan dan penyelidikan pada tahun 1957, untuk
  - mempelajari dan menaksirkan kekayaan alam Republik Indonesia, antara lain sumber-
  - sumber (receurce) batu bara, deposit bijih logam-logam non-ferreus, sumber-sumber
  - tenaga hydro-hstrik, bahan-balian mentah untuk perusahaan-perusahaan industri
    bahan
  - bangunan. Daftar nama pekerjaan-pekerjaan, besarnya (volume) dan waktu penyelesaian
  - pekerjaan-pekerjaan pemeriksaan dan penyelidikan itu serta juga sifat ikut-sertanya
    kedua
  - belah pihak dalam pekerjaan-pekerjaan itu akan ditentukan dalam perjanjian-perjanjian
  - tambahan yang akan diadakan sesuai dengan persetujuan pokok ini.
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Pasal 11.
  - Penyelesaian pekerjaan-pekerjaan pemeriksaan, penyelidikan dan perencanaan yang
  - dimaksudkan oleh persetujuan pokok ini, penyerahan perlengkapan-perlengkapan dan
  - bahan-bahan konstruksi, pengiriman para, ahli Uni Republik-republik Soviet Sosialis
    ke
  - Republik Indonesia dan penerimaan bangsa Indonesia di Uni Republik-republik Soviet
  - Sosialis, akan dilakukan oleh orgamsasi-organisasi Indonesia, yang diberi kuasa
    oleh
  - Pemerintah Indonesia untuk keperluan itu.
  - Dalam kontrak-kontrak itu akan ditetapkan secara detail, besarnya (volume), harga-
  - harga, waktu dan syarat-syarat lain dari penyerahan perlengkapan dan bahan-bahan
  - konstruksi, pemberian jasa-jasa (service-service) yang dimaksudkan oleh persetujuan
  - pokok ini.
  - Kontrak-kontrak untuk penyerahan perlengkapan-perlengkapan dan bahan-bahan
  - konstruksi harus ditutup dalam waktu 5 tahun, terhitung mulai tanggal persetujuan
    pokok
  - ini. Persetujuan pokok ini akan disahkan dan mulai berlaku pada tanggal pertukaran
  - piagam pengesahan yang akan diadakan di Moscow.
  - Dibuat dan ditanda-tangani di Jakarta pada tanggal 15 September 1956 dalam
  - rangkap dua yang asli, masing-masing tertulis dalam bahasa Indonesia dan bahasa
    Rusia,
  - yang kedua-duanya sama nilainya.
  - Wakil Yang Berkuasa Penuh Wakil Yang Berkuasa Penuh
  - dari Pemerintah Republik dari Pemerintah Uni Republik-
  - Indonesia, republik Soviet Sosialis,
  - ttd ttd
  - Dr. SOEBANDRIO J.F. SEMICHASNOV.
  - Disetujui D.P.R. dalam rapat pleno terbuka ke-17 tanggal 5 Pebruari 1958, pada
    hari
  - Rabu, P. 228/1958.
