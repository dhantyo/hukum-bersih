id: uu_10_2012
title: Undang-Undang Nomor 10 Tahun 2012 tentang Pengesahan Optional Protocol To The
  Convention On The Rights Of The Child On The Sale Of Children, Child Prostitution
  And Child Pornography (Protokol Opsional Konvensi Hak-Hak Anak Mengenai Penjualan
  Anak, Prostitusi Anak, Dan Pornografi Anak)
files:
- bpk_file_id: 28434
  filename: UU Nomor 10 Tahun 2012.pdf
  pages: 10
  first_page:
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 10 TAHUN 2012
  - TENTANG
  - PENGESAHAN OPTIONAL PROTOCOL TO THE CONVENTION ON THE RIGHTS
  - OF THE CHILD ON THE SALE OF CHILDREN, CHILD PROSTITUTION AND
  - CHILD PORNOGRAPHY
  - (PROTOKOL OPSIONAL KONVENSI HAK-HAK ANAK MENGENAI PENJUALAN
  - ANAK, PROSTITUSI ANAK, DAN PORNOGRAFI ANAK)
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa anak mempunyai hak untuk dilindungi dari'
  - eksploitasi ekonomi dan bekerja pada pekerjaan yang
  - membahayakan atau mengganggu pendidikan anak,
  - merusak kesehatan fisik, mental, spiritual, moral, dan
  - perkembangan sosial anak;
  - b. bahwa kegiatan penjualan anak, prostitusi anak, dan
  - pornografi anak merupakan kejahatan terhadap
  - kemanusiaan yang harus diberantas;
  - c. bahwa Indonesia sebagai bagian dari masyarakat
  - internasional harus turut serta secara aktif dalam rangka
  - mencegah, memberantas, dan menghukum pelaku tindak
  - pidana penjualan anak, prostitusi anak, dan pornografi
  - anak yang diwujudkan dalam Optional Protocol to the
  - Convention on the Rights of the Child on the Sale of
  - Children, Child Prostitution and Child Pornography
  - (Protokol Opsional Konvensi Hak-hak Anak mengenai
  - Penjualan Anak, Prostitusi Anak, dan Pornografi Anak);
  last_page:
  - o. memperkuat kerja sama internasional untuk mengatasi akar
  - masalah, seperti kemiskinan dan ketidakberdayaan yang
  - melandasi kerentanan anak-anak terhadap terjadinya
  - penjualan anak-anak, prostitusi anak, pornografi anak;
  - p. menyerahkan laporan dalam waktu dua tahun setelah
  - berlakunya Protokol untuk setiap Pihak, kepada Komite Hak-
  - hak Anak mengenai informasi yang komprehensif tentang
  - tindakan-tindakan yang diambil untuk implementasi ketentuan
  - dalam Protokol.
  - II. PASAL DEMI PASAL
  - Pasal 1
  - Ayat (1)
  - Cukup jelas.
  - Ayat (2)
  - Apabila terjadi perbedaan penafsiran terhadap terjemahan
  - dalam bahasa Indonesia, maka yang dipergunakan adalah
  - naskah asli Protokol Opsional dalam bahasa Inggris.
  - Pasal 2
  - Cukup jelas.
  - TAMBAHAN LEMBARAN NEGARA REPUBLIK INDONESIA NOMOR 5330
- bpk_file_id: 28435
  filename: Lampiran UU 010 2012.pdf
  pages: 11
  first_page:
  - PROTOKOL OPSIONAL KONVENSI HAK-HAK ANAK
  - MENGENAI
  - PENJUALAN ANAK, PROSTITUSI ANAK, DAN PORNOGRAFI ANAK
  - Negara-Negara Pihak pada Protokol ini,
  - Mempertimbangkan bahwa, untuk lebih lanjut mencapai tujuan Konvensi Hak-Hak Anak
    dan
  - implementasi ketentuan-ketentuannya, terutama Pasal 1, 11, 21, 32, 33, 34, 35,
    dan 36, selayaknya
  - diperluas langkah-langkah yang Negara-Negara Pihak harus lakukan untuk menjamin
  - perlindungan anak dari penjualan anak, prostitusi anak, dan pornografi anak,
  - Mempertimbangkan juga bahwa Konvensi Hak-Hak Anak mengakui hak anak untuk dilindungi
  - dari eksploitasi ekonomi dan dari pekerjaan yang dapat membahayakan atau mengganggu
  - pendidikan anak, atau merusak kesehatan atau perkembangan fisik, mental, spiritual,
    moral, atau
  - sosial anak,
  - Sangat prihatin terhadap perdagangan internasional anak yang semakin bertambah
    dan meningkat
  - untuk tujuan penjualan anak, prostitusi anak, dan pornografi anak,
  - Prihatin secara mendalam terhadap praktik pariwisata seks yang terus meluas dan
    berlanjut, di
  - mana anak khususnya rentan terhadap praktik ini, karena secara langsung mendorong
    penjualan
  - anak, prostitusi anak dan pornografi anak,
  - Mengakui bahwa sejumlah kelompok rentan pada khususnya, termasuk anak perempuan,
    beresiko
  - lebih besar terhadap eksploitasi seksual, dan bahwa anak perempuan tidak mendapat
    perhatian
  - secara proposional di antara mereka yang tereksploitasi secara seksual,
  - Prihatin akan bertambahnya pornografi anak di internet dan teknologi yang sedang
    berkembang
  - lainnya, dan mengingat kembali Konferensi Internasional tentang Memerangi Pornografi
    Anak di
  - Internet (Wina, 1999) dan, khususnya, kesimpulan Konferensi Internasional tersebut
    yang
  - menyerukan kriminalisasi mendunia atas produksi, distribusi, ekspor, pemindahan,
    impor,
  - kepemilikan pribadi, dan periklanan pornografi anak, serta menekankan pentingnya
    kerja sama
  - yang lebih erat dan kemitraan antara pemerintah dan industri internet,
  - Mempercayai bahwa penghapusan penjualan anak, prostitusi anak, dan pornografi
    anak akan
  - difasilitasi dengan diterimanya suatu pendekatan yang menyeluruh yang mengatasi
    faktor-faktor
  last_page:
  - Pasal 17
  - 1. Protokol ini, yang teks berbahasa Arab, China, Inggris, Perancis, Rusia dan
    Spanyol sama
  - otentiknya, harus disimpan dalam arsip Perserikatan Bangsa-Bangsa.
  - 2. Sekretaris Jenderal Perserikatan Bangsa-Bangsa harus mengirimkan salinan resmi
    Protokol ini
  - kepada semua Negara Pihak Konvensi dan semua Negara yang telah menandatangani
  - Konvensi.
