  filename: UU Nomor 4 Tahun 2021.pdf
  pages: 7
  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 4 TAHUN 2021
  - TENTANG
  - PENGESAHAN ASEAN AGREEMENT ON ELECTRONIC COMMERCE (PERSETUJUAN
  - ASEAN TENTANG PERDAGANGAN MELALUI SISTEM ELEKTRONIK)
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa kegiatan perdagangan merupakan salah satu sektor'
  - utama penggerak perekonomian nasional yang dapat
  - dilakukan melalui kerja sama perdagangan internasional
  - untuk mendukung program pembangunan nasional di
  - bidang ekonomi dalam rangka memajukan kesejahteraan
  - umum sebagaimana tercantum dalam Pembukaan Undang-
  - Undang Dasar Negara Republik Indonesia Tahun 1945;
  - b. bahwa untuk memfasilitasi dan meningkatkan kerja sama
  - transaksi perdagangan melalui sistem elektronik di kawasan
  - ASEAN dengan mengimplementasikan salah satu elemen
  - yang disepakati dalam Cetak Biru Masyarakat Ekonomi
  - ASEAN 2025 dalam integrasi ekonomi ASEAN melalui
  - penyusunan ASEAN Agreement on Electronic Commerce
  - (Persetujuan ASEAN tentang Perdagangan Melalui Sistem
  - Elektronik) yang telah ditandatangani Pemerintah Republik
  - Indonesia dan Pemerintah Negara-negara Anggota
  - Perhimpunan Bangsa-Bangsa Asia Tenggara pada
  - tanggal 22 Januari 2019 di Ha Noi, Viet Nam;
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - ASEAN Agreement on Electronic Commerce (Persetujuan ASEAN tentang
  - Perdagangan Melalui Sistem Elektronik) terdiri dari 19 (sembilan belas) Pasal
  - yang mengatur antara lain mekanisme dan lingkup kerja sama, fasilitasi PMSE
  - lintas batas, keamanan siber, pembayaran elektronik, logistik, transparansi,
  - penyelesaian sengketa, pemberlakuan Persetujuan yang bertujuan untuk
  - memfasilitasi transaksi perdagangan antarwilayah ASEAN melalui PMSE,
  - mendorong penciptaan lingkungan yang kondusif dalam penggunaan PMSE,
  - dan meningkatkan kerja sama antara Negara Anggota ASEAN untuk
  - mengembangkan serta mendorong pemanfaatan PMSE untuk menciptakan
  - pertumbuhan ekonomi yang inklusif dan mengurangi kesenjangan di ASEAN.
  - II. PASAL DEMI PASAL
