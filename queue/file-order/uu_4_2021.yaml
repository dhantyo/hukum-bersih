  first_page:
  - PERSETUJUAN ASEAN TENTANG PERDAGANGAN
  - MELALUI SISTEM ELEKTRONIK
  - Pemerintah Brunei Darussalam, Kerajaan Kamboja, Republik
  - Indonesia, Republik Demokratik Rakyat Laos, Malaysia,
  - Republik Persatuan Myanmar, Republik Filipina, Republik
  - Singapura, Kerajaan Thailand dan Republik Sosialis Vietnam,
  - Negara-Negara Anggota Perhimpunan Bangsa-Bangsa Asia
  - Tenggara (Association of Southeast Asian Nations/ ASEAN)
  - (untuk selanjutnya disebut secara bersama-sama sebagai
  - “Negara-Negara Anggota" atau masing-masing sebagai
  - “Negara Anggota");
  - MENGETAHUI peran Perdagangan Melalui Sistem Elektronik
  - (PMSE) dalam menggerakkan pertumbuhan ekonomi dan
  - pembangunan sosial di wilayah ASEAN;
  - MENILAI kontribusi PMSE dalam meningkatkan hubungan
  - dan kerja sama sektoral di wilayah ASEAN yang dimuat dalam
  - Cetak Biru Masyarakat Ekonomi ASEAN (MEA) 2025
  - sebagaimana diberlakukan pada tanggal 22 November 2015;
  - MEMBANGUN berdasarkan Pasal 5 (Fasilitas Pertumbuhan
  - Perdagangan Melalui Sistem Elektronik) dalam e-ASEAN
  - Framework Agreement yang ditandatangani oleh Para
  - Pemimpin ASEAN pada tanggal 24 November 2000 di
  - Singapura;
  - MENGAKUI pentingnya kontribusi PMSE dalam memfasilitasi
  - perdagangan dan investasi lintas batas, dan mengurangi
  - hambatan masuk dan biaya operasional usaha secara
  - signifikan khususnya Usaha Mikro, Kecil dan Menengah;
  - MENEKANKAN kepentingan koordinasi dan kerja sama
  - antara Negara-Negara Anggota untuk meningkatkan
  - pembangunan dan penggunaan PMSE di wilayah ASEAN;
