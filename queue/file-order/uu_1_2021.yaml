id: uu_1_2021
title: Undang-Undang Nomor 1 Tahun 2021 tentang Pengesahan Comprehensive Economic
  Partnership Agreement Between The Republic Of Indonesia And The Efta States (Persetujuan
  Kemitraan Ekonomi Komprehensif Antara Republik Indonesia Dan Negara-Negara Efta)
files:
- bpk_file_id: 261616
  filename: UU Nomor 1 Tahun 2021.pdf
  pages: 7
  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 1 TAHUN 2021
  - TENTANG
  - PENGESAHAN COMPREHENSIVE ECONOMIC PARTNERSHIP AGREEMENT
  - BETWEEN THE REPUBLIC OF INDONESIA AND THE EFTA STATES (PERSETUJUAN
  - KEMITRAAN EKONOMI KOMPREHENSIF ANTARA REPUBLIK INDONESIA
  - DAN NEGARA-NEGARA EFTA)
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa kegiatan perdagangan merupakan salah satu sektor'
  - utama penggerak perekonomian nasional yang dapat
  - dilakukan melalui kerja sama perdagangan internasional
  - untuk mendukung program pembangunan nasional di
  - bidang ekonomi dalam rangka memajukan kesejahteraan
  - umum sebagaimana tercantum dalam Pembukaan Undang-
  - Undang Dasar Negara Republik Indonesia Tahun 1945;
  - b. bahwa untuk mendorong percepatan pemulihan ekonomi
  - dan meningkatkan kerja sama ekonomi secara komprehensif
  - antara Republik Indonesia dan Negara-Negara European Free
  - Trade Association (EFTA). Pemerintah Republik Indonesia
  - dan Pemerintah Negara-Negara EFTA telah menandatangani
  - Comprehensive Economic Partnership Agreement between the
  - Republic of Indonesia and the EFTA States (Persetujuan
  - Kemitraan Ekonomi Komprehensif antara Republik
  - Indonesia dan Negara-Negara EFTA) pada tanggal
  - 16 Desember 2018 di Jakarta, Indonesia;
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Persetujuan IE-CEPA terdiri dari 12 (dua belas) Bab, 17 (tujuh belas)
  - Lampiran dan 17 (tujuh belas) Keterangan Tambahan dari Lampiran. Materi
  - pokok yang diatur dalam Persetujuan IE-CEPA antara lain mencakup ketentuan
  - umum, perdagangan barang, perdagangan jasa, penanaman modal, pelindungan
  - hak kekayaan intelektual, pengadaan barang dan jasa pemerintah, persaingan
  - usaha, perdagangan dan pembangunan berkelanjutan, kerja sama dan
  - pengembangan kapasitas serta penyelesaian sengketa.
  - Berdasarkan pertimbangan tersebut, dengan disahkannya Persetujuan ini,
  - maka Indonesia diharapkan dapat memperoleh manfaat berupa peningkatan
  - ekspor, penanaman modal, mendorong kerja sama ekonomi, dan peningkatan
  - daya saing antara Indonesia dengan Negara-Negara EFTA.
  - II. PASAL DEMI PASAL
  - Pasal 1
  - Cukup jelas.
  - Pasal 2
  - Cukup jelas.
  - TAMBAHAN LEMBARAN NEGARA REPUBLIK INDONESIA NOMOR 6684
