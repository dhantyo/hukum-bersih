  - NOMOR 5 TAHUN 2021
  - TENTANG
  - PENGESAHAN PERJANJIAN ANTARA REPUBLIK INDONESIA DAN FEDERASI
  - RUSIA TENTANG BANTUAN HUKUM TIMBAL BALIK DALAM MASALAH PIDANA
  - (TREATY BETWEEN THE REPUBLIC OF INDONESIA AND THE RUSSIAN
  - FEDERATION ON MUTUAL LEGAL ASSISTANCE IN CRIMINAL MATTERS
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa dalam rangka mewujudkan tujuan Negara'
  - Republik Indonesia untuk melindungi segenap bangsa
  - Indonesia dan seluruh tumpah darah Indonesia,
  - memajukan kesejahteraan umum, mencerdaskan
  - kehidupan bangsa, dan ikut melaksanakan ketertiban
  - dunia yang berdasarkan kemerdekaan, perdamaian abadi
  - dan keadilan sosial, Pemerintah Republik Indonesia
  - sebagai bagian dari masyarakat internasional melakukan
  - hubungan dan kerja sama internasional yang
  - diwujudkan dalam perjanjian internasional;
  - b. bahwa perkembangan ilmu pengetahuan dan teknologi
  - terutama di bidang transportasi, komunikasi, dan
  - informasi, selain mempunyai dampak positif juga
  - mempunyai dampak negatif, antara lain timbulnya tindak
  - pidana yang tidak lagi mengenal batas yurisdiksi suatu
  - negara, sehingga untuk meningkatkan kerja sama di
  - bidang hukum dalam menanggulangi dampak negatif
  - tersebut, Republik Indonesia dan Federasi Rusia telah
  - M. No 1003 70 A
  last_page:
  - PR ESI D EN
  - REPUBLIK INDONESIA
  - Menyadari kenyataan tersebut, Republik Indonesia dan Federasi Rusia
  - telah menandatangani Perjanjian antara Republik Indonesia dan Federasi
  - Rusia tentang Bantuan Hukum Timbal Balik dalam Masalah Pidana
  - (Treaty between the Republic of Indonesia and the Russian Federation on
  - Mutual Legal Assitance in Criminal Matters) pada tanggal 13 Desember
  - 2019 di Moskow, Rusia.
  - Untuk lebih meningkatkan efektivitas kerja sama di bidang hukum
  - dalam pencegahan, penanggulangan, dan pemberantasan tindak pidana,
  - terutama yang bersifat transnasional, perjanjian bantuan hukum timbal
  - balik dalam masalah pidana harus memperhatikan prinsip umum hukum
  - internasional yang menitikberatkan pada asas penghormatan kedaulatan
  - negara dan integritas wilayah, tidak mencampuri urusan dalam negeri
  - masing-masing negara, saling menguntungkan, serta berpedoman pada
  - asas tindak pidana ganda (double criminality).
  - Perjanjian antara Republik Indonesia dan Federasi Rusia tentang
  - Bantuan Hukum Timbal Balik dalam Masalah Pidana (Treaty between the
  - Republic of Indonesia and the Russian Federation on Mutual Legal
  - Assitance in Criminal Matters) ini mengatur antara lain mengenai ruang
  - lingkup bantuan hukum timbal balik, otoritas pusat, prosedur
  - pelaksanaan bantuan hukum timbal balik, kewajiban internasional, biaya
  - pelaksanaan permintaan bantuan hukum, konsultasi dan penyelesaian
  - sengketa, serta amendemen dan pengakhiran Perjanjian.
