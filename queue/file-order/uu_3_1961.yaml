  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - LAMPIRAN
  - KONPENSI (106) MENGENAI ISTIRAHAT MINGGUAN DALAM PERDAGANGAN
  - DAN KANTOR-KANTOR.
  - KONPERENSI UMUM ORGANISASI PERBURUHAN
  - INTERNASIONAL.
  - Setelah diundang di Genewa oleh Badan Pengurus Biro Perburuhan Internasional dan
  - setelah mengadakan sidangnya yang ke-40 pada tanggal 5 Juni 1957, dan
  - Setelah memutuskan untuk menerima beberapa usul mengenai istirahat mingguan
  - dalam perdagangan dan kantor-kantor yang termasuk soal ke-5 dari agenda sidang,
    dan
  - Setelah menetapkan, bahwa usul-usul ini harus berbentuk konpensi internasional.
  - Menerima pada tanggal 26 Juni 1957 Konpensi di bawah ini, yang dapat disebut
  - '"Konpensi Istirahat Mingguan (perdagangan dan kantor-kantor) 1957".'
  - Pasal 1.
  - Ketentuan Konpensi ini, sejauh mana tidak dilaksanakan secara lain oleh alat penetapan
  - upah, berdasarkan perjanjian perburuhan, putusan arbitrage atau dengan cara lain
  - menurut praktek nasional yang sesuai dengan keadaan nasional, harus dilaksanakan
  - dengan undang-undang atau peraturan nasional.
  - Pasal 2.
  - Konpensi ini berlaku terhadap semua orang, termasuk magang, yang dipekerjakan
    pada
  - perusahaan, lembaga atau kantor tata- usaha, baik milik pemerintah maupun partikelir,
  - 'sebagai berikut:'
  - (a) perusahaan dagang;
  - (b) perusahaan lembaga dan kantor tata-usaha, dimana orang yang dipekerjakan
  - terutama mengerjakan pekerjaan kantor, termasuk kantor orang yang melakukan
  - pekerjaan bebas;
  - (c) sejauh mana orang yang bersangkutan tidak dipekerjakan pada perusahaan
  - tersebut pada pasal 3 dan tidak tunduk pada peraturan nasional atau ketentuan
  - lain mengenai istirahat mingguan dalam industri, tambang, pengangkutan atau
  - 'pertanian:'
  - (i) cabang perdagangan setiap perusahaan lain;
  - (ii) cabang dari setiap perusahaan lain, dimana orang yang dipekerjakan terutama
  - melakukan pekerjaan kantor;
  - (iii) perusahaan campuran perdagangan dan industri.
  - Pasal 3.
  - 1. Konpensi ini harus berlaku pula terhadap orang-orang yang dipekerjakan pada
  - perusahaan sebagai berikut, sebagaimana diperinci oleh anggota yang telah
