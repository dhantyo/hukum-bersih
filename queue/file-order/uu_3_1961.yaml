  - MEMUTUSKAN
  - 'Menetapkan : UNDANG-UNDANG TENTANG PERSETUJUAN KONPENSI'
  - ORGANISASI PERBURUHAN INTERNASIONAL NO. 106
  - MENGENAI ISTIRAHAT DALAM PERDAGANGAN DAN
  - KANTOR-KANTOR.
  - Pasal 1.
  - Konpensi Organisasi Perburuhan Internasional No. 106 mengenai istirahat mingguan
  - dalam perdagangan dan kantor-kantor yang telah diterima oleh wakil-wakil anggota-
  - anggota Organisasi Perburuhan Internasional dalam sidangnya ke empat puluh (1957)
  - dan yang bunyinya sebagai dilampirkan pada undang-undang ini, dengan ini disetujui.
  - Pasal 2.
  - Undang-undang ini mulai berlaku pada hari diundangkan.
  - Agar supaya setiap orang dapat mengetahuinya, memerintahkan pengundangan
  - undang-undang ini dengan penempatan dalam Lembaran Negara Republik Indonesia.
  - Disahkan di Jakarta
  - pada tanggal 25 Pebruari 1961
  - PRESIDEN REPUBLIK INDONESIA
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Pikiran untuk memberikan istirahat mingguan ini, adalah sesuai dengan apa yang
  - terkandung pada pasal 27 ayat (2) Undang- undang Dasar 1945, serta telah pula
  - dilaksanakan dalam pasal 10 ayat (3) Undang-undang Kerja 1948 yang menentukan
    tiap
  - minggu harus diadakan sedikit-dikitnya satu hari istirahat, sehingga untuk
  - melaksanakan konpensi ini, Pemerintah tidak perlu menyusun peraturan baru, tentang
  - istirahat ini.
  - Dalam pada itu untuk mencegah penyalahgunaan pasal 5 ayat (a), istilah "keluarga
  - majikan" harus ditafsirkan meliputi suami/ istri beserta keluarga dalam turunan
    lurus
  - derajat pertama. Kemudian sesuai dengan filsafah negara yaitu Pancasila, maka
    pasal 6
  - ayat (4) harus diartikan, bahwa penghormatan tradisi dan kebiasaan golongan minoritas
  - agama merupakan sifat yang khas dari bangsa Indonesia yang menghormati dan
  - menjunjung tinggi tiap agama.
  - TAMBAHAN LEMBARAN NEGARA REPUBLIK INDONESIA TAHUN 1961 NOMOR 2153
