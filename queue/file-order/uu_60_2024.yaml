  - Demikianlah laporan pertanggungjawaban pengelolaan SBN ini dibuat dalam
  - rangka pemenuhan amanat sebagaimana dituangkan pada pasal 16 UU Nomor 24
  - Tahun 2002 tentang SUN dan pasal 27 UU Nomor 19 Tahun 2008 tentang SBSN
  - dan dilampirkan sebagai bagian dari pertanggungjawaban pelaksanaan APBN.
  - Besar harapan Pemerintah agar masyarakat juga dapat mengetahui secara jelas
  - dan transparan informasi terkait dengan pengelolaan SBN, sesuai komitmen
  - Pemerintah untuk mengelola sektor keuangan yang transparan, profesional dan
  - bertanggung jawab.
