  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa untuk mewujudkan pengelolaan keuangan negara'
  - yang dilaksanakan secara terbuka dan bertanggung jawab
  - untuk sebesar-besarnya kemakmuran rakyat, telah dibentuk
  - Undang-Undang Nomor 28 Tahun 2022 tentang Anggaran
  - Pendapatan dan Belanja Negara Tahun Anggaran 2023;
  - b. bahwa untuk melaksanakan ketentuan Pasal 3 ayat (2)
  - Undang-Undang Nomor 17 Tahun 2003 tentang Keuangan
  - Negara dan ketentuan Pasal 45 Undang-Undang Nomor 28
  - Tahun 2022 tentang Anggaran Pendapatan dan Belanja
  - Negara Tahun Anggaran 2023, perlu dilakukan
  - pertanggungjawaban atas pelaksanaan Anggaran
  - Pendapatan dan Belanja Negara Tahun Anggaran 2023;
  - c. bahwa berdasarkan pertimbangan sebagaimana dimaksud
  - dalam huruf a dan huruf b, perlu membentuk Undang-
  - Undang tentang Pertanggungjawaban atas Pelaksanaan
  - Anggaran Pendapatan dan Belanja Negara Tahun Anggaran
  - 2023;
  - 'Mengingat: 1. Pasal 5 ayat (1), Pasal 20, Pasal 23 ayat (1), dan Pasal 23E'
  - Undang-Undang Dasar Negara Republik Indonesia Tahun
  - 1945;
