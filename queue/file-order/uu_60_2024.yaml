  - Hambatan atau permasalahan dalam pencapaian kinerja Kementerian
  - Pertahanan antara lain disebabkan oleh hal-hal sebagai berikut.
  - 1. Dinamika ancaman keutuhan wilayah baik di dalam maupun luar negeri
  - terus berkembang dari demi kuantitas maupun kualitas;
  - 2. Sarana dan prasarana penanggulangan bencana yang perlu untuk
  - ditingkatkan;
  - 3. Pemenuhan Alutsista sebagai wujud kesiapan operasional TNI belum
  - optimal;
  - 4. Khususnya industri Alutsista dalam negeri tidak semuanya dapat memenuhi
  - kebutuhan TNI, sehingga ada kebutuhan Alutsista tertentu yang harus
  - diadakan dari luar negeri melalui fasilitas Pinjamana Luar Negeri
  - (PLN)/kredit ekspor.
  - Kemudian sebagai tindak lanjut atas permasalahan yang ada dan akan
  - muncul, TNI telah mempersiapkan beberapa upaya sebagai berikut.
  - 1. Jika Operasi Militer Perang (OMP) gagal dilaksanakan, maka selanjutnya
  - akan dilaksanakan Perang Berlarut sebagai kesadaran akan hak dan
  - kewajiban dalam mempertahankan negara yang melibatkan seluruh bangsa
  - Indonesia;
  - 2. Strategi pertahanan berlapis diimplementasikan dan dikembangkan untuk
  - menangkal, mengatasi, dan menanggulangi tantangan di bidang militer dan
  - nonmiliter, serta melaksanakan perang berlarut.
