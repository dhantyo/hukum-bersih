  pages: 3
  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 15 TAHUN 1957
  - TENTANG
  - MENGUBAH DAN MENAMBAH UNDANG-UNDANG PENEMPATAN BAGIAN
  - X DARI ANGGARAN REPUBLIK INDONESIA UNTUK TAHUN DINAS 1953
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : bahwa Bagian X dari anggaran Republik Indonesia yang mengenai tahun'
  - dinas 1953 yang antara lain ditetapkan atas Undang-undang tahun 1954
  - Nomor 50 (Lembaran Negara Republik Indonesia tahun 1954 Nomor
  - 121), perlu diubah dan ditambah ;
  - 'Mengingat : Pasal 113 dan Pasal 114 Undang-undang Dasar Sementara Republik'
  - Indonesia;
  - Dengan persetujuan Dewan Perwakilan Rakyat;
  - 'MEMUTUSKAN :'
  - Pasal 1
  - Bagian X (Kementerian Pendidikan, Pengajaran dan Kebudayaan) dari
  - anggaran Republik Indonesia yang mengenai tahun dinas 1953, yang
  - antara lain ditetapkan atas Undang-undang tahun 1954 Nomor 50
  - (Lembaran Negara Republik Indonesia tahun 1954 Nomor 121 ), diubah
  - 'dan ditambah sebagai berikut:'
  - BAB I (Pengeluaran).
  - 10.1. Kementerian dan Pengeluaran umum
  - dikurangkan dengan ............. Rp. 39.000,-
  - 10.2. Perpustakaan Negara dikurangkan
  - dengan .......................... Rp. 110.000,-
  - 10.3. Perguruan Tinggi ditambah dengan. Rp.22.075.400,-
  - 10.4. Jawatan Pengajaran dikurangkan
  - dengan ......................... Rp. 125.000,-
  - 10.6. Pendidikan Guru ditambah dengan.. Rp. 1.100.000,-
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Agar supaya setiap orang dapat mengetahuinya, memerintahkan
  - pengundangan undang-undang ini dengan penempatan dalam Lembaran
  - Negara Republik Indonesia.
  - Disahkan di Jakarta.
  - pada tanggal 25 Maret 1957.
  - PRESIDEN REPUBLIK INDONESIA,
  - ttd
  - SUKARNO
  - Diundangkan
  - pada tanggal 8 April 1957.
  - MENTERI KEHAKIMAN a.i.,
  - ttd
  - SUNARJO
  - MENTERI PENDIDIKAN, PENGAJARAN
  - DAN KEBUDAYAAN.
  - ttd
  - SARINO MANGUNPRANOTO
  - LEMBARAN NEGARA NOMOR 35 TAHUN 1957
