  first_page:
  - UNDANG-UNDANG REPUBLIK INDONESIA (UU)
  - NOMOR 24 TAHUN 1968 (24/1968)
  - TENTANG
  - TANDA KEHORMATAN BINTANG SWA BHUWANA PAKSA
  - DENGAN RAKHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA
  - 'Menimbang :'
  - a. bahwa untuk menghargai kesetiaan, kemampuan, kebijaksanaan dan jasa-jasa
  - luar biasa serta melebihi kewajiban dibidang tugas kemiliteran untuk kepentingan
  - Negara, Nusa dan Bangsa, baik yang ditunjukkan oleh Anggota Angkatan Udara
  - khususnya, maupun oleh Warganegara Republik Indonesia bukan Anggota
  - Angkatan Udara pada umumnya, perlu diadakan suatu peraturan tentang Tanda
  - Kehormatan;
  - b. Bahwa Tanda Kehormatan tersebut akan merupakan suatu dorongan untuk
  - membangkitkan dan memupuk sifat-sifat keprajuritan serta kesadaran berbakti
  - dari tiap-tiap Anggota Angkatan Udara maupun Warga Negara Republik
  - Indonesia bukan Anggota Angkatan Udara dalam membela dan mengabdi kepada
  - Negara, Nusa dan Bangsa.
  - 'Mengingat :'
  - 1. Pasal 5 ayat (1) dan Pasal 15 Undang-undang Dasar 1945
  - 2. Undang-undang Nomor 4 Drt tahun 1959 (Lembaran-Negara tahun 1959 Nomor
  - 44) tentang Ketentuan-ketentuan Umum Tanda-tanda Kehormatan ;
  - 3. Undang-undang Nomor 70 tahun 1958 (Lembaran-Negara tahun 1958 Nomor
  - 124) tentang Tanda-tanda Penghargaan untuk Anggota-Angkatan Perang.
  - Dengan Persetujuan Dewan Perwakilan Rakyat Gotong Royong.
  - 'MEMUTUSKAN :'
  - 'Menetapkan :'
  - UNDANG-UNDANG REPUBLIK INDONESIA TENTANG TANDA KEHORMATAN
  - BINTANG SWA BHUWANA PAKSA.
  - BAB I
  - KETENTUAN UMUM
  - Pasal 1.
  - Kepada Anggota Angkatan Udara yang memenuhi syarat-syarat yang ditentukan
  - dalam Undang-undang ini diberikan anugerah Tanda Kehormatan berupa Bintang
  - dengan nama Bintang Swa Bhuwana Paksa.
  last_page:
  - A.U.R.I. dan tidak terputus perjuangannya serta memenuhi persyaratan-persyaratan
    di
  - atas diberikan anugerah Bintang Swa Bhuwana Paksa.
  - (4) Ketentuan ini ada hubungannya dengan Pasal 2 ayat (1). Ini
  - dimaksudkan, bahwa pemberian anugerah Bintang Swa-Bhuwana Paksa terbuka
  - kemungkinan secara ulangan dalam kelas yang sama dan tidak menghilangkan hak
  - atas penganugerahan Bintang dengan kelas yang lebih tinggi/lebih rendah.
  - Pemenuhan syarat-syarat tersebut dalam Pasal-pasal 3, 4 dan 15 (1) dengan
  - ketentuan bahwa tindakan-tindakan prestasi atau tugasnya untuk mana diberikan
  - anugerah tidak ada hubungannya, sangkut-pautnya ataupun merupakan kelanjutan dari
  - tindakan, prestasi atau tugasnya yang telah mendapat suatu anugerah.
  - Hal ini berdasarkan pendirian, bahwa suatu tindakan atau prestasi/jasa yang
  - sama tidak dapat dihargai dua kali atau lebih.
  - Pasal 16.
  - Cukup jelas.
  - Pasal 17.
  - Cukup jelas.
