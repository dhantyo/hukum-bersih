  - PENJELASAN https://jdih-old.kemenkeu.go.id/FullText/2003/19TAHUN2003UUPen...
  - PENJELASAN
  - ATAS
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 19 TAHUN 2003
  - TENTANG
  - BADAN USAHA MILIK NEGARA
  - UMUM
  - I. Memajukan kesejahteraan bagi seluruh rakyat sebagaimana diamanatkan dalam Pembukaan
    Undang-
  - undang Dasar 1945 yang selanjutnya lebih rinci diatur dalam Pasal 33 Undang-undang
    Dasar 1945
  - merupakan tugas konstitusional bagi seluruh komponen bangsa. Dalam kaitan di atas,
    dirasa perlu untuk
  - meningkatkan penguasaan seluruh kekuatan ekonomi nasional baik melalui regulasi
    sektoral maupun
  - melalui kepemilikan negara terhadap unit-unit usaha tertentu dengan maksud untuk
    memberikan manfaat
  - yang sebesar-besarnya bagi kemakmuran rakyat.
  - Badan Usaha Milik Negara (BUMN) yang seluruh atau sebagian besar modalnya berasal
    dari kekayaan
  - negara yang dipisahkan, merupakan salah satu pelaku ekonomi dalam sistem perekonomian
    nasional, di
  - samping usaha swasta dan koperasi. Dalam menjalankan kegiatan usahanya, BUMN,
    swasta dan koperasi
  - melaksanakan peran saling mendukung berdasarkan demokrasi ekonomi.
  - II. Dalam sistem perekonomian nasional, BUMN ikut berperan menghasilkan barang
    dan/atau jasa yang
  - diperlukan dalam rangka mewujudkan sebesar-besarnya kemakmuran masyarakat. Peran
    BUMN
  - dirasakan semakin penting sebagai pelopor dan/atau perintis dalam sektor-sektor
    usaha yang belum
  - diminati usaha swasta. Di samping itu, BUMN juga mempunyai peran strategis sebagai
    pelaksana
  - pelayanan publik, penyeimbang kekuatan-kekuatan swasta besar, dan turut membantu
    pengembangan
  - usaha kecil/koperasi. BUMN juga merupakan salah satu sumber penerimaan negara
    yang signifikan dalam
  - bentuk berbagai jenis pajak, dividen dan hasil privatisasi.
  - Pelaksanaan peran BUMN tersebut diwujudkan dalam kegiatan usaha pada hampir seluruh
    sektor
  - perekonomian, seperti sektor pertanian, perikanan, perkebunan, kehutanan, manufaktur,
    pertambangan,
  - keuangan, pos dan telekomunikasi, transportasi, listrik, industri dan perdagangan,
    serta konstruksi.
  - III. Dalam kenyataannya, walaupun BUMN telah mencapai tujuan awal sebagai agen
    pembangunan dan
  - pendorong terciptanya korporasi, namun tujuan tersebut dicapai dengan biaya yang
    relatif tinggi. Kinerja
  - perusahaan dinilai belum memadai, seperti tampak pada rendahnya laba yang diperoleh
    dibandingkan
  - dengan modal yang ditanamkan. Dikarenakan berbagai kendala, BUMN belum sepenuhnya
    dapat
  - menyediakan barang dan/atau jasa yang bermutu tinggi bagi masyarakat dengan harga
    yang terjangkau
  - serta belum mampu berkompetisi dalam persaingan bisnis secara global. Selain itu,
    karena keterbatasan
  - sumber daya, fungsi BUMN baik sebagai pelopor/perintis maupun sebagai penyeimbang
    kekuatan swasta
  - besar, juga belum sepenuhnya dapat dilaksanakan.
  - Di lain pihak, perkembangan ekonomi dunia berlangsung sangat dinamis, terutama
    berkaitan dengan
  - liberalisasi dan globalisasi perdagangan yang telah disepakati oleh dunia internasional
    seperti kesepakatan
  - mengenai World Trade Organization (WTO), ASEAN Free Trade Area (AFTA), ASEAN Framework
  - Agreement on Service, dan kerjasama ekonomi regional Asia Pacific (Asia Pacific
    Economic Cooperation/
  - APEC).
  - IV. Untuk dapat mengoptimalkan perannya dan mampu mempertahankan keberadaannya
    dalam
  - perkembangan ekonomi dunia yang semakin terbuka dan kompetitif, BUMN perlu menumbuhkan
    budaya
  - korporasi dan profesionalisme antara lain melalui pembenahan pengurusan dan pengawasannya.
