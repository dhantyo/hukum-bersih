  - Pasal 91
  - Agar supaya Direksi dapat melaksanakan tugasnya secara mandiri, pihak-pihak luar
    manapun, selain organ
  - BUMN tidak diperbolehkan ikut campur tangan terhadap pengurusan BUMN. Termasuk
    dalam pengertian
  - campur tangan adalah tindakan atau arahan yang secara langsung memberi pengaruh
    terhadap tindakan
  - pengurusan BUMN atau terhadap pengambilan keputusan oleh Direksi.
  - Ketentuan ini dimaksudkan untuk mempertegas kemandirian BUMN sebagai badan usaha
    agar dapat dikelola
  - secara profesional sehingga dapat berkembang dengan baik sesuai dengan tujuan
    usahanya.
  - Hal ini berlaku pula bagi Departemen dan instansi Pemerintah lainnya, karena kebutuhan
    dana Departemen
  - dan instansi Pemerintah lainnya telah diatur dan ditetapkan secara tersendiri,
    Departemen dan instansi
  - Pemerintah tidak dibenarkan membebani BUMN dengan segala bentuk pengeluaran dan
    sebaliknya BUMN
  - tidak dibenarkan membiayai keperluan pengeluaran Departemen dan instansi Pemerintah
    dalam pembukuan.
