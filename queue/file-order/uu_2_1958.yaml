- bpk_file_id: 53752
  filename: UU Nomor 2 Tahun 1958(LAMPIRAN).pdf
  pages: 12
  first_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - PERJANJIAN ANTARA REPUBLIK INDONESIA
  - DAN REPUBLIK RAKYAT TIONGKOK
  - MENGENAI
  - SOAL DWIKEWARGANEGARAAN.
  - Pemerintah Republik Indonesia dan Pemerintah Republik Rakyat Tiongkok, berdasar
  - 'atas :'
  - '- Prinsip persamaan derajat;'
  - '- Prinsip saling memberi manfaat; dan'
  - '- Prinsip tidak campur tangan di dalam politik dalam negeri Negara masing-masing;'
  - berkeinginan menyelesaikan sebaik-baiknya dengan kerja-sama dalam persahabatan
  - masalah kewarganegaraan dari orang-orang yang serempak mempunyai kewarganegaraan
  - Republik Indonesia dan kewarganegaraan Republik Rakyat Tiongkok, memutus
  - mengadakan Perjanjian ini dan untuk itu telah mengangkat Wakil-wakil Berkuasa
    Penuh
  - 'mereka :'
  - '- Pemerintah Republik Indonesia'
  - Yang Mulia SUNARIO.
  - Menteri Luar Negeri;
  - dan
  - '- Pemerintah Republik Rakyat Tiongkok;'
  - Yang Mulia CHOU EN-LAI,
  - Menteri Luar Negeri.
  - yang, setelah saling memeriksa surat-surat kuasa masing-masing yang terdapat benar
    dan
  - 'baik, menyetujui pasal-pasal sebagai berikut :'
  - Pasal I.
  - Kedua Pihak Agung Yang Berjanji menyetujui, bahwa barang siapa serempak
  - mempunyai kewarganegaraan Republik Indonesia dan kewarganegaraan Republik Rakyat
  - Tiongkok harus memilih satu diantara kewarganegaraan Republik Indonesia dan
  - kewarganegaraan Republik Rakyat Tiongkok itu, dengan dasar menurut kehendak yang
  - berkepentingan sendiri.
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Atas nama Pemerintah Republik Indonesia kami membenarkan hal-hal yang tertera
  - di dalam nota Yang Mulia. Nota Yang Mulia dan jawaban kami atas nota itu merupakan
  - persesuaian faham yang telah dicapai antara Pemerintah Republik Indonesia dan
  - Pemerintah Republik Rakyat Tiongkok tentang pelaksanaan dari Perjanjian mengenai
  - masalah Dwikewarganegaraan dan akan mulai berlaku pada waktu yang bertepatan
  - dengan waktu mulai berlakunya Perjanjian tersebut di atas.
  - Kami mempergunakan kesempatan ini untuk menyatakan kepada Yang Mulia
  - hormat kami yang setinggi-tingginya.
  - ttd.
  - Ali Sastroamidjojo
  - Perdana Menteri Republik Indonesia.
  - Disetujui D.P.R. dalam rapat pleno terbuka ke-149 pada hari Selasa tanggal 17
    Desember
  - 1957, P. 59/1957
