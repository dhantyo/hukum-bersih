  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang: a. bahwa hubungan luar negeri yang dilandasi politik bebas'
  - aktif merupakan salah satu perwujudan dari tujuan
  - nasional Negara Kesatuan Republik Indonesia
  - sebagaimana tercantum dalam Pembukaan Undang-
  - Undang Dasar Negara Republik Indonesia Tahun 1945,
  - yaitu melindungi segenap bangsa Indonesia dan seluruh
  - tumpah darah Indonesia dan untuk memajukan
  - kesejahteraan umum, mencerdaskan kehidupan bangsa
  - dan ikut melaksanakan ketertiban dunia yang
  - berdasarkan kemerdekaan, perdamaian abadi dan
  - keadilan sosial;
  - b. bahwa untuk meningkatkan kerja sama di bidang
  - pertahanan, Pemerintah Republik Indonesia dan Kabinet
  - Menteri Ukraina telah menandatangani Persetujuan
  - antara Pemerintah Republik Indonesia dan Kabinet
  - Menteri Ukraina tentang Kerja Sama dalam Bidang
  - Pertahanan (Agreement between the Government of the
  - Republic of Indonesia and the Cabinet of Ministers of
  - Ukraine on Cooperation in the Field of Defence) pada
  - tanggal 5 Agustus 2016 di Jakarta, Indonesia;
