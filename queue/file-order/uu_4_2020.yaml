  - REPUBLIK INDONESIA
  - PERSETUJUAN
  - ANTARA
  - PEMERINTAH REPUBLIK INDONESIA
  - DAN
  - KABINET MENTERI UKRAINA
  - TENTANG
  - KERJA SAMA DALAM BIDANG PERTAHANAN
  - Pemerintah Republik Indonesia dan Kabinet Menteri Ukraina, yang selanjutnya
  - disebut sebagai "Para Pihak”,
  - Berkeinginan untuk meningkatkan dan memperkuat kerja sama bilateral antara
  - kedua Negara di bidang pertahanan,
  - Menegaskan bahwa mengembangkan hubungan persahabatan dan kerja sama
  - antara Para Pihak akan memberikan kontribusi untuk perdamaian dan
  - keamanan internasional dengan cara menciptakan kepercayaan timbal balik,
  - pemahaman dan kerja sama dalam hubungan internasional;
  - Menyadari bahwa penguatan kerja sama pertahanan akan bermanfaat bagi
  - lembaga-lembaga nasional masing-masing di bidang pertahanan;
  - Bertujuan untuk meningkatkan kerja sama di bidang pertahanan antara kedua
  - negara berdasarkan prinsip-prinsip kesetaraan, saling menguntungkan dan
  - menghormati kedaulatan dan integritas wilayah Para Pihak;
  - Sesuai dengan hukum dan peraturan perundang-undangan yang berlaku di
  - negara Para Pihak;
  - 'Telah menyetujui sebagai berikut:'
  last_page:
  - ARTICLE 9
  - ENTRY INTO FORCE AND TERMINATION
  - 1. This Agreement shall enter into force on the receipt of the last written
  - notification through diplomatic channels on accomplishment by the Parties of
  - proper internal state procedures, which are necessary in order of the present
  - Agreement to enter into force.
  - 2. This Agreement shall remain in force for a five-years period and shall
  - automatically be prolonged for the subsequent five-year periods unless it is
  - denounced by either Party by giving written notification through diplomatic
  - channels to the other Party at least 90 days prior to its intention to terminate
  - this Agreement.
  - 3. The termination of this Agreement will not affect the implementation of
  - arrangements, programs and projects concluded earlier in the framework of
  - this Agreement, unless otherwise agreed in writing by the Parties.
  - In witness whereof, the undersigned being duly authorized thereto by their
  - respective Governments, have signed this Agreement.
  - Done in Jakarta on the Fifth of August year Two thousand sixteen, in two
  - originals, in Indonesian, Ukrainian, and English languages, all the texts being
  - equally authentic. In case of any divergence in the interpretation of this
  - Agreement, the English text shall prevail.
  - FOR THE GOVERNMENT OF THE FOR THE CABINET OF
