  - NOMOR 1 TAHUN 2019
  - TENTANG
  - PENGESAHAN PERJANJIAN ANTARA REPUBLIK INDONESIA DAN PERSATUAN
  - EMIRAT ARAB MENGENAI EKSTRADISI (TREATY BETWEEN THE REPUBLIC
  - OF INDONESIA AND THE UNITED ARAB EMIRATES ON EXTRADITION
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa dalam rangka mencapai tujuan Negara Republik'
  - Indonesia untuk melindungi segenap bangsa Indonesia dan
  - seluruh tumpah darah Indonesia serta untuk memajukan
  - kesejahteraan umum, mencerdaskan kehidupan bangsa, dan
  - ikut melaksanakan ketertiban dunia yang berdasarkan
  - kemerdekaan, perdamaian abadi, dan keadilan sosial,
  - Pemerintah Republik Indonesia sebagai bagian dari
  - masyarakat internasional melakukan hubungan dan kerja
  - sama internasional yang diwujudkan dalam perjanjian
  - internasional;
  - b. bahwa kemajuan ilmu pengetahuan dan teknologi
  - khususnya teknologi transportasi, komunikasi, dan
  - informasi yang memudahkan lalu lintas manusia dari satu
  - negara ke negara lain, selain mempunyai dampak positif juga
  - mempunyai dampak negatif yang bersifat transnasional,
  - yaitu memberikan peluang yang lebih besar bagi pelaku
  - kejahatan untuk meloloskan diri dari penyidikan,
  - penuntutan, pemeriksaan di sidang pengadilan, dan
  - pelaksanaan pidana dari negara tempat tindak pidana
  - dilakukan;
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - Dalam Perjanjian antara Republik Indonesia dan Persatuan Emirat
  - Arab mengenai Ekstradisi ini diatur antara lain mengenai kesepakatan
  - Para Pihak untuk melakukan ekstradisi, tindak pidana yang dapat
  - diekstradisikan, permintaan ekstradisi, alasan penolakan ekstradisi,
  - saluran komunikasi, otoritas pusat, dan penyerahan orang yang
  - diekstradisikan.
  - Dengan disahkannya Undang-Undang tentang Pengesahan
  - Perjanjian antara Republik Indonesia dan Persatuan Emirat Arab
  - mengenai Ekstradisi (Treaty between the Republic of Indonesia and the
  - United Arab Emirates on Extradition) akan mendukung penegakan hukum
  - di Indonesia terutama yang berkaitan dengan kejahatan lintas negara
  - (transnational crime) khususnya tindak pidana korupsi, tindak pidana
  - pencucian uang, dan kejahatan terorganisasi lainnya.
