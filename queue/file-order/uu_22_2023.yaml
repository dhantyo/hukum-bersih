  first_page:
  - Traktat Mengenai Pelarangan Senjata Nuklir
  - Negara-Negara Pihak pada Traktat ini,
  - Bertekad untuk berkontribusi pada perwujudan tujuan dan prinsip Piagam
  - Perserikatan Bangsa-Bangsa,
  - Sangat khawatir akan konsekuensi kemanusiaan yang parah yang akan timbul dari
  - penggunaan apa pun dari senjata nuklir, dan mengakui kebutuhan logis untuk menghapus
  - senjata tersebut secara menyeluruh, yang tetap menjadi satu-satunya cara untuk
    memastikan
  - bahwa senjata nuklir tidak akan digunakan lagi dalam keadaan apa pun,
  - Memperhatikan risiko-risiko dari masih adanya senjata nuklir, termasuk dari detonasi
  - senjata nuklir apa pun secara tidak sengaja, miskalkulasi, atau kesalahan desain,
    dan
  - menegaskan bahwa risiko tersebut terkait dengan keamanan seluruh umat manusia,
    dan
  - bahwa semua Negara memiliki tanggung jawab untuk mencegah penggunaan apa pun dari
  - senjata nuklir,
  - Menyadari bahwa konsekuensi parah dari senjata nuklir tidak dapat secara cukup
  - diatasi, melewati batas wilayah nasional, memberikan dampak buruk bagi keselamatan
  - manusia, lingkungan, perkembangan sosial ekonomi, ekonomi global, ketahanan pangan,
    dan
  - kesehatan dari generasi sekarang dan masa depan, dan memiliki sebuah dampak yang
    tidak
  - seimbang pada perempuan dan anak perempuan, termasuk akibat dari radiasi ion,
  - Mengakui kepentingan etis bagi pelucutan senjata nuklir dan urgensi untuk mencapai
  - dan menjaga sebuah dunia yang bebas dari senjata nuklir, yang merupakan barang
    publik
  - global di tingkat tertinggi, yang memberikan manfaat, baik pada kepentingan keamanan
  - nasional maupun kolektif,
  - Memperhatikan penderitaan yang tidak tertahankan dan luka yang ditimbulkan pada
  - hibakusha (para korban senjata nuklir), serta pada mereka yang terdampak oleh
    uji coba
  - senjata nuklir,
  - Mengakui dampak tidak seimbang dari aktivitas senjata nuklir pada masyarakat
  - setempat,
  - Menegaskan kembali kebutuhan bagi semua Negara untuk setiap saat patuh pada
  - hukum internasional yang berlaku, termasuk hukum humanitarian internasional dan
    hukum
  - hak asasi manusia internasional,
  - Mendasarkan Negara-Negara Pihak pada prinsip dan aturan hukum humanitarian
  - internasional, khususnya prinsip bahwa hak para pihak dalam suatu konflik bersenjata
    untuk
  - memilih alat dan cara berperang adalah tidak takterbatas, aturan pembedaan, larangan
  - terhadap serangan membabi buta, aturan mengenai proporsionalitas dan kehati-hatian
    dalam
  last_page:
  - Pasal 17
  - Jangka Waktu Dan Penarikan Diri
  - 1. Traktat ini memiliki jangka waktu yang tidak terbatas.
  - 2. Setiap Negara Pihak, dalam menjalankan kedaulatan nasionalnya, memiliki hak
    untuk
  - menarik diri dari Traktat ini apabila ia memutuskan bahwa kejadian luar biasa
    yang
  - berhubungan dengan perihal yang diatur dalam Traktat ini telah membahayakan kepentingan
  - tertinggi negaranya. Ia wajib memberitahukan terkait penarikan dirinya kepada
    Penyimpan.
  - Pemberitahuan tersebut wajib disertai pernyataan tentang kejadian luar biasa yang
  - dianggapnya telah membahayakan kepentingan tertingginya.
  - 3. Penarikan diri tersebut akan mulai berlaku 12 bulan setelah tanggal penerimaan
  - pemberitahuan penarikan diri tersebut oleh Penyimpan. Meskipun demikian, apabila
    periode
  - 12 bulan telah lampau, Negara Pihak yang menarik diri tersebut adalah pihak dalam
    suatu
  - konflik bersenjata, Negara Pihak tersebut akan tetap terikat oleh kewajiban dari
    Traktat ini dan
  - dari protokol tambahan apa pun sampai ia tidak lagi menjadi pihak dalam suatu
    konflik
  - bersenjata.
  - Pasal 18
  - Hubungan dengan Perjanjian Lainnya
  - Pengimplementasian Traktat ini tidak akan mengesampingkan kewajiban yang
  - dilakukan oleh Negara-Negara Pihak sehubungan dengan perjanjian internasional
    yang telah
  - ada, di mana Negara-Negara Pihak tersebut adalah pihak, sepanjang kewajiban tersebut
    tidak
  - bertentangan dengan Traktat ini.
  - Pasal 19
  - Penyimpan
  - Sekretaris-Jenderal Perserikatan Bangsa-Bangsa, dengan ini, ditunjuk sebagai
  - Penyimpan Traktat ini.
  - Pasal 20
  - Teks Autentik
  - Teks bahasa Arab, Mandarin, Inggris, Prancis, Rusia, dan Spanyol dari Traktat
    ini
  - adalah sama-sama autentik.
  - DIBUAT di New York, pada hari ketujuh bulan Juli, dua ribu tujuh belas.
