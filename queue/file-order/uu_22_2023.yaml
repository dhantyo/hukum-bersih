  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa sesuai dengan Pembukaan Undang-Undang'
  - Dasar Negara Republik Indonesia Tahun 1945, salah satu
  - tujuan pembentukan Negara Republik Indonesia adalah
  - ikut melaksanakan ketertiban dunia yang berdasarkan
  - kemerdekaan, perdamaian abadi, dan keadilan sosial;
  - b. bahwa Pemerintah Republik Indonesia sebagai bagian
  - dari masyarakat internasional berkomitmen untuk
  - mendukung upaya pelucutan senjata dan nonproliferasi
  - senjata nuklir melalui pelarangan senjata nuklir dengan
  - menandatangani Treaty on the Prohibition of Nuclear
  - Weapons (Traktat mengenai Pelarangan Senjata Nuklir)
  - pada tanggal 20 September 2017 di New York, Amerika
  - Serikat;
  - c. bahwa sesuai dengan ketentuan Pasal 10 Undang-
  - Undang Nomor 24 Tahun 2000 tentang Perjanjian
  - Internasional, pengesahan perjanjian internasional di
