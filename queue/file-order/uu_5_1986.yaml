  - Cukup jelas.
  - Ayat (2)
  - '"Larangan membawa keluar" meliputi segala bentuk dan cara apapun juga yang memindahkan
    isi daftar,'
  - catatan, risalah, berita acara, serta berkas perkara keluar ruang kerja kepaniteraan,
