  - Wakil Panitera, Panitera Muda, dan Panitera Pengganti.
  - Pasal 142
  - Cukup jelas.
  - Pasal 143
  - Sebelum di setiap tempat sebagaimana dimaksud dalam Pasal 6 dapat dibentuk Pengadilan
    Tata Usaha
  - Negara, Menteri Kehakiman dengan persetujuan Ketua Mahkamah Agung mengambil langkah-langkah
    yang
  - perlu untuk menjamin agar pelayanan bagi rakyat pencari keadilan di bidang Peradilan
    Tata Usaha Negara di
  - tempat yang belum dilengkapi dengan Pengadilan Tata Usaha Negara dapat dilaksanakan
    sebaik-baiknya.
  - Pasal 144
  - Cukup jelas.
  - Pasal 145
  - Lingkungan Peradilan Tata Usaha Negara ini merupakan lingkungan Peradilan yang
    baru yang pembentukannya
  - memerlukan perencanaan dan persiapan yang matang oleh Pemerintah, mengenai prasarana
    dan sarana baik
  - materiil maupun person ii.
  - Oleh karena itu pembentukan Pengadilan di lingkungan Peradilan Tata Usaha Negara
    tidak dapat dilakukan
  - sekaligus tetapi secara bertahap.
  - Setelah Undang-undang ini diundangkan, dipandang perlu Pemerintah mengadakan persiapan
    seperlunya.
  - Untuk mengakomodasikan hal tersebut maka penerapan Undang¬
  - undang ini secara bertahap dalam waktu selambat-lambatnya lima tahun sejak Undang-undang
    ini diundangkan
  - diatur dengan Peraturan Pemerintah.
