  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang: a. bahwa untuk menjamin tercapainya cita-cita dan tujuan'
  - nasional sebagaimana termaktub dalam Pembukaan
  - Undang-Undang Dasar Negara Republik Indonesia
  - Tahun 1945 perlu diselenggarakan pemilihan umum untuk
  - memilih anggota Dewan Perwakilan Rakyat, anggota Dewan
  - Perwakilan Daerah, Presiden dan Wakil Presiden, dan
  - untuk memilih anggota Dewan Perwakilan Rakyat Daerah,
  - sebagai sarana perwujudan kedaulatan rakyat untuk
  - menghasilkan wakil rakyat dan pemerintahan negara yang
  - demokratis berdasarkan Pancasila dan Undang-Undang
  - Dasar Negara Republik Indonesia Tahun 1945;
  - b. bahwa diperlukan pengaturan pemilihan umum sebagai
  - perwujudan sistem ketatanegaraan yang demokratis dan
  - berintegritas demi menjamin konsistensi dan kepastian
  - hukum serta pemilihan umum yang efektif dan efisien;
  - c. bahwa pemilihan umum wajib menjamin tersalurkannya
  - suara rakyat secara langsung, umum, bebas, rahasia, jujur,
  - dan adil;
