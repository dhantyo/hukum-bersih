  first_page:
  - KONVENSI MINAMATA MENGENAI MERKURI
  - Para Pihak pada Konvensi ini,
  - Menyadari bahwa merkuri merupakan suatu bahan kimia yang
  - menjadi permasalahan global akibat luasnya perpindahan melalui
  - atmosfer, persistensinya di lingkungan hidup terjadi secara
  - antropogenik, kemampuannya bersifat bioakumulasi di ekosistem, serta
  - dampak negatif yang signifikan terhadap kesehatan manusia dan
  - lingkungan hidup;
  - Mengingat Keputusan Dewan Pengurus Program Lingkungan hidup
  - Perserikatan Bangsa-Bangsa № 25/5 tanggal 20 Februari 2009 untuk
  - melakukan aksi internasional dalam pengelolaan merkuri yang lebih
  - efisien, efektif, dan koheren;
  - Mengingat ayat 221 pada Dokumen Hasil dari Konferensi
  - Perserikatan Bangsa-Bangsa mengenai Pembangunan Berkelanjutan,
  - “Masa Depan Yang Kita Inginkan”, menyerukan adanya kesepakatan
  - negosiasi mengenai instrumen dan dokumen yang mengikat secara
  - global terkait merkuri untuk menangani risikorisiko terhadap kesehatan
  - manusia dan lingkungan hidup;
  - Mengingat Konferensi Perserikatan Bangsa-Bangsa yang
  - menegaskan kembali prinsip-prinsip Deklarasi Rio tentang Lingkungan
  - Hidup dan Pembangunan Berkelanjutan, diantaranya, tanggung jawab
  - bersama-sama meskipun berbeda-beda, dan dengan mempertimbangkan
  - keadaan dan kemampuan masing-masing Negara, maupun perlunya
  - adanya suatu tindakan global;
  - Menyadari adanya permasalahan kesehatan, terutama di negara-
  - negara berkembang, akibat pajanan merkuri pada populasi yang rentan,
  - terutama wanita, anak-anak, dan generasi mendatang;
  - Memperhatikan kerentanan khusus dari ekosistem daerah
  - ekosistem Arctic dan masyarakataslinya karena biomagnifikasi merkuri
  - dan kontaminasi makanan tradisionalnya, serta kekhawatiran atas
  - dampaknya terhadap masyarakat asli secara lebih luas;
  - Menyadari pembelajaran penting dari Penyakit Minamata,
  - terutama dampak kesehatan dan lingkungan hidup yang serius akibat
  - oleh polusi merkuri, dan perlunya pengelolaan merkuri secara tepat
  - untuk mencegah kejadian serupa di masa mendatang;
  - Menekankan pentingnya dukungan keuangan, teknis, teknologi,
  - dan peningkatan kemampuan, terutama untuk negara-negara
  - berkembang, serta negara-negara dengan ekonomi dalam transisi, agar
  last_page:
  - sendiri seperlunya, kecuali jika disepakati lain oleh para pihak.
  - 2. Komisi Konsiliasi dapat, setiap saat selama berlangsungnya proses
  - konsiliasi, membuat proposal atau rekomendasi untuk
  - penyelesaian sengketa tersebut.
  - Pasal 7
  - Para pihak bersengketa wajib bekerja sama dengan Komisi
  - Konsiliasi. Terutama, para pihak wajib berupaya untuk mematuhi
  - permintaan Komisi untuk menyerahkan materi tertulis, menyerahkan
  - barang bukti, dan menghadiri pertemuan. Para pihak serta para anggota
  - Komisi Konsiliasi berkewajiban untuk melindungi kerahasiaan segala
  - informasi ataupun dokumen yang diterimanya secara rahasia selama
  - berlangsungnya proses konsiliasi.
  - Pasal 8
  - Komisi Konsiliasi wajib mengambil keputusan melalui pemungutan
  - suara mayoritas para anggotanya.
  - Pasal 9
  - Kecuali jika sengketa tersebut telah diselesaikan, Komisi Konsiliasi
  - wajib menyerahkan laporan dengan rekomendasi untuk penyelesaian
  - sengketa dalam jangka waktu paling lambat 12 (dua belas) bulan sejak
  - dibentuk, dan para pihak wajib mempertimbangkan laporan tersebut
  - dengan itikad baik.
  - Pasal 10
  - Setiap keberatan mengenai apakah Komisi Konsiliasi memiliki
  - kompetensi untuk mempertimbangkan suatu permasalahan yang
  - diserahkan kepadanya wajib diputuskan oleh Komisi itu sendiri.
  - Pasal 11
  - Biaya Komisi Konsiliasi wajib ditanggung oleh para pihak
  - bersengketa secara sama rata, kecuali jika para pihak menyepakati lain.
  - Komisi wajib mencatat segala biaya yang dikeluarkannya, kemudian
  - menyerahkan laporan akhir mengenai pengeluaran tersebut kepada para
  - pihak.
