  first_page:
  - REPUBLIK INDONESIA
  - INDONESIA-AUSTRALIA
  - COMPREHENSIVE ECONOMIC PARTNERSHIP AGREEMENT
  - PREAMBLE
  - The Government of Australia ("Australia") and the Government of the Republic of
  - 'Indonesia ("Indonesia”), hereinafter referred to collectively as “the Parties”:'
  - REINFORCING the longstanding bonds of friendship and cooperation between
  - them, the growing bilateral economic relationship and their shared regional
  - interests and ties;
  - RECALLING the positive contribution made to the trade and investment
  - relationship between the Parties by the Agreement Establishing the ASEAN-
  - Australia-New Zealand Free Trade Area (“AANZFTA”), signed at Hua Hin on 27
  - February 2009;
  - MINDFUL of the Asia-Pacific Economic Cooperation goals of free and open trade
  - and investment;
  - RECOGNISING that open, transparent and competitive markets are key drivers of
  - economic growth, poverty reduction, job creation, innovation, expansion of
  - productive capacity and human development;
  - RESOLVING to create clear and mutually advantageous rules governing their trade
  - and investment to promote a predictable, transparent and consistent commercial
  - framework for business operations, minimise barriers, enhance economic efficiency
  - and create a larger market with more opportunities for business;
  - DESIRING to generate broader and deeper economic integration between the
  - Parties, strengthening inclusive economic growth and development, and advancing
  - economic cooperation;
  - RESOLVING to strengthen their economic, trade, and investment relations to
  - contribute to the objectives of sustainable development in its economic, social
    and
  last_page:
  - IN WITNESS WHEREOF, the undersigned, being duly authorised by their respective
  - Governments, have signed this Agreement.
  - DONE at Jakarta, on this 4th day of March in the year 2019, in duplicate in the
    English
  - and Indonesian languages.
  - FOR THE GOVERNMENT OF FOR THE GOVERNMENT OF
  - THE REPUBLIC OF INDONESIA AUSTRALIA
  - ENGGARTIASTO LUKITA SIMON BIRMINGHAM
  - Minister of Trade Minister for Trade, Tourism and
  - Investment
