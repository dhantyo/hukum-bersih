  - I. UMUM
  - Dalam rangka mendukung terwujudnya tata kelola yang baik dalam
  - penyelenggaraan negara, pengelolaan keuangan negara perlu
  - diselenggarakan secara terbuka dan bertanggung jawab sesuai dengan
  - aturan pokok yang telah ditetapkan dalam Undang-Undang Dasar Negara
  - Republik Indonesia Tahun 1945. Sesuai dengan amanat Pasal 23E
  - Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Undang-
  - Undang Nomor 17 Tahun 2003 tentang Keuangan Negara, dan Undang-
  - Undang Nomor 27 Tahun 2014 tentang Anggaran Pendapatan dan Belanja
  - Negara Tahun Anggaran 2015 sebagaimana telah diubah dengan Undang-
  - Undang Nomor 3 Tahun 2015 tentang Perubahan atas Undang-Undang
  - Nomor 27 Tahun 2014 tentang tentang Anggaran Pendapatan dan Belanja
  - Negara Tahun Anggaran 2015, Pemerintah menyusun
  - pertanggungjawaban atas pelaksanaan Anggaran Pendapatan dan Belanja
  - (APBN) Tahun Anggaran 2015, Pemerintah menyusun
  - pertanggungjawaban atas pelaksanaan Anggaran Pendapatan dan Belanja
  - (APBN) Tahun Anggaran 2015, berupa Laporan Keuangan Pemerintah
  - Pusat (LKPP).
  - Sesuai dengan ketentuan peraturan perundang-undangan, mulai
  - tahun 2015 Pemerintah Pusat menerapkan Standar Akuntansi
  last_page:
  - No. 5930
  - keuangan Pemerintah Pusat dan peningkatan penggunaan
  - informasi LKPP;
  - c. meningkatkan kualitas pengelolaan dan keandalan penyajian
  - aset Pemerintah dengan melakukan penertiban aset yang
  - meliputi inventarisasi, penilaian, pemanfaatan, dan legalitas
  - aset tetap pada seluruh Kementerian Negara/Lembaga;
  - d. meningkatkan kuantitas dan kualitas pelatihan akuntansi
  - dan pelaporan keuangan berbasis akrual dalam rangka
  - peningkatan kapasitas Sumber Daya Manusia (SDM) pada
  - Kementerian Negara/Lembaga dan Pemerintah Daerah;
  - e. memberikan penghargaan kepada Kementerian
  - Negara/Lembaga yang mengelola anggarannya secara efektif,
  - efisien dan/atau mendapatkan opini audit Wajar Tanpa
  - Pengecualian atas laporan keuangannya;
  - f. meningkatkan kualitas Sistem Pengendalian Internal dalam
  - pengelolaan keuangan negara, mulai dari tahap
  - perencanaan, penganggaran, pelaksanaan, dan
  - pertanggungjawaban atas pelaksanaan anggaran.
  - Pasal 14
  - Cukup jelas.
