  first_page:
  - PENJELASAN
  - ATAS
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 16 TAHUN 2007
  - TENTANG
  - PEMBENTUKAN KABUPATEN SUMBA BARAT DAYA
  - DI PROVINSI NUSA TENGGARA TIMUR
  - I. UMUM
  - Provinsi Nusa Tenggara Timur adalah provinsi yang dibentuk
  - berdasarkan Undang-Undang Nomor 64 Tahun 1958 tentang
  - Pembentukan Daerah-Daerah Tingkat I Bali, Nusa Tenggara Barat,
  - dan Nusa Tenggara Timur. Provinsi Nusa Tenggara Timur mempunyai
  - luas wilayah ± 47.349,49 km2, secara geografis, geopolitik dan
  - ketahanan keamanan, sangat strategis dan memiliki makna penting
  - dalam satu kesatuan sistem pemerintahan di Indonesia dan sistem
  - pemerintahan daerah. Potensi sumber daya nasional di Provinsi Nusa
  - Tenggara Timur yang tersebar di kabupaten dan kota, memiliki
  - makna dan peran tersendiri terhadap kepentingan pembangunan
  - nasional dan daerah.
  - Kondisi demikian perlu mendapat perhatian pemerintah sejalan
  - dengan kebijakan nasional dalam percepatan pembangunan. Oleh
  - karena itu diperlukan peningkatan kemampuan penyelenggaraan
  - pemerintahan daerahnya, khususnya di Kabupaten Sumba Barat
  - melalui pembentukan daerah.
  - Berdasarkan hal tersebut di atas dan memperhatikan aspirasi yang
  - berkembang dalam masyarakat, yang selanjutnya dituangkan secara
  - formal dalam Surat Keputusan Persetujuan DPRD Kabupaten Sumba
  - Barat Nomor 26/DPRD/2003 tanggal 30 Desember 2003 tentang
  - persetujuan Pemekaran Kabupaten Sumba Barat, Surat Usulan
  - Bupati Sumba Barat Nomor Pem.125/04/63.L/I-2004 tanggal 2
  - Januari 2004 tentang Usulan Pemekaran Kabupaten Sumba Barat,
  - Surat Keputusan Persetujuan DPRD Provinsi Nusa Tenggara Timur
  - Nomor 3/PIMP.DPRD/2004 tanggal 17 Januari 2004 tentang
  - Pemberian Dukungan Pemekaran Kabupaten Sumba Barat, Surat
  - Usulan Gubernur Nusa Tengggara Timur kepada Menteri Dalam
  - Negeri Nomor Pem.135/02/2004 tanggal 14 Januari 2004 tentang
  - Usul Pemekaran Kabupaten Sumba Barat di Provinsi Nusa Tenggara
  - Timur, Surat Keputusan DPRD Kabupaten Nomor 26/DPRD/2003
