  - Republik Indonesia dan Federasi Rusia, yang selanjutnya disebut sebagai “Para
  - Pihak”,
  - BERKEINGINAN untuk memfasilitasi kerja sama yang lebih efisien dan efektif
  - dalam hal pencegahan kejahatan antara Para Pihak,
  - BERTEKAD untuk memperkuat hubungan antara Para Pihak yang berkaitan
  - dengan ekstradisi dengan menyepakati Perjanjian ini,
  - BERDASARKAN prinsip kedaulatan, kesetaraan, dan saling menguntungkan,
