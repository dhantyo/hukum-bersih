  - PRESIDEN
  - REPUBLIK INDONESIA
  - UNDANG-UNDANG REPUBLIK INDONESIA
  - NOMOR 10 TAHUN 2019
  - TENTANG
  - PENGESAHAN PERJANJIAN ANTARA REPUBLIK INDONESIA DAN REPUBLIK
  - ISLAM IRAN TENTANG BANTUAN TIMBAL BALIK DALAM MASALAH PIDANA
  - (TREATY BETWEEN THE REPUBLIC OF INDONESIA AND THE ISLAMIC
  - REPUBLIC OF IRAN ON MUTUAL LEGAL ASSISTANCE IN CRIMINAL MATTERS)
  - DENGAN RAHMAT TUHAN YANG MAHA ESA
  - PRESIDEN REPUBLIK INDONESIA,
  - 'Menimbang : a. bahwa dalam rangka mencapai tujuan negara'
  - Republik Indonesia untuk melindungi segenap bangsa
  - Indonesia dan seluruh tumpah darah Indonesia,
  - untuk memajukan kesejahteraan umum, mencerdaskan
  - kehidupan bangsa, dan ikut melaksanakan ketertiban
  - dunia yang berdasarkan kemerdekaan, perdamaian
  - abadi, dan keadilan sosial, Pemerintah Republik
  - Indonesia sebagai bagian dari masyarakat internasional
  - melakukan hubungan dan kerja sama internasional yang
  - diwujudkan dalam perjanjian internasional;
  - b. bahwa perkembangan ilmu pengetahuan dan teknologi
  - khususnya di bidang transportasi, komunikasi, dan
  - informasi, selain mempunyai dampak positif juga
  - mempunyai dampak negatif, yaitu timbulnya tindak
  - pidana yang tidak lagi mengenal batas yurisdiksi suatu
  - negara, sehingga penanggulangan dan
  - pemberantasannya memerlukan kerja sama antarnegara
  - yang efektif, baik bersifat bilateral maupun multilateral;
  last_page:
  - PRESIDEN
  - REPUBLIK INDONESIA
  - 2 -
  - Dalam menanggulangi dan memberantas tindak pidana, terutama
  - yang bersifat transnasional, diperlukan kerja sama antarnegara yang
  - efektif baik bersifat bilateral maupun multilateral.
  - Dengan menyadari kenyataan tersebut, Pemerintah Republik
  - Indonesia dan Pemerintah Republik Islam Iran telah sepakat mengadakan
  - kerja sama bantuan timba! balik dalam masalah pidana yang telah
  - ditandatangani pada tanggal 14 Desember 2016 di Tehran, Iran. Untuk
  - lebih meningkatkan efektivitas kerja sama di bidang hukum dalam
  - penangguiangan dan pemberantasan tindak pidana, terutama yang
  - bersifat transnasional, perjanjian bantuan timbal balik dalam masalah
  - pidana harus memperhatikan prinsip umum hukum internasional yang
  - menitikberatkan pada asas penghormatan kedaulatan negara dan
  - kedaulatan hukum, kesetaraan, dan saling menguntungkan serta
  - mengacu pada asas tindak pidana ganda (double criminality).
  - Dalam isi Perjanjian antara Pemerintah Republik Indonesia dan
  - Pemerintah Republik Islam Iran tentang Bantuan Hukum Timbal Balik
  - dalam Masalah Pidana ini diatur antara lain mengenai ruang lingkup
  - bantuan, otoritas pusat, prosedur pelaksanaan bantuan, biaya, kewajiban
  - internasional, konsuitasi, penyelesaian sengketa, dan amandemen
  - perjanjian.
  - II. PASAL DEMI PASAL
  - Pasal 1
  - Cukup jelas.
  - Pasel 2
  - Cukup jelas.
