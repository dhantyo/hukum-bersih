  Indonesia Dan Republik Islam Iran Tentang Bantuan Timbal Balik Dalam Masalah Pidana
  (Treaty Between The Republic Of Indonesia And The Islamic Republic Of Iran On Mutual
  Legal Assistance In Criminal Matters)
